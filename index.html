<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET | GOD MODE EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --p: #ff5e00; --g: #00ff41; --gold: #d4af37; --danger: #ff3b30;
            --bg: #010101; --card: #080808; --border: #121212;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        .view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); z-index: 10; overflow-y: auto; padding-bottom: 100px; }
        .view.active { display: flex; animation: zoomIn 0.3s cubic-bezier(0.1, 0.7, 0.1, 1); }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* HEADER PREMIUM */
        header { height: 70px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px); }
        .logo { font-weight: 900; font-size: 24px; color: var(--gold); letter-spacing: -1.5px; }

        /* VIP PROGRESS */
        .vip-bar { height: 4px; background: #111; width: 100%; position: relative; }
        .vip-fill { height: 100%; background: var(--gold); width: 35%; box-shadow: 0 0 10px var(--gold); }

        .card { background: var(--card); margin: 12px; padding: 20px; border-radius: 24px; border: 1px solid var(--border); transition: 0.3s; }
        .btn { border: none; border-radius: 16px; font-weight: 900; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn-p { background: linear-gradient(135deg, #ff5e00, #ff2a00); color: #fff; padding: 18px; width: 100%; }
        .btn-g { background: linear-gradient(135deg, #00ff41, #008f23); color: #000; padding: 18px; width: 100%; }

        /* MINES BOARD UPGRADED */
        .m-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #000; padding: 12px; border-radius: 20px; border: 1px solid var(--border); }
        .tile { aspect-ratio: 1/1; background: #0a0a0a; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border-bottom: 4px solid #000; transition: 0.1s; }
        .tile:active { transform: scale(0.9); }
        .tile.open { border-bottom: none; background: #121212; }

        /* BET SELECTOR */
        .bet-box { display: flex; background: #000; border-radius: 50px; border: 1px solid var(--border); padding: 5px; margin-bottom: 15px; }
        .b-btn { width: 45px; height: 45px; border-radius: 50%; background: #111; color: #fff; border: none; font-size: 20px; font-weight: 900; }
        .b-val { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--g); }

        /* SHARK DASHBOARD */
        .shark-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px; }
        .shark-card { background: #050505; border: 1px solid var(--border); padding: 15px; border-radius: 20px; border-left: 4px solid var(--p); }

        nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: rgba(0,0,0,0.9); border-top: 1px solid var(--border); display: none; justify-content: space-around; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
        .nav-link { color: #444; font-size: 10px; font-weight: 900; text-align: center; }
        .nav-link.active { color: var(--gold); }

        #toast { position: fixed; top: 85px; left: 50%; transform: translateX(-50%); background: var(--p); color: #fff; padding: 10px 20px; border-radius: 50px; font-weight: 900; font-size: 11px; z-index: 10000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body onload="App.init()">

    <div id="toast">SINCRONIZADO</div>

    <div id="scr-auth" class="view active">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:35px;">
            <div class="logo" style="font-size:55px; margin-bottom:40px;">MEC-BET</div>
            <input type="text" id="u-in" placeholder="USUÁRIO" style="width:100%; padding:20px; background:var(--card); border:1px solid var(--border); border-radius:20px; color:#fff; margin-bottom:12px;">
            <input type="password" id="p-in" placeholder="SENHA" style="width:100%; padding:20px; background:var(--card); border:1px solid var(--border); border-radius:20px; color:#fff; margin-bottom:20px;">
            <button class="btn btn-p" onclick="App.Auth.login()">ENTRAR AGORA</button>
            <div style="display:flex; gap:20px; margin-top:20px;">
                <span style="font-size:11px; color:#333;" onclick="App.Router.go('scr-reg')">CADASTRAR</span>
                <span style="font-size:11px; color:#333;">RECUPERAR ACESSO</span>
            </div>
        </div>
    </div>

    <div id="scr-reg" class="view">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:35px;">
            <h2 style="margin-bottom:30px;">NOVA CONTA</h2>
            <input type="text" placeholder="CPF">
            <input type="email" placeholder="E-MAIL">
            <input type="password" placeholder="SENHA">
            <button class="btn btn-g" onclick="App.Router.go('scr-auth')">CRIAR CONTA</button>
            <span style="margin-top:20px; font-size:11px;" onclick="App.Router.go('scr-auth')">JÁ TENHO CONTA</span>
        </div>
    </div>

    <div id="scr-lobby" class="view">
        <header><div class="logo">MEC-BET</div><div id="u-lvl" style="color:var(--gold); font-size:12px; font-weight:900;">GOLD VIP</div></header>
        <div class="vip-bar"><div class="vip-fill" id="vip-p"></div></div>
        <div class="card">
            <p style="font-size:11px; color:#444; margin-bottom:5px;">SALDO DISPONÍVEL</p>
            <h1 id="u-saldo" style="font-size:50px; letter-spacing:-2px;">R$ 0,00</h1>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-g" style="flex:1" onclick="App.System.deposit()">DEPOSITAR</button>
                <button class="btn" style="flex:1; background:#111; border:1px solid #222;" onclick="alert('SAQUE MÍNIMO: R$ 50,00')">SACAR</button>
            </div>
        </div>
        <div style="padding:0 15px;"><div class="card" onclick="App.Router.go('scr-mines')" style="border-right: 4px solid var(--gold);"><i class="fa-solid fa-gem" style="color:var(--gold)"></i> MINES PREDICTOR</div></div>
    </div>

    <div id="scr-mines" class="view">
        <header><i class="fa-solid fa-chevron-left" onclick="App.Router.go('scr-lobby')"></i><div id="m-saldo" style="color:var(--g); font-weight:900;">R$ 0,00</div><i class="fa-solid fa-clock-rotate-left"></i></header>
        <div style="padding:15px;">
            <div class="m-grid" id="m-board"></div>
            <div style="margin-top:20px;">
                <div class="bet-box">
                    <button class="b-btn" onclick="App.Game.changeBet(-5)">-</button>
                    <div class="b-val" id="bet-display">R$ 10.00</div>
                    <button class="b-btn" onclick="App.Game.changeBet(5)">+</button>
                </div>
                <button id="m-start" class="btn btn-p" onclick="App.Game.Mines.start()">INICIAR APOSTA</button>
                <button id="m-cash" class="btn btn-g" style="display:none;" onclick="App.Game.Mines.cashout()">CASHOUT</button>
            </div>
            <p id="m-msg" style="text-align:center; margin-top:20px; font-weight:900; color:var(--gold);"></p>
        </div>
    </div>

    <div id="scr-admin" class="view">
        <header><div class="logo" style="color:var(--p)">SHARK CONTROL</div><div style="font-size:10px;">LATÊNCIA: 12ms</div></header>
        <div class="shark-grid" style="margin-top:20px;">
            <div class="shark-card"><p style="font-size:9px; color:#444;">GGR TOTAL</p><h2 id="adm-profit">R$ 0,00</h2></div>
            <div class="shark-card"><p style="font-size:9px; color:#444;">ONLINE</p><h2 id="adm-on">0</h2></div>
        </div>
        <div style="padding:15px;"><h3 style="font-size:11px; color:#333; margin-bottom:15px;">CONTROLE DE USUÁRIOS</h3><div id="adm-list"></div></div>
    </div>

    <nav id="navbar">
        <div class="nav-link active" onclick="App.Router.go('scr-lobby')"><i class="fa-solid fa-house"></i><br>HOME</div>
        <div class="nav-link" onclick="App.Router.go('scr-mines')"><i class="fa-solid fa-gamepad"></i><br>JOGOS</div>
        <div id="nav-shark" class="nav-link" style="display:none; color:var(--gold)" onclick="App.Router.go('scr-admin')"><i class="fa-solid fa-crown"></i><br>SHARK</div>
        <div class="nav-link" onclick="App.Auth.logout()"><i class="fa-solid fa-user-gear"></i><br>PERFIL</div>
    </nav>

    <script>
        const App = {
            db: JSON.parse(localStorage.getItem('MEC_GOD_V9')) || [],
            sess: null, bet: 10,

            init() {
                window.addEventListener('storage', () => {
                    this.db = JSON.parse(localStorage.getItem('MEC_GOD_V9'));
                    if(this.sess) {
                        this.sess = this.db.find(u => u.user === this.sess.user);
                        this.System.syncUI();
                        this.System.toast();
                    }
                });
                const s = sessionStorage.getItem('MEC_SESS');
                if(s) {
                    this.sess = this.db.find(u => u.user === s);
                    if(this.sess) this.System.unlock();
                }
                this.Game.Mines.render();
            },

            Auth: {
                login() {
                    let u = document.getElementById('u-in').value.toUpperCase();
                    if(!u) return;
                    let user = App.db.find(x => x.user === u);
                    if(!user) {
                        user = { user: u, saldo: 0, exp: 10, role: u === 'ADMIN' ? 'admin' : 'player', mode: 'auto' };
                        App.db.push(user); App.System.save();
                    }
                    sessionStorage.setItem('MEC_SESS', u);
                    location.reload();
                },
                logout() { sessionStorage.clear(); location.reload(); }
            },

            Game: {
                changeBet(v) { App.bet += v; if(App.bet < 5) App.bet = 5; document.getElementById('bet-display').innerText = `R$ ${App.bet}.00`; },
                Mines: {
                    playing: false, m: 1,
                    start() {
                        if(App.sess.saldo < App.bet) return alert("SALDO INSUFICIENTE!");
                        App.sess.saldo -= App.bet; App.System.saveSync();
                        this.playing = true; this.m = 1;
                        document.getElementById('m-start').style.display = 'none';
                        document.getElementById('m-cash').style.display = 'block';
                        this.render();
                    },
                    render() {
                        const board = document.getElementById('m-board'); board.innerHTML = '';
                        const bPos = Math.floor(Math.random() * 25);
                        for(let i=0; i<25; i++) {
                            let t = document.createElement('div'); t.className = 'tile';
                            t.onclick = () => {
                                if(!this.playing || t.classList.contains('open')) return;
                                t.classList.add('open');
                                let bomb = (i === bPos);
                                if(App.sess.mode === 'win') bomb = false;
                                if(App.sess.mode === 'lose') bomb = true;

                                if(bomb) {
                                    t.innerHTML = '💣'; t.style.color = 'red'; this.end(false);
                                } else {
                                    t.innerHTML = '💎'; t.style.color = 'var(--g)';
                                    this.m += 0.8;
                                    document.getElementById('m-cash').innerText = `SACAR R$ ${(App.bet * this.m).toFixed(2)}`;
                                }
                            };
                            board.appendChild(t);
                        }
                    },
                    cashout() { App.sess.saldo += (App.bet * this.m); this.end(true); },
                    end(win) {
                        this.playing = false;
                        document.getElementById('m-start').style.display = 'block';
                        document.getElementById('m-cash').style.display = 'none';
                        document.getElementById('m-msg').innerText = win ? "VITÓRIA!" : "DERROTA!";
                        if(win) App.sess.exp += 5;
                        App.System.saveSync();
                    }
                }
            },

            System: {
                unlock() {
                    document.getElementById('scr-auth').classList.remove('active');
                    document.getElementById('navbar').style.display = 'flex';
                    if(App.sess.role === 'admin') {
                        document.getElementById('scr-admin').classList.add('active');
                        document.getElementById('nav-shark').style.display = 'block';
                    } else { document.getElementById('scr-lobby').classList.add('active'); }
                    this.syncUI();
                },
                syncUI() {
                    document.getElementById('u-saldo').innerText = `R$ ${App.sess.saldo.toFixed(2)}`;
                    document.getElementById('m-saldo').innerText = `R$ ${App.sess.saldo.toFixed(2)}`;
                    document.getElementById('vip-p').style.width = App.sess.exp + '%';
                    if(App.sess.role === 'admin') this.loadShark();
                },
                loadShark() {
                    const l = document.getElementById('adm-list');
                    let p = 0;
                    l.innerHTML = App.db.filter(u => u.role !== 'admin').map(u => {
                        p += (u.exp * 5) - u.saldo;
                        return `
                        <div class="card" style="margin:5px 0; padding:12px; display:flex; justify-content:space-between; align-items:center;">
                            <div><b>${u.user}</b><br><small>R$ ${u.saldo.toFixed(2)}</small></div>
                            <div style="display:flex; gap:5px;">
                                <button onclick="App.System.mod('${u.user}', 50)" style="background:var(--g); border:none; padding:8px; border-radius:10px;">+</button>
                                <button onclick="App.System.mode('${u.user}','win')" style="background:var(--gold); border:none; padding:8px; border-radius:10px;">🏆</button>
                                <button onclick="App.System.mode('${u.user}','lose')" style="background:red; border:none; padding:8px; border-radius:10px;">💀</button>
                            </div>
                        </div>`;
                    }).join('');
                    document.getElementById('adm-profit').innerText = `R$ ${Math.abs(p).toFixed(2)}`;
                    document.getElementById('adm-on').innerText = App.db.length;
                },
                mod(n, v) { let u = App.db.find(x => x.user === n); u.saldo += v; this.saveSync(); },
                mode(n, m) { let u = App.db.find(x => x.user === n); u.mode = m; this.saveSync(); },
                save() { localStorage.setItem('MEC_GOD_V9', JSON.stringify(App.db)); },
                saveSync() { this.save(); this.syncUI(); },
                deposit() { App.sess.saldo += 100; this.saveSync(); alert("DEPÓSITO PIX APROVADO!"); },
                toast() { const t = document.getElementById('toast'); t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); }
            },

            Router: {
                go(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); }
            }
        };
    </script>
</body>
</html>
