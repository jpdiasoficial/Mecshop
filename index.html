<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET INFINITY | FIXED</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --green: #00ff41; --gold: #d4af37; --bg: #000; --primary: #ff5e00; --gray: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; text-transform: uppercase; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* NAVEGAÇÃO DE TELAS */
        .view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); }
        .view.active { display: flex; animation: fade 0.3s ease; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* UI ELEMENTS */
        .header-elite { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray); height: 70px; }
        .logo { font-weight: 900; font-size: 22px; color: var(--gold); }
        
        .wallet-card { background: #080808; margin: 20px; padding: 25px; border-radius: 20px; border: 1px solid var(--gray); border-bottom: 4px solid var(--green); }
        .wallet-value { font-size: 40px; font-weight: 900; margin: 10px 0; letter-spacing: -2px; }

        .btn { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: #fff; }
        .btn-deposit { background: var(--green); color: #000; margin-top: 10px; }

        /* ROLETA */
        .wheel-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .wheel { width: 280px; height: 280px; border: 10px solid #111; border-radius: 50%; background: conic-gradient(var(--primary) 0 12.5%, #000 12.5% 25%, var(--primary) 25% 37.5%, #000 37.5% 50%, var(--primary) 50% 62.5%, #000 62.5% 75%, var(--primary) 75% 87.5%, #000 87.5% 100%); transition: 4s cubic-bezier(0.1, 0, 0, 1); position: relative; }
        .wheel::before { content: ''; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid var(--gold); z-index: 10; }

        /* AUTH */
        .auth-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        .input-auth { width: 100%; background: #0a0a0a; border: 1px solid #222; padding: 18px; border-radius: 12px; color: #fff; margin-bottom: 12px; }

        nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; border-top: 1px solid var(--gray); display: none; justify-content: space-around; align-items: center; }
        .nav-item { color: #444; font-size: 10px; font-weight: 900; text-align: center; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body onload="Mec.init()">

    <div id="scr-auth" class="view active">
        <div class="auth-box">
            <h1 class="logo" style="font-size: 40px; margin-bottom: 30px;">MEC-BET</h1>
            <div id="login-fields" style="width: 100%;">
                <input id="user" class="input-auth" placeholder="USUÁRIO">
                <input id="pass" type="password" class="input-auth" placeholder="SENHA">
                <button class="btn btn-main" onclick="Mec.Auth.login()">ENTRAR</button>
                <p onclick="Mec.Auth.toggle(true)" style="text-align:center; margin-top:20px; font-size:11px; color:var(--primary)">CRIAR CONTA</p>
            </div>
            <div id="reg-fields" style="width: 100%; display:none;">
                <input id="new-user" class="input-auth" placeholder="NOVO USUÁRIO">
                <input id="new-pass" type="password" class="input-auth" placeholder="NOVA SENHA">
                <button class="btn btn-main" style="background:var(--green); color:#000" onclick="Mec.Auth.register()">CADASTRAR</button>
                <p onclick="Mec.Auth.toggle(false)" style="text-align:center; margin-top:20px; font-size:11px;">VOLTAR</p>
            </div>
        </div>
    </div>

    <div id="scr-lobby" class="view">
        <header class="header-elite">
            <div class="logo">MEC-BET</div>
            <i class="fa-solid fa-right-from-bracket" onclick="Mec.Auth.logout()"></i>
        </header>
        <div class="wallet-card">
            <p style="font-size:10px; color:#555">BANCA DISPONÍVEL</p>
            <h2 id="balance" class="wallet-value">R$ 0,00</h2>
            <button class="btn btn-deposit" onclick="Mec.Game.add()">DEPOSITAR (DEMO)</button>
        </div>
        <div style="padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div onclick="Mec.Router.go('scr-game')" style="background:#0a0a0a; padding:20px; border-radius:15px; border:1px solid #222">
                <i class="fa-solid fa-dharmachakra" style="font-size:30px; color:var(--gold)"></i>
                <p style="margin-top:10px; font-size:12px; font-weight:900;">ROLETA VIP</p>
            </div>
        </div>
    </div>

    <div id="scr-game" class="view">
        <header class="header-elite">
            <i class="fa-solid fa-chevron-left" onclick="Mec.Router.go('scr-lobby')"></i>
            <div class="logo">SORTEIO</div>
            <div></div>
        </header>
        <div class="wheel-container">
            <div id="main-wheel" class="wheel"></div>
            <button id="btn-spin" class="btn btn-main" style="width:80%; margin-top:40px;" onclick="Mec.Game.spin()">GIRAR R$ 10</button>
            <p id="game-res" style="margin-top:20px; font-weight:900;"></p>
        </div>
    </div>

    <nav id="nav-bar">
        <div class="nav-item active" onclick="Mec.Router.go('scr-lobby')"><i class="fa-solid fa-house"></i><br>HOME</div>
        <div class="nav-item" onclick="Mec.Router.go('scr-game')"><i class="fa-solid fa-gamepad"></i><br>JOGOS</div>
    </nav>

    <script>
        const Mec = {
            users: JSON.parse(localStorage.getItem('JP_DB')) || [],
            current: null,

            init() {
                const session = localStorage.getItem('JP_SESSION');
                if(session) {
                    this.current = this.users.find(u => u.user === session);
                    if(this.current) this.System.unlock();
                }
            },

            Auth: {
                toggle(reg) {
                    document.getElementById('login-fields').style.display = reg ? 'none' : 'block';
                    document.getElementById('reg-fields').style.display = reg ? 'block' : 'none';
                },
                register() {
                    let u = document.getElementById('new-user').value;
                    let p = document.getElementById('new-pass').value;
                    if(!u || !p) return alert("PREENCHA");
                    Mec.users.push({user: u, pass: p, saldo: 0});
                    localStorage.setItem('JP_DB', JSON.stringify(Mec.users));
                    alert("CONTA CRIADA");
                    location.reload();
                },
                login() {
                    let u = document.getElementById('user').value;
                    let p = document.getElementById('pass').value;
                    let found = Mec.users.find(x => x.user == u && x.pass == p);
                    if(found) {
                        localStorage.setItem('JP_SESSION', u);
                        location.reload();
                    } else { alert("ERRO"); }
                },
                logout() { localStorage.removeItem('JP_SESSION'); location.reload(); }
            },

            Game: {
                add() { 
                    Mec.current.saldo += 50; 
                    Mec.System.sync(); 
                },
                spin() {
                    if(Mec.current.saldo < 10) return alert("SEM SALDO");
                    Mec.current.saldo -= 10;
                    document.getElementById('btn-spin').disabled = true;
                    let deg = Math.floor(Math.random() * 3600) + 7200;
                    document.getElementById('main-wheel').style.transform = `rotate(${deg}deg)`;
                    
                    setTimeout(() => {
                        let win = Math.random() > 0.5 ? 20 : 0;
                        Mec.current.saldo += win;
                        document.getElementById('game-res').innerText = win > 0 ? "GANHOU R$ 20" : "PERDEU";
                        document.getElementById('btn-spin').disabled = false;
                        Mec.System.sync();
                    }, 4000);
                }
            },

            System: {
                unlock() {
                    document.getElementById('scr-auth').classList.remove('active');
                    document.getElementById('scr-lobby').classList.add('active');
                    document.getElementById('nav-bar').style.display = 'flex';
                    this.sync();
                },
                sync() {
                    document.getElementById('balance').innerText = "R$ " + Mec.current.saldo.toFixed(2);
                    localStorage.setItem('JP_DB', JSON.stringify(Mec.users));
                }
            },

            Router: {
                go(id) {
                    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                    document.getElementById(id).classList.add('active');
                }
            }
        };
    </script>
</body>
</html>
