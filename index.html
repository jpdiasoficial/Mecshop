<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET V28 | TOTAL ACCESS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #ff5e00; --g: #00ff41; --gold: #d4af37; --bg: #050505; --card: #0d0d0d; --border: #1a1a1a; --text: #eee; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Roboto Mono', monospace; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* TELAS */
        .view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); z-index: 10; overflow-y: auto; padding-bottom: 90px; }
        .view.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* HEADER */
        header { height: 65px; background: #000; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 22px; color: var(--gold); letter-spacing: -1px; }
        .balance-pill { background: #111; padding: 8px 15px; border-radius: 30px; border: 1px solid #222; color: var(--g); font-weight: 900; font-size: 13px; }

        /* CRASH ENGINE V22 STYLE */
        .crash-wrap { height: 230px; background: #000; border: 1px solid #222; border-radius: 15px; margin-bottom: 15px; position: relative; overflow: hidden; }
        #canvas-crash { width: 100%; height: 100%; }
        #c-mult { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 55px; font-weight: 900; z-index: 10; color: #fff; text-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #wait-timer { position: absolute; top: 10px; width: 100%; text-align: center; color: var(--gold); font-size: 11px; z-index: 11; display: none; }

        .velas { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; margin-bottom: 5px; }
        .vela-item { min-width: 50px; height: 28px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 900; }

        /* CONTROLES DE APOSTA */
        .bet-card { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .ctrl-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .math-b { width: 45px; height: 45px; background: #222; border: none; border-radius: 10px; color: #fff; font-size: 20px; font-weight: 900; }
        .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .q-btn { background: #111; border: 1px solid #222; padding: 10px 0; border-radius: 8px; color: #666; font-size: 10px; font-weight: 900; }
        .q-btn.active { color: var(--gold); border-color: var(--gold); }

        .btn { border: none; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; display: flex; align-items: center; justify-content: center; transition: 0.1s; }
        .btn-p { background: var(--p); color: #fff; height: 60px; box-shadow: 0 5px 0 #943700; }
        .btn-g { background: var(--g); color: #000; height: 60px; box-shadow: 0 5px 0 #008f24; }
        .btn:active { transform: translateY(3px); box-shadow: none; }

        /* SHARK ADMIN */
        .u-card { background: #000; border: 1px solid #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 10px currentColor; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; border-top: 1px solid var(--border); display: none; justify-content: space-around; align-items: center; z-index: 1000; }
        .n-item { color: #444; font-size: 9px; text-align: center; }
        .n-item.active { color: var(--gold); }
        .n-item i { font-size: 22px; display: block; margin-bottom: 4px; }

        input { width: 100%; padding: 18px; background: #0d0d0d; border: 1px solid #222; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; }
    </style>
</head>
<body onload="App.init()">

    <div id="scr-auth" class="view active" style="justify-content:center; padding:30px;">
        <div style="text-align:center; margin-bottom:40px;">
            <h1 class="logo" style="font-size:45px;">MEC-BET</h1>
            <p style="color:#444; font-size:10px; letter-spacing:2px;">ACESSO TOTAL LIBERADO</p>
        </div>
        <input type="text" id="login-u" placeholder="DIGITE QUALQUER NOME (OU ADMIN)">
        <input type="password" id="login-p" placeholder="DIGITE QUALQUER SENHA">
        <button class="btn btn-p" onclick="App.Auth.login()">ENTRAR AGORA</button>
        <p style="text-align:center; margin-top:20px; font-size:11px; color:#555;">Sistema V28 | Davi-768 UI</p>
    </div>

    <div id="scr-lobby" class="view">
        <header><div class="logo">MEC-BET</div><div class="balance-pill" id="bal-top">R$ 0,00</div></header>
        <div style="padding:15px;">
            <div style="background:linear-gradient(135deg,#0d0d0d,#1a1a1a); padding:25px; border-radius:20px; border-left:5px solid var(--p); margin-bottom:20px;">
                <small style="color:#666">SALDO DISPONÍVEL</small>
                <h1 id="bal-main" style="font-size:38px; margin:10px 0;">R$ 0,00</h1>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-g" style="height:45px; font-size:12px;" onclick="App.Sys.dep()">DEPÓSITO PIX</button>
                    <button class="btn" style="height:45px; font-size:12px; background:#222; color:#fff" onclick="alert('Saque solicitado!')">SACAR</button>
                </div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="btn" style="background:#0d0d0d; border:1px solid #222; padding:25px; flex-direction:column;" onclick="App.Router.go('scr-crash')">
                    <i class="fa-solid fa-rocket" style="color:var(--p); font-size:35px; margin-bottom:10px;"></i><b>CRASH</b>
                </div>
                <div class="btn" style="background:#0d0d0d; border:1px solid #222; padding:25px; flex-direction:column;" onclick="alert('Mines em atualização')">
                    <i class="fa-solid fa-gem" style="color:var(--gold); font-size:35px; margin-bottom:10px;"></i><b>MINES</b>
                </div>
            </div>
        </div>
    </div>

    <div id="scr-crash" class="view">
        <header><i class="fa-solid fa-chevron-left" onclick="App.Router.go('scr-lobby')"></i><div id="bal-crash">R$ 0,00</div><div></div></header>
        <div style="padding:15px;">
            <div class="velas" id="v-hist"></div>
            
            <div class="crash-wrap">
                <div id="wait-timer">PRÓXIMA RODADA EM: <span id="wait-count">10</span>s</div>
                <h1 id="c-mult">1.00x</h1>
                <canvas id="canvas-crash"></canvas>
            </div>

            <div class="bet-card">
                <div class="ctrl-row">
                    <button class="math-b" onclick="App.Game.adj(-10)">-</button>
                    <div style="text-align:center;"><small style="color:#555">VALOR DA APOSTA</small><br><b style="font-size:24px; color:var(--g)">R$ <span id="c-bet-val">10</span></b></div>
                    <button class="math-b" onclick="App.Game.adj(10)">+</button>
                </div>
                <div class="quick-grid">
                    <button class="q-btn" onclick="App.Game.set(10)">10</button>
                    <button class="q-btn" onclick="App.Game.set(50)">50</button>
                    <button class="q-btn" onclick="App.Game.set(100)">100</button>
                    <button class="q-btn" onclick="App.Game.set(500)">500</button>
                </div>
            </div>

            <button id="c-start" class="btn btn-p" onclick="App.Game.start()">COMEÇAR JOGO</button>
            <button id="c-cash" class="btn btn-g" style="display:none;" onclick="App.Game.cashout()">COLETAR LUCRO</button>
        </div>
    </div>

    <div id="scr-admin" class="view">
        <div style="padding:20px;">
            <h2 style="color:var(--p); margin-bottom:20px; border-bottom:1px solid #222; padding-bottom:10px;">SHARK COMMANDER V28</h2>
            <div id="adm-list"></div>
        </div>
    </div>

    <nav id="navbar">
        <div class="n-item active" onclick="App.Router.go('scr-lobby', this)"><i class="fa-solid fa-house"></i>HOME</div>
        <div class="n-item" onclick="App.Router.go('scr-crash', this)"><i class="fa-solid fa-rocket"></i>CRASH</div>
        <div id="n-shark" class="n-item" style="display:none; color:var(--p)" onclick="App.Router.go('scr-admin', this)"><i class="fa-solid fa-skull"></i>SHARK</div>
    </nav>

    <script>
        const App = {
            db: JSON.parse(localStorage.getItem('MEC_V28_FINAL')) || [],
            curr: null,
            init() {
                const s = sessionStorage.getItem('MEC_SESS');
                if(s) { 
                    this.curr = this.db.find(u => u.user === s); 
                    if(this.curr) { this.curr.online = true; this.Sys.unlock(); }
                }
                this.Game.initCanvas();
            },
            Auth: {
                login() {
                    let u = document.getElementById('login-u').value.toUpperCase();
                    if(!u) return;
                    let user = App.db.find(x => x.user === u);
                    if(!user) {
                        user = { user: u, saldo: 0, role: (u === 'ADMIN') ? 'admin' : 'player', mode: 'auto', bet: 10, online: true };
                        App.db.push(user);
                    }
                    sessionStorage.setItem('MEC_SESS', u);
                    location.reload();
                }
            },
            Game: {
                canvas: null, ctx: null, t: null, m: 1.00, wait: 10, playing: false, path: [],
                adj(v) { App.curr.bet = Math.max(10, App.curr.bet + v); this.sync(); },
                set(v) { App.curr.bet = v; this.sync(); },
                sync() { document.getElementById('c-bet-val').innerText = App.curr.bet; App.Sys.save(); },
                initCanvas() {
                    this.canvas = document.getElementById('canvas-crash');
                    if(!this.canvas) return;
                    this.ctx = this.canvas.getContext('2d');
                    this.canvas.width = this.canvas.offsetWidth;
                    this.canvas.height = this.canvas.offsetHeight;
                },
                start() {
                    if(App.curr.saldo < App.curr.bet) return alert("SALDO INSUFICIENTE");
                    App.curr.saldo -= App.curr.bet; App.Sys.saveSync();
                    document.getElementById('c-start').disabled = true;
                    document.getElementById('wait-timer').style.display = 'block';
                    let cd = setInterval(() => {
                        this.wait--; document.getElementById('wait-count').innerText = this.wait;
                        if(this.wait <= 0) { clearInterval(cd); this.launch(); document.getElementById('wait-timer').style.display = 'none'; this.wait = 10; }
                    }, 1000);
                },
                launch() {
                    this.playing = true; this.m = 1.00; this.path = [{x:0, y:this.canvas.height}];
                    document.getElementById('c-start').style.display = 'none'; document.getElementById('c-cash').style.display = 'block';
                    let lim = (Math.random() * 5 + 1.2); if(App.curr.mode === 'lose') lim = 1.05;
                    this.t = setInterval(() => {
                        this.m += (this.m * 0.035);
                        document.getElementById('c-mult').innerText = this.m.toFixed(2)+'x';
                        this.draw();
                        if(this.m >= lim) this.explode();
                    }, 100);
                },
                draw() {
                    this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
                    let x = (this.m - 1) * (this.canvas.width / 4);
                    let y = this.canvas.height - ((this.m - 1) * (this.canvas.height / 4));
                    this.path.push({x, y});
                    this.ctx.strokeStyle = this.m > 2 ? 'var(--g)' : 'var(--p)';
                    this.ctx.lineWidth = 4; this.ctx.beginPath();
                    this.path.forEach((p, i) => { if(i===0) this.ctx.moveTo(p.x, p.y); else this.ctx.lineTo(p.x, p.y); });
                    this.ctx.stroke();
                    // QUADRADINHO NEON V22
                    this.ctx.fillStyle = '#fff'; this.ctx.shadowBlur = 15; this.ctx.shadowColor = this.ctx.strokeStyle;
                    this.ctx.fillRect(x - 6, y - 6, 12, 12);
                    this.ctx.shadowBlur = 0;
                },
                explode() {
                    clearInterval(this.t); this.playing = false; this.addVela(this.m);
                    document.getElementById('c-mult').style.color = 'red';
                    setTimeout(() => {
                        document.getElementById('c-mult').style.color = '#fff'; document.getElementById('c-mult').innerText = '1.00x';
                        document.getElementById('c-start').style.display = 'block'; document.getElementById('c-cash').style.display = 'none';
                        document.getElementById('c-start').disabled = false; this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
                    }, 2000);
                },
                cashout() {
                    if(!this.playing) return; App.curr.saldo += (App.curr.bet * this.m);
                    this.playing = false; App.Sys.saveSync(); document.getElementById('c-cash').style.display = 'none';
                },
                addVela(v) {
                    const row = document.getElementById('v-hist'); const e = document.createElement('div');
                    e.className = 'vela-item'; e.style.background = v > 2 ? 'var(--g)' : 'var(--p)';
                    e.style.color = v > 2 ? '#000' : '#fff'; e.innerText = v.toFixed(2)+'x';
                    row.prepend(e);
                }
            },
            Sys: {
                unlock() {
                    document.getElementById('scr-auth').classList.remove('active'); document.getElementById('navbar').style.display = 'flex';
                    if(App.curr.role === 'admin') { document.getElementById('scr-admin').classList.add('active'); document.getElementById('n-shark').style.display = 'block'; }
                    else document.getElementById('scr-lobby').classList.add('active');
                    this.syncUI();
                },
                syncUI() {
                    const s = `R$ ${App.curr.saldo.toFixed(2)}`;
                    ['bal-top','bal-main','bal-crash'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerText = s; });
                    document.getElementById('c-bet-val').innerText = App.curr.bet;
                    if(App.curr.role === 'admin') this.loadShark();
                },
                loadShark() {
                    const l = document.getElementById('adm-list');
                    l.innerHTML = App.db.filter(u => u.role !== 'admin').map(u => `
                        <div class="u-card">
                            <div><span class="status-dot" style="color:${u.online ? 'var(--g)' : '#333'}"></span><b>${u.user}</b><br><small>R$ ${u.saldo.toFixed(2)} [${u.mode}]</small></div>
                            <div style="display:flex; gap:5px;">
                                <button onclick="App.Sys.mod('${u.user}',1000)" style="background:var(--g); border:none; padding:8px; border-radius:5px;">+1K</button>
                                <button onclick="App.Sys.mode('${u.user}','win')" style="background:blue; color:#fff; border:none; padding:8px; border-radius:5px;">W</button>
                                <button onclick="App.Sys.mode('${u.user}','lose')" style="background:red; color:#fff; border:none; padding:8px; border-radius:5px;">L</button>
                            </div>
                        </div>`).join('');
                },
                mod(n, v) { let u = App.db.find(x => x.user === n); u.saldo += v; this.saveSync(); },
                mode(n, m) { let u = App.db.find(x => x.user === n); u.mode = m; this.saveSync(); },
                dep() { App.curr.saldo += 100; this.saveSync(); alert("Crédito liberado!"); },
                save() { localStorage.setItem('MEC_V28_FINAL', JSON.stringify(App.db)); },
                saveSync() { this.save(); this.syncUI(); }
            },
            Router: {
                go(id, el) {
                    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                    document.getElementById(id).classList.add('active');
                    if(el) { document.querySelectorAll('.n-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
                    if(id === 'scr-crash') setTimeout(() => App.Game.initCanvas(), 100);
                }
            }
        };
    </script>
</body>
</html>
