<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>DEMO PLATFORM</title>

<style>

body{
background:#0b0b0b;
color:white;
font-family:Arial;
text-align:center;
}

.card{
background:#151515;
padding:20px;
border-radius:10px;
margin:20px auto;
width:300px;
}

button{
padding:10px 20px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.green{background:#00ff6a}
.red{background:#ff3b3b}
.gold{background:#d4af37}

input{
padding:10px;
margin:10px;
border-radius:6px;
border:none;
width:200px;
}

</style>
</head>

<body>

<div id="login">

<h1>PLATFORM DEMO</h1>

<input id="user" placeholder="usuario">

<br>

<button onclick="login()">ENTRAR</button>

</div>

<div id="userPanel" style="display:none">

<h2>PAINEL USUÁRIO</h2>

<div class="card">

Saldo

<h1 id="balance">0</h1>

<button class="green" onclick="deposit()">Depositar +100</button>

<button class="red" onclick="bet()">Apostar 50</button>

</div>

</div>

<div id="adminPanel" style="display:none">

<h2>PAINEL ADMIN</h2>

<div id="userList"></div>

</div>

<script>

const channel = new BroadcastChannel("demo-platform")

let db = JSON.parse(localStorage.getItem("db")) || []

let currentUser=null

function save(){

localStorage.setItem("db",JSON.stringify(db))

channel.postMessage("update")

}

function login(){

let name=document.getElementById("user").value.toUpperCase()

let user=db.find(u=>u.name==name)

if(!user){

user={

name:name,
balance:0

}

db.push(user)

save()

}

currentUser=user

document.getElementById("login").style.display="none"

if(name=="ADMIN"){

document.getElementById("adminPanel").style.display="block"

loadUsers()

}

else{

document.getElementById("userPanel").style.display="block"

updateUI()

}

}

function updateUI(){

document.getElementById("balance").innerText=currentUser.balance

}

function deposit(){

currentUser.balance+=100

save()

updateUI()

}

function bet(){

currentUser.balance-=50

save()

updateUI()

}

function loadUsers(){

let html=""

db.forEach(u=>{

html+=`

<div class="card">

${u.name}

<h3>${u.balance}</h3>

<button onclick="add('${u.name}')">+500</button>

<button onclick="remove('${u.name}')">-500</button>

</div>

`

})

document.getElementById("userList").innerHTML=html

}

function add(name){

let u=db.find(x=>x.name==name)

u.balance+=500

save()

loadUsers()

}

function remove(name){

let u=db.find(x=>x.name==name)

u.balance-=500

save()

loadUsers()

}

channel.onmessage=()=>{

db=JSON.parse(localStorage.getItem("db"))

if(currentUser){

currentUser=db.find(x=>x.name==currentUser.name)

updateUI()

}

if(document.getElementById("adminPanel").style.display=="block"){

loadUsers()

}

}

</script>

</body>
</html>
