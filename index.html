    <style>
        /* ============================================================
           [M04] SISTEMA DE VARIÁVEIS CSS EXPANDIDO
        ============================================================ */
        :root {
            --primary:       #e63946;
            --primary-dark:  #b52d38;
            --primary-glow:  rgba(230, 57, 70, 0.35);
            --secondary:     #25d366;
            --secondary-dark:#1da851;
            --secondary-glow:rgba(37, 211, 102, 0.35);
            --gold:          #f4c430;
            --gold-glow:     rgba(244, 196, 48, 0.35);
            --bg:            #050505;
            --bg2:           #080808;
            --surface:       #111111;
            --surface2:      #181818;
            --border:        #222222;
            --border2:       #2a2a2a;
            --text-main:     #ffffff;
            --text-dim:      #888888;
            --text-muted:    #555555;
            --radius-sm:     8px;
            --radius-md:     15px;
            --radius-lg:     20px;
            --radius-xl:     28px;
            --shadow-card:   0 8px 40px rgba(0,0,0,0.6);
            --shadow-btn:    0 15px 35px rgba(37,211,102,0.3);
            --transition:    0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* [M05] Reset global aprimorado */
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* [M06] Body com scroll suave e overflow controlado */
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* [M07] Scrollbar customizada */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg2); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* ============================================================
           [M08] HEADER COM LOGO ANIMADO + CONTADOR DE ESTOQUE
        ============================================================ */
        header {
            background: rgba(5,5,5,0.97);
            padding: 18px 20px 14px;
            text-align: center;
            border-bottom: 3px solid var(--primary);
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .header-inner { max-width: 500px; margin: 0 auto; }

        /* [M09] Logo com fonte Bebas Neue */
        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px; letter-spacing: 6px;
            text-transform: uppercase; line-height: 1;
        }
        .logo span { color: var(--primary); }

        /* [M10] Badge de estoque ao vivo */
        .header-meta {
            display: flex; justify-content: center; align-items: center;
            gap: 12px; margin-top: 8px; flex-wrap: wrap;
        }
        .loc-tag {
            font-size: 10px; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 2px;
        }
        .stock-badge {
            background: var(--primary); color: #fff;
            font-size: 9px; font-weight: 900;
            padding: 3px 10px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 1px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 var(--primary-glow); }
            50%       { box-shadow: 0 0 0 8px transparent; }
        }

        /* ============================================================
           [M11] BARRA DE BUSCA
        ============================================================ */
        .search-bar {
            max-width: 500px; margin: 0 auto;
            padding: 12px 15px 0;
            background: var(--bg2);
        }
        .search-input-wrap {
            display: flex; align-items: center;
            background: var(--surface); border: 1px solid var(--border2);
            border-radius: var(--radius-md); overflow: hidden;
            transition: border-color 0.3s;
        }
        .search-input-wrap:focus-within { border-color: var(--primary); }
        .search-input-wrap i {
            padding: 0 14px; color: var(--text-dim); font-size: 14px;
        }
        .search-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-main); font-size: 13px; padding: 13px 0;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-clear {
            padding: 0 14px; color: var(--text-dim); cursor: pointer;
            font-size: 14px; background: none; border: none;
            transition: color 0.2s;
        }
        .search-clear:hover { color: var(--primary); }

        /* ============================================================
           [M12] FILTROS DINÂMICOS APRIMORADOS
        ============================================================ */
        .v80-nav {
            display: flex; gap: 10px; padding: 12px 15px;
            overflow-x: auto; background: var(--bg2);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 88px; z-index: 999;
            max-width: 100%;
        }
        .v80-nav::-webkit-scrollbar { display: none; }
        .nav-link {
            background: var(--surface); color: var(--text-dim);
            padding: 10px 20px; border-radius: var(--radius-sm);
            font-size: 11px; font-weight: 700; border: 1px solid var(--border);
            text-transform: uppercase; white-space: nowrap;
            transition: var(--transition); cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            user-select: none;
        }
        .nav-link i { font-size: 12px; }
        .nav-link:hover { border-color: var(--primary); color: #fff; }
        .nav-link.active {
            background: var(--primary); color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 18px var(--primary-glow);
        }
        /* [M13] Contador no filtro */
        .nav-count {
            background: rgba(255,255,255,0.15);
            padding: 2px 7px; border-radius: 20px;
            font-size: 9px; font-weight: 900;
        }
        .nav-link.active .nav-count { background: rgba(255,255,255,0.25); }

        /* ============================================================
           [M14] BANNER HERO ROTATIVO
        ============================================================ */
        .hero-banner {
            max-width: 500px; margin: 0 auto;
            padding: 15px 15px 0;
        }
        .hero-slide {
            background: linear-gradient(135deg, #1a0a0c 0%, #0d0d0d 50%, #0a0a1a 100%);
            border: 1px solid var(--border2); border-radius: var(--radius-lg);
            padding: 28px 24px; position: relative; overflow: hidden;
            display: none;
        }
        .hero-slide.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hero-slide::before {
            content: ''; position: absolute; top: -50%; right: -20%;
            width: 300px; height: 300px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-label {
            font-size: 9px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 3px; color: var(--primary); margin-bottom: 8px;
        }
        .hero-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px; letter-spacing: 2px; line-height: 1;
            margin-bottom: 10px;
        }
        .hero-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; }
        .hero-cta {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--primary); color: #fff;
            padding: 12px 22px; border-radius: var(--radius-sm);
            font-size: 12px; font-weight: 900; text-decoration: none;
            text-transform: uppercase; letter-spacing: 1px;
            transition: var(--transition);
        }
        .hero-cta:hover { background: var(--primary-dark); transform: scale(1.03); }
        .hero-dots {
            display: flex; gap: 6px; margin-top: 18px;
        }
        .hero-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--border2); cursor: pointer; transition: 0.3s;
        }
        .hero-dot.active { background: var(--primary); width: 20px; border-radius: 3px; }

        /* ============================================================
           [M15] ESTATÍSTICAS DA LOJA
        ============================================================ */
        .stats-row {
            max-width: 500px; margin: 15px auto 0;
            padding: 0 15px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .stat-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 16px 10px;
            text-align: center;
        }
        .stat-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px; color: var(--primary); line-height: 1;
        }
        .stat-label {
            font-size: 9px; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;
        }

        /* ============================================================
           [M16] CATÁLOGO PRINCIPAL
        ============================================================ */
        .catalog { max-width: 500px; margin: 0 auto; padding: 20px 15px 30px; }

        /* [M17] Título de seção */
        .section-title {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .section-title h3 {
            font-size: 13px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            color: var(--text-dim);
        }
        .section-title span {
            background: var(--primary); color: #fff;
            font-size: 10px; font-weight: 900;
            padding: 3px 10px; border-radius: 20px;
        }

        /* ============================================================
           [M18] CARD APRIMORADO COM GALERIA
        ============================================================ */
        .card {
            background: var(--surface); border-radius: var(--radius-xl);
            margin-bottom: 35px; overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            box-shadow: var(--shadow-card);
            animation: slideUp 0.7s ease-out both;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 50px rgba(0,0,0,0.7);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* [M19] Delay escalonado nos cards */
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.10s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.20s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.30s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.40s; }

        /* ============================================================
           [M20] GALERIA DE IMAGENS COM SLIDER
        ============================================================ */
        .media {
            position: relative; width: 100%; height: 280px;
            background: #1a1a1a; overflow: hidden;
        }
        .media-slides { display: flex; height: 100%; transition: transform 0.4s ease; }
        .media-slide {
            min-width: 100%; height: 100%; position: relative; flex-shrink: 0;
        }
        .media-slide img {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 0; transition: opacity 0.5s;
        }
        .media-slide img.loaded { opacity: 1; }

        /* [M21] Skeleton loader */
        .media-slide::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .media-slide img.loaded + .media-slide::before,
        .media-slide img.loaded::before { display: none; }
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position:  200% 0; }
        }

        /* [M22] Controles do slider */
        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.6); border: none; color: #fff;
            width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; z-index: 5; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.2s;
            backdrop-filter: blur(4px);
        }
        .slider-btn:hover { background: var(--primary); transform: translateY(-50%) scale(1.1); }
        .slider-prev { left: 10px; }
        .slider-next { right: 10px; }

        /* [M23] Indicadores do slider */
        .slider-dots {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; z-index: 5;
        }
        .slider-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer;
        }
        .slider-dot.active { background: #fff; width: 14px; border-radius: 3px; }

        /* [M24] Contador de fotos */
        .photo-count {
            position: absolute; bottom: 10px; right: 12px;
            background: rgba(0,0,0,0.7); color: #fff;
            font-size: 10px; font-weight: 700;
            padding: 4px 10px; border-radius: 20px; z-index: 5;
            backdrop-filter: blur(4px);
        }

        /* ============================================================
           [M25] BADGES MÚLTIPLOS
        ============================================================ */
        .badges {
            position: absolute; top: 14px; left: 14px;
            display: flex; flex-direction: column; gap: 6px; z-index: 10;
        }
        .badge {
            padding: 5px 12px; border-radius: var(--radius-sm);
            font-size: 9px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
        .badge-red   { background: var(--primary); color: #fff; }
        .badge-gold  { background: var(--gold); color: #000; }
        .badge-green { background: var(--secondary); color: #fff; }
        .badge-blue  { background: #1e90ff; color: #fff; }

        /* [M26] Botão favoritar */
        .btn-fav {
            position: absolute; top: 14px; right: 14px; z-index: 10;
            background: rgba(0,0,0,0.6); border: none; color: #fff;
            width: 38px; height: 38px; border-radius: 50%;
            cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition); backdrop-filter: blur(4px);
        }
        .btn-fav:hover, .btn-fav.active { background: var(--primary); transform: scale(1.15); }
        .btn-fav.active i { font-weight: 900; }

        /* ============================================================
           [M27] INFO DO CARD APRIMORADA
        ============================================================ */
        .info { padding: 22px 22px 24px; }

        .tag-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .tag {
            color: var(--primary); font-size: 10px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .tag-verified {
            color: var(--secondary); font-size: 10px;
            display: flex; align-items: center; gap: 3px;
        }

        /* [M28] Nome do veículo com fonte Bebas */
        .name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 30px; letter-spacing: 1px;
            margin-bottom: 14px; line-height: 1;
            text-transform: uppercase;
        }

        /* [M29] Pills de especificações aprimoradas */
        .specs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .pill {
            background: var(--surface2); padding: 7px 13px;
            border-radius: var(--radius-sm); font-size: 12px;
            font-weight: 600; color: #bbb;
            border: 1px solid var(--border2);
            display: flex; align-items: center; gap: 5px;
        }
        .pill i { font-size: 10px; color: var(--text-dim); }

        /* ============================================================
           [M30] LINHA DE PREÇO COM DESCONTO
        ============================================================ */
        .price-row {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 18px; padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .price-block {}
        .price-old {
            font-size: 13px; color: var(--text-muted);
            text-decoration: line-through; margin-bottom: 2px;
        }
        .price { font-size: 34px; font-weight: 900; color: #fff; letter-spacing: -1.5px; line-height: 1; }
        .price-badge {
            background: var(--secondary); color: #fff;
            font-size: 10px; font-weight: 900;
            padding: 5px 12px; border-radius: var(--radius-sm);
            text-transform: uppercase; letter-spacing: 1px;
        }

            font-size: 11px; color: var(--text-dim); mar
