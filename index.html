<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | GENESIS V115 GOLD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&family=Orbitron:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #ff9f0a; --bg: #050505; --surface: rgba(28, 28, 30, 0.8);
            --border: rgba(255, 159, 10, 0.25); --green: #32d74b; --blue: #0a84ff; --red: #ff375f;
        }
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            margin: 0; text-transform: uppercase; overflow-x: hidden;
            background-image: radial-gradient(circle at 2px 2px, rgba(255,159,10,0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        /* --- PORTAL DE ACESSO --- */
        #portal { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .logo-main { text-align: center; margin-bottom: 40px; filter: drop-shadow(0 0 10px rgba(255,159,10,0.3)); }
        .logo-main h1 { font-family: 'Orbitron'; font-size: 42px; letter-spacing: 15px; margin: 0; }
        
        .auth-grid { display: grid; grid-template-columns: 1fr; gap: 12px; width: 340px; }
        .btn-access { 
            padding: 20px; background: var(--surface); border: 1px solid var(--border); 
            color: #fff; font-family: 'JetBrains Mono'; font-size: 11px; font-weight: bold; 
            cursor: pointer; transition: 0.3s; border-radius: 4px; backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-access:hover { border-color: var(--primary); box-shadow: 0 0 20px rgba(255,159,10,0.2); transform: translateX(5px); }

        /* --- LOBBY REFINADO --- */
        #lobby { display: none; padding: 20px; animation: slideUp 0.6s ease; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); margin-bottom: 25px; }
        
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .module-card { 
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px; 
            padding: 25px; border-top: 4px solid var(--primary); position: relative;
            backdrop-filter: blur(15px);
        }
        .module-card h3 { font-family: 'Orbitron'; font-size: 13px; color: var(--primary); margin: 0 0 20px 0; display: flex; align-items: center; gap: 10px; }

        /* --- ESTADO OPERACIONAL --- */
        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 9px; font-family: 'JetBrains Mono'; border: 1px solid #444; }
        .online { border-color: var(--green); color: var(--green); animation: glow 1.5s infinite alternate; }

        /* --- CÂMERA E AÇÕES --- */
        .modulo-view { display: none; padding: 20px; animation: fadeIn 0.4s; }
        .scanner-container { width: 100%; height: 280px; background: #000; border: 1px solid var(--primary); border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 20px; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .laser { position: absolute; width: 100%; height: 2px; background: var(--primary); box-shadow: 0 0 15px var(--primary); top: 0; animation: laserMove 2.5s infinite linear; }

        .action-btn { 
            width: 100%; padding: 20px; background: transparent; border: 1px solid var(--primary); 
            color: var(--primary); font-weight: 900; font-family: 'JetBrains Mono'; cursor: pointer; border-radius: 8px;
            margin-bottom: 15px; transition: 0.2s;
        }
        .action-btn:active { background: var(--primary); color: #000; }

        @keyframes laserMove { 0% { top: 0; } 100% { top: 100%; } }
        @keyframes glow { from { box-shadow: 0 0 2px var(--green); } to { box-shadow: 0 0 10px var(--green); } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="portal">
    <div class="logo-main">
        <h1>JP DIAS</h1>
        <p style="color:var(--primary); font-size:9px; letter-spacing:6px; margin-top:10px;">INDUSTRIAL LOGISTICS V115</p>
    </div>
    <div class="auth-grid">
        <button class="btn-access" onclick="acesso('DONO')">01. PROPRIETÁRIO <span>[👑]</span></button>
        <button class="btn-access" onclick="acesso('SHARK')">02. ADMIN (SHARK) <span>[🦈]</span></button>
        <button class="btn-access" onclick="acesso('SUPERVISOR')">03. SUPERVISOR <span>[🛡️]</span></button>
        <button class="btn-access" onclick="acesso('OPERACIONAL')">04. OPERACIONAL <span>[📦]</span></button>
        <button class="btn-access" onclick="acesso('MOTORISTA')" style="border-color:var(--blue);">05. MOTORISTA <span>[🚚]</span></button>
    </div>
</div>

<div id="lobby">
    <div class="top-bar">
        <div id="user-info" class="status-pill online">CARREGANDO...</div>
        <button onclick="location.reload()" style="background:none; border:none; color:var(--red); font-weight:bold; cursor:pointer;">DISCONNECT_</button>
    </div>

    <div class="dash-grid" id="dash-main">
        </div>
</div>

<div id="modulo-exec" class="modulo-view">
    <header class="top-bar">
        <button onclick="voltarLobby()" style="background:none; border:none; color:var(--primary); font-weight:bold; cursor:pointer;">⬅ CANCELAR</button>
        <span id="mod-name" style="font-family:'Orbitron'; font-size:11px;">ESTAÇÃO</span>
    </header>

    <div class="scanner-container">
        <video id="camera" autoplay playsinline></video>
        <div class="laser"></div>
    </div>

    <button class="action-btn" onclick="iniciarBipagem()">BIPAR CÓDIGO (VOZ)</button>
    <button class="action-btn" style="border-color:var(--red); color:var(--red);" onclick="alert('Avaria enviada ao Shark')">REPORTAR AVARIA</button>
</div>

<script>
    let roleAtiva = "";
    let mediaStream = null;

    function falar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'pt-BR';
        window.speechSynthesis.speak(m);
    }

    function acesso(role) {
        if(role !== 'OPERACIONAL' && role !== 'MOTORISTA') {
            if(prompt(`CREDENCIAIS ${role}:`) !== "123") return;
        }
        roleAtiva = role;
        document.getElementById('portal').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('user-info').innerText = `${role} | ID: GHOST-${Math.floor(Math.random()*9999)}`;
        
        falar(`Bem vindo à Gênesis. Nível ${role} operacional.`);
        renderizarDash();
    }

    function renderizarDash() {
        const grid = document.getElementById('dash-main');
        grid.innerHTML = "";

        // VISÃO GESTOR (DONO/SHARK)
        if(['DONO', 'SHARK', 'SUPERVISOR'].includes(roleAtiva)) {
            grid.innerHTML += `
                <div class="module-card">
                    <h3>🛰️ MONITORAMENTO STAFF</h3>
                    <div style="font-family:'JetBrains Mono'; font-size:10px;">
                        <p>● OP-GHOST-22 [ARMAZÉM] - BIPANDO</p>
                        <p>● OP-GHOST-09 [CROSSDOCK] - STANDBY</p>
                        <p style="color:var(--blue)">● MOT-TRUCK-88 [ROTA] - KM 402</p>
                    </div>
                    <button class="action-btn" style="margin-top:15px; font-size:10px; padding:10px;" onclick="alert('Auditoria iniciada')">AUDITAR GERAL</button>
                </div>
            `;
        }

        // VISÃO OPERACIONAL
        grid.innerHTML += `
            <div class="module-card">
                <h3>📦 OPERAÇÕES DE CAMPO</h3>
                <button class="action-btn" onclick="abrirModulo('ARMAZÉM')">ENTRAR NO ARMAZÉM</button>
                <button class="action-btn" onclick="abrirModulo('CROSSDOCK')">ENTRAR NO CROSSDOCK</button>
            </div>
        `;

        if(roleAtiva === 'MOTORISTA') {
            grid.innerHTML += `
                <div class="module-card" style="border-top-color:var(--blue)">
                    <h3>🚚 PAINEL DE VIAGEM</h3>
                    <p style="font-size:11px;">DESTINO: CD-INTERIOR</p>
                    <button class="action-btn" style="border-color:var(--blue); color:var(--blue);">INICIAR GPS ROTA</button>
                </div>
            `;
        }
    }

    async function abrirModulo(nome) {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('modulo-exec').style.display = 'block';
        document.getElementById('mod-name').innerText = nome;
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('camera').srcObject = mediaStream;
        } catch(e) { console.log("Câmera OFF"); }
    }

    function iniciarBipagem() {
        falar("Iniciando. Informe o código do produto.");
        let c = prompt("CÓDIGO:");
        if(c) { falar("Confirmado. Bipagem registrada."); }
    }

    function voltarLobby() {
        if(mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        document.getElementById('modulo-exec').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
    }
</script>

</body>
</html>
