<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HG MOTORS | DIAMOND SELECTION</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37; --bg: #000000; --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1); --w: #25D366; --text: #f0f0f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Barra de Progresso Superior */
        #scroll-progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--gold); z-index: 3000; width: 0%; transition: 0.1s; }

        header {
            position: fixed; top: 0; width: 100%; z-index: 2000; padding: 15px;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border); display: flex; justify-content: center;
        }
        .logo-main { height: 45px; transition: 0.3s; cursor: pointer; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
        .logo-main:hover { transform: scale(1.05); }

        .hero { padding: 140px 20px 40px; text-align: center; background: radial-gradient(circle at top, #111 0%, #000 100%); }
        .hero h2 { font-size: clamp(24px, 8vw, 36px); font-weight: 800; letter-spacing: -1px; text-transform: uppercase; }
        .hero p { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-top: 8px; }

        .container { padding: 20px; max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        
        .lux-card {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 28px; overflow: hidden; position: relative;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideUp 0.8s ease backwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .lux-card:hover { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        .lux-img-box { width: 100%; height: 240px; position: relative; overflow: hidden; }
        .lux-img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .lux-card:hover .lux-img-box img { transform: scale(1.1); }
        
        .lux-badge {
            position: absolute; top: 15px; left: 15px;
            background: var(--gold); color: #000; padding: 5px 12px;
            border-radius: 10px; font-size: 10px; font-weight: 900; z-index: 10;
        }

        .lux-info { padding: 22px; }
        .lux-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; color: #fff; }
        .lux-sub { font-size: 12px; color: #888; margin-bottom: 20px; min-height: 36px; }
        
        .lux-pricing {
            background: rgba(255,255,255,0.03); border-radius: 18px; padding: 18px;
            border: 1px solid var(--border); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .val { font-size: 24px; font-weight: 800; color: #fff; }
        .label { font-size: 9px; color: var(--gold); font-weight: 800; text-transform: uppercase; display: block; }

        .lux-btn {
            background: var(--w); color: #fff; text-decoration: none;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 16px; border-radius: 16px; font-weight: 800; font-size: 13px;
            text-transform: uppercase; transition: 0.3s;
        }
        .lux-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* Botão WhatsApp Flutuante */
        .wpp-float {
            position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px;
            background: var(--w); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; z-index: 2500; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .wpp-float:hover { transform: scale(1.1) rotate(10deg); }

        /* Seção Especial: Pedidos */
        .encomenda { grid-column: 1 / -1; background: linear-gradient(90deg, #111, #050505); padding: 40px; border-radius: 28px; text-align: center; border: 1px dashed var(--border); margin-top: 20px; }
        .encomenda h3 { font-weight: 800; margin-bottom: 10px; color: var(--gold); }
        .encomenda p { font-size: 14px; color: #666; margin-bottom: 20px; }

        footer { text-align: center; padding: 60px 20px; color: #444; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
        .social-icons { margin-bottom: 20px; display: flex; justify-content: center; gap: 20px; font-size: 18px; }
        .social-icons a { color: #333; transition: 0.3s; }
        .social-icons a:hover { color: var(--gold); }
    </style>
</head>
<body onscroll="updateScroll()">

    <div id="scroll-progress"></div>

    <header>
        <img src="5565.png" alt="HG MOTORS" class="logo-main" onclick="window.scrollTo(0,0)">
    </header>

    <div class="hero">
        <h2>CARROS E MOTOS</h2>
        <p>A excelência que você merece</p>
    </div>

    <main class="container" id="vitrine"></main>

    <a href="https://wa.me/5519999999999" class="wpp-float" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <footer>
        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-solid fa-location-dot"></i></a>
        </div>
        HG MOTORS • DIAMOND POPULAR<br>
        RUA DO SUCESSO, 777 - AMERICANA/SP<br><br>
        DESENVOLVIDO POR JP DIAS • 2026
    </footer>

    <script>
        const estoque = [
            { nome: 'Chevrolet Onix LTZ', info: '2021 • Automático • MyLink • Único Dono', preco: '72.900', img: '5756.jpg', badge: 'MAIS VENDIDO' },
            { nome: 'Volkswagen Gol G8', info: '2022 • Ar Condicionado • Completo • Baixa KM', preco: '58.500', img: '5751.jpg', badge: 'ECONÔMICO' },
            { nome: 'Fiat Argo Drive', info: '2021 • Multimídia • Econômico • Impecável', preco: '64.900', img: '5749.jpg', badge: 'OPORTUNIDADE' },
            { nome: 'Ford Ka SE Plus', info: '2020 • Motor 1.5 • Revisado • Garantia', preco: '52.900', img: '5750.jpg', badge: 'REVISADO' },
            { nome: 'Hyundai HB20 Vision', info: '2021 • Direção Elétrica • Super Conservado', preco: '67.900', img: '5754.jpg', badge: 'VIP' }
        ];

        function render() {
            const vitrine = document.getElementById('vitrine');
            let cards = estoque.map((v, index) => `
                <article class="lux-card" style="animation-delay: ${index * 0.1}s">
                    <div class="lux-img-box">
                        <img src="${v.img}" alt="${v.nome}" loading="lazy">
                        <div class="lux-badge">${v.badge}</div>
                    </div>
                    <div class="lux-info">
                        <h3 class="lux-title">${v.nome}</h3>
                        <p class="lux-sub">${v.info}</p>
                        <div class="lux-pricing">
                            <div>
                                <span class="label">Valor à vista</span>
                                <span class="val">R$ ${v.preco}</span>
                            </div>
                            <i class="fa-solid fa-shield-check" style="color: #222; font-size: 20px;"></i>
                        </div>
                        <a href="https://wa.me! Vi o ${v.nome} no estoque e quero mais detalhes." class="lux-btn">
                            <i class="fa-brands fa-whatsapp"></i> Consultar Veículo
                        </a>
                    </div>
                </article>
            `).join('');

            // Adiciona Card de Encomenda ao final
            cards += `
                <div class="encomenda">
                    <h3>NÃO ACHOU O QUE PROCURAVA?</h3>
                    <p>Nós encontramos o carro ou moto dos seus sonhos para você.</p>
                    <a href="https://wa.me encomendar um veículo específico" 
                       style="color: var(--gold); text-decoration:none; font-weight:800; font-size:12px; letter-spacing:1px;">
                       FALAR COM CONSULTOR DIAMOND →
                    </a>
                </div>
            `;
            
            vitrine.innerHTML = cards;
        }

        function updateScroll() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById("scroll-progress").style.width = scrolled + "%";
        }

        render();
    </script>
</body>
</html>
