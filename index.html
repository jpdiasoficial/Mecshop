<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET ULTRA V20</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #ff5e00; --g: #00ff41; --gold: #d4af37; --danger: #ff3b30; --bg: #050505; --card: #0d0d0d; --border: #1a1a1a; --pink: #ff007a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* ENGINE DE TELAS & TRANSIÇÕES (Lista 10) */
        .view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); z-index: 10; overflow-y: auto; padding-bottom: 110px; }
        .view.active { display: flex; animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        header { height: 70px; background: rgba(0,0,0,0.95); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(15px); }
        .logo { font-weight: 900; font-size: 24px; color: var(--gold); text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }

        .card { background: var(--card); margin: 10px; padding: 18px; border-radius: 20px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        
        /* BOTÕES PROFISSIONAIS (Lista 15) */
        .btn { border: none; border-radius: 14px; font-weight: 900; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn-p { background: linear-gradient(135deg, #ff5e00, #ff2a00); color: #fff; padding: 16px; width: 100%; box-shadow: 0 4px 15px rgba(255, 94, 0, 0.3); }
        .btn-g { background: linear-gradient(135deg, #00ff41, #008f25); color: #000; padding: 16px; width: 100%; box-shadow: 0 4px 15px rgba(0, 255, 65, 0.2); }

        /* MINES GRID (V7 + Lista 20) */
        .m-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #000; padding: 12px; border-radius: 18px; }
        .tile { aspect-ratio: 1/1; background: #111; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; border-bottom: 4px solid #000; color: #222; transition: 0.2s; }
        .tile.open { border-bottom: none; background: #1a1a1a; transform: translateY(2px); }
        .is-gem { color: var(--g); text-shadow: 0 0 10px var(--g); }
        .is-bomb { color: var(--danger); text-shadow: 0 0 10px var(--danger); }

        /* CRASH CHART & CANVAS (Lista 20) */
        #crash-area { height: 220px; background: radial-gradient(circle at bottom left, #0a0a0a, #000); border-radius: 18px; position: relative; overflow: hidden; border: 1px solid #222; }
        #chart-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        #rocket { position: absolute; bottom: 20px; left: 20px; font-size: 30px; color: var(--p); z-index: 10; filter: drop-shadow(0 0 10px var(--p)); }
        #mult-display { font-size: 55px; font-weight: 900; z-index: 20; position: relative; text-shadow: 0 0 20px #000; }

        /* DOUBLE ROLETA (Lista 15) */
        .wheel-wrap { height: 65px; background: #000; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative; }
        .wheel { display: flex; transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1); width: 6000px; }
        .w-item { min-width: 55px; height: 65px; display: flex; align-items: center; justify-content: center; font-weight: 900; border-right: 1px solid #000; font-size: 18px; }
        .w-red { background: var(--danger); } .w-black { background: #1a1a1a; } .w-white { background: #fff; color: #000; }

        /* VIP & PROGRESSO (Lista 20) */
        .vip-container { height: 8px; background: #1a1a1a; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .vip-bar { height: 100%; background: linear-gradient(90deg, var(--gold), #fff); width: 0%; transition: 1s; box-shadow: 0 0 10px var(--gold); }

        /* CHAT FAKE & NOTIFICAÇÕES (Lista 10) */
        .chat-fake { height: 55px; font-size: 11px; color: #555; overflow: hidden; padding: 0 15px; }
        .history { display: flex; gap: 6px; overflow-x: auto; padding: 10px; scrollbar-width: none; }
        .vela { min-width: 55px; padding: 5px; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; background: #111; border: 1px solid #222; }

        /* NAVBAR (Lista 10) */
        nav { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 75px; background: rgba(10,10,10,0.95); border: 1px solid var(--border); border-radius: 25px; display: none; justify-content: space-around; align-items: center; z-index: 1000; backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-link { color: #444; font-size: 10px; font-weight: 900; text-align: center; flex: 1; transition: 0.3s; }
        .nav-link.active { color: var(--gold); transform: translateY(-5px); }
        .nav-link i { font-size: 22px; display: block; margin-bottom: 4px; }

        input { width:100%; padding:18px; background:var(--card); border:1px solid var(--border); border-radius:15px; color:#fff; margin-bottom:12px; outline:none; transition: 0.3s; }
        input:focus { border-color: var(--p); }
    </style>
</head>
<body onload="App.init()">

    <div id="scr-auth" class="view active" style="justify-content:center; align-items:center; padding:35px;">
        <div class="logo" style="font-size:50px; margin-bottom:40px;">MEC-BET</div>
        <input type="text" id="u-in" placeholder="DIGITE SEU USUÁRIO">
        <button class="btn btn-p" onclick="App.Auth.login()">ACESSAR PLATAFORMA</button>
        <p style="margin-top:25px; color:var(--gold); font-size:13px;" onclick="App.Router.go('scr-reg')">NÃO TEM CONTA? CADASTRE-SE</p>
    </div>

    <div id="scr-reg" class="view" style="justify-content:center; align-items:center; padding:35px;">
        <h2 style="margin-bottom:25px; letter-spacing:1px;">CADASTRO VIP</h2>
        <input type="text" placeholder="CPF VÁLIDO">
        <input type="email" placeholder="SEU MELHOR E-MAIL">
        <input type="password" placeholder="CRIE UMA SENHA">
        <button class="btn btn-g" onclick="App.Router.go('scr-auth')">CRIAR CONTA AGORA</button>
    </div>

    <div id="scr-lobby" class="view">
        <header><div class="logo">MEC-BET</div><div id="u-saldo-top" style="color:var(--g); font-weight:900; background:rgba(0,255,65,0.1); padding:6px 15px; border-radius:20px;">R$ 0,00</div></header>
        <div class="card" style="border-left: 5px solid var(--gold);">
            <div style="display:flex; justify-content:space-between; align-items:start;">
                <div><small style="color:#666; font-weight:900;">SALDO DISPONÍVEL</small><h1 id="u-saldo-main" style="font-size:42px; letter-spacing:-1px;">R$ 0,00</h1></div>
                <div style="text-align:right;"><i class="fa-solid fa-gem" style="color:var(--gold)"></i><br><small style="color:var(--gold); font-weight:900;" id="vip-txt">VIP 1</small></div>
            </div>
            <div class="vip-container"><div class="vip-bar" id="vip-f"></div></div>
            <button class="btn btn-g" style="margin-top:20px;" onclick="App.System.deposit()">DEPOSITAR VIA PIX</button>
        </div>
        <div class="chat-fake" id="chat"></div>
        <div style="padding:0 10px; display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
            <div class="card" onclick="App.Router.go('scr-mines')" style="margin:0; text-align:center; background:linear-gradient(180deg, #0d0d0d, #1a1a1a);"><i class="fa-solid fa-gem" style="color:var(--gold); font-size:24px; margin-bottom:10px;"></i><br>MINES</div>
            <div class="card" onclick="App.Router.go('scr-crash')" style="margin:0; text-align:center; background:linear-gradient(180deg, #0d0d0d, #1a1a1a);"><i class="fa-solid fa-rocket" style="color:var(--p); font-size:24px; margin-bottom:10px;"></i><br>CRASH</div>
            <div class="card" onclick="App.Router.go('scr-double')" style="margin:0; text-align:center; background:linear-gradient(180deg, #0d0d0d, #1a1a1a);"><i class="fa-solid fa-circle-dot" style="color:var(--danger); font-size:24px; margin-bottom:10px;"></i><br>DOUBLE</div>
            <div class="card" onclick="alert('Em Breve')" style="margin:0; text-align:center; opacity:0.5; background:linear-gradient(180deg, #0d0d0d, #1a1a1a);"><i class="fa-solid fa-futbol" style="color:var(--g); font-size:24px; margin-bottom:10px;"></i><br>PENALTY</div>
        </div>
    </div>

    <div id="scr-mines" class="view">
        <header><i class="fa-solid fa-chevron-left" onclick="App.Router.go('scr-lobby')"></i><div id="m-saldo" style="color:var(--g)">R$ 0,00</div><i class="fa-solid fa-headset"></i></header>
        <div style="padding:15px;">
            <div class="m-grid" id="m-board"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin:25px 0;">
                <button class="btn" style="background:#111; width:55px; height:55px;" onclick="App.Game.changeBet(-10)">-</button>
                <div style="text-align:center;"><small style="color:#444">APOSTA</small><br><b id="bet-m" style="font-size:24px; color:var(--gold)">R$ 10</b></div>
                <button class="btn" style="background:#111; width:55px; height:55px;" onclick="App.Game.changeBet(10)">+</button>
            </div>
            <button id="m-start" class="btn btn-p" onclick="App.Game.Mines.start()">INICIAR JOGO</button>
            <button id="m-cash" class="btn btn-g" style="display:none;" onclick="App.Game.Mines.cashout()">SACAR PRÊMIO</button>
        </div>
    </div>

    <div id="scr-crash" class="view">
        <header><i class="fa-solid fa-chevron-left" onclick="App.Router.go('scr-lobby')"></i><div id="c-saldo" style="color:var(--g)">R$ 0,00</div><div>CRASH</div></header>
        <div class="history" id="c-hist"></div>
        <div style="padding:15px;">
            <div id="crash-area"><canvas id="chart-canvas"></canvas><div id="mult-display">1.00x</div><div id="rocket"><i class="fa-solid fa-rocket"></i></div></div>
            <div class="card" style="background:#000; margin-top:15px;">
                <div style="display:flex; gap:5px; margin-bottom:15px;">
                    <button class="btn" style="background:#111; flex:1;" onclick="App.Game.betMod(0.5)">1/2</button>
                    <button class="btn" style="background:#111; flex:1;" onclick="App.Game.betMod(2)">2X</button>
                </div>
                <button id="c-start" class="btn btn-p" onclick="App.Game.Crash.start()">APOSTAR</button>
                <button id="c-cash" class="btn btn-g" style="display:none;" onclick="App.Game.Crash.cashout()">CASHOUT</button>
                <button id="c-wait" class="btn" style="display:none; background:#111; color:#444;" disabled>PREPARANDO...</button>
            </div>
        </div>
    </div>

    <div id="scr-double" class="view">
        <header><i class="fa-solid fa-chevron-left" onclick="App.Router.go('scr-lobby')"></i><div id="d-saldo" style="color:var(--g)">R$ 0,00</div><div>DOUBLE</div></header>
        <div style="padding:15px;">
            <div class="wheel-wrap"><div class="wheel" id="d-wheel"></div></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:25px;">
                <button class="btn" style="background:var(--danger); height:65px;" onclick="App.Game.Double.bet('red')">2X</button>
                <button class="btn" style="background:#fff; color:#000; height:65px;" onclick="App.Game.Double.bet('white')">14X</button>
                <button class="btn" style="background:#1a1a1a; height:65px;" onclick="App.Game.Double.bet('black')">2X</button>
            </div>
        </div>
    </div>

    <div id="scr-admin" class="view">
        <header><div class="logo" style="color:var(--p)">SHARK ADMIN</div><i class="fa-solid fa-shield-halved"></i></header>
        <div style="padding:15px;">
            <input type="text" id="adm-search" placeholder="FILTRAR USUÁRIO..." oninput="App.System.loadShark()">
            <div id="adm-list"></div>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-link active" onclick="App.Router.go('scr-lobby', this)"><i class="fa-solid fa-house"></i>LOBBY</div>
        <div class="nav-link" onclick="App.Router.go('scr-mines', this)"><i class="fa-solid fa-gamepad"></i>JOGOS</div>
        <div id="nav-shark" class="nav-link" style="display:none; color:var(--gold)" onclick="App.Router.go('scr-admin', this)"><i class="fa-solid fa-crown"></i>SHARK</div>
    </nav>

    <script>
        const App = {
            db: JSON.parse(localStorage.getItem('MEC_V20_FINAL_DB')) || [],
            curr: null, bet: 10,
            init() {
                const s = sessionStorage.getItem('MEC_SESS');
                if(s) { this.curr = this.db.find(u => u.user === s); if(this.curr) this.System.unlock(); }
                this.Game.Mines.render(); this.Game.Double.init(); this.System.chatCycle();
            },
            Auth: {
                login() {
                    let u = document.getElementById('u-in').value.toUpperCase(); if(!u) return;
                    let user = App.db.find(x => x.user === u);
                    if(!user) { user = { user: u, saldo: 0, role: u === 'ADMIN' ? 'admin' : 'player', mode: 'auto', xp: 0 }; App.db.push(user); App.System.save(); }
                    sessionStorage.setItem('MEC_SESS', u); location.reload();
                }
            },
            Game: {
                changeBet(v) { App.bet += v; if(App.bet < 1) App.bet = 1; this.updUI(); },
                betMod(m) { App.bet *= m; this.updUI(); },
                updUI() { document.getElementById('bet-m').innerText = `R$ ${App.bet.toFixed(0)}`; },
                Mines: {
                    playing: false, mult: 1, bPos: 0,
                    start() {
                        if(App.curr.saldo < App.bet) return alert("SALDO INSUFICIENTE!");
                        App.curr.saldo -= App.bet; App.curr.xp += 5; App.System.saveSync();
                        this.playing = true; this.mult = 1; this.bPos = Math.floor(Math.random()*25);
                        document.getElementById('m-start').style.display = 'none'; document.getElementById('m-cash').style.display = 'block';
                        this.render();
                    },
                    render() {
                        const b = document.getElementById('m-board'); b.innerHTML = '';
                        for(let i=0; i<25; i++) {
                            let t = document.createElement('div'); t.className = 'tile'; t.innerHTML = '<i class="fa-solid fa-cube" style="opacity:0.05"></i>';
                            t.onclick = () => {
                                if(!this.playing || t.classList.contains('open')) return;
                                t.classList.add('open');
                                let bomb = (i === this.bPos);
                                if(App.curr.mode === 'win') bomb = false; if(App.curr.mode === 'lose') bomb = true;
                                if(bomb) { t.innerHTML = '<i class="fa-solid fa-bomb"></i>'; t.classList.add('is-bomb'); this.end(false); }
                                else { t.innerHTML = '<i class="fa-solid fa-gem"></i>'; t.classList.add('is-gem'); this.mult += 0.5; document.getElementById('m-cash').innerText = `SACAR R$ ${(App.bet*this.mult).toFixed(2)}`; }
                            }; b.appendChild(t);
                        }
                    },
                    cashout() { App.curr.saldo += (App.bet * this.mult); this.end(true); },
                    end(win) { this.playing = false; document.getElementById('m-start').style.display = 'block'; document.getElementById('m-cash').style.display = 'none'; App.System.saveSync(); if(win) alert("VITÓRIA!"); }
                },
                Crash: {
                    timer: null, mult: 1.00, pts: [],
                    start() {
                        if(App.curr.saldo < App.bet) return alert("SALDO!");
                        App.curr.saldo -= App.bet; App.System.saveSync();
                        this.mult = 1.00; this.pts = [];
                        document.getElementById('c-start').style.display = 'none'; document.getElementById('c-cash').style.display = 'block';
                        let limit = (Math.random() * 5 + 1.1); if(App.curr.mode === 'lose') limit = 1.01; if(App.curr.mode === 'win') limit = 20.0;
                        this.timer = setInterval(() => {
                            this.mult += (this.mult * 0.018);
                            document.getElementById('mult-display').innerText = this.mult.toFixed(2)+'x';
                            document.getElementById('rocket').style.transform = `translate(${this.mult*8}px, -${this.mult*8}px)`;
                            this.draw(); if(this.mult >= limit) this.explode();
                        }, 100);
                    },
                    draw() {
                        const c = document.getElementById('chart-canvas'); const ctx = c.getContext('2d');
                        ctx.clearRect(0,0,c.width,c.height); ctx.beginPath(); ctx.strokeStyle = '#ff5e00'; ctx.lineWidth = 4;
                        this.pts.push({x: this.mult*10, y: c.height - (this.mult*10)});
                        ctx.moveTo(0, c.height); this.pts.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
                    },
                    explode() {
                        clearInterval(this.timer); document.getElementById('c-cash').style.display = 'none'; document.getElementById('c-wait').style.display = 'block';
                        const v = document.createElement('div'); v.className = 'vela'; v.innerText = this.mult.toFixed(2)+'x'; document.getElementById('c-hist').prepend(v);
                        setTimeout(() => { document.getElementById('c-wait').style.display = 'none'; document.getElementById('c-start').style.display = 'block'; document.getElementById('rocket').style.transform = 'translate(0,0)'; }, 3000);
                    },
                    cashout() { App.curr.saldo += (App.bet * this.mult); clearInterval(this.timer); App.System.saveSync(); this.explode(); alert("CASHED OUT!"); }
                },
                Double: {
                    init() {
                        const w = document.getElementById('d-wheel'); w.innerHTML = '';
                        for(let i=0; i<100; i++) {
                            const r = document.createElement('div'); r.className = `w-item ${i%2===0?'w-red':'w-black'}`; if(i%14===0) r.className = 'w-item w-white';
                            r.innerText = i%14; w.appendChild(r);
                        }
                    },
                    bet(t) {
                        if(App.curr.saldo < App.bet) return;
                        App.curr.saldo -= App.bet; App.System.saveSync();
                        const w = document.getElementById('d-wheel'); let stop = Math.floor(Math.random()*2500) + 1000;
                        w.style.transform = `translateX(-${stop}px)`;
                        setTimeout(() => { alert("Rodada Finalizada!"); w.style.transition = 'none'; w.style.transform = 'translateX(0)'; setTimeout(()=>w.style.transition='transform 4s cubic-bezier(0.1, 0, 0.1, 1)', 100); }, 5000);
                    }
                }
            },
            System: {
                unlock() {
                    docum
