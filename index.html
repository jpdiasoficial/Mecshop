<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS LOG-PRO | V9000</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --red: #ff3b30; --blue: #0a84ff; --gray: #111; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; }
        .active { display: flex !important; }

        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #050505; font-family: 'Orbitron'; font-size: 10px; }
        
        /* PAINEL GESTOR - DIVIDIDO EM CADASTRO E DADOS */
        .dash-scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .kpi-card { background: #080808; border: 1px solid #222; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary); }
        .kpi-card small { font-size: 7px; color: #555; }
        .kpi-card b { display: block; font-size: 14px; font-family: 'Orbitron'; }

        /* TABELA DE FUNCIONÁRIOS COM DADOS */
        .data-table { width: 100%; border-collapse: collapse; font-size: 9px; margin-top: 15px; }
        .data-table th { text-align: left; color: #555; padding: 8px; border-bottom: 1px solid #222; }
        .data-table td { padding: 10px 8px; border-bottom: 1px solid #111; }
        .status-on { color: var(--primary); }

        /* FORMULÁRIO */
        .form-box { background: #080808; padding: 15px; border-radius: 8px; border: 1px solid #222; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; font-family: 'Orbitron'; font-size: 9px; margin-bottom: 10px; border-radius: 4px; box-sizing: border-box; }
        .btn-add { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; border-radius: 4px; }

        /* OPERACIONAL */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .card-mod { background: #0d0d0d; border: 1px solid #222; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--primary); cursor: pointer; }
        .op-display { flex: 1; margin: 20px; border: 2px solid var(--primary); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #flash { position: absolute; width: 100%; height: 100%; background: var(--primary); color: #000; display: none; justify-content: center; align-items: center; font-family: 'Orbitron'; font-size: 25px; border-radius: 18px; z-index: 10; }
    </style>
</head>
<body>

<div id="flash">✓ BIPADO</div>

<div id="scr-login" class="screen active">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px;">
        <h1 style="font-family:'Orbitron'; color:#151515; font-size:35px; letter-spacing:10px;">JP DIAS</h1>
        <input type="password" id="pass" placeholder="SENHA (9910 ou 1234)">
        <button class="btn-add" onclick="entrar()">ACESSAR</button>
    </div>
</div>

<div id="scr-gestor" class="screen">
    <header><span>DASHBOARD MASTER</span> <button onclick="location.reload()" style="color:var(--red); background:none; border:none;">SAIR</button></header>
    <div class="dash-scroll">
        
        <div class="kpi-grid">
            <div class="kpi-card"><small>BIPES TOTAIS</small><b id="total-bipes">1.240</b></div>
            <div class="kpi-card" style="border-left-color: var(--blue);"><small>EFICIÊNCIA GIRO</small><b>94%</b></div>
        </div>

        <div class="form-box">
            <b style="font-family:'Orbitron'; font-size:10px; display:block; margin-bottom:10px; color:var(--primary);">NOVO ACESSO</b>
            <input type="text" id="reg-nome" placeholder="NOME DO COLABORADOR">
            <select id="reg-mod">
                <option value="Armazém">ARMAZÉM</option>
                <option value="Crossdock">CROSSDOCK</option>
                <option value="Motorista">MOTORISTA</option>
            </select>
            <button class="btn-add" onclick="salvarFunc()">CRIAR E ATIVAR</button>
        </div>

        <b style="font-family:'Orbitron'; font-size:10px;">EQUIPE & PERFORMANCE</b>
        <table class="data-table">
            <thead>
                <tr><th>NOME</th><th>MÓDULO</th><th>BIPES</th><th>STATUS</th></tr>
            </thead>
            <tbody id="lista-func">
                <tr><td>PEDRO SILVA</td><td>ARMAZÉM</td><td>450</td><td class="status-on">● ON</td></tr>
                <tr><td>MARCOS REIS</td><td>CROSSDOCK</td><td>890</td><td class="status-on">● ON</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="scr-hub" class="screen">
    <header><span>MÓDULOS JP DIAS</span></header>
    <div class="grid">
        <div class="card-mod" onclick="showOp('AMZ')"><span>ESTOQUE</span><b>ARMAZÉM</b></div>
        <div class="card-mod" onclick="showOp('CROS')" style="border-color:var(--blue)"><span>GIRO</span><b>CROSSDOCK</b></div>
        <div class="card-mod" onclick="showOp('ROTA')" style="border-color:var(--gold); grid-column: span 2;"><span>LOGÍSTICA</span><b>ROTA MOTORISTA</b></div>
    </div>
</div>

<div id="scr-exec" class="screen">
    <header><span id="exec-title">---</span> <button onclick="show('scr-hub')" style="color:#555; background:none; border:none;">VOLTAR</button></header>
    <div class="op-display">
        <h2 id="main-st" style="font-family:'Orbitron';">READY</h2>
        <p id="sub-st" style="font-size:10px; color:#444;">AGUARDANDO LEITURA</p>
    </div>
    <div style="padding:20px; background:#080808;">
        <input type="text" id="scan-in" placeholder="ESCANEIE OU DIGITE">
        <button class="btn-add" onclick="bipar()">CONFIRMAR MANUAL</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function falar(t) { window.speechSynthesis.cancel(); window.speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }

    function entrar() {
        const p = document.getElementById('pass').value;
        if(p === "9910") show('scr-gestor');
        else if(p === "1234") show('scr-hub');
        else alert("ERRO");
    }

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showOp(tipo) {
        show('scr-exec');
        document.getElementById('exec-title').innerText = tipo;
        document.getElementById('scan-in').focus();
        falar("Iniciando Módulo " + tipo);
    }

    function salvarFunc() {
        const nome = document.getElementById('reg-nome').value;
        const mod = document.getElementById('reg-mod').value;
        if(nome) {
            const row = `<tr><td>${nome.toUpperCase()}</td><td>${mod.toUpperCase()}</td><td>0</td><td class="status-on">● ON</td></tr>`;
            document.getElementById('lista-func').innerHTML += row;
            document.getElementById('reg-nome').value = "";
            falar("Funcionário Cadastrado");
        }
    }

    function bipar() {
        const val = document.getElementById('scan-in').value;
        if(val) {
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.type = 'square'; osc.frequency.value = 1300;
            g.gain.value = 0.1; osc.start(); osc.stop(audioCtx.currentTime + 0.1);

            document.getElementById('flash').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('flash').style.display = 'none';
                document.getElementById('main-st').innerText = "BIP: " + val;
                document.getElementById('scan-in').value = "";
                document.getElementById('scan-in').focus();
            }, 600);
        }
    }

    document.getElementById('scan-in')?.addEventListener('keypress', (e) => { if(e.key === 'Enter') bipar(); });
</script>
</body>
</html>
