<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK V45 | Platinum Shark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #121212; --text: #fff; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; }

        .screen { display: none; height: 100vh; padding: 20px; flex-direction: column; overflow-y: auto; padding-bottom: 100px; }
        .active { display: flex; animation: slideUp 0.4s ease; }

        /* LOGIN (IMAGEM 4805) */
        .auth-screen { justify-content: center; align-items: center; text-align: center; }
        .logo-main { font-size: 42px; font-weight: 900; color: var(--primary); letter-spacing: 4px; margin-bottom: 40px; }
        input { width: 100%; max-width: 320px; background: #1a1a1a; border: 1px solid #333; padding: 18px; border-radius: 15px; color: #fff; margin-bottom: 15px; font-size: 16px; outline: none; }
        .btn-access { width: 100%; max-width: 320px; background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        /* DASHBOARD (IMAGEM 4803) */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--primary); }
        
        .card-main { background: var(--card); border-radius: 25px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .blur { filter: blur(12px); }

        /* GRID DE ICONES COM IMAGENS REAIS */
        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 30px 0; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; color: #888; cursor: pointer; }
        .icon-circle { width: 60px; height: 60px; background: #181818; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--primary); border: 1px solid rgba(255,255,255,0.03); }

        /* CARTÃO BLACK */
        .black-card { background: linear-gradient(145deg, #1a1a1a, #000); border-radius: 20px; padding: 25px; border: 1px solid #222; height: 180px; position: relative; }

        /* PAINEL CONTROL (IMAGEM 4804) */
        .stat-box { background: var(--card); padding: 20px; border-radius: 18px; border-left: 4px solid var(--primary); margin-bottom: 15px; }
        .upload-zone { border: 2px dashed var(--primary); padding: 30px; border-radius: 20px; text-align: center; cursor: pointer; }

        /* MENU INFERIOR (IMAGEM 4806) */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #050505; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #1a1a1a; }
        .nav-link { color: #444; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-link.active-link { color: var(--primary); }
        .nav-link.exit-btn { color: var(--danger); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="scr-auth" class="screen active auth-screen">
        <div class="logo-main">MEC-BANK</div>
        <input type="text" id="inp-user" placeholder="Usuário Master ou Cliente">
        <input type="password" id="inp-pass" placeholder="Senha de Acesso">
        <button class="btn-access" onclick="processLogin()">Acessar</button>
    </div>

    <div id="scr-home" class="screen">
        <header class="header">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="avatar" id="avatar-char">S</div>
                <span id="display-name" style="font-weight: 800;">Shark</span>
            </div>
            <i class="fa-solid fa-bell" style="color: var(--primary); font-size: 20px;"></i>
        </header>

        <div class="card-main">
            <small style="color: #666;">Saldo disponível <i class="fa-solid fa-eye-slash" onclick="toggleVisibility()"></i></small>
            <div id="main-balance" class="blur" style="font-size: 32px; font-weight: 900; margin: 10px 0;">R$ 145.850,90</div>
            <button style="width:100%; background:transparent; border:1px solid var(--primary); color:var(--primary); padding:10px; border-radius:10px;">Ver Extrato</button>
        </div>

        <div class="action-grid">
            <div class="action-item" onclick="abrirCamera('Pix')"><div class="icon-circle"><i class="fa-solid fa-qrcode"></i></div><span>Pix</span></div>
            <div class="action-item" onclick="abrirCamera('Boleto')"><div class="icon-circle"><i class="fa-solid fa-barcode"></i></div><span>Pagar</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-money-bill-transfer"></i></div><span>Transf.</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-mobile-screen"></i></div><span>Recarga</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-hand-holding-dollar"></i></div><span>Empréstimo</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-shield-halved"></i></div><span>Seguros</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-gift"></i></div><span>Mimos</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-circle-question"></i></div><span>Ajuda</span></div>
        </div>

        <div class="black-card">
            <small style="color: var(--primary); font-weight: 900;">SHARK PLATINUM</small>
            <div style="margin-top: 40px; font-size: 20px; letter-spacing: 4px;">•••• •••• •••• 8835</div>
            <div style="position: absolute; bottom: 25px;">
                <small style="color: #666; display: block;">Limite</small>
                <strong>R$ 50.000,00</strong>
            </div>
        </div>
    </div>

    <div id="scr-master" class="screen">
        <h2 style="color: var(--primary);">Shark Master Panel</h2>
        <div class="stat-box"><small>SALDO GLOBAL</small><h3>R$ 1.450.850</h3></div>
        <div class="upload-zone" onclick="document.getElementById('file-in').click()">
            <i class="fa-solid fa-file-excel" style="font-size: 30px; color: var(--primary);"></i>
            <p>Sincronizar Planilha XLSX</p>
            <input type="file" id="file-in" hidden onchange="alert('Sincronizado!')">
        </div>
    </div>

    <nav class="nav-bar" id="navbar" style="display: none;">
        <div class="nav-link active-link" onclick="openScreen('scr-home')"><i class="fa-solid fa-house"></i><br>Início</div>
        <div class="nav-link"><i class="fa-solid fa-list-ul"></i><br>Extrato</div>
        <div class="nav-link"><i class="fa-solid fa-credit-card"></i><br>Cartões</div>
        <div class="nav-link exit-btn" onclick="location.reload()"><i class="fa-solid fa-power-off"></i><br>Sair</div>
    </nav>

    <script>
        // MOTOR DE LOGIN
        function processLogin() {
            const u = document.getElementById('inp-user').value;
            const p = document.getElementById('inp-pass').value;
            if(!u || !p) return alert("Preencha tudo!");
            
            document.getElementById('scr-auth').classList.remove('active');
            document.getElementById('navbar').style.display = 'flex';

            if(u.toLowerCase() === 'shark') {
                document.getElementById('scr-master').classList.add('active');
            } else {
                document.getElementById('display-name').innerText = u;
                document.getElementById('avatar-char').innerText = u[0].toUpperCase();
                document.getElementById('scr-home').classList.add('active');
            }
        }

        // MOTOR DA CÂMERA (PIX/BOLETO)
        async function abrirCamera(tipo) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const modal = document.createElement('div');
                modal.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:2000; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;";
                modal.innerHTML = `<h3 style='color:#00ff88'>Escaneando ${tipo}...</h3><video id="v" style="width:100%; border-radius:20px;"></video><button onclick="window.closeCam()" class="btn-access" style="margin-top:20px;">FECHAR</button>`;
                document.body.appendChild(modal);
                document.getElementById('v').srcObject = stream;
                document.getElementById('v').play();
                window.closeCam = () => { stream.getTracks().forEach(t => t.stop()); modal.remove(); };
            } catch (e) { alert("Câmera bloqueada!"); }
        }

        function openScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function toggleVisibility() { document.getElementById('main-balance').classList.toggle('blur'); }
    </script>
</body>
</html>
