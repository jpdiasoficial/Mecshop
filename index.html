<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | GENESIS V300</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff9f0a; --bg: #000; --card: #111; --red: #ff3b30; --blue: #0a84ff; --green: #30d158; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; overflow: hidden; height: 100vh; }
        
        /* --- ESTILOS GLOBAIS --- */
        .glass { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; padding: 20px; box-sizing: border-box; }
        input, select { width: 100%; padding: 12px; margin-top: 10px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 11px; }
        .btn { width: 100%; padding: 15px; margin-top: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Orbitron'; border: none; transition: 0.3s; }
        
        /* --- TELAS --- */
        .page { display: none; height: 100vh; width: 100vw; flex-direction: column; padding: 20px; box-sizing: border-box; }
        #page-portal { display: flex; justify-content: center; align-items: center; }
        
        /* --- PORTAL GHOST --- */
        #ghost-trigger { font-family: 'Orbitron'; letter-spacing: 12px; color: #080808; cursor: pointer; user-select: none; margin-bottom: 25px; }
        
        /* --- PAINEL MASTER (GOD) --- */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-item { background: var(--card); padding: 15px; border-left: 3px solid var(--primary); border-radius: 6px; }
        .stat-item b { display: block; font-family: 'Orbitron'; font-size: 20px; color: var(--primary); }
        .stat-item span { font-size: 8px; color: #555; letter-spacing: 1px; }

        /* --- OPERAÇÃO --- */
        .voice-box { flex: 1; border: 2px solid var(--primary); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: rgba(255,159,10,0.03); margin: 20px 0; }
        .pulse { width: 15px; height: 15px; background: var(--primary); border-radius: 50%; animation: pulse 1s infinite; margin-top: 20px; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
    </style>
</head>
<body>

<div id="page-portal" class="page">
    <h1 id="ghost-trigger" onclick="ghostClick()">JP DIAS</h1>
    <div class="glass" style="width: 300px;">
        <small style="color:#444; letter-spacing:2px;">SISTEMA OPERACIONAL</small>
        <input type="text" id="user" placeholder="USUÁRIO">
        <input type="password" id="pass" placeholder="SENHA">
        <button class="btn" style="background:var(--primary); color:#000;" onclick="handleLogin()">ENTRAR</button>
    </div>
</div>

<div id="page-master" class="page">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <div>
            <span style="font-family:'Orbitron'; color:var(--primary); font-size:14px;">MASTER CONTROL</span><br>
            <small style="color:#333; font-size:8px;">GENESIS V300 | ONLINE</small>
        </div>
        <button onclick="location.reload()" style="background:none; border:1px solid var(--red); color:var(--red); padding:5px 10px; font-size:10px; border-radius:4px;">LOGOUT</button>
    </div>

    <div class="stat-grid">
        <div class="stat-item"><b>R$ 2.150</b><span>ROI ESTIMADO</span></div>
        <div class="stat-item" style="border-left-color:var(--blue);"><b>09ms</b><span>LATÊNCIA REDE</span></div>
    </div>

    <div class="glass" style="padding:15px; margin-bottom:15px;">
        <h4 style="font-family:'Orbitron'; font-size:10px; margin:0 0 10px 0;">GERENCIAR EQUIPE</h4>
        <input type="text" id="new-u" placeholder="NOME DO FUNCIONÁRIO">
        <select id="new-m">
            <option value="VOZ">ARMAZÉM (VOZ)</option>
            <option value="BIP">CROSSDOCK (BIPAGEM)</option>
        </select>
        <button class="btn" style="background:var(--green); color:#000; font-size:11px;" onclick="alert('Usuário Liberado!')">ATIVAR NOVO ACESSO</button>
    </div>

    <div class="glass" style="flex:1; overflow-y:auto;">
        <h4 style="font-family:'Orbitron'; font-size:10px; margin:0 0 10px 0;">AUDITORIA LIVE</h4>
        <div style="font-family:monospace; font-size:10px; color:#555;" id="logs">
            > SISTEMA INICIALIZADO...<br>
            > AGUARDANDO LOGIN OPERACIONAL...
        </div>
    </div>
</div>

<div id="page-voz" class="page">
    <h2 style="font-family:'Orbitron'; color:var(--primary); font-size:14px;">SETOR: ARMAZÉM</h2>
    <div class="voice-box">
        <h3 id="voz-inst" style="font-family:'Orbitron'; font-size:20px;">DIGA "ATIVAR" 3X</h3>
        <div class="pulse"></div>
    </div>
    <button class="btn" style="background:var(--red); color:#fff;" onclick="location.reload()">FINALIZAR TURNO</button>
</div>

<div id="page-bip" class="page">
    <h2 style="font-family:'Orbitron'; color:var(--blue); font-size:14px;">SETOR: CROSSDOCK</h2>
    <div class="glass" style="flex:1; margin:20px 0;">
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #222; padding:10px 0;">
            <span>CAIXA #7721</span> <span style="color:var(--blue);">BIPAR</span>
        </div>
    </div>
    <button class="btn" style="background:var(--blue); color:#fff;">ABRIR SCANNER</button>
    <button class="btn" style="background:var(--red); color:#fff;" onclick="location.reload()">SAIR</button>
</div>

<script>
    let ghostClicks = 0;
    let voiceCounts = 0;

    // 1. GATILHO GHOST (JP DIAS)
    function ghostClick() {
        ghostClicks++;
        if(ghostClicks === 5) {
            const pass = prompt("IDENTIFICAÇÃO MASTER:");
            if(pass === "9910") {
                showPage('page-master');
                falar("Acesso mestre concedido. Bem vindo, J P.");
            }
            ghostClicks = 0;
        }
        setTimeout(() => ghostClicks = 0, 3000);
    }

    // 2. LÓGICA DE LOGIN (100% FUNCIONAL)
    function handleLogin() {
        const u = document.getElementById('user').value.toLowerCase();
        const p = document.getElementById('pass').value;

        if(u === "shark" && p === "123") {
            showPage('page-master');
        } else if(u === "op") {
            showPage('page-voz');
            iniciarMotorVoz();
        } else if(u === "cross") {
            showPage('page-bip');
        } else {
            alert("USUÁRIO NÃO RECONHECIDO");
        }
    }

    // 3. NAVEGAÇÃO ENTRE TELAS
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        const target = document.getElementById(id);
        target.style.display = 'flex';
    }

    // 4. MOTOR DE VOZ (SEM ERROS)
    function iniciarMotorVoz() {
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Recognition) return alert("Seu navegador não suporta voz.");
        
        const rec = new Recognition();
        rec.lang = 'pt-BR';
        rec.continuous = true;
        rec.interimResults = false;

        rec.onresult = (e) => {
            const fala = e.results[e.results.length - 1][0].transcript.toLowerCase();
            if(fala.includes("ativar")) {
                voiceCounts++;
                falar(voiceCounts);
                if(voiceCounts === 3) {
                    document.getElementById('voz-inst').innerHTML = "CASA A-12<br>CÓDIGO: 482";
                    falar("Ativado. Casa A 12. Código 482.");
                    voiceCounts = 0;
                }
            }
        };
        
        rec.onerror = () => rec.start(); // Reinicia em caso de erro
        rec.start();
    }

    function falar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'pt-BR';
        window.speechSynthesis.speak(m);
    }
</script>
</body>
</html>
