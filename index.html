<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v83 ULTRA | JP MASTER</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --p: #00ff41; --bg: #000; --card: #080808; --brd: #151515; --danger: #ff3131; --blue: #00d4ff; }
        * { box-sizing: border-box; outline: none; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; font-size: 10px; height: 100vh; overflow: hidden; }
        header { padding: 12px 15px; background: #050505; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--p); box-shadow: 0 0 10px var(--p); }
        .screen { display: none; height: 100vh; flex-direction: column; background: #000; }
        .active { display: flex !important; }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 120px; }
        .card { background: var(--card); border: 1px solid var(--brd); border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        input { width: 100%; padding: 14px; background: #000; border: 1px solid #222; color: var(--p); border-radius: 5px; font-family: 'Orbitron'; margin-bottom: 10px; }
        .btn { width: 100%; padding: 16px; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 6px; cursor: pointer; }
        .btn-p { background: var(--p); color: #000; }
        .grid-modos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .btn-m { background: #0a0a0a; border: 1px solid #222; padding: 12px 2px; border-radius: 4px; font-size: 8px; text-align: center; color: #444; cursor: pointer; }
        .btn-m.active { border-color: var(--p); color: var(--p); background: rgba(0,255,101,0.05); }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid #222; background: #050505; min-height: 150px; }
        #shark-panel { display: none; border: 1px dashed var(--p); padding: 15px; margin-top: 15px; }
        .row-viva { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #111; }
        .badge { background: var(--p); color: #000; padding: 2px 6px; border-radius: 3px; font-weight: 900; }
    </style>
</head>
<body>

<div id="scr-login" class="screen active" style="align-items:center; justify-content:center;">
    <div style="font-family:'Orbitron'; color:var(--p); font-size:40px;">LOG-PRO</div>
    <div style="width:260px; margin-top:40px;">
        <input type="password" id="pin" placeholder="PIN MASTER" style="text-align:center;">
        <button class="btn btn-p" onclick="auth()">INICIAR</button>
    </div>
</div>

<div id="scr-app" class="screen">
    <header>
        <div><span id="net-dot" class="status-dot"></span> <span id="user-display">OP: TERMINAL</span></div>
        <div id="clock">00:00:00</div>
    </header>
    <div class="scroll">
        <div class="grid-modos">
            <div class="btn-m active" id="m-ENTRADA" onclick="setModo('ENTRADA')">ENTRADA</div>
            <div class="btn-m" id="m-SEPARACAO" onclick="setModo('SEPARACAO')">SEP.</div>
            <div class="btn-m" id="m-AVARIA" onclick="setModo('AVARIA')">AVARIA</div>
            <div class="btn-m" id="m-SAIDA" onclick="setModo('SAIDA')">SAÍDA</div>
        </div>
        <div id="reader"></div>
        <button class="btn" style="background:#111; color:#fff; border:1px solid #222; margin-top:10px;" onclick="toggleCamera()">ATIVAR SCANNER</button>
        
        <div class="card" style="margin-top:15px;">
            <small style="color:#444;">ÚLTIMO SCAN</small>
            <div id="last-code" style="font-family:'Orbitron'; font-size:22px; color:var(--p);">---</div>
            <div id="fb-msg" style="font-weight:900; color:var(--blue);">READY</div>
        </div>

        <div class="card">
            <h3 style="font-family:'Orbitron'; font-size: 8px; color:var(--p);">DOCA REAL-TIME</h3>
            <div id="lista-viva"></div>
        </div>

        <div id="shark-panel">
            <h3 style="font-family:'Orbitron'; font-size: 9px; color:var(--p);">MASTER COMMAND</h3>
            <textarea id="bulk-input" style="width:100%; height:60px; background:#000; color:var(--p); border:1px solid #222;"></textarea>
            <button class="btn btn-p" style="margin-top:10px;" onclick="dispararCarga()">DISPARAR CARGA</button>
        </div>
    </div>
</div>

<script>
    // 1. CONFIG FIREBASE (v8 SDK para máxima compatibilidade)
    const firebaseConfig = {
        apiKey: "AIzaSyDRDhONvvzZmo2csXksqHs6E6vV3MuvLSs",
        projectId: "log-pro-jp",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const sync = new BroadcastChannel('logpro_ultra_v83');
    
    let modoAtivo = 'ENTRADA';
    let userRole = 'OP';
    let scanner;
    let camOn = false;

    function falar(t) {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'pt-BR';
        window.speechSynthesis.speak(u);
    }

    // 2. AUTH BLINDADA (Evita Tela Preta)
    function auth() {
        const p = document.getElementById('pin').value;
        if(p === "7979") {
            userRole = 'SHARK MASTER';
            document.getElementById('shark-panel').style.display = 'block';
            document.getElementById('user-display').innerText = "JP | MASTER";
        }
        
        // PRIMEIRO: Muda a tela
        document.getElementById('scr-login').classList.remove('active');
        document.getElementById('scr-app').classList.add('active');
        
        // SEGUNDO: Inicializa sistemas
        falar("Sistema Ativo");
        try {
            scanner = new Html5Qrcode("reader");
        } catch(e) { console.log("Scanner em espera"); }
    }

    async function toggleCamera() {
        if(!camOn) {
            try {
                await scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (t) => processarBipe(t));
                camOn = true;
            } catch(e) { alert("ERRO CAMERA: Verifique o HTTPS ou Permissões"); }
        } else {
            await scanner.stop();
            camOn = false;
        }
    }

    async function processarBipe(codigo) {
        document.getElementById('last-code').innerText = codigo;
        falar("OK");
        await db.collection("logs").add({ cod: codigo, modo: modoAtivo, op: userRole, ts: firebase.firestore.FieldValue.serverTimestamp() });
        
        if(modoAtivo === 'SEPARACAO') {
            const ref = db.collection("carga").doc(codigo);
            const d = await ref.get();
            if(d.exists && d.data().falta > 0) {
                await ref.update({ falta: firebase.firestore.FieldValue.increment(-1) });
            }
        }
    }

    function setModo(m) {
        modoAtivo = m;
        document.querySelectorAll('.btn-m').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m.replace('Í','I').replace('Ç','C')).classList.add('active');
        falar(m);
    }

    // Real-time listener
    db.collection("carga").onSnapshot(snap => {
        const list = document.getElementById('lista-viva');
        list.innerHTML = "";
        snap.forEach(d => {
            if(d.data().falta > 0) {
                list.innerHTML += `<div class="row-viva"><span>📦 ${d.id}</span><span class="badge">${d.data().falta}</span></div>`;
            }
        });
    });

    async function dispararCarga() {
        const linhas = document.getElementById('bulk-input').value.split('\n');
        for(let l of linhas) {
            const [c, q] = l.split(',');
            if(c && q) await db.collection("carga").doc(c.trim()).set({ falta: parseInt(q) });
        }
        alert("CARGA LANÇADA");
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
