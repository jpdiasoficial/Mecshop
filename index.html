<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAINEL GERAL | JP DIAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --blue: #0a84ff; --red: #ff3b30; --gold: #ff9f0a; --gray: #0d0d0d; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .active { display: flex !important; }

        header { border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* LAYOUT LARGO (DASHBOARD) */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; flex: 1; overflow-y: auto; }
        .panel-card { background: var(--gray); border: 1px solid #1a1a1a; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .panel-header span { font-family: 'Orbitron'; font-size: 10px; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 9px; }
        .stat-val { color: var(--primary); font-weight: bold; }
        
        .progress-bar { width: 100%; height: 4px; background: #222; border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); }

        /* BOTÃO GHOST & ACESSO */
        .btn-master { background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 4px; font-family: 'Orbitron'; font-weight: bold; font-size: 9px; cursor: pointer; }
    </style>
</head>
<body>

<div id="scr-login" class="screen active" style="justify-content: center; align-items: center;">
    <h1 style="font-family:'Orbitron'; color:#111; letter-spacing:10px; cursor:pointer;" onclick="handleGhost()">JP DIAS</h1>
    <div style="background:#080808; border:1px solid #222; padding:20px; border-radius:12px; width:280px; text-align:center;">
        <input type="password" id="p" placeholder="SENHA MESTRE" style="width:100%; padding:15px; background:#000; border:1px solid #333; color:var(--primary); font-family:'Orbitron'; text-align:center; margin-bottom:15px;">
        <button onclick="loginMaster()" style="width:100%; padding:15px; background:var(--primary); border:none; border-radius:5px; font-family:'Orbitron'; font-weight:bold;">ACESSAR PAINEL GERAL</button>
    </div>
</div>

<div id="scr-master-panel" class="screen">
    <header>
        <span style="font-family:'Orbitron'; color:var(--primary); font-size:14px;">CONTROLE GERAL OPERACIONAL</span>
        <button onclick="location.reload()" style="background:none; border:1px solid var(--red); color:var(--red); font-size:8px; padding:5px; border-radius:4px; border:1px solid var(--red);">LOGOUT</button>
    </header>

    <div class="dashboard-grid">
        
        <div class="panel-card" style="border-top: 3px solid var(--primary);">
            <div class="panel-header"><span>ARMAZÉM</span> <small style="color:var(--primary);">ON</small></div>
            <div class="stat-row"><span>PICKING ATIVO:</span> <span class="stat-val">14</span></div>
            <div class="stat-row"><span>PENDENTES:</span> <span class="stat-val" style="color:var(--gold)">08</span></div>
            <div class="stat-row"><span>ABASTECER:</span> <span class="stat-val" style="color:var(--red)">02</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width: 65%;"></div></div>
        </div>

        <div class="panel-card" style="border-top: 3px solid var(--blue);">
            <div class="panel-header"><span>CROSSDOCK</span> <small style="color:var(--blue);">FLUXO</small></div>
            <div class="stat-row"><span>DOCA ENTRADA:</span> <span class="stat-val">03</span></div>
            <div class="stat-row"><span>TRIAGEM:</span> <span class="stat-val">22 VOL.</span></div>
            <div class="stat-row"><span>AG. SAÍDA:</span> <span class="stat-val">05 VOL.</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width: 80%; background:var(--blue);"></div></div>
        </div>

        <div class="panel-card" style="border-top: 3px solid var(--gold);">
            <div class="panel-header"><span>MOTORISTAS</span> <small style="color:var(--gold);">ROTA</small></div>
            <div class="stat-row"><span>EM TRÂNSITO:</span> <span class="stat-val">06</span></div>
            <div class="stat-row"><span>CHECK-IN:</span> <span class="stat-val">02</span></div>
            <div class="stat-row"><span>LIBERADOS:</span> <span class="stat-val">11</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width: 40%; background:var(--gold);"></div></div>
        </div>

        <div class="panel-card" style="border-top: 3px solid var(--red);">
            <div class="panel-header"><span>QUALIDADE</span> <small style="color:var(--red);">ALERTA</small></div>
            <div class="stat-row"><span>AVARIAS HOJE:</span> <span class="stat-val">03</span></div>
            <div class="stat-row"><span>DEVOLUÇÕES:</span> <span class="stat-val">01</span></div>
            <div class="stat-row"><span>PERDAS:</span> <span class="stat-val">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width: 15%; background:var(--red);"></div></div>
        </div>

    </div>

    <div class="glass" style="margin-top:15px; display:flex; gap:10px; align-items:center;">
        <span style="font-size:8px; font-family:'Orbitron';">COMANDO RÁPIDO:</span>
        <button class="btn-master" style="flex:1;" onclick="bip(1500); alert('ALERTA GERAL ENVIADO')">ALERTAR TODOS</button>
        <button class="btn-master" style="flex:1; background:var(--blue); color:#fff;" onclick="bip(800); alert('NOVA ROTA LIBERADA')">LIBERAR MOTORISTAS</button>
    </div>
</div>

<script>
    const audio = new (window.AudioContext || window.webkitAudioContext)();

    function bip(f=800, d=0.1) {
        const o=audio.createOscillator(); const g=audio.createGain();
        o.connect(g); g.connect(audio.destination);
        o.frequency.value=f; g.gain.value=0.1;
        o.start(); setTimeout(()=>o.stop(), d*1000);
    }

    function loginMaster() {
        const p = document.getElementById('p').value;
        if(p === "9910") {
            bip(1200, 0.2);
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('scr-master-panel').classList.add('active');
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("Painel Geral Master ativo. Monitorando operações."));
        } else {
            bip(200, 0.5); alert("ACESSO NEGADO");
        }
    }

    function handleGhost() {
        bip(1500, 0.2);
        document.getElementById('p').focus();
    }
</script>
</body>
</html>
