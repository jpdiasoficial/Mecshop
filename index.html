<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET INFINITY | OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff5e00; --green: #00ff41; --gold: #d4af37;
            --bg: #000; --card: #0a0a0a; --gray: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; text-transform: uppercase; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* NAVEGAÇÃO ENTRE TELAS */
        .view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); z-index: 10; }
        .view.active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* CABEÇALHO ELITE */
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray); height: 75px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .logo { font-weight: 900; font-size: 20px; color: var(--gold); letter-spacing: -1px; }

        /* BANCA E CARDS */
        .wallet { background: linear-gradient(180deg, #0d0d0d 0%, #000 100%); margin: 20px; padding: 25px; border-radius: 20px; border: 1px solid var(--gray); border-bottom: 4px solid var(--green); }
        .wallet-val { font-size: 42px; font-weight: 900; margin: 10px 0; letter-spacing: -2px; }

        .btn { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-deposit { background: var(--green); color: #000; box-shadow: 0 0 15px rgba(0,255,65,0.2); }
        .btn-play { background: var(--primary); color: #fff; margin-top: 40px; }

        /* GAMES GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; flex: 1; overflow-y: auto; }
        .game-card { background: var(--card); height: 160px; border-radius: 20px; border: 1px solid var(--gray); display: flex; flex-direction: column; justify-content: flex-end; padding: 15px; position: relative; }
        .game-card i { position: absolute; top: 15px; right: 15px; font-size: 30px; color: #151515; }

        /* ROLETA */
        .wheel-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .wheel { width: 300px; height: 300px; border: 10px solid #111; border-radius: 50%; background: conic-gradient(var(--primary) 0 12.5%, #000 12.5% 25%, var(--primary) 25% 37.5%, #000 37.5% 50%, var(--primary) 50% 62.5%, #000 62.5% 75%, var(--primary) 75% 87.5%, #000 87.5% 100%); transition: 4s cubic-bezier(0.1, 0, 0, 1); position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .wheel::after { content: ''; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid var(--gold); }

        /* ADMIN AREA */
        .admin-row { background: #080808; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--gold); }

        /* AUTH INPUTS */
        .auth-screen { padding: 30px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .input-auth { width: 100%; background: #080808; border: 1px solid #1a1a1a; padding: 20px; border-radius: 15px; color: #fff; margin-bottom: 15px; }

        nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: rgba(0,0,0,0.9); border-top: 1px solid var(--gray); display: none; justify-content: space-around; align-items: center; }
        .nav-item { color: #333; font-size: 10px; font-weight: 900; text-align: center; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body onload="Core.init()">

    <div class="app-shell">
        
        <div id="scr-auth" class="view active">
            <div class="auth-screen">
                <h1 class="logo" style="font-size: 45px; margin-bottom: 10px;">MEC-BET</h1>
                <p style="color: #222; font-size: 10px; margin-bottom: 40px;">SISTEMA DE ACESSO CRIPTOGRAFADO</p>
                <div style="width: 100%;" id="auth-form">
                    <input type="text" id="user-in" class="input-auth" placeholder="USUÁRIO">
                    <input type="password" id="pass-in" class="input-auth" placeholder="SENHA">
                    <button class="btn" style="background:var(--primary)" onclick="Core.Auth.handle()">ENTRAR NO SISTEMA</button>
                    <p style="text-align:center; font-size:10px; margin-top:20px; color:#444">ACESSO RESTRITO A MAIORES DE 18 ANOS</p>
                </div>
            </div>
        </div>

        <div id="scr-lobby" class="view">
            <header class="header">
                <div class="logo">MEC-BET</div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <span id="lvl-tag" style="border:1px solid var(--gold); color:var(--gold); padding:4px 8px; border-radius:4px; font-size:10px;">LVL 1</span>
                    <i class="fa-solid fa-power-off" style="color:var(--danger)" onclick="Core.Auth.logout()"></i>
                </div>
            </header>
            <div class="wallet">
                <p style="font-size:10px; color:#444">BANCA DISPONÍVEL</p>
                <h2 class="wallet-val" id="disp-saldo">R$ 0,00</h2>
                <button class="btn btn-deposit" onclick="Core.Game.demoCash()">DEPOSITAR VIA PIX</button>
            </div>
            <div class="grid">
                <div class="game-card" style="border-bottom: 3px solid var(--gold)" onclick="Core.Router.go('scr-game')">
                    <i class="fa-solid fa-dharmachakra"></i>
                    <span>ROLETA VIP<br><small style="color:var(--gold)">ONLINE</small></span>
                </div>
                <div class="game-card" style="border-bottom: 3px solid var(--blue)">
                    <i class="fa-solid fa-plane-up"></i>
                    <span>AVIATOR<br><small style="color:var(--blue)">SINAL ATIVO</small></span>
                </div>
            </div>
        </div>

        <div id="scr-game" class="view">
            <header class="header">
                <i class="fa-solid fa-chevron-left" onclick="Core.Router.go('scr-lobby')"></i>
                <div class="logo">ROLETA</div>
                <div id="disp-saldo-game" style="color:var(--green); font-weight:900;">R$ 0,00</div>
            </header>
            <div class="wheel-box">
                <div id="wheel-obj" class="wheel"></div>
                <button id="spin-btn" class="btn btn-play" onclick="Core.Game.spin()">GIRAR ROLETA (R$ 10)</button>
                <div id="win-msg" style="margin-top:20px; font-weight:900; font-size:20px; color:var(--green)"></div>
            </div>
        </div>

        <div id="scr-admin" class="view">
            <header class="header">
                <div class="logo">SHARK ADMIN</div>
                <i class="fa-solid fa-xmark" onclick="Core.Router.go('scr-lobby')"></i>
            </header>
            <div style="padding: 20px;" id="admin-list">
                </div>
            <div style="padding: 20px;">
                <button class="btn" style="background:var(--danger); color:#fff" onclick="Core.System.reset()">RESETAR DATABASE</button>
            </div>
        </div>

        <nav id="navbar">
            <div class="nav-item active" onclick="Core.Router.go('scr-lobby')"><i class="fa-solid fa-house"></i><br>HOME</div>
            <div class="nav-item" onclick="Core.Router.go('scr-game')"><i class="fa-solid fa-gamepad"></i><br>JOGOS</div>
            <div id="nav-shark" class="nav-item" style="display:none; color:var(--gold)" onclick="Core.Router.go('scr-admin')"><i class="fa-solid fa-crown"></i><br>SHARK</div>
        </nav>

    </div>

    <script>
        const Core = {
            db: JSON.parse(localStorage.getItem('MEC_DATABASE')) || [],
            session: null,

            init() {
                const user = localStorage.getItem('MEC_SESSION');
                if(user) {
                    this.session = this.db.find(u => u.user === user);
                    if(this.session) this.System.startUI();
                }
            },

            Auth: {
                handle() {
                    let u = document.getElementById('user-in').value.toUpperCase();
                    let p = document.getElementById('pass-in').value;
                    if(!u || !p) return alert("PREENCHA OS CAMPOS!");

                    let user = Core.db.find(x => x.user === u);
                    if(user) {
                        if(user.pass === p) {
                            this.success(u);
                        } else { alert("SENHA INCORRETA!"); }
                    } else {
                        let newUser = { user: u, pass: p, saldo: 0, lvl: 1, role: u === 'ADMIN' ? 'admin' : 'player' };
                        Core.db.push(newUser);
                        Core.System.save();
                        this.success(u);
                    }
                },
                success(u) {
                    localStorage.setItem('MEC_SESSION', u);
                    location.reload();
                },
                logout() {
                    localStorage.removeItem('MEC_SESSION');
                    location.reload();
                }
            },

            Game: {
                demoCash() {
                    Core.session.saldo += 100;
                    Core.System.sync();
                    alert("DEPÓSITO DE R$ 100 REALIZADO!");
                },
                spin() {
                    if(Core.session.saldo < 10) return alert("SALDO INSUFICIENTE!");
                    Core.session.saldo -= 10;
                    Core.System.sync();

                    const btn = document.getElementById('spin-btn');
                    const wheel = document.getElementById('wheel-obj');
                    btn.disabled = true;
                    
                    let deg = Math.floor(Math.random() * 3600) + 7200;
                    wheel.style.transform = `rotate(${deg}deg)`;

                    setTimeout(() => {
                        let win = Math.random() > 0.6 ? 25 : 0;
                        Core.session.saldo += win;
                        if(win > 0) Core.session.lvl += 1;
                        
                        document.getElementById('win-msg').innerText = win > 0 ? `GANHOU R$ ${win}` : "PERDEU!";
                        btn.disabled = false;
                        Core.System.sync();
                    }, 4000);
                }
            },

            System: {
                startUI() {
                    document.getElementById('scr-auth').classList.remove('active');
                    document.getElementById('scr-lobby').classList.add('active');
                    document.getElementById('navbar').style.display = 'flex';
                    if(Core.session.role === 'admin') {
                        document.getElementById('nav-shark').style.display = 'block';
                        this.loadAdmin();
                    }
                    this.sync();
                },
                sync() {
                    document.getElementById('disp-saldo').innerText = "R$ " + Core.session.saldo.toFixed(2);
                    document.getElementById('disp-saldo-game').innerText = "R$ " + Core.session.saldo.toFixed(2);
                    document.getElementById('lvl-tag').innerText = "LVL " + Core.session.lvl;
                    this.save();
                },
                save() { localStorage.setItem('MEC_DATABASE', JSON.stringify(Core.db)); },
                loadAdmin() {
                    const list = document.getElementById('admin-list');
                    list.innerHTML = Core.db.map(u => `
                        <div class="admin-row">
                            <div><b>${u.user}</b><br><small>R$ ${u.saldo}</small></div>
                            <button onclick="Core.System.addSaldo('${u.user}')" style="background:var(--green); border:none; padding:5px 10px; border-radius:5px; font-weight:900;">+50</button>
                        </div>
                    `).join('');
                },
                addSaldo(uName) {
                    let user = Core.db.find(x => x.user === uName);
                    user.saldo += 50;
                    this.save();
                    this.loadAdmin();
                    if(Core.session.user === uName) this.sync();
                },
                reset() { if(confirm("RESETA TUDO?")) { localStorage.clear(); location.reload(); } }
            },

            Router: {
                go(id) {
                    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                    document.getElementById(id).classList.add('active');
                }
            }
        };
    </script>
</body>
</html>
