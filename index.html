<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET | OS PLATFORM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff5e00; --primary-glow: rgba(255, 94, 0, 0.4);
            --gold: #d4af37; --green: #00ff41; --danger: #ff3b30;
            --bg-deep: #050505; --bg-card: #0d0d0d; --border: #1a1a1a;
            --text-dim: #555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--bg-deep); color: #fff; height: 100vh; overflow: hidden; width: 100vw; }

        /* VIRTUAL DOM / SCREEN MANAGER */
        .viewport { position: relative; height: 100%; width: 100%; }
        .screen { 
            position: absolute; inset: 0; display: none; 
            flex-direction: column; background: var(--bg-deep);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .screen.active { display: flex; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* COMPONENTES DE ELITE */
        .glass-header { 
            padding: 20px; display: flex; justify-content: space-between; align-items: center; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border);
            z-index: 100;
        }
        .logo-brand { font-weight: 900; font-size: 20px; letter-spacing: -1px; color: var(--gold); text-transform: uppercase; }

        /* AUTH MODULE */
        .auth-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 10px; font-weight: 900; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; }
        .input-field { 
            width: 100%; background: #000; border: 1px solid var(--border); padding: 18px; 
            border-radius: 12px; color: #fff; font-weight: 600; outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .btn-supreme { 
            width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: 900; 
            font-size: 14px; cursor: pointer; transition: 0.2s; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); }

        /* DASHBOARD CORE */
        .scroll-area { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .banca-panel { 
            background: linear-gradient(145deg, #0d0d0d 0%, #050505 100%); 
            margin: 20px; padding: 30px; border-radius: 24px; border: 1px solid var(--border);
            position: relative; overflow: hidden;
        }
        .banca-panel::before { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px; background: var(--primary); filter: blur(80px); opacity: 0.2; }
        .banca-val { font-size: 45px; font-weight: 900; letter-spacing: -2px; margin: 10px 0; font-variant-numeric: tabular-nums; }
        
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }
        .card-game { 
            background: var(--bg-card); border-radius: 20px; height: 180px; padding: 20px;
            display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid var(--border);
            position: relative; overflow: hidden; cursor: pointer;
        }
        .card-game i { position: absolute; top: 15px; right: 15px; font-size: 32px; color: #1a1a1a; transition: 0.3s; }
        .card-game:hover i { color: var(--primary); transform: scale(1.1); }
        .card-game.vip { border-bottom: 4px solid var(--gold); }

        /* ADMIN CONTROL (SHARK MODE) */
        .admin-stat { background: #000; border: 1px solid var(--border); padding: 25px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--gold); }
        .stat-n { font-size: 28px; font-weight: 900; color: #fff; }

        /* NAV BAR */
        nav { 
            position: fixed; bottom: 0; width: 100%; background: rgba(5,5,5,0.9); 
            backdrop-filter: blur(20px); border-top: 1px solid var(--border);
            display: none; justify-content: space-around; padding: 15px 0; z-index: 1000;
        }
        .nav-item { color: var(--text-dim); text-align: center; font-size: 9px; font-weight: 800; cursor: pointer; flex: 1; transition: 0.3s; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="viewport">
    
    <section id="scr-auth" class="screen active">
        <div class="auth-wrap">
            <h1 class="logo-brand" style="font-size: 40px; margin-bottom: 40px; text-align: center;">MEC-BET</h1>
            <div id="auth-logic">
                <div class="input-group">
                    <label>Identificação de Acesso</label>
                    <input type="text" id="in-user" class="input-field" placeholder="USUÁRIO">
                </div>
                <div class="input-group">
                    <label>Chave de Segurança</label>
                    <input type="password" id="in-pass" class="input-field" placeholder="••••••••">
                </div>
                <button class="btn-supreme btn-primary" onclick="Core.Auth.init()">Autenticar no Kernel</button>
            </div>
        </div>
    </section>

    <section id="scr-lobby" class="screen">
        <div class="glass-header">
            <div class="logo-brand">MEC-BET OS</div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span id="u-tag" style="font-size: 10px; font-weight: 900; background: #111; padding: 5px 12px; border-radius: 4px; color: var(--gold);">PLAYER</span>
                <i class="fa-solid fa-power-off" style="color: var(--danger); cursor: pointer;" onclick="Core.Auth.logout()"></i>
            </div>
        </div>
        <div class="scroll-area">
            <div class="banca-panel">
                <p style="font-size: 10px; font-weight: 900; color: var(--text-dim);">LIQUIDEZ DISPONÍVEL</p>
                <h2 class="banca-val" id="u-saldo">R$ 0,00</h2>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn-supreme" style="background: var(--green); color: #000; flex: 1;">Depósito via PIX</button>
                    <button class="btn-supreme" style="background: #151515; color: #fff; border: 1px solid #222; flex: 1;">Saque</button>
                </div>
            </div>
            <div class="game-grid">
                <div class="card-game vip" onclick="Core.Router.go('scr-wheel')">
                    <i class="fa-solid fa-dharmachakra"></i>
                    <p style="font-weight: 900; font-size: 12px;">ROLETA<br><span style="color: var(--gold);">PREMIUM</span></p>
                </div>
                <div class="card-game" style="border-bottom: 4px solid var(--primary);">
                    <i class="fa-solid fa-plane-up"></i>
                    <p style="font-weight: 900; font-size: 12px;">AVIATOR<br><span style="color: var(--primary);">SHARK SINAL</span></p>
                </div>
                <div class="card-game" style="border-bottom: 4px solid var(--blue);">
                    <i class="fa-solid fa-gem"></i>
                    <p style="font-weight: 900; font-size: 12px;">MINES<br><span style="color: var(--blue);">ALGORITMO</span></p>
                </div>
                <div class="card-game" style="border-bottom: 4px solid var(--green);">
                    <i class="fa-solid fa-bolt"></i>
                    <p style="font-weight: 900; font-size: 12px;">TIGER<br><span style="color: var(--green);">TURBO</span></p>
                </div>
            </div>
        </div>
    </section>

    <section id="scr-admin" class="screen">
        <div class="glass-header"><div class="logo-brand">SHARK CONTROL</div><i class="fa-solid fa-xmark" onclick="Core.Router.go('scr-lobby')"></i></div>
        <div class="scroll-area" style="padding: 20px;">
            <div class="admin-stat">
                <p style="font-size: 10px; color: var(--text-dim); font-weight: 900;">GGR (LUCRO DA CASA)</p>
                <div class="stat-n" style="color: var(--green);">R$ 72.050,00</div>
            </div>
            <div class="admin-stat" style="border-left-color: var(--danger);">
                <p style="font-size: 10px; color: var(--text-dim); font-weight: 900;">PAYOUT ATUAL</p>
                <div class="stat-n">92%</div>
            </div>
            <button class="btn-supreme" style="background: var(--danger); color: #fff;" onclick="Core.System.kill()">Derrubar Plataforma</button>
        </div>
    </section>

    <nav id="navbar">
        <div class="nav-item active" onclick="Core.Router.go('scr-lobby')"><i class="fa-solid fa-house"></i>INÍCIO</div>
        <div class="nav-item" onclick="Core.Router.go('scr-wheel')"><i class="fa-solid fa-gamepad"></i>JOGOS</div>
        <div id="adm-trigger" class="nav-item" style="display: none; color: var(--gold);" onclick="Core.Router.go('scr-admin')"><i class="fa-solid fa-crown"></i>SHARK</div>
    </nav>

</div>

<script>
    /* CORE ENGINE: O CÉREBRO DA INTELIGÊNCIA ARTIFICIAL
       Gerencia Sessão, Rotas e Lógica de Negócio 
    */
    const Core = {
        State: {
            user: JSON.parse(localStorage.getItem('MEC_SESSION')) || null,
            saldo: parseFloat(localStorage.getItem('MEC_SALDO')) || 0.00
        },

        Auth: {
            init() {
                const u = document.getElementById('in-user').value;
                const p = document.getElementById('in-pass').value;

                if(!u || !p) return alert("ERRO DE AUTENTICAÇÃO");

                // SEPARAÇÃO DE CARGOS POR KERNEL
                const role = (u.toLowerCase() === 'admin' && p === '9910') ? 'SHARK' : 'PLAYER';
                
                Core.State.user = { name: u.toUpperCase(), role: role };
                localStorage.setItem('MEC_SESSION', JSON.stringify(Core.State.user));
                
                location.reload();
            },
            logout() {
                if(confirm("FINALIZAR SESSÃO?")) {
                    localStorage.removeItem('MEC_SESSION');
                    location.reload();
                }
            }
        },

        Router: {
            go(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
                
                // Update Nav Active State
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                const map = {'scr-lobby': 0, 'scr-wheel': 1, 'scr-admin': 2};
                if(map[screenId] !== undefined) document.querySelectorAll('.nav-item')[map[screenId]].classList.add('active');
            }
        },

        System: {
            boot() {
                if(Core.State.user) {
                    document.getElementById('navbar').style.display = 'flex';
                    document.getElementById('u-tag').innerText = Core.State.user.role;
                    document.getElementById('u-tag').style.color = Core.State.user.role === 'SHARK' ? '#d4af37' : '#00ff41';
                    
                    if(Core.State.user.role === 'SHARK') document.getElementById('adm-trigger').style.display = 'block';
                    
                    Core.System.updateDisplay();
                    Core.Router.go('scr-lobby');
                }
            },
            updateDisplay() {
                document.getElementById('u-saldo').innerText = Core.State.saldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            },
            kill() {
                if(confirm("CONFIRMAR DESLIGAMENTO?")) {
                    document.body.innerHTML = "<div style='height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column;'><h1 style='color:red; font-family:serif;'>PLATFORM TERMINATED</h1><button onclick='location.reload()' style='margin-top:20px;'>RESTART</button></div>";
                }
            }
        }
    };

    window.onload = Core.System.boot();
</script>
</body>
</html>
