<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO | JP TECNOLOGIA</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --border: #222; --out: #ff3b30; --in: #00d4ff; --sep: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; font-size: 10px; height: 100vh; overflow: hidden; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; background: #000; }
        .active { display: flex !important; }
        header { padding: 12px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #050505; }
        .scroll { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 150px; }
        h3 { font-family: 'Orbitron'; color: var(--primary); font-size: 10px; margin: 15px 0 8px 0; border-left: 3px solid var(--primary); padding-left: 8px; }
        .table-wrapper { border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; background: #080808; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: #111; color: #555; padding: 10px; text-align: left; font-size: 8px; border-bottom: 1px solid var(--border); }
        td { padding: 8px 10px; border-bottom: 1px solid #151515; white-space: nowrap; }
        .btn-green { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 4px; cursor: pointer; }
        input, select, textarea { width: 100%; padding: 14px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: 'Orbitron'; margin-bottom: 10px; box-sizing: border-box; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid #222; }

        @media print {
            body * { visibility: hidden; background: white !important; color: black !important; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 10px; font-family: sans-serif; }
            table { border: 1px solid #000; width: 100%; border-collapse: collapse; margin-top: 10px; }
            th, td { border: 1px solid #000; padding: 6px; font-size: 10px; text-align: left; color: black !important; }
            .print-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 10px; text-align: center; }
        }
    </style>
</head>
<body onload="init()">

<div id="print-area"></div>

<div id="scr-login" class="screen active" style="align-items:center; justify-content:center; text-align:center;">
    <div style="font-family:'Orbitron'; color:var(--primary); font-size:35px;">LOG-PRO</div>
    <div style="font-size:7px; color:#444; margin-bottom:40px;">SISTEMA JP TECNOLOGIA</div>
    <div style="width: 85%; max-width: 320px;">
        <input type="text" id="user-name" placeholder="USUÁRIO">
        <input type="password" id="pass" placeholder="CHAVE">
        <button class="btn-green" onclick="auth()">ENTRAR</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span style="color:var(--primary)">MASTER: JP</span> <button onclick="logout()" style="color:var(--out); background:none; border:none; font-size:8px;">SAIR</button></header>
    <div class="scroll">
        <h3>AUDITORIA GLOBAL</h3>
        <div class="table-wrapper"><table><thead><tr><th>HORA</th><th>OP</th><th>ACAO</th><th>ITEM</th><th>QTD</th></tr></thead><tbody id="audit-body"></tbody></table></div>
        <h3>INVENTARIO GLOBAL</h3>
        <div class="table-wrapper"><table><thead><tr><th>CODIGO</th><th>PRODUTO</th><th style="background:#002200; color:var(--primary);">SALDO</th><th>ENTRADA</th><th>SEP</th><th>SAIDA</th></tr></thead><tbody id="stock-body"></tbody></table></div>
    </div>
    <div style="position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px;">
        <button onclick="prepararImpressao('GLOBAL')" style="width:50px; height:50px; border-radius:50%; background:#fff; border:none; font-size:18px; font-weight:bold;">PRINT</button>
        <button onclick="ir('scr-config')" style="width:50px; height:50px; border-radius:50%; background:var(--primary); border:none; font-weight:bold;">CONFIG</button>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span id="display-user">OP: ---</span> <button onclick="logout()" style="color:var(--out); background:none; border:none; font-size:8px;">SAIR</button></header>
    <div class="scroll">
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <select id="mod-op" style="flex:2;">
                <option value="ENTRADA">ENTRADA</option>
                <option value="SEPARACAO">SEPARACAO</option>
                <option value="SAIDA">SAIDA</option>
            </select>
            <input type="number" id="qtd-bipe" value="1" style="flex:0.6; text-align:center;">
        </div>
        <div id="reader"></div>
        <button class="btn-green" id="btn-cam" onclick="toggleCamera()" style="margin:10px 0;">ATIVAR SCANNER V30</button>

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>MEUS ÚLTIMOS BIPES</h3>
            <button onclick="prepararImpressao('OP')" style="background:none; border:1px solid #444; color:#fff; padding:5px 10px; border-radius:4px; font-size:8px; font-weight:bold;">IMPRIMIR LISTA</button>
        </div>
        <div class="table-wrapper"><table><thead><tr><th>HORA</th><th>ACAO</th><th>ITEM</th><th>QTD</th></tr></thead><tbody id="op-audit-body"></tbody></table></div>
    </div>
</div>

<div id="scr-config" class="screen">
    <header><span>CONFIGURAÇÕES</span> <button onclick="ir('scr-shark')">VOLTAR</button></header>
    <div class="scroll">
        <textarea id="op-area" style="height:80px;" placeholder="OPERADORES (NOME, CHAVE)"></textarea>
        <textarea id="import-area" style="height:250px;" placeholder="PRODUTOS (CODIGO, NOME)"></textarea>
        <button class="btn-green" onclick="salvarConfig()">SALVAR TUDO</button>
    </div>
</div>

<script>
    const canal = new BroadcastChannel('logpro_jp_v66');
    let BASE = JSON.parse(localStorage.getItem('LP_BASE')) || {};
    let MOVS = JSON.parse(localStorage.getItem('LP_MOVS')) || [];
    let OPERADORES = JSON.parse(localStorage.getItem('LP_USERS')) || {"JP":"9910", "OP":"1234"};
    let currentUser = "", scanner, camOn = false, isLocked = false;

    function playBeep() { try { const ctx = new AudioContext(); const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.connect(g); g.connect(ctx.destination); osc.frequency.value = 880; g.gain.setValueAtTime(0.3, ctx.currentTime); osc.start(); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.stop(ctx.currentTime + 0.12); } catch(e){} }

    function auth() {
        const u = document.getElementById('user-name').value.toUpperCase().trim();
        const p = document.getElementById('pass').value.trim();
        if(OPERADORES[u] === p) { currentUser = u; if(p === "9910") ir('scr-shark'); else { document.getElementById('display-user').innerText = "OP: " + currentUser; ir('scr-op'); atualizarOpAudit(); } }
        else alert("ACESSO NEGADO");
    }

    function logout() { currentUser = ""; ir('scr-login'); }

    function ir(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'scr-shark') atualizarTabelas();
        if(id === 'scr-config') document.getElementById('op-area').value = Object.entries(OPERADORES).map(([k,v]) => `${k}, ${v}`).join('\n');
    }

    function salvarConfig() {
        let novosOps = {}; document.getElementById('op-area').value.split('\n').forEach(l => { const d = l.split(','); if(d[0] && d[1]) novosOps[d[0].trim().toUpperCase()] = d[1].trim(); });
        OPERADORES = novosOps; localStorage.setItem('LP_USERS', JSON.stringify(OPERADORES));
        document.getElementById('import-area').value.split('\n').forEach(l => { const d = l.split(','); if(d[0] && d[1]) BASE[d[0].trim()] = d[1].trim().toUpperCase(); });
        localStorage.setItem('LP_BASE', JSON.stringify(BASE)); alert("SISTEMA ATUALIZADO!"); ir('scr-shark');
    }

    function processar(cod) {
        if(isLocked) return; isLocked = true; playBeep();
        let c = cod.trim(); if(!BASE[c]) { BASE[c] = "ITEM NOVO: " + c; localStorage.setItem('LP_BASE', JSON.stringify(BASE)); }
        const modo = document.getElementById('mod-op').value;
        const q = parseInt(document.getElementById('qtd-bipe').value) || 1;
        MOVS.unshift({ cod: c, n: BASE[c], m: modo, q, d: new Date().toLocaleString(), u: currentUser });
        localStorage.setItem('LP_MOVS', JSON.stringify(MOVS));
        atualizarOpAudit(); canal.postMessage('sync');
        setTimeout(() => isLocked = false, 800);
    }

    function atualizarOpAudit() {
        const meusBipes = MOVS.filter(m => m.u === currentUser).slice(0, 10);
        document.getElementById('op-audit-body').innerHTML = meusBipes.map(m => `<tr><td>${m.d.split(' ')[1]}</td><td>${m.m}</td><td>${m.n}</td><td>${m.q}</td></tr>`).join('');
    }

    function atualizarTabelas() {
        document.getElementById('audit-body').innerHTML = MOVS.slice(0, 15).map(m => `<tr><td>${m.d.split(' ')[1]}</td><td>${m.u}</td><td>${m.m}</td><td>${m.n}</td><td>${m.q}</td></tr>`).join('');
        let r = {}; Object.keys(BASE).forEach(k => r[k] = { n: BASE[k], ent:0, sep:0, sai:0, sal:0 });
        MOVS.forEach(m => { if(r[m.cod]) { if(m.m === 'ENTRADA') { r[m.cod].ent += m.q; r[m.cod].sal += m.q; } else if(m.m === 'SEPARACAO') { r[m.cod].sep += m.q; r[m.cod].sal -= m.q; } else { r[m.cod].sai += m.q; r[m.cod].sal -= m.q; } } });
        document.getElementById('stock-body').innerHTML = Object.keys(r).map(k => `<tr><td>${k}</td><td><b>${r[k].n}</b></td><td style="color:var(--primary); font-weight:900;">${r[k].sal}</td><td>${r[k].ent}</td><td>${r[k].sep}</td><td>${r[k].sai}</td></tr>`).join('');
    }

    function prepararImpressao(tipo) {
        let lista = tipo === 'OP' ? MOVS.filter(m => m.u === currentUser).slice(0, 15) : MOVS.slice(0, 30);
        let html = `<div class="print-header">
                        <h2 style="margin:0;">JP TECNOLOGIA - LOGPRO</h2>
                        <p style="margin:5px 0; font-size:12px;">RELATORIO DE CONFERENCIA E ENTREGA</p>
                        <p style="margin:0; font-size:10px;">DATA: ${new Date().toLocaleString()}</p>
                    </div>`;
        html += `<table><thead><tr><th>HORA</th><th>OPERADOR</th><th>ACAO</th><th>PRODUTO</th><th>QTD</th></tr></thead><tbody>`;
        html += lista.map(m => `<tr><td>${m.d.split(' ')[1]}</td><td>${m.u}</td><td>${m.m}</td><td>${m.n}</td><td>${m.q}</td></tr>`).join('');
        html += `</tbody></table><br><br><p style="font-size:10px;">ASS. RESPONSÁVEL: __________________________________________________</p>`;
        document.getElementById('print-area').innerHTML = html;
        window.print();
    }

    function exportarCSV() {
        let c = "DATA,OP,ITEM,ACAO,QTD\n" + MOVS.map(m=>`${m.d},${m.u},${m.n},${m.m},${m.q}`).join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], {type:'text/csv'})); a.download = 'RELATORIO_JP.csv'; a.click();
    }

    async function toggleCamera() {
        if(!camOn) { if(!scanner) scanner = new Html5Qrcode("reader"); await scanner.start({ facingMode: "environment" }, { fps: 26, qrbox: 250 }, (t) => processar(t)); camOn = true; document.getElementById('btn-cam').innerText = "PARAR SCANNER"; }
        else { await scanner.stop(); camOn = false; document.getElementById('btn-cam').innerText = "ATIVAR SCANNER V30"; }
    }

    canal.onmessage = () => { MOVS = JSON.parse(localStorage.getItem('LP_MOVS')) || []; BASE = JSON.parse(localStorage.getItem('LP_BASE')) || []; if(document.querySelector('#scr-shark.active')) atualizarTabelas(); if(document.querySelector('#scr-op.active')) atualizarOpAudit(); };
    function init() {}
</script>
</body>
</html>
