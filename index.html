<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SERGEL | Shark Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ea1d2c; --bg: #ffffff; --gray: #f2f2f2; --green: #2e7d32; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); padding-bottom: 110px; color: #3e3e3e; }
        header { padding: 15px; position: sticky; top: 0; background: #fff; z-index: 100; border-bottom: 1px solid #eee; }
        .search-container { background: var(--gray); border-radius: 10px; display: flex; padding: 10px 15px; }
        .search-container input { border: none; background: none; width: 100%; outline: none; font-size: 14px; }
        .trigger-dot { position: absolute; right: 20px; top: 15px; color: #ddd; cursor: pointer; padding: 5px; }
        .cat-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 15px; scrollbar-width: none; }
        .pill { padding: 8px 18px; border-radius: 20px; border: 1px solid #eee; background: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; color: #777; }
        .pill.active { background: var(--red); color: #fff; border-color: var(--red); }
        .container { padding: 0 15px; }
        .item-card { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f2f2f2; align-items: center; }
        .item-info { flex: 1; }
        .item-info b { font-size: 15px; display: block; }
        .price { font-size: 14px; font-weight: 700; color: #333; }
        .prod-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; margin-left: 10px; }
        .btn-add { border: 1px solid #eee; background: #fff; color: var(--red); padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
        .counter { display: flex; align-items: center; border: 1px solid var(--red); border-radius: 6px; }
        .btn-q { border: none; background: none; color: var(--red); padding: 5px 10px; font-size: 18px; font-weight: bold; }
        .footer-bar { position: fixed; bottom: 0; width: 100%; background: #fff; padding: 15px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .btn-fin { background: var(--red); color: #fff; border: none; padding: 12px 30px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        #panel-admin { display: none; position: fixed; top: 0; width: 100%; height: 100%; background: #fff; z-index: 3000; padding: 20px; overflow-y: auto; }
        .admin-card { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee; }
        .input-text { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        .row-adm { padding: 12px; background: #fff; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; }
        .switch-box { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body onload="init()">

<header>
    <div class="trigger-dot" onclick="abrirLogin()">...</div>
    <div class="search-container"><input type="text" id="buscador" placeholder="Buscar sabor..." oninput="renderLoja()"></div>
</header>
<div class="cat-scroll" id="cat-lista"></div>
<div class="container" id="lista-geral"></div>

<div class="footer-bar">
    <div><small>Subtotal</small><br><b id="total-final">R$ 0,00</b></div>
    <button class="btn-fin" onclick="abrirCheckout()">Finalizar</button>
</div>

<div id="panel-admin">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0">GESTOR SHARK</h3>
        <button onclick="fecharAdmin()">Sair</button>
    </div>

    <div class="admin-card">
        <b style="color:var(--red)">CONTROLES DA LOJA</b>
        <div class="switch-box"><span>Aceitar Entrega</span><input type="checkbox" id="cfg-ent" checked onchange="save()"></div>
        <div class="switch-box"><span>Aceitar Retirada</span><input type="checkbox" id="cfg-ret" checked onchange="save()"></div>
        <div class="switch-box"><span>Ativar Cupom</span><input type="checkbox" id="cfg-cup" checked onchange="save()"></div>
    </div>

    <div class="admin-card">
        <b>IMPORTAR DA PLANILHA</b>
        <textarea id="import-area" class="input-text" style="height:60px;" placeholder="Cole aqui os nomes dos produtos..."></textarea>
        <button onclick="importar()" style="width:100%; background:#333; color:#fff; padding:10px; border:none; border-radius:5px;">Processar Nomes</button>
    </div>

    <div class="admin-card">
        <b>MEUS PRODUTOS</b>
        <div id="adm-lista"></div>
    </div>
</div>

<script>
    let db = { prods: [], cats: [], cfgs: {ent:true, ret:true, cup:true} };
    let car = {}; let catAtiva = '';

    function init() {
        db.prods = JSON.parse(localStorage.getItem('sergel_p')) || [];
        db.cats = JSON.parse(localStorage.getItem('sergel_c')) || [];
        db.cfgs = JSON.parse(localStorage.getItem('sergel_g')) || {ent:true, ret:true, cup:true};
        if(db.cats.length > 0 && !catAtiva) catAtiva = db.cats[0].nome;
        document.getElementById('cfg-ent').checked = db.cfgs.ent;
        document.getElementById('cfg-ret').checked = db.cfgs.ret;
        document.getElementById('cfg-cup').checked = db.cfgs.cup;
        renderCats(); renderLoja(); atualizarAdmin();
    }

    function renderCats() {
        document.getElementById('cat-lista').innerHTML = db.cats.map(c => `<div class="pill ${catAtiva===c.nome?'active':''}" onclick="setCat('${c.nome}')">${c.nome}</div>`).join('');
    }
    function setCat(n) { catAtiva = n; renderCats(); renderLoja(); }

    function renderLoja() {
        let b = document.getElementById('buscador').value.toLowerCase();
        let h = db.prods.filter(p => p.ativo && p.cat === catAtiva && p.nome.toLowerCase().includes(b)).map(p => {
            let q = car[p.id] || 0;
            return `<div class="item-card">
                <div class="item-info"><b>${p.nome}</b><span class="price">R$ ${p.preco.toFixed(2)}</span></div>
                ${p.img ? `<img src="${p.img}" class="prod-img">` : ''}
                <div class="action-box">
                    ${q === 0 ? `<button class="btn-add" onclick="add(${p.id},1)">ADICIONAR</button>` : 
                    `<div class="counter"><button class="btn-q" onclick="add(${p.id},-1)">-</button><span>${q}</span><button class="btn-q" onclick="add(${p.id},1)">+</button></div>`}
                </div>
            </div>`;
        }).join('');
        document.getElementById('lista-geral').innerHTML = h || '<p style="text-align:center; padding:20px; opacity:0.5;">Nenhum produto ativo nesta categoria.</p>';
    }

    function add(id,v) { car[id] = (car[id] || 0) + v; if(car[id]<=0) delete car[id]; renderLoja(); calc(); }
    function calc() {
        let t = 0; for(let id in car) { let p = db.prods.find(x=>x.id==id); t += p.preco * car[id]; }
        document.getElementById('total-final').innerText = `R$ ${t.toFixed(2).replace('.',',')}`;
    }

    function importar() {
        let lines = document.getElementById('import-area').value.split('\n');
        lines.forEach(l => {
            if(l.trim() !== "") {
                let p = { id: Date.now()+Math.random(), nome: l.trim().toUpperCase(), preco: 0, cat: 'Geral', ativo: false, img: '' };
                db.prods.push(p);
                if(!db.cats.find(c => c.nome === 'Geral')) db.cats.push({nome: 'Geral'});
            }
        });
        save(); init(); alert("Importado! Agora defina os preços no painel.");
    }

    function editarPreco(id, val) { db.prods.find(x=>x.id==id).preco = parseFloat(val) || 0; save(); renderLoja(); }
    function setImg(id) { let u = prompt("URL da Foto:"); if(u!==null) { db.prods.find(x=>x.id==id).img = u; save(); renderLoja(); atualizarAdmin(); } }
    function toggle(id) { let p = db.prods.find(x=>x.id==id); p.ativo = !p.ativo; save(); atualizarAdmin(); renderLoja(); }
    function remover(id) { if(confirm("Apagar?")) { db.prods = db.prods.filter(x=>x.id!=id); save(); init(); } }

    function save() {
        db.cfgs.ent = document.getElementById('cfg-ent').checked;
        db.cfgs.ret = document.getElementById('cfg-ret').checked;
        db.cfgs.cup = document.getElementById('cfg-cup').checked;
        localStorage.setItem('sergel_p', JSON.stringify(db.prods));
        localStorage.setItem('sergel_c', JSON.stringify(db.cats));
        localStorage.setItem('sergel_g', JSON.stringify(db.cfgs));
    }

    function atualizarAdmin() {
        document.getElementById('adm-lista').innerHTML = db.prods.map(p => `
            <div class="row-adm">
                <b style="font-size:12px;">${p.nome}</b>
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <input type="number" placeholder="Preço" value="${p.preco}" onchange="editarPreco(${p.id}, this.value)" style="width:70px;">
                    <button onclick="setImg(${p.id})">📸</button>
                    <button onclick="toggle(${p.id})" style="background:${p.ativo?'#4CAF50':'#ccc'}; color:#fff; border:none; border-radius:4px; font-size:10px; flex:1;">${p.ativo?'ATIVO':'OFF'}</button>
                    <button onclick="remover(${p.id})" style="background:none; border:none; color:red;">🗑️</button>
                </div>
            </div>`).join('');
    }

    function abrirLogin() { if(prompt("Senha:")==="9910") document.getElementById('panel-admin').style.display='block'; }
    function fecharAdmin() { document.getElementById('panel-admin').style.display='none'; }
    function abrirCheckout() {
        let n = prompt("Seu Nome:");
        if(n) {
            let msg = `🍦 *PEDIDO SERGEL*\n👤 *CLIENTE:* ${n.toUpperCase()}\n\n*ITENS:*\n`;
            for(let id in car) { let p = db.prods.find(x=>x.id==id); msg += `• ${car[id]}x ${p.nome}\n`; }
            msg += `\n💰 *TOTAL: ${document.getElementById('total-final').innerText}*`;
            window.open(`https://wa.me/5519994750657?text=${encodeURIComponent(msg)}`);
        }
    }
</script>
</body>
</html>
