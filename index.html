<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK | SHARK ULTIMATE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --p: #00ffa3; --bg: #000; --c: #0a0a0a; --b: #1a1a1a; --t: #fff; --s: rgba(0, 255, 163, 0.2); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--t); height: 100vh; overflow: hidden; position: fixed; width: 100%; }

        /* HEADER */
        header { height: 80px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--b); display: none; justify-content: space-between; align-items: center; padding: 0 25px; position: fixed; top: 0; width: 100%; z-index: 2000; }
        .avatar { width: 45px; height: 45px; background: #111; border-radius: 15px; border: 1px solid var(--b); display: flex; align-items: center; justify-content: center; color: var(--p); font-weight: 900; }

        /* VIEWS */
        .view { position: absolute; inset: 0; display: none; flex-direction: column; padding: 100px 20px 110px 20px; overflow-y: auto; }
        .view.active { display: flex; }

        /* CARDS */
        .card { background: var(--c); border: 1px solid var(--b); border-radius: 28px; padding: 25px; margin-bottom: 20px; }
        .val-blur { filter: blur(12px); opacity: 0.1; }

        /* INPUTS & BTNS */
        input { width: 100%; padding: 20px; background: #050505; border: 1px solid #1a1a1a; border-radius: 18px; color: #fff; margin-bottom: 15px; text-align: center; font-size: 16px; }
        .btn-main { background: var(--p); color: #000; border: none; border-radius: 18px; padding: 20px; width: 100%; font-weight: 800; text-transform: uppercase; cursor: pointer; }

        /* NAV */
        nav { position: fixed; bottom: 25px; left: 5%; width: 90%; height: 75px; background: rgba(10,10,10,0.9); backdrop-filter: blur(25px); border-radius: 25px; display: none; justify-content: space-around; align-items: center; border: 1px solid var(--b); z-index: 2000; }
        .nav-l { color: #333; text-decoration: none; text-align: center; font-size: 10px; font-weight: 800; cursor: pointer; }
        .nav-l.active { color: var(--p); }
        .nav-l i { font-size: 22px; display: block; margin-bottom: 4px; }

        /* GRID */
        .ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .op { text-align: center; font-size: 9px; font-weight: 800; color: #555; cursor: pointer; }
        .op-i { height: 60px; background: var(--c); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--p); margin-bottom: 5px; border: 1px solid var(--b); }
    </style>
</head>
<body onload="Shark.init()">

    <header id="h">
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="avatar" id="av">?</div>
            <div>
                <div style="font-size:13px; font-weight:800;" id="un">USUÁRIO</div>
                <div style="font-size:9px; color:var(--p); font-weight:900;" id="rk">RANK</div>
            </div>
        </div>
        <div style="font-weight:800; color:var(--p);">R$ <span id="ub" class="val-blur">0,00</span></div>
    </header>

    <div id="view-auth" class="view active" style="justify-content:center; text-align:center;">
        <h1 style="font-family:'Orbitron'; color:var(--p); font-size:35px; margin-bottom:40px;">MEC-BANK</h1>
        <div class="card">
            <input type="text" id="login_user" placeholder="USUÁRIO">
            <input type="password" id="login_pass" placeholder="SENHA">
            <button class="btn-main" onclick="Shark.login()">ENTRAR AGORA</button>
        </div>
    </div>

    <div id="view-home" class="view">
        <div class="card" style="background: linear-gradient(135deg, #0d0d0d, #000);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:11px; color:#444; font-weight:800;">SALDO TOTAL</span>
                <i class="fa-solid fa-eye" id="eye" style="color:var(--p);" onclick="Shark.togglePrivacy()"></i>
            </div>
            <div id="mb" class="val-blur" style="font-size:38px; font-weight:900; margin:15px 0;">R$ 0,00</div>
            <button class="btn-main" style="padding:12px; font-size:10px;" onclick="Shark.go('view-extrato')">VER EXTRATO</button>
        </div>

        <div class="ops">
            <div class="op" onclick="Shark.go('view-extrato')"><div class="op-i"><i class="fa-solid fa-bolt"></i></div>PIX</div>
            <div class="op"><div class="op-i"><i class="fa-solid fa-barcode"></i></div>BOLETOS</div>
            <div class="op" onclick="Shark.checkAdmin()"><div class="op-i"><i class="fa-solid fa-crown"></i></div>ADMIN</div>
            <div class="op"><div class="op-i"><i class="fa-solid fa-ellipsis"></i></div>MAIS</div>
        </div>

        <div class="card" style="border-style: dashed; border-color: #222; text-align: center; color: #333;">
            <p style="font-size: 12px; font-weight: 800;">NENHUM CARTÃO ATIVO</p>
        </div>
    </div>

    <div id="view-admin" class="view">
        <div style="background:var(--p); color:#000; padding:25px; border-radius:25px; margin-bottom:20px;">
            <small style="font-weight:900;">VOLUME TOTAL GGR</small>
            <h2 id="adm-val" style="font-size:30px; font-weight:900;">R$ 1.450.850,00</h2>
        </div>
        <div class="card" style="height:250px; padding:15px;"><canvas id="chart"></canvas></div>
    </div>

    <div id="view-extrato" class="view">
        <h2 style="margin-bottom:20px;">Extrato</h2>
        <div id="ex-list" class="card" style="text-align:center; color:#333; font-weight:800; padding:40px;">
            SEM MOVIMENTAÇÕES HOJE
        </div>
    </div>

    <nav id="n">
        <a class="nav-l active" id="btn-home" onclick="Shark.go('view-home', this)"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-l" onclick="Shark.go('view-extrato', this)"><i class="fa-solid fa-receipt"></i>Extrato</a>
        <a class="nav-l" id="nav-admin" style="display:none;" onclick="Shark.go('view-admin', this)"><i class="fa-solid fa-crown"></i>Admin</a>
        <a class="nav-l" onclick="location.reload()" style="color:#ff4444;"><i class="fa-solid fa-power-off"></i>Sair</a>
    </nav>

    <script>
        const Shark = {
            u: null,
            isPrivate: true,

            init() {},

            login() {
                const user = document.getElementById('login_user').value.trim().toUpperCase();
                if(!user) return alert("DIGITE O USUÁRIO!");

                if(user === 'ADMIN') {
                    this.u = { name: 'JP DIAS', bal: 1450850.00, role: 'admin' };
                    document.getElementById('nav-admin').style.display = 'flex';
                } else {
                    this.u = { name: user, bal: 2500.00, role: 'user' };
                }

                document.getElementById('view-auth').classList.remove('active');
                document.getElementById('h').style.display = 'flex';
                document.getElementById('n').style.display = 'flex';
                this.sync();
                this.go('view-home');
            },

            sync() {
                const val = this.u.bal.toLocaleString('pt-BR', {minimumFractionDigits: 2});
                document.getElementById('ub').innerText = val;
                document.getElementById('mb').innerText = "R$ " + val;
                document.getElementById('un').innerText = this.u.name;
                document.getElementById('av').innerText = this.u.name[0];
                document.getElementById('rk').innerText = this.u.role === 'admin' ? "RANK: PLATINUM" : "RANK: GOLD";
                if(this.u.role === 'admin') document.getElementById('adm-val').innerText = "R$ " + val;
            },

            go(id, el) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(el) {
                    document.querySelectorAll('.nav-l').forEach(l => l.classList.remove('active'));
                    el.classList.add('active');
                }
                if(id === 'view-admin') this.draw();
            },

            checkAdmin() {
                if(this.u.role === 'admin') this.go('view-admin', document.getElementById('nav-admin'));
                else alert("ACESSO RESTRITO AO ADM.");
            },

            togglePrivacy() {
                this.isPrivate = !this.isPrivate;
                document.getElementById('ub').classList.toggle('val-blur', this.isPrivate);
                document.getElementById('mb').classList.toggle('val-blur', this.isPrivate);
                document.getElementById('eye').className = this.isPrivate ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
            },

            draw() {
                const ctx = document.getElementById('chart').getContext('2d');
                if(window.myChart) window.myChart.destroy();
                window.myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['00h', '06h', '12h', '18h', '24h'],
                        datasets: [{ data: [1400000, 1420000, 1450850, 1430000, 1450850], borderColor: '#00ffa3', tension: 0.4, fill: true, backgroundColor: 'rgba(0, 255, 163, 0.05)' }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
                });
            }
        };
    </script>
</body>
</html>
