<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA JP DIAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --blue: #0a84ff; --red: #ff3b30; --gold: #ff9f0a; --gray: #0d0d0d; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        
        /* ESTILO EXATO DA IMAGEM */
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; box-sizing: border-box; }
        .active { display: flex !important; }
        
        .login-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: #080808; border: 1px solid #1a1a1a; border-radius: 12px; padding: 30px 20px; width: 100%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h1.logo { font-family: 'Orbitron'; color: #222; letter-spacing: 8px; margin-bottom: 30px; font-size: 28px; }
        
        .input-group { position: relative; margin-bottom: 12px; }
        input { width: 100%; padding: 18px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-family: 'Orbitron'; text-align: center; box-sizing: border-box; font-size: 13px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        
        .btn-entrar { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; border-radius: 8px; font-family: 'Orbitron'; font-weight: 900; font-size: 14px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-entrar:active { transform: scale(0.98); opacity: 0.8; }

        /* INTERFACES INTERNAS */
        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #050505; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; flex: 1; overflow-y: auto; }
        .card { background: #0d0d0d; border: 1px solid #222; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
        .card:active { background: var(--primary); color: #000; }
        
        .dash-wide { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; padding: 15px; }
        .panel { background: #080808; border-left: 4px solid var(--primary); padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="scr-login" class="screen active">
    <div class="login-container">
        <h1 class="logo">JP DIAS</h1>
        <div class="login-box">
            <div class="input-group">
                <input type="text" id="user" placeholder="USUÁRIO / MOTORISTA">
            </div>
            <div class="input-group">
                <input type="password" id="pass" placeholder="SENHA">
            </div>
            <button class="btn-entrar" onclick="autenticar()">ENTRAR</button>
        </div>
    </div>
</div>

<div id="scr-gestor" class="screen">
    <header>
        <span style="font-family:'Orbitron'; color:var(--primary); font-size:12px;">PAINEL GERAL GESTÃO</span>
        <button onclick="location.reload()" style="background:none; border:1px solid var(--red); color:var(--red); font-size:8px; padding:5px; border-radius:4px;">SAIR</button>
    </header>
    <div class="dash-wide">
        <div class="panel"><b>ESTOQUE</b><br><small>14 ITENS PENDENTES</small></div>
        <div class="panel" style="border-color:var(--blue)"><b>MOTORISTAS</b><br><small>08 EM ROTA</small></div>
        <div class="panel" style="border-color:var(--red)"><b>AVARIAS</b><br><small>02 REGISTRADAS</small></div>
    </div>
</div>

<div id="scr-operador" class="screen">
    <header>
        <span style="font-family:'Orbitron'; color:var(--primary); font-size:12px;">OPERAÇÃO E LIBERAÇÃO</span>
        <button onclick="location.reload()" style="background:none; border:1px solid var(--red); color:var(--red); font-size:8px; padding:5px; border-radius:4px;">SAIR</button>
    </header>
    <div class="grid">
        <div class="card" onclick="falar('Recebimento ativo')"><i>IN</i><span>RECEBER</span></div>
        <div class="card" onclick="falar('Iniciando separação por voz')"><i>VOZ</i><span>SEPARAR</span></div>
        <div class="card" onclick="falar('Conferência de carga')"><i>OK</i><span>CONFERIR</span></div>
        <div class="card" onclick="falar('Relatar avaria')"><i>AVR</i><span>AVARIA</span></div>
    </div>
</div>

<script>
    function bip() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        gain.gain.value = 0.1; osc.start(); setTimeout(() => osc.stop(), 100);
    }

    function falar(t) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    }

    function autenticar() {
        const p = document.getElementById('pass').value;
        bip();
        if(p === "9910") {
            document.getElementById('scr-login').classList.remove('active');
            document.getElementById('scr-gestor').classList.add('active');
            falar("Acesso Gestor.");
        } else if(p === "1234") {
            document.getElementById('scr-login').classList.remove('active');
            document.getElementById('scr-operador').classList.add('active');
            falar("Acesso Operador.");
        } else {
            alert("SENHA INCORRETA");
        }
    }
</script>
</body>
</html>
