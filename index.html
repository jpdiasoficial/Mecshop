<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEC BET DEMO</title>

<style>

body{
background:#050505;
color:#fff;
font-family:Arial;
margin:0;
}

header{
background:#000;
padding:15px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #222;
}

.logo{
color:#d4af37;
font-weight:bold;
}

.balance{
color:#00ff41;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
margin-bottom:15px;
border:1px solid #222;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin:5px;
font-weight:bold;
}

.green{background:#00ff41;color:#000}
.red{background:#ff3b3b;color:#fff}
.orange{background:#ff5e00;color:#fff}

input{
padding:10px;
border-radius:6px;
border:none;
margin:5px;
}

.view{display:none}
.active{display:block}

</style>
</head>

<body>

<div id="loginView" class="active container">

<h1>MEC BET DEMO</h1>

<input id="userInput" placeholder="usuário">

<br>

<button class="orange" onclick="login()">ENTRAR</button>

</div>


<div id="userView" class="view">

<header>

<div class="logo">MEC BET</div>

<div class="balance">R$ <span id="balanceTop">0</span></div>

</header>

<div class="container">

<div class="card">

<h3>Saldo</h3>

<h1 id="balanceMain">0</h1>

<button class="green" onclick="deposit()">Depositar +100</button>

<button class="red" onclick="bet()">Apostar 50</button>

</div>

</div>

</div>


<div id="adminView" class="view">

<header>

<div class="logo">PAINEL ADMIN</div>

</header>

<div class="container">

<h2>Usuários cadastrados</h2>

<div id="userList"></div>

</div>

</div>


<script>

const channel = new BroadcastChannel("mecbet-demo")

let db = JSON.parse(localStorage.getItem("mecbetDB")) || []

let currentUser=null


function save(){

localStorage.setItem("mecbetDB",JSON.stringify(db))

channel.postMessage("sync")

}


function login(){

let name=document.getElementById("userInput").value.toUpperCase()

if(!name)return

let user=db.find(u=>u.name===name)

if(!user){

user={

name:name,
balance:0

}

db.push(user)

save()

}

currentUser=user

document.getElementById("loginView").style.display="none"

if(name==="ADMIN"){

document.getElementById("adminView").style.display="block"

loadUsers()

}else{

document.getElementById("userView").style.display="block"

updateUI()

}

}


function updateUI(){

document.getElementById("balanceTop").innerText=currentUser.balance

document.getElementById("balanceMain").innerText=currentUser.balance

}


function deposit(){

currentUser.balance+=100

save()

updateUI()

}


function bet(){

currentUser.balance-=50

save()

updateUI()

}


function loadUsers(){

let html=""

db.forEach(u=>{

html+=`

<div class="card">

<b>${u.name}</b>

<h3>R$ ${u.balance}</h3>

<button onclick="add('${u.name}')">+500</button>

<button onclick="remove('${u.name}')">-500</button>

</div>

`

})

document.getElementById("userList").innerHTML=html

}


function add(name){

let u=db.find(x=>x.name===name)

u.balance+=500

save()

loadUsers()

}


function remove(name){

let u=db.find(x=>x.name===name)

u.balance-=500

save()

loadUsers()

}


channel.onmessage=()=>{

db=JSON.parse(localStorage.getItem("mecbetDB"))

if(currentUser){

currentUser=db.find(x=>x.name===currentUser.name)

if(document.getElementById("userView").style.display==="block"){

updateUI()

}

}

if(document.getElementById("adminView").style.display==="block"){

loadUsers()

}

}

</script>

</body>
</html>
