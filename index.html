<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO | SISTEMA TECNOLOGIA JP DIAS</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --card: #0a0a0a; --out: #ff3b30; --in: #00d4ff; --line: #1a1a1a; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; overflow: hidden; height: 100vh; font-size: 11px; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; background: #000; }
        .active { display: flex !important; }
        
        /* ESTILO DA LOGO CONFORME IMAGEM */
        .logo-main { font-family: 'Orbitron'; color: var(--primary); font-size: 38px; letter-spacing: 5px; text-shadow: 0 0 15px rgba(0,255,65,0.6); margin-bottom: 5px; }
        .logo-sub { font-size: 8px; letter-spacing: 2px; color: #555; font-family: 'Orbitron'; }

        header { padding: 15px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: rgba(0,0,0,0.95); z-index: 10; }
        .scroll { flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box; padding-bottom: 120px; }
        
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #151515; margin-bottom: 12px; }
        .btn-green { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        input, select { width: 100%; padding: 15px; background: #0d0d0d; border: 1px solid #222; color: #fff; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-family: 'Orbitron'; }
        
        /* TABELA PLANILHA */
        .sheet-container { width: 100%; border-collapse: collapse; }
        .sheet-header th { padding: 12px 10px; text-align: left; color: var(--primary); border-bottom: 2px solid var(--primary); font-size: 9px; }
        .sheet-row td { padding: 12px 10px; border-bottom: 1px solid var(--line); }

        /* PAINEL DE FEEDBACK PÓS-BIPE */
        .info-panel { background: #000; border: 2px solid var(--primary); border-radius: 12px; padding: 15px; margin-top: 15px; display: none; }
        .val-destaque { color: var(--primary); font-size: 18px; font-family: 'Orbitron'; display: block; }
        
        #reader-container { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #222; position: relative; }
        #cooldown-bar { width: 0%; height: 5px; background: var(--primary); position: absolute; bottom: 0; transition: width 0.5s linear; }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active" style="align-items:center; justify-content:center; text-align:center;">
    <div class="logo-main">LOG-PRO</div>
    <div class="logo-sub">SISTEMA TECNOLOGIA JP DIAS</div>
    
    <div style="width: 85%; max-width: 320px; margin-top: 40px;">
        <input type="password" id="pass" placeholder="CHAVE DE ACESSO" inputmode="numeric">
        <button class="btn-green" onclick="auth()">CONECTAR TERMINAL</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span>SHARK HUB</span> <span id="sync-blink" style="color:var(--primary); display:none;">● LIVE</span></header>
    <div class="scroll">
        <div id="stats" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px;"></div>
        <div class="card" style="padding:0; overflow-x: auto;">
            <table class="sheet-container">
                <thead><tr class="sheet-header"><th>PRODUTO</th><th>EST</th><th>SEP</th><th>SAI</th></tr></thead>
                <tbody id="sheet-body"></tbody>
            </table>
        </div>
        <button class="btn-green" onclick="exportarCSV()" style="margin-top:10px;">RELATÓRIO CSV</button>
        <button class="btn-green" style="margin-top:10px; background:#222; color:#fff;" onclick="ir('scr-config')">CONFIGURAR BASE</button>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span>OPERADOR</span> <button onclick="ir('scr-login')" style="background:none; border:none; color:red;">SAIR</button></header>
    <div class="scroll">
        <div style="display:flex; gap:8px;">
            <select id="mod-op" style="flex:2;">
                <option value="IN">📥 ENTRADA</option>
                <option value="SEP">📦 SEPARAÇÃO</option>
                <option value="CON">✅ CONFERÊNCIA</option>
                <option value="OUT">📤 SAÍDA FINAL</option>
            </select>
            <input type="number" id="qtd-bipe" value="1" style="flex:1; text-align:center;">
        </div>

        <div id="reader-container">
            <div id="reader"></div>
            <div id="cooldown-bar"></div>
        </div>

        <div id="info-panel" class="info-panel">
            <small style="color:#555">PRODUTO:</small>
            <span id="view-nome" class="val-destaque">---</span>
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <div><small style="color:#555">CÓDIGO:</small><br><b id="view-cod">---</b></div>
                <div><small style="color:#555">SALDO ATUAL:</small><br><b id="view-saldo" style="color:var(--in)">0</b></div>
            </div>
        </div>

        <button class="btn-green" id="btn-cam" onclick="toggleCamera()" style="margin-top:15px;">ABRIR SCANNER</button>
    </div>
</div>

<div id="scr-config" class="screen">
    <header><span>AJUSTES</span> <button onclick="ir('scr-shark')">VOLTAR</button></header>
    <div class="scroll">
        <div class="card">
            <small style="color:var(--primary)">CADASTRAR (CÓDIGO, NOME)</small>
            <textarea id="import-area" style="width:100%; height:100px; background:#111; color:#fff; border:1px solid #333; margin-top:10px;"></textarea>
            <button class="btn-green" onclick="importar()">SALVAR BASE</button>
        </div>
    </div>
</div>

<script>
    const canal = new BroadcastChannel('logpro_v51');
    let BASE = JSON.parse(localStorage.getItem('LP_BASE')) || {};
    let MOVS = JSON.parse(localStorage.getItem('LP_MOVS')) || [];
    let scanner, camOn = false, isLocked = false;

    function auth() {
        const p = document.getElementById('pass').value;
        if(p === "9910") ir('scr-shark');
        else if(p === "1234") ir('scr-op');
        else alert("ACESSO NEGADO");
    }

    function ir(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'scr-shark') atualizarShark();
    }

    function importar() {
        document.getElementById('import-area').value.split('\n').forEach(l => {
            const d = l.split(','); if(d[0] && d[1]) BASE[d[0].trim()] = d[1].trim().toUpperCase();
        });
        localStorage.setItem('LP_BASE', JSON.stringify(BASE)); ir('scr-shark');
    }

    function processar(cod) {
        if(isLocked || !BASE[cod.trim()]) return;
        isLocked = true;
        const item = BASE[cod.trim()];
        const modo = document.getElementById('mod-op').value;
        const qtd = parseInt(document.getElementById('qtd-bipe').value) || 1;

        // CÁLCULO DE SALDO PARA FEEDBACK
        let s = 0; MOVS.filter(m => m.cod === cod).forEach(m => {
            if(m.modo === 'IN') s += m.q; else if(m.modo === 'SEP' || m.modo === 'OUT') s -= m.q;
        });

        MOVS.unshift({ cod, nome: item, modo, q: qtd, d: new Date().toLocaleString() });
        localStorage.setItem('LP_MOVS', JSON.stringify(MOVS));

        document.getElementById('info-panel').style.display = 'block';
        document.getElementById('view-nome').innerText = item;
        document.getElementById('view-cod').innerText = cod;
        document.getElementById('view-saldo').innerText = (modo === 'IN' ? s + qtd : s - qtd);

        canal.postMessage({ type: 'BIPE' });
        document.getElementById('cooldown-bar').style.width = "100%";
        setTimeout(() => { isLocked = false; document.getElementById('cooldown-bar').style.width = "0%"; }, 600);
    }

    function atualizarShark() {
        let r = {}; Object.keys(BASE).forEach(k => r[k] = { n: BASE[k], ent: 0, sep: 0, sai: 0, sal: 0 });
        MOVS.forEach(m => {
            if(r[m.cod]) {
                if(m.modo === 'IN') { r[m.cod].ent += m.q; r[m.cod].sal += m.q; }
                if(m.modo === 'SEP') { r[m.cod].sep += m.q; r[m.cod].sal -= m.q; }
                if(m.modo === 'OUT') { r[m.cod].sai += m.q; r[m.cod].sal -= m.q; }
            }
        });
        document.getElementById('sheet-body').innerHTML = Object.keys(r).map(k => `
            <tr class="sheet-row"><td><b>${r[k].n}</b></td><td>${r[k].sal}</td><td style="color:orange">${r[k].sep}</td><td style="color:var(--out)">${r[k].sai}</td></tr>
        `).join('');
        document.getElementById('stats').innerHTML = `<div class="card"><small>ESTOQUE TOTAL</small><br><b>${Object.values(r).reduce((a,b)=>a+b.sal,0)}</b></div><div class="card"><small>SKUS</small><br><b>${Object.keys(BASE).length}</b></div>`;
    }

    async function toggleCamera() {
        if(!camOn) {
            if(!scanner) scanner = new Html5Qrcode("reader");
            await scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 220 }, (t) => processar(t));
            camOn = true; document.getElementById('btn-cam').innerText = "FECHAR";
        } else { await scanner.stop(); camOn = false; document.getElementById('btn-cam').innerText = "ABRIR SCANNER"; }
    }

    function exportarCSV() {
        let c = "DATA,ITEM,MODO,QTD\n" + MOVS.map(m=>`${m.d},${m.nome},${m.modo},${m.q}`).join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], {type:'text/csv'}));
        a.download = 'LOGPRO_FINAL.csv'; a.click();
    }

    canal.onmessage = () => { MOVS = JSON.parse(localStorage.getItem('LP_MOVS')); if(document.getElementById('scr-shark').classList.contains('active')) atualizarShark(); };
    function init() { console.log("LOG-PRO V51 READY"); }
</script>
</body>
</html>
