<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v103 | SHARK SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #00ff41; --s: #007aff; --bg: #000; --sf: #0a0a0a; --brd: #1a1a1a; --dg: #ff3b30; --w: #ffae00; }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; font-size: 11px; height: 100vh; overflow: hidden; text-transform: uppercase; }
        .screen { display: none; height: 100vh; flex-direction: column; }
        .active-screen { display: flex !important; }
        header { padding: 15px; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #000; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px 15px 100px 15px; }
        .card { background: var(--sf); border: 1px solid var(--brd); border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; }
        h3 { font-family: 'Orbitron'; font-size: 9px; color: var(--p); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-left: 3px solid var(--p); padding-left: 8px; }
        input, select { width: 100%; padding: 14px; background: #050505; border: 1px solid #222; color: #fff; border-radius: 8px; font-size: 11px; margin-bottom: 10px; font-weight: 700; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: var(--s); color: #fff; }
        .btn-d { background: var(--dg); color: #fff; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .kpi-box { background: #0a0a0a; border: 1px solid #222; padding: 10px 5px; border-radius: 8px; text-align: center; }
        .kpi-box span { font-family: 'Orbitron'; font-size: 14px; color: var(--p); display: block; }
        .bottom-nav { display: none; background: #000; border-top: 2px solid var(--brd); position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-size: 8px; font-weight: 800; gap: 4px; }
        .active-tab { color: var(--p); border-top: 3px solid var(--p); background: #050505; }
        .pill { padding: 3px 6px; border-radius: 4px; font-weight: 900; font-size: 7px; color: #000; }
        .avaria { border: 1px solid var(--dg) !important; background: rgba(255, 59, 48, 0.05); }
        .badge-count { position: absolute; top: 10px; right: 10px; background: var(--dg); color: #fff; padding: 2px 6px; border-radius: 10px; font-size: 8px; }
    </style>
</head>
<body onload="inicializarApp()">

    <div id="tela-login" class="screen active-screen" style="justify-content:center; padding:40px;">
        <h1 style="font-family:'Orbitron'; color:var(--p); text-align:center; font-size:35px;">LOG-PRO</h1>
        <p style="color:#555; font-size:8px; text-align:center; margin-bottom:40px;">SISTEMA OPERACIONAL SHARK v103</p>
        <button class="btn btn-p" onclick="login('shark')" style="margin-bottom:12px;">👑 ADMIN SHARK</button>
        <button class="btn btn-s" onclick="login('operador')" style="margin-bottom:12px;">📦 OPERADOR / WMS</button>
        <button class="btn btn-d" onclick="login('motorista')">🚚 MOTORISTA / ROTA</button>
    </div>

    <div id="tela-shark" class="screen">
        <header><span>SHARK COMMAND</span> <button onclick="location.reload()" style="background:none; border:none; color:var(--dg); font-size:10px;">SAIR</button></header>
        <div class="scroll-area">
            <div class="kpi-grid">
                <div class="kpi-box"><span id="sh-ent">0</span><small>ENT</small></div>
                <div class="kpi-box"><span id="sh-sep">0</span><small>SEP</small></div>
                <div class="kpi-box"><span id="sh-ava" style="color:var(--dg)">0</span><small>AVA</small></div>
                <div class="kpi-box"><span id="sh-est" style="color:var(--s)">0</span><small>EST</small></div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-file-export"></i> DADOS EM MASSA</h3>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <button class="btn btn-s" style="padding:10px; font-size:8px;" onclick="exportarDados()">EXPORTAR JSON</button>
                    <button class="btn btn-p" style="padding:10px; font-size:8px;" onclick="document.getElementById('fileInput').click()">IMPORTAR</button>
                </div>
                <input type="file" id="fileInput" style="display:none" onchange="importarDados(this)">
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-truck-ramp-box"></i> ROMANEIOS ATIVOS</h3>
                <div id="lista-romaneios-shark"></div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-list-check"></i> ESTOQUE INTELIGENTE</h3>
                <div id="inventario-shark"></div>
            </div>
        </div>
    </div>

    <div id="tela-operador" class="screen">
        <header><span>WMS OPERATOR</span></header>
        <div class="scroll-area">
            <div class="card">
                <div id="reader-op" style="width:100%; min-height:160px; background:#000; border:2px solid var(--p); display:none; margin-bottom:10px;"></div>
                <button class="btn btn-p" id="btn-cam" onclick="toggleCam()">SCANNER QR/EAN</button>
            </div>
            
            <div class="card">
                <h3>REGISTRO DE OPERAÇÃO</h3>
                <select id="op-tipo-v3">
                    <option value="ENTRADA">📥 ENTRADA DE CARGA</option>
                    <option value="SEPARACAO">📦 SEPARAÇÃO (PICKING)</option>
                    <option value="AVARIA">⚠️ REGISTRAR AVARIA</option>
                </select>
                <input type="text" id="ean-v3" placeholder="EAN OU CÓDIGO">
                <button class="btn btn-s" onclick="processarOperacao()">CONFIRMAR ITEM</button>
            </div>

            <div class="card">
                <h3>ROMANEIO DE SAÍDA</h3>
                <input type="text" id="rom-nome" placeholder="NOME DO MOTORISTA / PLACA">
                <button class="btn btn-d" onclick="fecharRomaneio()">FECHAR E ENVIAR ROMANEIO</button>
            </div>
        </div>
    </div>

    <div id="tela-motorista" class="screen">
        <header><span>DRIVER ROUTE</span></header>
        <div class="scroll-area">
            <div id="lista-entregas-motorista"></div>
        </div>
    </div>

    <div class="bottom-nav" id="nav-v3">
        <div class="nav-item" id="nv-sh" onclick="navegar('tela-shark', this)"><i class="fa-solid fa-crown"></i>SHARK</div>
        <div class="nav-item" id="nv-op" onclick="navegar('tela-operador', this)"><i class="fa-solid fa-barcode"></i>WMS</div>
        <div class="nav-item" id="nv-mt" onclick="navegar('tela-motorista', this)"><i class="fa-solid fa-truck"></i>ROTA</div>
    </div>

    <script>
        // CORE DATA V3
        let db = JSON.parse(localStorage.getItem('SHARK_DB') || '{"logs":[], "produtos":{}, "romaneios":[]}');
        let camAtiva = false;
        let html5QrCode;

        function inicializarApp() { renderizarTudo(); }

        function login(role) {
            document.getElementById('tela-login').classList.remove('active-screen');
            document.getElementById('nav-v3').style.display = 'flex';
            document.getElementById('nv-sh').style.display = (role === 'shark') ? 'flex' : 'none';
            document.getElementById('nv-op').style.display = (role === 'shark' || role === 'operador') ? 'flex' : 'none';
            document.getElementById('nv-mt').style.display = (role === 'shark' || role === 'motorista') ? 'flex' : 'none';
            navegar('tela-'+role, document.getElementById('nv-'+(role=='operador'?'op':role=='motorista'?'mt':'sh')));
        }

        function navegar(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-screen');
            el.classList.add('active-tab');
            renderizarTudo();
        }

        // LÓGICA DE OPERAÇÃO EM TEMPO REAL
        function processarOperacao(eanLido = null) {
            let ean = eanLido || document.getElementById('ean-v3').value;
            if(!ean) return;

            if(!db.produtos[ean]) {
                let n = prompt("NOVO PRODUTO! NOME:");
                if(n) db.produtos[ean] = n; else return;
            }

            let tipo = document.getElementById('op-tipo-v3').value;
            let qtd = prompt(`QUANTIDADE PARA ${tipo}:`, "1");
            
            if(qtd) {
                db.logs.unshift({
                    data: new Date().toLocaleString(),
                    tipo: tipo,
                    ean: ean,
                    nome: db.produtos[ean],
                    qtd: parseInt(qtd),
                    romaneioId: null
                });
                save();
                renderizarTudo();
                document.getElementById('ean-v3').value = "";
            }
        }

        function fecharRomaneio() {
            let motorista = document.getElementById('rom-nome').value;
            if(!motorista) return alert("INSIRA O NOME DO MOTORISTA!");
            
            // Pega tudo que foi "SEPARADO" e ainda não está em um romaneio
            let itens = db.logs.filter(l => l.tipo === 'SEPARACAO' && !l.romaneioId);
            if(itens.length === 0) return alert("NADA SEPARADO PARA ENVIAR!");

            let id = Date.now();
            itens.forEach(l => l.romaneioId = id);
            
            db.romaneios.unshift({
                id: id,
                motorista: motorista,
                data: new Date().toLocaleString(),
                status: 'EM ROTA',
                itens: itens
            });

            save();
            renderizarTudo();
            document.getElementById('rom-nome').value = "";
            alert("ROMANEIO ENVIADO PARA O MOTORISTA!");
        }

        function renderizarTudo() {
            let ent=0, sep=0, ava=0, est={};
            let shHtml = "", mtHtml = "";

            // PROCESSA ESTOQUE E KPIs
            db.logs.forEach(l => {
                est[l.nome] = est[l.nome] || {saldo:0, avaria:0};
                if(l.tipo === 'ENTRADA') { ent += l.qtd; est[l.nome].saldo += l.qtd; }
                if(l.tipo === 'SEPARACAO') { sep += l.qtd; est[l.nome].saldo -= l.qtd; }
                if(l.tipo === 'AVARIA') { ava += l.qtd; est[l.nome].avaria += l.qtd; }
            });

            // DASHBOARD SHARK
            if(document.getElementById('sh-ent')) {
                document.getElementById('sh-ent').innerText = ent;
                document.getElementById('sh-sep').innerText = sep;
                document.getElementById('sh-ava').innerText = ava;
                document.getElementById('sh-est').innerText = (ent - sep);
                
                for(let p in est) {
                    shHtml += `<div class="card ${est[p].avaria > 0 ? 'avaria' : ''}" style="padding:10px; margin-bottom:5px;">
                                <b>${p}</b> 
                                <div style="display:flex; justify-content:space-between; margin-top:5px;">
                                    <span>SALDO: ${est[p].saldo}</span>
                                    <span style="color:var(--dg)">AVARIA: ${est[p].avaria}</span>
                                </div>
                               </div>`;
                }
                document.getElementById('inventario-shark').innerHTML = shHtml || "VAZIO";
            }

            // TELA MOTORISTA
            db.romaneios.forEach(r => {
                mtHtml += `<div class="card">
                            <h3><i class="fa-solid fa-truck"></i> ROMANEIO #${r.id.toString().slice(-4)}</h3>
                            <p>MOTORISTA: ${r.motorista}</p>
                            <div style="margin:10px 0; font-size:9px; color:var(--p);">
                                ${r.itens.map(i => `• ${i.qtd}x ${i.nome}`).join('<br>')}
                            </div>
                            <button class="btn btn-p" style="height:30px; font-size:8px;" onclick="concluirEntrega(${r.id})">${r.status === 'EM ROTA' ? 'CONFIRMAR ENTREGA' : 'CONCLUÍDO ✅'}</button>
                           </div>`;
            });
            if(document.getElementById('lista-entregas-motorista')) document.getElementById('lista-entregas-motorista').innerHTML = mtHtml || "SEM ENTREGAS";
        }

        function concluirEntrega(id) {
            let r = db.romaneios.find(x => x.id === id);
            r.status = 'ENTREGUE';
            save();
            renderizarTudo();
        }

        function save() { localStorage.setItem('SHARK_DB', JSON.stringify(db)); }

        // IMPORT/EXPORT
        function exportarDados() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            let dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "shark_backup.json");
            dl.click();
        }

        function importarDados(input) {
            let reader = new FileReader();
            reader.onload = function(){
                db = JSON.parse(reader.result);
                save();
                location.reload();
            };
            reader.readAsText(input.files[0]);
        }

        function toggleCam() {
            if(!camAtiva) {
                document.getElementById('reader-op').style.display='block';
                html5QrCode = new Html5Qrcode("reader-op");
                html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => { processarOperacao(txt); toggleCam(); });
                document.getElementById('btn-cam').innerText="FECHAR"; camAtiva=true;
            } else {
                html5QrCode.stop().then(() => { document.getElementById('reader-op').style.display='none'; camAtiva=false; document.getElementById('btn-cam').innerText="SCANNER QR/EAN"; });
            }
        }
    </script>
</body>
</html>
