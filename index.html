<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK V45 | Platinum Shark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #111; --text: #fff; --gray: #888; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); margin: 0; height: 100vh; overflow: hidden; }

        /* SISTEMA DE TELAS */
        .screen { display: none; height: 100vh; flex-direction: column; overflow-y: auto; position: relative; }
        .active { display: flex; animation: slideUp 0.4s ease; }
        .with-nav { padding-bottom: 100px; }

        /* TELA DE LOGIN (SEM BARRA INFERIOR) */
        #scr-login { justify-content: center; align-items: center; padding: 40px; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        .logo-main { font-size: 38px; font-weight: 900; color: var(--primary); letter-spacing: -1px; margin-bottom: 50px; text-shadow: 0 0 20px rgba(0,255,136,0.3); }
        .login-box { width: 100%; max-width: 320px; }
        .login-box input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 15px; color: #fff; margin-bottom: 15px; font-size: 16px; outline: none; }
        .login-box input:focus { border-color: var(--primary); }
        .btn-access { width: 100%; background: var(--primary); color: #000; border: none; padding: 20px; border-radius: 15px; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,255,136,0.2); }

        /* ÁREA DO CLIENTE (ESTILO MERCADO PAGO/PLATINUM) */
        .header-client { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .user-pill { display: flex; align-items: center; gap: 12px; background: #1a1a1a; padding: 6px 16px 6px 6px; border-radius: 30px; }
        .avatar { width: 35px; height: 35px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; }
        
        .balance-card { background: #111; margin: 0 15px; padding: 25px; border-radius: 24px; border: 1px solid #222; }
        .blur { filter: blur(12px); }

        /* GRID DE 8 BOTÕES (TODOS COM FIGURINHA E FUNÇÃO) */
        .grid-services { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 25px 15px; }
        .service-item { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; cursor: pointer; }
        .icon-circle { width: 60px; height: 60px; background: #181818; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--primary); border: 1px solid #252525; }
        .service-item span { font-size: 11px; font-weight: 500; color: #aaa; }
        .service-item:active .icon-circle { background: var(--primary); color: #000; transform: scale(0.9); }

        /* PAINEL MASTER (VISÃO SHARK 4808) */
        .admin-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .admin-box { background: #111; padding: 20px; border-radius: 18px; border-left: 4px solid var(--primary); }
        .upload-zone { border: 2px dashed #333; margin: 15px; padding: 40px; border-radius: 20px; text-align: center; color: var(--primary); cursor: pointer; }
        .btn-admin { margin: 0 15px 12px 15px; padding: 18px; border-radius: 15px; border: none; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; }

        /* BARRA INFERIOR (SÓ APARECE APÓS LOGIN) */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(5,5,5,0.98); display: none; justify-content: space-around; padding: 15px 0; border-top: 1px solid #1a1a1a; backdrop-filter: blur(15px); z-index: 1000; }
        .nav-item { color: #444; text-align: center; font-size: 10px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item i { font-size: 22px; }
        .nav-item.active-nav { color: var(--primary); }
        .nav-item.exit { color: var(--danger); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="scr-login" class="screen active">
        <div class="logo-main">MEC-BANK</div>
        <div class="login-box">
            <input type="text" id="inp-user" placeholder="Usuário (Shark ou Cliente)">
            <input type="password" id="inp-pass" placeholder="Senha de Acesso">
            <button class="btn-access" onclick="executarLogin()">ENTRAR COM SEGURANÇA</button>
        </div>
        <p style="margin-top: 40px; font-size: 11px; color: #333;">V45.8835 PLATINUM OPERATIONAL</p>
    </div>

    <div id="scr-home" class="screen with-nav">
        <div class="header-client">
            <div class="user-pill">
                <div class="avatar">J</div>
                <span id="user-name" style="font-weight: 700;">Olá, Shark</span>
            </div>
            <div style="display: flex; gap: 20px; font-size: 20px;">
                <i class="fa-solid fa-gear" style="color: #333;"></i>
                <i class="fa-solid fa-bell" style="color: var(--primary);"></i>
            </div>
        </div>

        <div class="balance-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--gray); font-size: 14px;">Saldo disponível</span>
                <i class="fa-solid fa-eye" id="eye-bal" onclick="toggleBal()"></i>
            </div>
            <div id="val-bal" class="blur" style="font-size: 30px; font-weight: 800; margin: 12px 0;">R$ 145.850,90</div>
            <button style="width: 100%; background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 12px; border-radius: 12px; font-weight: 700; margin-top: 10px;">Ver extrato detalhado</button>
        </div>

        <div class="grid-services">
            <div class="service-item" onclick="startCam('Pix')"><div class="icon-circle"><i class="fa-solid fa-qrcode"></i></div><span>Pix</span></div>
            <div class="service-item" onclick="startCam('Boleto')"><div class="icon-circle"><i class="fa-solid fa-barcode"></i></div><span>Pagar</span></div>
            <div class="service-item"><div class="icon-circle"><i class="fa-solid fa-money-bill-transfer"></i></div><span>Transf.</span></div>
            <div class="service-item"><div class="icon-circle"><i class="fa-solid fa-mobile-screen"></i></div><span>Recarga</span></div>
            <div class="service-item"><div class="icon-circle"><i class="fa-solid fa-hand-holding-dollar"></i></div><span>Empréstimo</span></div>
            <div class="service-item"><div class="icon-circle"><i class="fa-solid fa-shield-halved"></i></div><span>Seguros</span></div>
            <div class="service-item"><div class="icon-circle"><i class="fa-solid fa-gift"></i></div><span>Mimos</span></div>
            <div class="service-item" onclick="go('scr-help', this)"><div class="icon-circle"><i class="fa-solid fa-circle-question"></i></div><span>Ajuda</span></div>
        </div>
    </div>

    <div id="scr-master" class="screen with-nav">
        <div style="padding: 25px;">
            <h2 style="color: var(--primary); margin: 0;">Shark Control Panel</h2>
            <p style="color: var(--gray); font-size: 12px; margin-top: 5px;">Gerenciamento de Ativos e Usuários</p>
        </div>

        <div class="admin-stat-grid">
            <div class="admin-box"><small style="color: var(--gray);">Saldos Totais</small><div style="font-size: 20px; font-weight: 800; margin-top: 5px;">R$ 1.450.850</div></div>
            <div class="admin-box"><small style="color: var(--gray);">Contas Ativas</small><div style="font-size: 20px; font-weight: 800; margin-top: 5px;">842</div></div>
        </div>

        <div class="upload-zone" onclick="document.getElementById('xlsx').click()">
            <i class="fa-solid fa-file-excel" style="font-size: 35px; margin-bottom: 10px;"></i>
            <div style="font-weight: 800;">SINCRONIZAR PLANILHA XLSX</div>
            <input type="file" id="xlsx" hidden onchange="alert('Sincronizando Base Shark...')">
        </div>

        <button class="btn-admin" style="background: #111; color: var(--primary); border: 1px solid var(--primary);"><i class="fa-solid fa-file-pdf"></i> RELATÓRIO OPERACIONAL</button>
        <button class="btn-admin" style="background: var(--danger); color: #fff;"><i class="fa-solid fa-lock"></i> BLOQUEIO GERAL</button>
        <button class="btn-admin" style="background: #fff; color: #000;"><i class="fa-solid fa-user-plus"></i> CADASTRAR NOVO MASTER</button>
    </div>

    <nav class="nav-bar" id="nav">
        <a href="#" class="nav-item active-nav" onclick="go('scr-home', this)"><i class="fa-solid fa-house"></i>Início</a>
        <a href="#" class="nav-item" onclick="go('scr-home', this)"><i class="fa-solid fa-list-ul"></i>Extrato</a>
        <a href="#" class="nav-item" onclick="go('scr-master', this)"><i class="fa-solid fa-gears"></i>Painel</a>
        <a href="#" class="nav-item exit" onclick="location.reload()"><i class="fa-solid fa-power-off"></i>Sair</a>
    </nav>

    <script>
        function executarLogin() {
            const user = document.getElementById('inp-user').value.toLowerCase();
            const pass = document.getElementById('inp-pass').value;

            if(!user || !pass) return alert("Acesso Negado: Preencha as credenciais.");

            document.getElementById('scr-login').classList.remove('active');
            document.getElementById('nav').style.display = 'flex'; // MOSTRA A BARRA SÓ AGORA

            if(user === 'shark') {
                document.getElementById('scr-master').classList.add('active');
                setActiveNav(2);
            } else {
                document.getElementById('user-name').innerText = "Olá, " + user;
                document.getElementById('scr-home').classList.add('active');
                setActiveNav(0);
            }
        }

        function go(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
                el.classList.add('active-nav');
            }
        }

        function setActiveNav(idx) {
            const items = document.querySelectorAll('.nav-item');
            items.forEach(n => n.classList.remove('active-nav'));
            items[idx].classList.add('active-nav');
        }

        function toggleBal() {
            const val = document.getElementById('val-bal');
            const eye = document.getElementById('eye-bal');
            val.classList.toggle('blur');
            eye.classList.toggle('fa-eye');
            eye.classList.toggle('fa-eye-slash');
        }

        async function startCam(tipo) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const modal = document.createElement('div');
                modal.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:2000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;";
                modal.innerHTML = `<h3 style='color:var(--primary)'>Escaneando ${tipo}...</h3><video id="v" style="width:100%; border-radius:24px; border:2px solid var(--primary)"></video><button onclick="this.parentElement.remove()" style="margin-top:25px; width:100%; padding:20px; background:var(--danger); color:#fff; border:none; border-radius:15px; font-weight:800;">CANCELAR</button>`;
                document.body.appendChild(modal);
                document.getElementById('v').srcObject = stream;
                document.getElementById('v').play();
            } catch(e) { alert("Erro de Câmera: Verifique as permissões do Shark."); }
        }
    </script>
</body>
</html>
