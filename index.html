<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS LOG-PRO | V12</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --red: #ff3b30; --blue: #0a84ff; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; }
        .active { display: flex !important; }

        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #050505; font-family: 'Orbitron'; font-size: 10px; }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; }

        /* KPI & TABELAS */
        .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .kpi { background: #080808; border: 1px solid #222; padding: 12px; border-radius: 8px; border-left: 4px solid var(--primary); }
        .kpi b { display: block; font-family: 'Orbitron'; font-size: 14px; color: var(--primary); }
        
        table { width: 100%; border-collapse: collapse; font-size: 9px; margin-top: 10px; background: #080808; }
        th { text-align: left; color: #555; padding: 8px; border-bottom: 1px solid #222; }
        td { padding: 10px 8px; border-bottom: 1px solid #111; }

        /* BOTOES */
        .btn { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; border-radius: 4px; margin-top: 5px; }
        .btn-exp { background: var(--blue); color: #fff; margin-top: 20px; }
        
        /* OPERACIONAL */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .card { background: #0d0d0d; border: 1px solid #222; padding: 25px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--primary); cursor: pointer; }
        .op-box { flex: 1; margin: 20px; border: 2px solid var(--primary); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #flash { position: absolute; width: 100%; height: 100%; background: var(--primary); color: #000; display: none; justify-content: center; align-items: center; font-family: 'Orbitron'; font-size: 25px; border-radius: 18px; z-index: 10; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; font-family: 'Orbitron'; font-size: 10px; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body onload="init()">

<div id="flash">✓ REGISTRADO</div>

<div id="scr-login" class="screen active">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px;">
        <h1 style="font-family:'Orbitron'; color:#151515; font-size:40px; letter-spacing:10px;">JP DIAS</h1>
        <input type="password" id="pass" placeholder="SENHA (9910/1234)">
        <button class="btn" onclick="login()">ENTRAR</button>
    </div>
</div>

<div id="scr-gestor" class="screen">
    <header><span>DASHBOARD MASTER</span> <button onclick="location.reload()" style="color:var(--red); background:none; border:none;">SAIR</button></header>
    <div class="scroll">
        <div class="kpi-row">
            <div class="kpi"><small>TOTAL BIPES</small><b id="k-total">0</b></div>
            <div class="kpi" style="border-left-color: var(--blue);"><small>EQUIPE</small><b id="k-equipe">0</b></div>
        </div>

        <div style="background:#080808; padding:15px; border:1px solid #222; border-radius:8px;">
            <b style="font-size:10px; color:var(--primary); font-family:'Orbitron';">NOVO CADASTRO</b>
            <input type="text" id="fnome" placeholder="NOME DO FUNCIONÁRIO" style="margin-top:10px;">
            <select id="fmod" style="width:100%; padding:12px; background:#000; color:#fff; font-family:'Orbitron'; font-size:10px; margin:10px 0; border:1px solid #333;">
                <option value="Armazém">MÓDULO: ARMAZÉM</option>
                <option value="Crossdock">MÓDULO: CROSSDOCK</option>
            </select>
            <button class="btn" onclick="addFunc()">SALVAR FUNCIONÁRIO</button>
        </div>

        <button class="btn btn-exp" onclick="exportarLista()">📦 GERAR LISTA DE BIPAGEM</button>

        <table id="tbl-bipes">
            <thead><tr><th>HORA</th><th>CÓDIGO</th><th>MÓDULO</th></tr></thead>
            <tbody id="lista-logs"></tbody>
        </table>
    </div>
</div>

<div id="scr-hub" class="screen">
    <header><span>MÓDULOS JP DIAS</span></header>
    <div class="grid">
        <div class="card" onclick="op('ARMAZÉM')"><b>ARMAZÉM</b></div>
        <div class="card" onclick="op('CROSSDOCK')" style="border-color:var(--blue)"><b>CROSSDOCK</b></div>
    </div>
</div>

<div id="scr-exec" class="screen">
    <header><span id="exec-title">---</span> <button onclick="show('scr-hub')" style="color:#555; background:none; border:none;">VOLTAR</button></header>
    <div class="op-box">
        <h2 id="main-val" style="font-family:'Orbitron';">READY</h2>
        <input type="text" id="scanner" style="position:absolute; opacity:0;">
    </div>
    <div style="padding:20px; background:#080808;">
        <input type="text" id="manual" placeholder="BIPE OU DIGITE">
        <button class="btn" onclick="registrar(true)">CONFIRMAR</button>
    </div>
</div>

<script>
    let db = { logs: [], equipe: [] };
    const audio = new (window.AudioContext || window.webkitAudioContext)();

    function init() {
        const salvo = localStorage.getItem('jpdias_v12');
        if(salvo) db = JSON.parse(salvo);
        render();
    }

    function render() {
        document.getElementById('k-total').innerText = db.logs.length;
        document.getElementById('k-equipe').innerText = db.equipe.length;
        const lista = document.getElementById('lista-logs');
        if(lista) {
            lista.innerHTML = db.logs.slice(-10).reverse().map(l => `<tr><td>${l.hora}</td><td>${l.cod}</td><td>${l.mod}</td></tr>`).join('');
        }
        localStorage.setItem('jpdias_v12', JSON.stringify(db));
    }

    function login() {
        const p = document.getElementById('pass').value;
        if(p === "9910") show('scr-gestor');
        else if(p === "1234") show('scr-hub');
        else alert("SENHA INCORRETA");
    }

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function addFunc() {
        const n = document.getElementById('fnome').value.toUpperCase();
        if(n) {
            db.equipe.push({ nome: n, mod: document.getElementById('fmod').value });
            document.getElementById('fnome').value = "";
            render();
            alert("CADASTRADO!");
        }
    }

    function op(t) {
        show('scr-exec');
        document.getElementById('exec-title').innerText = t;
        document.getElementById('scanner').focus();
    }

    function registrar(manual) {
        const input = manual ? document.getElementById('manual') : document.getElementById('scanner');
        const cod = input.value;
        if(cod) {
            const agora = new Date();
            const hora = agora.getHours() + ":" + agora.getMinutes().toString().padStart(2, '0');
            
            db.logs.push({ hora, cod, mod: document.getElementById('exec-title').innerText });
            render();

            const osc = audio.createOscillator(); const g = audio.createGain();
            osc.connect(g); g.connect(audio.destination);
            osc.type = 'square'; osc.frequency.value = 1300;
            g.gain.value = 0.1; osc.start(); osc.stop(audio.currentTime + 0.1);

            document.getElementById('flash').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('flash').style.display = 'none';
                document.getElementById('main-val').innerText = cod;
                input.value = "";
                document.getElementById('scanner').focus();
            }, 400);
        }
    }

    function exportarLista() {
        if(db.logs.length === 0) return alert("LISTA VAZIA");
        let texto = "--- LISTA DE BIPAGEM JP DIAS ---\n\n";
        db.logs.forEach(l => {
            texto += `[${l.hora}] ${l.cod} (${l.mod})\n`;
        });
        
        const blob = new Blob([texto], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `bipagem_jpdias_${new Date().toLocaleDateString()}.txt`;
        a.click();
    }

    document.getElementById('scanner')?.addEventListener('keypress', (e) => { if(e.key === 'Enter') registrar(false); });
    document.getElementById('manual')?.addEventListener('keypress', (e) => { if(e.key === 'Enter') registrar(true); });
</script>
</body>
                       </html>
