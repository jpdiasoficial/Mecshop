<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v102 | JP DIAS ELITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --p: #00ff41; --s: #007aff; --bg: #000; --sf: #0a0a0a; --brd: #1a1a1a; --dg: #ff3b30; --w: #ffae00; --txt: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--txt); font-family: 'Inter', sans-serif; font-size: 11px; height: 100vh; overflow: hidden; text-transform: uppercase; }
        .screen { display: none; height: 100vh; flex-direction: column; background: var(--bg); }
        .active-screen { display: flex !important; }
        header { padding: 15px; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #000; z-index: 10; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px 15px 100px 15px; }
        .card { background: var(--sf); border: 1px solid var(--brd); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        h3 { font-family: 'Orbitron'; font-size: 9px; color: var(--p); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-left: 3px solid var(--p); padding-left: 8px; }
        input, select { width: 100%; padding: 14px; background: #050505; border: 1px solid #222; color: #fff; border-radius: 8px; font-size: 11px; margin-bottom: 10px; font-weight: 700; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: var(--s); color: #fff; }
        .btn-d { background: var(--dg); color: #fff; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .kpi-box { background: #0a0a0a; border: 1px solid #222; padding: 10px 5px; border-radius: 8px; text-align: center; }
        .kpi-box span { font-family: 'Orbitron'; font-size: 14px; color: var(--p); display: block; }
        .audit-table { width: 100%; border-collapse: collapse; font-size: 8px; }
        .audit-table td { padding: 8px 0; border-bottom: 1px solid #111; }
        .bottom-nav { display: flex; background: #000; border-top: 2px solid var(--brd); position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-size: 8px; font-weight: 800; gap: 4px; }
        .active-tab { color: var(--p); border-top: 3px solid var(--p); }
        .scanner-view { width: 100%; background: #000; border-radius: 12px; border: 2px solid var(--p); min-height: 200px; display: none; overflow: hidden; margin-bottom: 10px; }
        .check-item { display: flex; align-items: center; gap: 10px; background: #111; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #222; }
        .check-item.done { border-color: var(--p); background: rgba(0,255,65,0.05); }
        #qrcode-output { display: flex; justify-content: center; padding: 10px; background: #fff; border-radius: 8px; margin: 10px auto; width: fit-content; }
    </style>
</head>
<body onload="inicializarApp()">

    <div id="tela-login" class="screen active-screen" style="justify-content:center; align-items:center; padding:40px;">
        <h1 style="font-family:'Orbitron'; color:var(--p); font-size:32px;">LOG-PRO</h1>
        <p style="color:#444; font-size:9px; margin-bottom:40px;">JP DIAS | INFRAESTRUTURA</p>
        <input type="password" id="pin-acesso" placeholder="SENHA DO SISTEMA" style="text-align:center;">
        <button class="btn btn-p" onclick="realizarLogin()">ENTRAR NO TERMINAL</button>
    </div>

    <div id="tela-shark" class="screen">
        <header><span>DASHBOARD SHARK</span> <button onclick="logout()" class="btn-d" style="width:50px; height:25px; font-size:7px;">SAIR</button></header>
        <div class="scroll-area">
            <div class="kpi-grid">
                <div class="kpi-box"><span id="kpi-ent">0</span><small>ENT</small></div>
                <div class="kpi-box"><span id="kpi-sep" style="color:var(--w)">0</span><small>DOCA</small></div>
                <div class="kpi-box"><span id="kpi-sai" style="color:var(--s)">0</span><small>OUT</small></div>
                <div class="kpi-box"><span id="kpi-ava" style="color:var(--dg)">0</span><small>AVA</small></div>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> LOGS DE AUDITORIA (CLOUD)</h3>
                <div style="max-height: 200px; overflow-y: auto;">
                    <table class="audit-table"><tbody id="tabela-logs-geral"></tbody></table>
                </div>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-box"></i> INVENTÁRIO REAL</h3>
                <div id="lista-estoque-real"></div>
            </div>
        </div>
    </div>

    <div id="tela-operador" class="screen">
        <header><span>TERMINAL OPERADOR</span></header>
        <div class="scroll-area">
            <div class="card">
                <div id="reader-op" class="scanner-view"></div>
                <button class="btn btn-p" id="btn-cam-op" onclick="controleCamera('reader-op','btn-cam-op',false)">ATIVAR SCANNER</button>
            </div>
            
            <div id="doca-conferencia" class="card" style="border-top: 4px solid var(--w);">
                <h3><i class="fa-solid fa-clipboard-check"></i> CONFERÊNCIA DE DOCA</h3>
                <div id="itens-conferencia-doca"></div>
                <button id="btn-gerar-qr-final" class="btn btn-s" style="margin-top:10px; opacity:0.3;" disabled onclick="abrirModalQR()">GERAR PONTE QR</button>
            </div>

            <div id="modal-qr" class="card" style="display:none; text-align:center; border:2px solid var(--p);">
                <div id="qrcode-output"></div>
                <button class="btn btn-d" onclick="fecharModalQR()">FECHAR</button>
            </div>

            <div class="card">
                <select id="op-tipo">
                    <option value="ENTRADA">📥 ENTRADA</option>
                    <option value="SEPARACAO">📦 DOCA (SAÍDA)</option>
                    <option value="AVARIA">⚠️ AVARIA</option>
                </select>
                <input type="text" id="ean-manual" placeholder="DIGITAR EAN/NOME">
                <button class="btn btn-s" onclick="processarBipeManual()">PROCESSAR</button>
                <button class="btn btn-d" style="margin-top:10px; font-size:8px;" onclick="limparSessao()">REDEFINIR DOCA</button>
            </div>
        </div>
    </div>

    <div id="tela-motorista" class="screen">
        <header><span>ROTA & GPS</span></header>
        <div class="scroll-area">
            <div class="card">
                <div id="reader-mot" class="scanner-view"></div>
                <button class="btn btn-s" id="btn-cam-mot" onclick="controleCamera('reader-mot','btn-cam-mot',true)">LER PONTE QR</button>
            </div>
            <div id="rota-container" class="card" style="display:none;">
                <h3>CHECKLIST DE ENTREGA</h3>
                <div id="rota-itens-check"></div>
                <p id="mot-gps-status" style="font-size:8px; color:var(--w); margin:10px 0;"></p>
                <button id="btn-entrega-final" class="btn btn-p" onclick="finalizarEntrega()" disabled style="opacity:0.3;">CONFIRMAR (GPS)</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="nav-main" style="display:none;">
        <div class="nav-item active-tab" onclick="navegar('tela-shark', this)"><i class="fa-solid fa-chart-line"></i>SHARK</div>
        <div class="nav-item" onclick="navegar('tela-operador', this)"><i class="fa-solid fa-boxes-stacked"></i>DOCA</div>
        <div class="nav-item" onclick="navegar('tela-motorista', this)"><i class="fa-solid fa-truck"></i>ROTA</div>
    </nav>

    <script>
        // ESTADOS DO SISTEMA
        let logs = JSON.parse(localStorage.getItem('L_V102') || '[]');
        let produtos = JSON.parse(localStorage.getItem('P_V102') || {});
        let docaItems = JSON.parse(localStorage.getItem('D_V102') || '[]');
        let html5QrCode, isCameraOpen = false, gpsCoords = "";

        // ÁUDIO FEEDBACK
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function bip(t) {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = t==='ok'?800:200; g.gain.value = 0.1;
            o.start(); o.stop(audioCtx.currentTime + (t==='ok'?0.1:0.3));
        }

        // INICIALIZAÇÃO
        function inicializarApp() { renderTudo(); renderDoca(); }
        function realizarLogin() { bip('ok'); document.getElementById('tela-login').classList.remove('active-screen'); document.getElementById('nav-main').style.display = 'flex'; navegar('tela-shark', document.querySelector('.nav-item')); }

        function navegar(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-screen');
            el.classList.add('active-tab');
            if(isCameraOpen) controleCamera(null, null, null);
        }

        // LÓGICA DO OPERADOR (BASEADA NO SEU CÓDIGO ORIGINAL + DOCA)
        function handleOperador(c) {
            let nome = produtos[c] || prompt("NOME DO PRODUTO:");
            if(!nome) return;
            produtos[c] = nome; localStorage.setItem('P_V102', JSON.stringify(produtos));
            let tipo = document.getElementById('op-tipo').value;
            let q = prompt(`QUANTIDADE [${tipo}]:`, "1");
            if(!q) return;

            bip('ok');
            if(tipo === 'SEPARACAO') {
                docaItems.unshift({ id: Date.now(), nome, q: parseInt(q), conferido: false });
                localStorage.setItem('D_V102', JSON.stringify(docaItems));
                renderDoca();
            } else {
                registrarLog('OP', tipo, `${nome} | QTD: ${q}`);
            }
            renderTudo();
        }

        function renderDoca() {
            let h = "";
            docaItems.forEach(i => {
                h += `<div class="check-item ${i.conferido?'done':''}" onclick="checkDoca(${i.id})">
                    <i class="fa-solid ${i.conferido?'fa-check-circle':'fa-circle'}"></i>
                    <span>${i.nome} (x${i.q})</span>
                </div>`;
            });
            document.getElementById('itens-conferencia-doca').innerHTML = h || "DOCA VAZIA";
            let pronto = docaItems.length > 0 && docaItems.every(i => i.conferido);
            let btn = document.getElementById('btn-gerar-qr-final');
            btn.disabled = !pronto; btn.style.opacity = pronto ? "1" : "0.3";
        }

        function checkDoca(id) { bip('ok'); docaItems = docaItems.map(i => i.id === id ? {...i, conferido:!i.conferido} : i); localStorage.setItem('D_V102', JSON.stringify(docaItems)); renderDoca(); }

        function abrirModalQR() {
            document.getElementById('modal-qr').style.display = 'block';
            document.getElementById('qrcode-output').innerHTML = "";
            let data = "JP_ELITE:" + docaItems.map(i => `${i.nome} x${i.q}`).join('#');
            new QRCode(document.getElementById("qrcode-output"), { text: data, width: 160, height: 160 });
            docaItems.forEach(i => registrarLog('OP', 'SEPARACAO', `${i.nome} | QTD: ${i.q}`));
            bip('ok');
        }

        // LÓGICA DO SHARK (AUDITORIA)
        function registrarLog(origem, acao, detalhes) {
            logs.unshift({ hora: new Date().toLocaleTimeString(), origem, acao, detalhes });
            localStorage.setItem('L_V102', JSON.stringify(logs.slice(0,500)));
            renderTudo();
            // Aqui você pode adicionar o seu script original para enviar ao Google Sheets se desejar
        }

        function renderTudo() {
            let ent=0, sep=0, sai=0, ava=0, estoque={}, hLogs="";
            logs.forEach(l => {
                let q = parseInt(l.detalhes.split('QTD: ')[1]) || 0;
                let n = l.detalhes.split(' |')[0];
                if(l.acao==='ENTRADA') { ent+=q; estoque[n]=(estoque[n]||0)+q; }
                if(l.acao==='SEPARACAO') { sep+=q; estoque[n]=(estoque[n]||0)-q; }
                if(l.acao==='AVARIA') { ava+=q; estoque[n]=(estoque[n]||0)-q; }
                if(l.acao==='ENTREGA') sai++;
                hLogs += `<tr><td style="color:#444">${l.hora}</td><td><b style="color:var(--p)">${l.acao}</b></td><td>${l.detalhes}</td></tr>`;
            });
            document.getElementById('tabela-logs-geral').innerHTML = hLogs;
            document.getElementById('kpi-ent').innerText = ent; document.getElementById('kpi-sep').innerText = sep;
            document.getElementById('kpi-sai').innerText = sai; document.getElementById('kpi-ava').innerText = ava;
            let hEst = "";
            for(let p in estoque) if(estoque[p]>0) hEst += `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #111;"><span>${p}</span><b>${estoque[p]}</b></div>`;
            document.getElementById('lista-estoque-real').innerHTML = hEst || "VAZIO";
        }

        // LÓGICA DO MOTORISTA (ROTA)
        let cargaMot = [];
        function handleMotorista(c) {
            if(c.startsWith("JP_ELITE:")) {
                bip('ok');
                cargaMot = c.replace("JP_ELITE:","").split('#').map((d,idx) => ({id:idx, d, done:false}));
                document.getElementById('rota-container').style.display = 'block';
                renderRotaMot();
                navigator.geolocation.getCurrentPosition(p => {
                    gpsCoords = p.coords.latitude + "," + p.coords.longitude;
                    document.getElementById('mot-gps-status').innerText = "📍 GPS LOCALIZADO";
                    checkLiberaMot();
                });
            }
        }

        function renderRotaMot() {
            let h = "";
            cargaMot.forEach(i => {
                h += `<div class="check-item ${i.done?'done':''}" onclick="checkMot(${i.id})">
                    <i class="fa-solid ${i.done?'fa-check-square':'fa-square'}"></i> <span>${i.d}</span>
                </div>`;
            });
            document.getElementById('rota-itens-check').innerHTML = h;
        }

        function checkMot(id) { bip('ok'); cargaMot[id].done = !cargaMot[id].done; renderRotaMot(); checkLiberaMot(); }
        function checkLiberaMot() {
            let ok = cargaMot.every(i => i.done) && gpsCoords !== "";
            let b = document.getElementById('btn-entrega-final');
            b.disabled = !ok; b.style.opacity = ok ? "1" : "0.3";
        }

        function finalizarEntrega() {
            bip('ok');
            registrarLog('MOT', 'ENTREGA', `GPS: ${gpsCoords}`);
            alert("SUCESSO: CARGA BAIXADA NO SISTEMA!");
            document.getElementById('rota-container').style.display = 'none';
        }

        // AUXILIARES
        function processarBipeManual() { let e = document.getElementById('ean-manual').value; if(e) handleOperador(e); document.getElementById('ean-manual').value = ""; }
        function limparSessao() { if(confirm("LIMPAR DOCA?")) { docaItems=[]; localStorage.removeItem('D_V102'); renderDoca(); } }
        function logout() { location.reload(); }
        function fecharModalQR() { document.getElementById('modal-qr').style.display = 'none'; }
        
        function controleCamera(div, btn, isMot) {
            if(!isCameraOpen && div) {
                document.getElementById(div).style.display = 'block';
                html5QrCode = new Html5Qrcode(div);
                html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, c => isMot ? handleMotorista(c) : handleOperador(c));
                document.getElementById(btn).innerText = "DESLIGAR CÂMERA"; isCameraOpen = true;
            } else if (isCameraOpen) {
                html5QrCode.stop().then(() => { 
                    document.querySelectorAll('.scanner-view').forEach(v=>v.style.display='none'); 
                    document.querySelectorAll('[id^="btn-cam"]').forEach(b=>b.innerText="ATIVAR SCANNER");
                    isCameraOpen = false; 
                });
            }
        }
    </script>
</body>
</html>
