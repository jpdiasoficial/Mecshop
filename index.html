<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SERGEL | Shark Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ea1d2c; --bg: #ffffff; --light-gray: #f2f2f2; --text-main: #3e3e3e; --green: #2e7d32; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); margin: 0; color: var(--text-main); padding-bottom: 120px; }

        /* HEADER */
        header { padding: 15px; position: sticky; top: 0; background: #fff; z-index: 100; border-bottom: 1px solid #eee; }
        .loja-call { font-size: 13px; color: #888; font-weight: 600; text-transform: uppercase; display: block; text-align: center; }
        .trigger-dot { position: absolute; right: 20px; top: 15px; color: #eee; cursor: pointer; padding: 5px; font-size: 20px; }

        /* BUSCA */
        .search-container { background: var(--light-gray); border-radius: 10px; display: flex; align-items: center; padding: 10px 15px; margin: 10px 15px; }
        .search-container input { border: none; background: none; width: 100%; outline: none; font-size: 14px; }

        /* CATEGORIAS (BOLINHAS) */
        .cat-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 15px; scrollbar-width: none; }
        .cat-circle { min-width: 75px; display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: 0.5; cursor: pointer; }
        .cat-circle img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--red); object-fit: cover; padding: 2px; background: #fff; }
        .cat-circle span { font-size: 10px; font-weight: 700; text-align: center; text-transform: uppercase; }
        .cat-circle.active { opacity: 1; transform: scale(1.05); }

        /* LISTA DE PRODUTOS */
        .container { padding: 0 15px; }
        .item-card { display: flex; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #f2f2f2; gap: 15px; align-items: center; }
        .item-info { flex: 1; }
        .item-info b { font-size: 15px; display: block; color: #000; text-transform: uppercase; }
        .price-varejo { font-size: 16px; font-weight: 700; color: #333; }
        .price-atacado { font-size: 11px; color: var(--green); font-weight: 600; display: block; }
        .prod-img { width: 85px; height: 85px; border-radius: 12px; object-fit: cover; }

        /* BOTÕES */
        .action-box { min-width: 110px; display: flex; justify-content: flex-end; }
        .btn-add-main { border: 1px solid #eee; background: #fff; color: var(--red); padding: 8px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .counter-box { display: flex; align-items: center; border: 1.5px solid var(--red); border-radius: 8px; background: #fff; }
        .btn-qty { border: none; background: none; color: var(--red); padding: 5px 12px; font-size: 20px; font-weight: bold; cursor: pointer; }

        /* FOOTER */
        .footer-bar { position: fixed; bottom: 0; width: 100%; background: #fff; padding: 15px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; z-index: 500; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        .btn-finalizar { background: var(--red); color: #fff; border: none; padding: 14px 35px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; }

        /* ADMIN & LOGIN */
        #login-area { display: none; background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #eee; }
        #panel-admin { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 3000; padding: 20px; overflow-y: auto; }
        .admin-card { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        
        /* MODAL CHECKOUT */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; }
        .modal-content { position: absolute; bottom: 0; background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 25px; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body onload="init()">

<header>
    <div class="trigger-dot" onclick="mostrarLogin()">...</div>
    <span class="loja-call">Faça seu pedido abaixo</span>
</header>

<div id="login-area">
    <input type="password" id="pass-shk" placeholder="SENHA ACESSO" oninput="checarSenha(this.value)" style="width:150px; text-align:center;">
</div>

<div class="search-container">
    <input type="text" id="buscador" placeholder="O que você deseja hoje?" oninput="renderLoja()">
</div>

<div class="cat-scroll" id="cat-lista"></div>
<div class="container" id="lista-produtos"></div>

<div class="footer-bar">
    <div><small style="color:#888; text-transform:uppercase; font-size:10px;">Subtotal</small><br><b id="total-final" style="font-size:20px;">R$ 0,00</b></div>
    <button class="btn-finalizar" onclick="abrirCheckout()">Finalizar</button>
</div>

<div class="modal" id="modal-checkout">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="margin:0">Fechar Pedido</h2>
            <b onclick="fecharCheckout()" style="color:#999; cursor:pointer;">X</b>
        </div>
        <input type="text" id="cliente-nome" placeholder="Seu Nome completo">
        <div id="revisao-pedido" style="margin:15px 0; border-top:1px solid #eee; padding-top:10px;"></div>
        <button class="btn-finalizar" style="width:100%" onclick="enviarWhatsApp()">ENVIAR PARA WHATSAPP</button>
    </div>
</div>

<div id="panel-admin">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="color:var(--red); margin:0;">GESTOR SHARK</h2>
        <button onclick="fecharAdmin()" style="padding:10px 15px; background:#333; color:#fff; border:none; border-radius:8px;">SAIR</button>
    </div>

    <div class="admin-card">
        <b>IMPORTAR EM MASSA (NOMES)</b>
        <textarea id="import-area" style="height:80px;" placeholder="Cole aqui a lista de nomes da planilha..."></textarea>
        <button onclick="importarMassa()" style="width:100%; background:var(--red); color:#fff; border:none; padding:12px; border-radius:8px; font-weight:700;">SUBIR LISTA</button>
    </div>

    <div class="admin-card">
        <b>CRIAR CATEGORIA (BOLINHA)</b>
        <input type="text" id="c-nome" placeholder="Nome da Categoria">
        <input type="text" id="c-img" placeholder="URL da Imagem (Picolé, Pote, etc)">
        <button onclick="addCat()" style="width:100%; background:#333; color:#fff; border:none; padding:10px; border-radius:8px;">ADICIONAR BOLINHA</button>
    </div>

    <div id="lista-adm-itens"></div>
</div>

<script>
    let db = {
        cats: JSON.parse(localStorage.getItem('shk_cats_v4')) || [{nome:'Tudo', img:'https://cdn-icons-png.flaticon.com/512/1814/1814400.png'}],
        prods: JSON.parse(localStorage.getItem('shk_prods_v4')) || []
    };
    let car = {}; let catAtiva = 'Tudo';

    function init() { renderCats(); renderLoja(); renderAdmin(); }

    function mostrarLogin() { 
        let a = document.getElementById('login-area');
        a.style.display = (a.style.display === 'block') ? 'none' : 'block';
    }

    function checarSenha(v) { 
        if(v === "9910") { 
            document.getElementById('panel-admin').style.display='block'; 
            document.getElementById('login-area').style.display='none'; 
            document.getElementById('pass-shk').value = '';
        } 
    }

    function renderCats() {
        document.getElementById('cat-lista').innerHTML = db.cats.map(c => `
            <div class="cat-circle ${catAtiva === c.nome ? 'active' : ''}" onclick="catAtiva='${c.nome}';renderCats();renderLoja();">
                <img src="${c.img || 'https://via.placeholder.com/60'}">
                <span>${c.nome}</span>
            </div>`).join('');
    }

    function renderLoja() {
        let b = document.getElementById('buscador').value.toLowerCase();
        let f = db.prods.filter(p => p.on && (catAtiva === 'Tudo' || p.cat === catAtiva) && p.nome.toLowerCase().includes(b));
        
        document.getElementById('lista-produtos').innerHTML = f.map(p => {
            let q = car[p.id] || 0;
            return `
            <div class="item-card">
                <div class="item-info">
                    <b>${p.nome}</b>
                    <span class="price-varejo">R$ ${p.preco.toFixed(2).replace('.',',')}</span>
                    ${p.qAtac > 0 ? `<span class="price-atacado">Atacado: R$ ${p.atac.toFixed(2)} (+${p.qAtac} un)</span>` : ''}
                </div>
                ${p.img ? `<img src="${p.img}" class="prod-img">` : ''}
                <div class="action-box">
                    ${q === 0 ? `<button class="btn-add-main" onclick="add(${p.id},1)">ADICIONAR</button>` : 
                    `<div class="counter-box"><button class="btn-qty" onclick="add(${p.id},-1)">-</button><span style="font-weight:700">${q}</span><button class="btn-qty" onclick="add(${p.id},1)">+</button></div>`}
                </div>
            </div>`;
        }).join('');
    }

    function add(id, v) { car[id] = (car[id] || 0) + v; if(car[id] <= 0) delete car[id]; renderLoja(); calc(); }
    function calc() {
        let t = 0;
        for(let id in car) {
            let p = db.prods.find(x => x.id == id);
            let preco = (p.qAtac > 0 && car[id] >= p.qAtac) ? p.atacado : p.preco;
            t += preco * car[id];
        }
        document.getElementById('total-final').innerText = `R$ ${t.toFixed(2).replace('.',',')}`;
    }

    function abrirCheckout() {
        if(Object.keys(car).length === 0) return alert("Seu carrinho está vazio!");
        document.getElementById('modal-checkout').style.display = 'block';
        let h = "";
        for(let id in car) {
            let p = db.prods.find(x => x.id == id);
            h += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${car[id]}x ${p.nome}</span><b>R$ ${((p.qAtac > 0 && car[id] >= p.qAtac ? p.atacado : p.preco) * car[id]).toFixed(2)}</b></div>`;
        }
        document.getElementById('revisao-pedido').innerHTML = h;
    }
    function fecharCheckout() { document.getElementById('modal-checkout').style.display = 'none'; }

    function importarMassa() {
        let n = document.getElementById('import-area').value.split('\n');
        n.forEach(l => { if(l.trim()) db.prods.push({id: Date.now()+Math.random(), nome: l.trim().toUpperCase(), preco: 0, atacado: 0, qAtac: 0, cat: 'Tudo', on: false, img: ''}); });
        salvar(); renderAdmin(); alert("Importado!");
    }

    function addCat() {
        let n = document.getElementById('c-nome').value.toUpperCase();
        let i = document.getElementById('c-img').value;
        if(n) { db.cats.push({nome: n, img: i}); salvar(); renderCats(); renderAdmin(); }
    }

    function renderAdmin() {
        document.getElementById('lista-adm-itens').innerHTML = db.prods.map(p => `
            <div class="admin-card" style="font-size:12px;">
                <b>${p.nome}</b>
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <input type="number" step="0.01" value="${p.preco}" placeholder="Varejo" onchange="p_up(${p.id},'preco',this.value)" style="width:70px;">
                    <input type="number" step="0.01" value="${p.atacado}" placeholder="Atac" onchange="p_up(${p.id},'atacado',this.value)" style="width:70px;">
                    <select onchange="p_up(${p.id},'cat',this.value)" style="flex:1">${db.cats.map(c => `<option ${p.cat===c.nome?'selected':''}>${c.nome}</option>`).join('')}</select>
                    <button onclick="p_up(${p.id},'on',!${p.on});renderAdmin();renderLoja();" style="background:${p.on?'#4CAF50':'#ccc'}; color:#fff; border:none; border-radius:5px; padding:0 10px;">${p.on?'ON':'OFF'}</button>
                    <button onclick="db.prods=db.prods.filter(x=>x.id!=${p.id});salvar();renderAdmin();" style="border:none; background:none;">🗑️</button>
                </div>
            </div>`).join('');
    }

    function p_up(id, f, v) { let p = db.prods.find(x=>x.id==id); p[f] = (f==='on' || f==='cat') ? v : parseFloat(v); salvar(); }
    function salvar() { 
        localStorage.setItem('shk_prods_v4', JSON.stringify(db.prods)); 
        localStorage.setItem('shk_cats_v4', JSON.stringify(db.cats));
    }
    function fecharAdmin() { document.getElementById('panel-admin').style.display='none'; }

    function enviarWhatsApp() {
        let n = document.getElementById('cliente-nome').value; if(!n) return alert("Seu nome?");
        let msg = `🍦 *NOVO PEDIDO SERGEL*\n👤 *CLIENTE:* ${n.toUpperCase()}\n\n*PEDIDO:*\n`;
        for(let id in car) { let p = db.prods.find(x=>x.id==id); msg += `• ${car[id]}x ${p.nome}\n`; }
        msg += `\n💰 *TOTAL: ${document.getElementById('total-final').innerText}*`;
        window.open(`https://wa.me/5519994750657?text=${encodeURIComponent(msg)}`);
    }
</script>
</body>
</html>
