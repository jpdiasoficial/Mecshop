<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK V45 GOLD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card: #121212; --text: #fff; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; }

        .screen { display: none; height: 100vh; padding: 20px; flex-direction: column; overflow-y: auto; padding-bottom: 100px; }
        .active { display: flex; animation: fadeIn 0.3s ease; }

        /* --- LOGIN (IMAGEM 4805) --- */
        .auth-container { justify-content: center; align-items: center; }
        .logo-text { font-size: 35px; font-weight: 900; color: var(--primary); margin-bottom: 40px; letter-spacing: 2px; }
        .input-group { width: 100%; max-width: 320px; margin-bottom: 15px; }
        input { width: 100%; padding: 18px; background: #111; border: 1px solid #333; color: #fff; border-radius: 12px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn-login { width: 100%; max-width: 320px; background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        /* --- DASHBOARD (IMAGEM 4803/4806) --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; background: #002b1a; border: 2px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: bold; }
        
        .balance-box { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #222; }
        .blur { filter: blur(10px); }
        .btn-extrato { width: 100%; background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 12px; border-radius: 12px; margin-top: 15px; font-weight: 600; }

        /* GRID COM ÍCONES REAIS (O QUE FALTAVA) */
        .grid-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 30px 0; }
        .action-card { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; color: #888; }
        .icon-circle { width: 60px; height: 60px; background: #1a1a1a; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--primary); }

        /* CARD BLACK */
        .card-black { background: linear-gradient(145deg, #1a1a1a, #000); border-radius: 20px; padding: 25px; border: 1px solid #333; height: 180px; position: relative; margin-top: 10px; }
        .chip { width: 40px; height: 30px; background: #333; border-radius: 5px; position: absolute; right: 25px; bottom: 25px; }

        /* MENU INFERIOR (IMAGEM 4806) */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav-item { color: #555; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: var(--primary); }
        .nav-item.exit { color: var(--danger); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="scr-auth" class="screen active auth-container">
        <div class="logo-text">MEC-BANK</div>
        <div class="input-group">
            <input type="text" id="user" placeholder="Usuário Master ou Cliente">
        </div>
        <div class="input-group">
            <input type="password" id="pass" placeholder="Sua senha">
        </div>
        <button class="btn-login" onclick="login()">Acessar Conta</button>
    </div>

    <div id="scr-home" class="screen">
        <header class="header">
            <div class="profile">
                <div class="avatar" id="av">J</div>
                <span id="name" style="font-weight: 800;">Jp</span>
            </div>
            <i class="fa-solid fa-bell" style="color: var(--primary); font-size: 20px;"></i>
        </header>

        <div class="balance-box">
            <small style="color: #666;">Saldo em conta <i class="fa-solid fa-eye" onclick="document.getElementById('bal').classList.toggle('blur')"></i></small>
            <div id="bal" class="blur" style="font-size: 32px; font-weight: 800; margin: 10px 0;">R$ 145.850,90</div>
            <button class="btn-extrato">Ver Extrato Detalhado</button>
        </div>

        <div class="grid-actions">
            <div class="action-card"><div class="icon-circle"><i class="fa-solid fa-qrcode"></i></div><span>Pix</span></div>
            <div class="action-card"><div class="icon-circle"><i class="fa-solid fa-barcode"></i></div><span>Pagar</span></div>
            <div class="action-card"><div class="icon-circle"><i class="fa-solid fa-money-bill-transfer"></i></div><span>Transf.</span></div>
            <div class="action-card"><div class="icon-circle"><i class="fa-solid fa-mobile-screen"></i></div><span>Recarga</span></div>
            <div class="action-card"><div class="icon-circle"><i class="fa-solid fa-hand-holding-dollar"></i></div><span>Empréstimo</span></div>
            <div class="action-card"><div class="icon-circle"><i class="fa-solid fa-shield-heart"></i></div><span>Seguros</span></div>
            <div class="action-card"><div class="icon-circle"><i class="fa-solid fa-gift"></i></div><span>Mimos</span></div>
            <div class="action-card"><div class="icon-circle"><i class="fa-solid fa-circle-question"></i></div><span>Ajuda</span></div>
        </div>

        <div class="card-black">
            <small style="color: var(--primary); font-weight: bold; letter-spacing: 2px;">SHARK PLATINUM</small>
            <div style="margin-top: 40px; font-size: 20px; letter-spacing: 4px;">•••• •••• •••• 8835</div>
            <div style="position: absolute; bottom: 25px;">
                <small style="color: #666; display: block;">Limite</small>
                <strong>R$ 50.000,00</strong>
            </div>
            <div class="chip"></div>
        </div>
    </div>

    <div id="scr-master" class="screen">
        <h2 style="color: var(--primary);">Shark Control Panel</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div class="balance-box" style="padding: 15px;">SALDO TOTAL<br><h3>R$ 1.450.850</h3></div>
            <div class="balance-box" style="padding: 15px;">CONTAS<br><h3>842</h3></div>
        </div>
        <div class="balance-box" style="border: 2px dashed var(--primary); text-align: center; background: rgba(0,255,136,0.05);">
            <i class="fa-solid fa-file-excel" style="font-size: 30px; color: var(--primary);"></i>
            <p>SUBIR PLANILHA (XLSX)</p>
        </div>
        <button class="btn-login" style="background: #111; color: var(--primary); border: 1px solid var(--primary); margin-top: 20px; width: 100%;">GERAR RELATÓRIO</button>
        <button class="btn-login" style="background: var(--danger); color: #fff; margin-top: 10px; width: 100%;">BLOQUEIO GERAL</button>
    </div>

    <nav class="nav-bar" id="nb" style="display: none;">
        <div class="nav-item active" onclick="tab('scr-home')"><i class="fa-solid fa-house"></i>Início</div>
        <div class="nav-item"><i class="fa-solid fa-list-ul"></i>Extrato</div>
        <div class="nav-item"><i class="fa-solid fa-credit-card"></i>Cartões</div>
        <div class="nav-item"><i class="fa-solid fa-headset"></i>Suporte</div>
        <div class="nav-item exit" onclick="location.reload()"><i class="fa-solid fa-power-off"></i>Sair</div>
    </nav>

    <script>
        function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            
            if(!u || !p) return alert("Preencha usuário e senha!");

            document.getElementById('scr-auth').classList.remove('active');
            
            if(u.toLowerCase() === 'shark') {
                document.getElementById('scr-master').classList.add('active');
            } else {
                document.getElementById('name').innerText = u;
                document.getElementById('av').innerText = u[0].toUpperCase();
                document.getElementById('scr-home').classList.add('active');
                document.getElementById('nb').style.display = 'flex';
            }
        }

        function tab(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
