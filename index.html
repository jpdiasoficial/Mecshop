<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO | JP TECNOLOGIA</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --border: #222; --out: #ff3b30; --in: #00d4ff; --sep: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; font-size: 10px; height: 100vh; overflow: hidden; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; background: #000; }
        .active { display: flex !important; }
        
        header { padding: 12px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #050505; }
        .scroll { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 150px; }
        
        h3 { font-family: 'Orbitron'; color: var(--primary); font-size: 10px; margin: 15px 0 8px 0; border-left: 3px solid var(--primary); padding-left: 8px; }

        .table-wrapper { border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; background: #080808; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #111; color: #555; padding: 10px; text-align: left; font-size: 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
        td { padding: 8px 10px; border-bottom: 1px solid #151515; white-space: nowrap; }

        .fab-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .fab { width: 55px; height: 55px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,65,0.3); }
        
        .btn-green { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 4px; cursor: pointer; }
        .btn-outline { background: none; border: 1px solid #444; color: #888; padding: 5px 10px; font-size: 8px; border-radius: 3px; cursor: pointer; }
        
        input, select, textarea { width: 100%; padding: 14px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: 'Orbitron'; margin-bottom: 10px; box-sizing: border-box; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid #222; }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active" style="align-items:center; justify-content:center; text-align:center;">
    <div style="font-family:'Orbitron'; color:var(--primary); font-size:35px;">LOG-PRO</div>
    <div style="font-size:7px; color:#444; margin-bottom:40px;">SISTEMA JP TECNOLOGIA</div>
    <div style="width: 85%; max-width: 320px;">
        <input type="text" id="user-name" placeholder="USUÁRIO">
        <input type="password" id="pass" placeholder="CHAVE">
        <button class="btn-green" onclick="auth()">ACESSAR TERMINAL</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header>
        <span style="color:var(--primary)">MASTER: JP</span> 
        <div style="display:flex; gap:10px;">
            <button class="btn-outline" onclick="resetTotal()">RESET</button>
            <button class="btn-outline" style="border-color:var(--out); color:var(--out);" onclick="logout()">SAIR</button>
        </div>
    </header>
    <div class="scroll">
        <h3>📡 AUDITORIA EM TEMPO REAL</h3>
        <div class="table-wrapper"><table><thead><tr><th>HORA</th><th>OP</th><th>AÇÃO</th><th>ITEM</th><th>QTD</th></tr></thead><tbody id="audit-body"></tbody></table></div>

        <h3>📦 INVENTÁRIO GLOBAL</h3>
        <div class="table-wrapper"><table><thead><tr><th>CÓDIGO</th><th>PRODUTO</th><th style="background:#002200; color:var(--primary);">SALDO</th><th>IN</th><th>SEP</th><th>OUT</th></tr></thead><tbody id="stock-body"></tbody></table></div>
    </div>
    <div class="fab-container">
        <button class="fab" style="background:var(--in)" onclick="atualizarTabelas()">🔄</button>
        <button class="fab" style="background:var(--primary)" onclick="ir('scr-config')">➕</button>
        <button class="fab" style="background:#fff" onclick="exportarCSV()">📊</button>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span id="display-user">OP: ---</span> <button onclick="logout()" style="color:var(--out); background:none; border:none; font-size:8px;">DESLOGAR</button></header>
    <div class="scroll">
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <select id="mod-op" style="flex:2;">
                <option value="IN">📥 ENTRADA / CADASTRO</option>
                <option value="SEP">📦 SEPARAÇÃO</option>
                <option value="OUT">📤 SAÍDA FINAL</option>
            </select>
            <input type="number" id="qtd-bipe" value="1" style="flex:0.6; text-align:center;">
        </div>
        <div id="reader"></div>
        <div id="feedback-op" style="background:#0a0a0a; border:1px solid var(--primary); padding:15px; margin-top:10px; display:none; border-radius:8px;">
            <b id="res-nome" style="font-size:16px; color:var(--primary);">---</b><br>
            <small>CÓDIGO: <b id="res-cod">---</b> | ESTOQUE: <b id="res-est">0</b></small>
        </div>
        <button class="btn-green" id="btn-cam" onclick="toggleCamera()" style="margin-top:10px;">ATIVAR SCANNER V30</button>
    </div>
</div>

<div id="scr-config" class="screen">
    <header><span>PAINEL DE CONTROLE</span> <button onclick="ir('scr-shark')">VOLTAR</button></header>
    <div class="scroll">
        <h3>👥 CADASTRAR OPERADORES (NOME, CHAVE)</h3>
        <textarea id="op-area" placeholder="TALITA, 1234&#10;SHARK, 9910" style="height:120px;"></textarea>
        
        <h3>📦 IMPORTAR PRODUTOS (CÓDIGO, NOME)</h3>
        <textarea id="import-area" placeholder="789001, TECLADO RGB" style="height:250px;"></textarea>
        
        <button class="btn-green" onclick="salvarConfig()">SALVAR TODAS AS ALTERAÇÕES</button>
    </div>
</div>

<script>
    const canal = new BroadcastChannel('logpro_jp_v62');
    let BASE = JSON.parse(localStorage.getItem('LP_BASE')) || {};
    let MOVS = JSON.parse(localStorage.getItem('LP_MOVS')) || [];
    let OPERADORES = JSON.parse(localStorage.getItem('LP_USERS')) || {"JP":"9910", "SHARK":"9910", "OP":"1234"};
    let currentUser = "", scanner, camOn = false, isLocked = false;

    function auth() {
        const u = document.getElementById('user-name').value.toUpperCase().trim();
        const p = document.getElementById('pass').value.trim();
        if(!u || !p) return alert("PREENCHA TUDO");
        
        if(OPERADORES[u] === p) {
            currentUser = u;
            if(p === "9910") ir('scr-shark'); else { document.getElementById('display-user').innerText = "OP: " + currentUser; ir('scr-op'); }
        } else alert("USUÁRIO OU CHAVE INVÁLIDA");
    }

    function logout() { currentUser = ""; ir('scr-login'); }

    function ir(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'scr-shark') atualizarTabelas();
        if(id === 'scr-config') {
            document.getElementById('op-area').value = Object.entries(OPERADORES).map(([k,v]) => `${k}, ${v}`).join('\n');
        }
    }

    function salvarConfig() {
        // Salvar Operadores
        let novosOps = {};
        document.getElementById('op-area').value.split('\n').forEach(l => {
            const d = l.split(','); if(d[0] && d[1]) novosOps[d[0].trim().toUpperCase()] = d[1].trim();
        });
        OPERADORES = novosOps;
        localStorage.setItem('LP_USERS', JSON.stringify(OPERADORES));

        // Salvar Produtos
        document.getElementById('import-area').value.split('\n').forEach(l => {
            const d = l.split(','); if(d[0] && d[1]) BASE[d[0].trim()] = d[1].trim().toUpperCase();
        });
        localStorage.setItem('LP_BASE', JSON.stringify(BASE));
        
        alert("SISTEMA ATUALIZADO PELO MASTER!");
        ir('scr-shark');
    }

    function processar(cod) {
        if(isLocked) return;
        isLocked = true;
        let c = cod.trim();
        if(!BASE[c]) { BASE[c] = "NOVO: " + c; localStorage.setItem('LP_BASE', JSON.stringify(BASE)); }
        
        const modo = document.getElementById('mod-op').value;
        const q = parseInt(document.getElementById('qtd-bipe').value) || 1;
        MOVS.unshift({ cod: c, n: BASE[c], m: modo, q, d: new Date().toLocaleTimeString(), u: currentUser });
        localStorage.setItem('LP_MOVS', JSON.stringify(MOVS));

        document.getElementById('feedback-op').style.display = 'block';
        document.getElementById('res-nome').innerText = BASE[c];
        document.getElementById('res-cod').innerText = c;
        let saldo = 0; MOVS.filter(m => m.cod === c).forEach(m => {
            if(m.m === 'IN') saldo += m.q; else saldo -= m.q;
        });
        document.getElementById('res-est').innerText = saldo;
        canal.postMessage('sync');
        setTimeout(() => { isLocked = false; }, 600);
    }

    function atualizarTabelas() {
        document.getElementById('audit-body').innerHTML = MOVS.slice(0, 15).map(m => `
            <tr><td>${m.d}</td><td style="color:var(--primary)">${m.u}</td><td>${m.m}</td><td>${m.n}</td><td>${m.q}</td></tr>
        `).join('');

        let r = {};
        Object.keys(BASE).forEach(k => r[k] = { n: BASE[k], ent:0, sep:0, sai:0, sal:0 });
        MOVS.forEach(m => {
            if(r[m.cod]) {
                if(m.m === 'IN') { r[m.cod].ent += m.q; r[m.cod].sal += m.q; }
                else if(m.m === 'SEP') { r[m.cod].sep += m.q; r[m.cod].sal -= m.q; }
                else if(m.m === 'OUT') { r[m.cod].sai += m.q; r[m.cod].sal -= m.q; }
            }
        });
        document.getElementById('stock-body').innerHTML = Object.keys(r).map(k => `
            <tr><td>${k}</td><td><b>${r[k].n}</b></td><td style="color:var(--primary); font-weight:900;">${r[k].sal}</td><td>${r[k].ent}</td><td>${r[k].sep}</td><td>${r[k].sai}</td></tr>
        `).join('');
    }

    function exportarCSV() {
        let c = "HORA,OP,ITEM,ACAO,QTD\n" + MOVS.map(m=>`${m.d},${m.u},${m.n},${m.m},${m.q}`).join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], {type:'text/csv'}));
        a.download = 'RELATORIO_JP.csv'; a.click();
    }

    function resetTotal() { if(confirm("LIMPAR TUDO?")) { localStorage.clear(); location.reload(); } }

    async function toggleCamera() {
        if(!camOn) {
            if(!scanner) scanner = new Html5Qrcode("reader");
            await scanner.start({ facingMode: "environment" }, { fps: 26, qrbox: 250 }, (t) => processar(t));
            camOn = true; document.getElementById('btn-cam').innerText = "FECHAR";
        } else { await scanner.stop(); camOn = false; document.getElementById('btn-cam').innerText = "ABRIR SCANNER"; }
    }

    canal.onmessage = () => { 
        MOVS = JSON.parse(localStorage.getItem('LP_MOVS')) || []; 
        BASE = JSON.parse(localStorage.getItem('LP_BASE')) || []; 
        if(document.querySelector('#scr-shark.active')) atualizarTabelas(); 
    };
    function init() { }
</script>
</body>
</html>
