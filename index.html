<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO XMS v82 | CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { --p: #00ff41; --bg: #000000; --card: #111; --brd: #222; --exit: #ff3b30; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            font-size: 12px; height: 100vh; overflow: hidden; text-transform: uppercase;
        }

        /* ECONOMIA DE BATERIA: TEMA TOTAL BLACK */
        header { 
            padding: 20px; border-bottom: 1px solid var(--brd); 
            display: flex; justify-content: space-between; align-items: center; 
            background: #000; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Orbitron'; color: var(--p); font-size: 18px; letter-spacing: 2px; }
        
        .btn-exit { 
            background: rgba(255, 59, 48, 0.1); color: var(--exit); 
            border: 1px solid var(--exit); padding: 8px 15px; border-radius: 6px; 
            font-family: 'Orbitron'; font-size: 10px; cursor: pointer;
        }

        .main { height: calc(100vh - 75px); overflow-y: auto; padding: 20px; padding-bottom: 100px; }

        /* CAMERA BOX */
        #reader { 
            width: 100%; background: #080808; border-radius: 12px; 
            border: 2px solid var(--brd); overflow: hidden; margin-bottom: 20px;
        }

        .card { background: var(--card); border: 1px solid var(--brd); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        
        h3 { font-family: 'Orbitron'; font-size: 11px; color: var(--p); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        select, input { 
            width: 100%; padding: 15px; background: #000; border: 1px solid #333; 
            color: #fff; border-radius: 8px; font-size: 13px; margin-bottom: 10px; font-weight: 700;
        }

        .btn { 
            width: 100%; padding: 18px; border: none; border-radius: 8px; 
            font-family: 'Orbitron'; font-weight: 900; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s;
        }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: #fff; color: #000; margin-top: 10px; }

        /* LISTA REAL-TIME */
        .log-item { 
            padding: 12px; border-bottom: 1px solid #222; display: flex; 
            justify-content: space-between; align-items: center; font-size: 10px;
        }
        .time { color: #555; font-weight: 800; }
        .qty { background: var(--p); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: 900; }

        /* OVERLAY LOGIN */
        #login-overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; padding: 40px;
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="font-family:'Orbitron'; color:var(--p); font-size:32px; text-align:center; margin-bottom:40px;">LOG-PRO<br><span style="font-size:12px; color:#555;">v82 GALAXY CORE</span></div>
    <input type="password" id="pin" placeholder="PIN DE ACESSO" style="text-align:center;">
    <button class="btn btn-p" onclick="acessar()">ENTRAR NO FLUXO</button>
</div>

<header>
    <div class="logo">LOG-PRO <span>v82</span></div>
    <button class="btn-exit" onclick="sair()">SAIR</button>
</header>

<div class="main">
    
    <div class="card">
        <h3><i class="fa-solid fa-camera"></i> SCANNER ATIVO</h3>
        <div id="reader"></div>
        <button class="btn btn-s" id="cam-btn" onclick="toggleCamera()">LIGAR CÂMERA</button>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-layer-group"></i> ETAPA ATUAL</h3>
        <select id="current-stage">
            <option value="ENTRADA">📥 ENTRADA</option>
            <option value="SEPARAÇÃO">📦 SEPARAÇÃO</option>
            <option value="EXPEDIÇÃO">🚚 EXPEDIÇÃO</option>
        </select>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> ÚLTIMOS BIPES</h3>
        <div id="live-logs">
            </div>
    </div>

</div>

<script>
    let scanner;
    let isCameraOn = false;

    // FUNÇÃO ACESSAR
    function acessar() {
        if(document.getElementById('pin').value !== "") {
            document.getElementById('login-overlay').style.display = 'none';
        }
    }

    // FUNÇÃO SAIR (LIMPA TUDO E VOLTA)
    function sair() {
        if(isCameraOn) toggleCamera();
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('pin').value = "";
    }

    // TOGGLE CAMERA (ECONOMIA DE BATERIA)
    function toggleCamera() {
        const btn = document.getElementById('cam-btn');
        if (!isCameraOn) {
            scanner = new Html5Qrcode("reader");
            scanner.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            );
            btn.innerHTML = "DESLIGAR CÂMERA";
            btn.style.background = "#222";
            btn.style.color = "#fff";
            isCameraOn = true;
        } else {
            scanner.stop().then(() => {
                document.getElementById('reader').innerHTML = "";
                btn.innerHTML = "LIGAR CÂMERA";
                btn.style.background = "#fff";
                btn.style.color = "#000";
                isCameraOn = false;
            });
        }
    }

    // SUCESSO NO SCAN
    function onScanSuccess(decodedText) {
        // BIP SONORO (HÁPTICO)
        if (navigator.vibrate) navigator.vibrate(100);
        
        // PEDIR QUANTIDADE (PROMPT GALAXY)
        let qtd = prompt(`CÓDIGO: ${decodedText}\nINFORME A QUANTIDADE:`, "1");
        
        if (qtd !== null && qtd !== "") {
            registrarBipe(decodedText, qtd);
        }
    }

    // REGISTRO REAL-TIME
    function registrarBipe(cod, qtd) {
        const stage = document.getElementById('current-stage').value;
        const logContainer = document.getElementById('live-logs');
        const now = new Date().toLocaleTimeString();

        // Criar elemento visual
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
            <div>
                <span class="time">${now}</span><br>
                <strong>${cod}</strong> [${stage}]
            </div>
            <div class="qty">${qtd}</div>
        `;

        // Insere no topo
        logContainer.prepend(item);

        // SALVAR NO LOCALSTORAGE (Sincronização Simples)
        const logEntry = { cod, qtd, stage, time: now };
        let history = JSON.parse(localStorage.getItem('LOGPRO_V82') || '[]');
        history.unshift(logEntry);
        localStorage.setItem('LOGPRO_V82', JSON.stringify(history.slice(0, 50)));
    }

    // CARREGAR HISTÓRICO AO ABRIR
    function loadHistory() {
        let history = JSON.parse(localStorage.getItem('LOGPRO_V82') || '[]');
        const logContainer = document.getElementById('live-logs');
        history.forEach(l => {
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<div><span class="time">${l.time}</span><br><strong>${l.cod}</strong> [${l.stage}]</div><div class="qty">${l.qtd}</div>`;
            logContainer.appendChild(item);
        });
    }

    window.onload = loadHistory;
</script>

</body>
</html>
