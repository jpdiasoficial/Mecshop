<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK | SHARK EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #00ffa3; --bg: #000; --c: #0d0d0d; --b: #1a1a1a; --t: #fff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--t); overflow: hidden; }

        /* HEADER */
        header { height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--b); position: fixed; top: 0; width: 100%; z-index: 100; background: black; }
        .badge { background: rgba(0,255,163,0.1); color: var(--p); border: 1px solid var(--p); padding: 5px 12px; border-radius: 10px; font-weight: 800; font-size: 14px; }

        /* VIEWS */
        .view { position: absolute; inset: 0; display: none; padding: 100px 20px; overflow-y: auto; }
        .view.active { display: block; }

        /* CARDS */
        .card { background: var(--c); border: 1px solid var(--b); border-radius: 24px; padding: 25px; margin-bottom: 20px; }
        .blur-value { filter: blur(8px); transition: 0.3s; }
        .eye-btn { cursor: pointer; color: #444; font-size: 18px; transition: 0.2s; }
        .eye-btn:active { transform: scale(0.9); }

        /* GRID OPS */
        .ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 25px 0; }
        .op { text-align: center; }
        .op-i { width: 60px; height: 60px; background: var(--c); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--p); margin: 0 auto 8px; border: 1px solid var(--b); }

        /* NAV */
        nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: #080808; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--b); }
        .nav-l { color: #555; text-decoration: none; text-align: center; font-size: 11px; font-weight: 600; cursor: pointer; }
        .nav-l.active { color: var(--p); }
        .nav-l i { font-size: 22px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:40px; height:40px; background:#111; border-radius:12px; display:flex; align-items:center; justify-content:center; border:1px solid var(--b); font-weight:900; color:var(--p);">A</div>
            <div>
                <div style="font-size:12px; font-weight:800;">ADMIN</div>
                <div style="font-size:9px; color:var(--p); font-weight:800;">RANK: PLATINUM SHARK</div>
            </div>
        </div>
        <div class="badge">R$ <span id="top-balance" class="value-text">1.450.000</span></div>
    </header>

    <div id="home" class="view active">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <span style="font-size:11px; color:#666; font-weight:800;">SALDO DISPONÍVEL</span>
                <i class="fa-solid fa-eye eye-btn" id="toggle-eye" onclick="Shark.toggleVisibility()"></i>
            </div>
            <h1 style="font-size:36px; letter-spacing:-1px;">R$ <span id="main-balance" class="value-text blur-value">1.450.000,00</span></h1>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--p); font-weight:800;">Extrato</button>
                <button style="flex:1; padding:15px; border-radius:12px; border:none; background:#1a1a1a; color:#fff; font-weight:800;">Cartões</button>
            </div>
        </div>

        <div class="ops">
            <div class="op"><div class="op-i"><i class="fa-solid fa-bolt"></i></div><small>Pix</small></div>
            <div class="op"><div class="op-i"><i class="fa-solid fa-barcode"></i></div><small>Boletos</small></div>
            <div class="op"><div class="op-i"><i class="fa-solid fa-arrow-trend-up"></i></div><small>Investir</small></div>
            <div class="op"><div class="op-i"><i class="fa-solid fa-briefcase"></i></div><small>Jobs</small></div>
        </div>

        <div class="card" style="background: linear-gradient(135deg, #0a0a0a 0%, #000 100%);">
            <div style="color:var(--p); font-size:10px; font-weight:900; letter-spacing:2px; margin-bottom:40px;">SHARK PLATINUM</div>
            <div style="font-size:18px; letter-spacing:4px; margin-bottom:20px;">•••• •••• •••• 8835</div>
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <div>
                    <small style="color:#444; display:block; margin-bottom:5px;">LIMITE DISPONÍVEL</small>
                    <b style="font-size:18px;">R$ <span class="value-text blur-value">50.000,00</span></b>
                </div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png" width="40" style="opacity:0.5">
            </div>
        </div>
    </div>

    <div id="extrato" class="view">
        <h2 style="margin-bottom:20px;">Movimentações</h2>
        <div style="color:#444; text-align:center; margin-top:50px;">Nenhuma atividade recente encontrada.</div>
    </div>

    <div id="admin" class="view">
        <div class="card" style="background:var(--p); color:#000;">
            <small style="font-weight:900;">VOLUME OPERACIONAL</small>
            <h2 style="font-size:28px;">R$ 1.450.850,00</h2>
        </div>
        <div class="card"><canvas id="adminChart"></canvas></div>
    </div>

    <nav>
        <div class="nav-l active" onclick="Shark.nav('home', this)"><i class="fa-solid fa-house"></i>Home</div>
        <div class="nav-l" onclick="Shark.nav('extrato', this)"><i class="fa-solid fa-chart-pie"></i>Extrato</div>
        <div class="nav-l" onclick="Shark.nav('admin', this)"><i class="fa-solid fa-shield-halved"></i>Admin</div>
        <div class="nav-l" style="color:#ff4444;" onclick="location.reload()"><i class="fa-solid fa-power-off"></i>Sair</div>
    </nav>

    <script>
        const Shark = {
            isHidden: true,

            nav(id, el) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                document.querySelectorAll('.nav-l').forEach(l => l.classList.remove('active'));
                el.classList.add('active');
                if(id === 'admin') this.initChart();
            },

            toggleVisibility() {
                this.isHidden = !this.isHidden;
                const values = document.querySelectorAll('.value-text');
                const icon = document.getElementById('toggle-eye');

                values.forEach(v => {
                    if (this.isHidden) {
                        v.classList.add('blur-value');
                    } else {
                        v.classList.remove('blur-value');
                    }
                });

                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            },

            initChart() {
                const ctx = document.getElementById('adminChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['1h', '2h', '3h', '4h', '5h', '6h'],
                        datasets: [{
                            data: [10, 25, 15, 40, 30, 60],
                            borderColor: '#00ffa3',
                            tension: 0.4,
                            borderWidth: 3,
                            pointRadius: 0
                        }]
                    },
                    options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
                });
            }
        };
    </script>
</body>
</html>
