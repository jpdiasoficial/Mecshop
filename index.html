<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO | JP TECNOLOGIA</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --border: #222; --out: #ff3b30; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; font-size: 10px; height: 100vh; overflow: hidden; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; background: #000; z-index: 10; }
        .active { display: flex !important; }
        header { padding: 12px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #050505; }
        .scroll { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 150px; }
        .stats { display: flex; gap: 10px; padding: 10px; background: #080808; border-bottom: 1px solid #111; }
        .card { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 4px; text-align: center; }
        .card span { display: block; font-size: 14px; color: var(--primary); font-family: 'Orbitron'; }
        .filters { padding: 10px; background: #050505; border-bottom: 1px solid #111; display: flex; flex-direction: column; gap: 8px; }
        .filters input { margin: 0; padding: 12px; background: #111; border: 1px solid #222; color: #fff; border-radius: 4px; font-family: 'Orbitron'; font-size: 9px; }
        .table-wrapper { border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; background: #080808; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; }
        th { background: #111; color: #555; padding: 10px; text-align: left; font-size: 8px; border-bottom: 1px solid var(--border); }
        td { padding: 8px 10px; border-bottom: 1px solid #151515; white-space: nowrap; }
        .btn-green { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 4px; cursor: pointer; }
        input, select, textarea { width: 100%; padding: 14px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: 'Orbitron'; margin-bottom: 10px; box-sizing: border-box; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid #222; background: #050505; }
        .status-bar { display: flex; gap: 15px; padding: 8px 12px; background: #050505; border-bottom: 1px solid #111; font-size: 7px; }
        #print-area { display: none; }
        @media print { .screen { display: none !important; } #print-area { display: block !important; color: black; } }
    </style>
</head>
<body onload="init()">

<div id="print-area"></div>

<div id="scr-login" class="screen active" style="align-items:center; justify-content:center; text-align:center;">
    <div style="font-family:'Orbitron'; color:var(--primary); font-size:35px;">LOG-PRO</div>
    <div style="font-size:7px; color:#444; margin-bottom:40px;">JP TECNOLOGIA | MONITORAMENTO</div>
    <div style="width: 85%; max-width: 320px;">
        <input type="text" id="user-name" placeholder="USUÁRIO">
        <input type="password" id="pass" placeholder="CHAVE">
        <button class="btn-green" onclick="auth()">ACESSAR</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span style="color:var(--primary)" id="shark-user-title">...</span> <button onclick="logout()" style="color:var(--out); background:none; border:none; font-size:8px;">SAIR</button></header>
    <div class="status-bar"><span id="st-jp">JP: ⚪</span><span id="st-shark">SHARK: ⚪</span><span id="st-op">OP: ⚪</span></div>
    <div class="stats"><div class="card">ITENS <span id="stat-itens">0</span></div><div class="card">MOVS <span id="stat-movs">0</span></div><div class="card">SALDO <span id="stat-saldo">0</span></div></div>
    
    <div class="filters">
        <input type="text" id="main-filter" placeholder="BUSCAR COD, ITEM OU OP..." oninput="atualizarTabelas()">
        <input type="date" id="date-filter" onchange="atualizarTabelas()">
    </div>

    <div class="scroll">
        <h3>INVENTÁRIO ATUAL</h3>
        <div class="table-wrapper"><table><thead><tr><th>COD</th><th>NOME</th><th>SALDO</th></tr></thead><tbody id="stock-body"></tbody></table></div>
        <h3>HISTÓRICO REAL-TIME</h3>
        <div class="table-wrapper"><table><thead><tr><th>HORA</th><th>OP</th><th>MOV</th><th>ITEM</th><th>QTD</th></tr></thead><tbody id="audit-body"></tbody></table></div>
    </div>
    <div style="position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px;">
        <button onclick="prepararImpressao()" style="width:50px; height:50px; border-radius:50%; background:#fff; border:none;">🖨️</button>
        <button onclick="ir('scr-config')" style="width:50px; height:50px; border-radius:50%; background:var(--primary); border:none;">⚙️</button>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span id="display-user">...</span> <button onclick="logout()" style="color:var(--out); background:none; border:none; font-size:8px;">SAIR</button></header>
    <div class="scroll">
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <select id="mod-op" style="flex:2;"><option value="ENTRADA">ENTRADA</option><option value="SAIDA">SAÍDA</option></select>
            <input type="number" id="qtd-bipe" value="1" style="flex:0.6; text-align:center;">
        </div>
        <div id="reader"></div>
        <button class="btn-green" id="btn-cam" onclick="toggleCamera()" style="margin:10px 0;">LIGAR SCANNER</button>
        <h3>BIPES DA SESSÃO</h3>
        <div class="table-wrapper"><table><tbody id="op-audit-body"></tbody></table></div>
        <button class="btn-green" onclick="limparSessao()">LIMPAR LISTA</button>
    </div>
</div>

<div id="scr-config" class="screen">
    <header><span>CONFIGURAÇÕES</span> <button onclick="ir('scr-shark')">VOLTAR</button></header>
    <div class="scroll">
        <h3>BASE DE ITENS (COD, NOME)</h3>
        <textarea id="import-area" style="height:200px;" placeholder="Ex: 001, PRODUTO X"></textarea>
        <button class="btn-green" onclick="salvarConfig()">SALVAR ITENS</button>
        <button onclick="resetLocal()" style="margin-top:20px; color:var(--out); background:none; border:none; width:100%; font-size:8px;">LIMPAR CACHE LOCAL</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRDhONvvzZmo2csXksqHs6E6vV3MuvLSs",
        authDomain: "log-pro-jp.firebaseapp.com",
        projectId: "log-pro-jp",
        storageBucket: "log-pro-jp.firebasestorage.app",
        messagingSenderId: "481645607846",
        appId: "1:481645607846:web:fd55dd943718ad78386d67"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let BASE = JSON.parse(localStorage.getItem('LP_BASE')) || {};
    let MOVS = []; 
    let currentUser = localStorage.getItem('LP_SESSION') || "";
    let bipesSessao = [];
    let scanner, camOn = false;

    // PRESENÇA ONLINE
    async function updatePresence() {
        if(!currentUser) return;
        await setDoc(doc(db, "presenca", currentUser), { u: currentUser, t: serverTimestamp() });
    }
    setInterval(updatePresence, 15000);

    onSnapshot(collection(db, "presenca"), (snap) => {
        snap.docs.forEach(d => {
            const p = d.data();
            const el = document.getElementById("st-"+p.u.toLowerCase());
            if(el) el.innerHTML = p.u + ": <span style='color:var(--primary)'>🟢 ONLINE</span>";
        });
    });

    // ESCUTADOR DE MOVIMENTAÇÕES
    onSnapshot(query(collection(db, "logs"), orderBy("data_hora", "desc"), limit(100)), (snap) => {
        MOVS = snap.docs.map(d => d.data());
        atualizarTabelas();
    });

    window.auth = () => {
        const u = document.getElementById('user-name').value.toUpperCase().trim();
        const p = document.getElementById('pass').value.trim();
        if((u==="JP" || u==="SHARK") && p==="9910") { currentUser=u; localStorage.setItem('LP_SESSION', u); logarNaTela(); }
        else if(u==="OP" && p==="1234") { currentUser=u; localStorage.setItem('LP_SESSION', u); logarNaTela(); }
        else alert("ACESSO NEGADO");
    };

    window.logarNaTela = () => {
        if(!currentUser) return;
        updatePresence();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if(currentUser==="JP" || currentUser==="SHARK") {
            document.getElementById('shark-user-title').innerText = "GESTOR: " + currentUser;
            document.getElementById('scr-shark').classList.add('active');
        } else {
            document.getElementById('display-user').innerText = "OP: " + currentUser;
            document.getElementById('scr-op').classList.add('active');
        }
    };

    window.processar = async (cod) => {
        let c = cod.trim();
        if(!BASE[c]) {
            const n = prompt("NOVO ITEM ("+c+"). NOME:", "");
            if(n) { BASE[c] = n.toUpperCase(); localStorage.setItem('LP_BASE', JSON.stringify(BASE)); } else return;
        }
        const q = parseInt(document.getElementById('qtd-bipe').value) || 1;
        const mov = { 
            cod: c, n: BASE[c], t: document.getElementById('mod-op').value, 
            q: q, op: currentUser, data_hora: serverTimestamp(),
            d_str: new Date().toLocaleString()
        };
        await addDoc(collection(db, "logs"), mov);
        bipesSessao.unshift(mov);
        atualizarOpAudit();
    };

    window.atualizarTabelas = () => {
        const f = document.getElementById('main-filter').value.toUpperCase();
        const dF = document.getElementById('date-filter').value;
        
        // SALDOS
        let r = {}; let totalS = 0;
        Object.keys(BASE).forEach(k => r[k] = { n: BASE[k], sal: 0 });
        MOVS.forEach(m => { if(r[m.cod]) { m.t === 'ENTRADA' ? r[m.cod].sal += m.q : r[m.cod].sal -= m.q; } });
        
        document.getElementById('stock-body').innerHTML = Object.keys(r).filter(k => r[k].n.includes(f) || k.includes(f)).map(k => {
            totalS += r[k].sal;
            return `<tr><td>${k}</td><td><b>${r[k].n}</b></td><td style="color:var(--primary)">${r[k].sal}</td></tr>`;
        }).join('');

        // HISTÓRICO
        let movsF = MOVS.filter(m => {
            const dM = m.d_str.split(' ')[0].split('/').reverse().join('-');
            return (dF ? dM === dF : true) && (m.n.includes(f) || m.op.includes(f) || m.cod.includes(f));
        });
        document.getElementById('audit-body').innerHTML = movsF.map(m => `<tr><td>${m.d_str.split(' ')[1]}</td><td>${m.op}</td><td>${m.t}</td><td>${m.n}</td><td>${m.q}</td></tr>`).join('');
        
        document.getElementById('stat-itens').innerText = Object.keys(BASE).length;
        document.getElementById('stat-movs').innerText = MOVS.length;
        document.getElementById('stat-saldo').innerText = totalS;
        document.getElementById('import-area').value = Object.entries(BASE).map(([k,v]) => `${k}, ${v}`).join('\n');
    };

    window.limparSessao = () => { bipesSessao = []; atualizarOpAudit(); };
    window.atualizarOpAudit = () => { document.getElementById('op-audit-body').innerHTML = bipesSessao.map(m => `<tr><td>${m.cod}</td><td>${m.n}</td><td>${m.q}</td></tr>`).join(''); };
    window.logout = () => { localStorage.removeItem('LP_SESSION'); location.reload(); };
    window.ir = (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); };
    
    window.toggleCamera = async () => {
        if(!camOn) { scanner = new Html5Qrcode("reader"); await scanner.start({ facingMode: "environment" }, { fps: 25, qrbox: 250 }, (t) => processar(t)); camOn = true; document.getElementById('btn-cam').innerText = "PARAR"; }
        else { await scanner.stop(); camOn = false; document.getElementById('btn-cam').innerText = "LIGAR"; }
    };

    window.salvarConfig = () => {
        document.getElementById('import-area').value.split('\n').forEach(l => { const d = l.split(','); if(d[0] && d[1]) BASE[d[0].trim()] = d[1].trim().toUpperCase(); });
        localStorage.setItem('LP_BASE', JSON.stringify(BASE)); alert("SALVO!"); atualizarTabelas();
    };

    window.prepararImpressao = () => {
        let h = `<h2>ROMANEIO LOG-PRO</h2><p>${new Date().toLocaleString()}</p><table><thead><tr><th>OP</th><th>MOV</th><th>ITEM</th><th>QTD</th></tr></thead><tbody>`;
        h += MOVS.slice(0,30).map(m => `<tr><td>${m.op}</td><td>${m.t}</td><td>${m.n}</td><td>${m.q}</td></tr>`).join('');
        h += `</tbody></table>`;
        document.getElementById('print-area').innerHTML = h; window.print();
    };

    window.init = () => { if(currentUser) logarNaTela(); atualizarTabelas(); };
</script>
</body>
    </html>
