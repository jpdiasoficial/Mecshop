<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby VIP - Carregamento Instantâneo</title>
    <style>
        :root {
            --gold: #ffd700;
            --dark: #0f0f0f;
            --card: #1a1a1a;
        }
        body {
            background-color: var(--dark);
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            width: 100%;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 500px;
        }
        .game-card {
            background: var(--card);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.2s;
        }
        .game-card:active { transform: scale(0.95); }
        .game-img {
            width: 100%;
            height: 120px;
            background: #252525; /* Placeholder para imagem */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #555;
        }
        .btn-play {
            background: linear-gradient(180deg, var(--gold), #b8860b);
            color: black;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; color:var(--gold);">LOBBY EXCLUSIVO</h2>
        <p style="font-size:12px; margin:5px 0 0;">Sua conexão: <span style="color:#00ff00;">Ultra-Rápida</span></p>
    </div>

    <div class="grid">
        <div class="game-card">
            <div class="game-img">SLOT 01</div>
            <div class="btn-play">Jogar Agora</div>
        </div>
        <div class="game-card">
            <div class="game-img">SLOT 02</div>
            <div class="btn-play">Jogar Agora</div>
        </div>
        <div class="game-card">
            <div class="game-img">SLOT 03</div>
            <div class="btn-play">Jogar Agora</div>
        </div>
        <div class="game-card">
            <div class="game-img">SLOT 04</div>
            <div class="btn-play">Jogar Agora</div>
        </div>
    </div>

</body>
</html>
