<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | GLOBAL LOGISTICS V75</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff9f0a; /* Laranja Meli/Industrial */
            --bg: #0a0a0c;
            --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 159, 10, 0.3);
            --green: #32d74b;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #1a1a20 0%, #0a0a0c 100%);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* --- PORTAL DE ENTRADA ULTRA LUXO --- */
        #portal {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo-container {
            position: relative;
            margin-bottom: 50px;
        }

        .logo-container h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 45px;
            letter-spacing: 12px;
            background: linear-gradient(to bottom, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .btn-premium {
            width: 320px;
            padding: 20px;
            margin: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px; /* Visual mais industrial/sério */
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 2px;
        }

        .btn-premium:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 159, 10, 0.4);
            transform: scale(1.05);
        }

        /* --- LOBBY "COMMAND CENTER" --- */
        #lobby { display: none; padding: 30px; }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .grid-master {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 40px;
        }

        .card-hq {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0 20px 0 20px; /* Design assimétrico moderno */
            padding: 30px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
        }

        .card-hq::before { /* Efeito de linha de scanner */
            content: "";
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255,159,10,0.1), transparent);
            animation: scan 4s infinite linear;
        }

        @keyframes scan { 0% { top: -100%; } 100% { top: 100%; } }

        .card-hq h3 { font-family: 'Orbitron'; color: var(--primary); margin: 0; font-size: 16px; }
        .card-hq p { font-size: 10px; color: #888; margin-top: 10px; font-family: 'JetBrains Mono'; }

        /* --- LOGS E STATUS --- */
        .terminal {
            background: rgba(0,0,0,0.8);
            border: 1px solid #222;
            height: 150px;
            border-radius: 10px;
            padding: 15px;
            font-family: 'JetBrains Mono';
            font-size: 11px;
            color: var(--green);
            overflow-y: auto;
            margin-top: 30px;
        }

        .badge-ghost {
            border: 1px solid var(--green);
            color: var(--green);
            padding: 4px 12px;
            font-size: 10px;
            border-radius: 100px;
        }

    </style>
</head>
<body>

<div id="portal">
    <div class="logo-container">
        <h1>JP DIAS</h1>
        <div style="height:2px; background:var(--primary); width:50px; margin: 10px auto;"></div>
    </div>
    <button class="btn-premium" onclick="login('MASTER')">ACCESS LEVEL 01 // OWNER</button>
    <button class="btn-premium" onclick="login('SHARK')">ACCESS LEVEL 02 // SHARK</button>
    <button class="btn-premium" onclick="login('OP')">ACCESS LEVEL 03 // TECH-OP</button>
</div>

<div id="lobby">
    <div class="header-main">
        <span class="badge-ghost" id="id-display">ID: GHOST_INIT</span>
        <button onclick="location.reload()" style="background:none; border:none; color:#555; cursor:pointer; font-weight:bold;">DISCONNECT_</button>
    </div>

    <div class="grid-master">
        <div class="card-hq" onclick="alert('Iniciando Armazém...')">
            <h3>📦 ARMAZÉM WMS</h3>
            <p>// TRAVA 3 ETAPAS ATIVA<br>// VOICE COMMAND READY</p>
        </div>
        <div class="card-hq" onclick="alert('Iniciando Crossdock...')">
            <h3>⚡ CROSS DOCK</h3>
            <p>// MONITOR MOTORISTA ON<br>// FLOW OPTIMIZATION</p>
        </div>
        <div class="card-hq" style="grid-column: span 2;" onclick="alert('Abrindo Auditoria...')">
            <h3>🛰️ TORRE DE CONTROLE GHOST</h3>
            <p>// TOTAL VISIBILITY // ENCRYPTED DATA</p>
        </div>
    </div>

    <div class="terminal" id="terminal-out">
        > SYSTEM_READY...<br>
        > JP_DIAS_CORE_V75_LOADED...<br>
        > WAITING_FOR_OPERATIONAL_INPUT...
    </div>
</div>

<script>
    function login(nivel) {
        if(nivel !== 'OP') {
            let p = prompt("ENTER SECURITY KEY:");
            if(p !== "123") return;
        }
        document.getElementById('portal').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        const id = "GHOST-" + Math.floor(Math.random()*9999);
        document.getElementById('id-display').innerText = `ID: ${id}`;
        
        const audio = new SpeechSynthesisUtterance("Bem vindo ao sistema J P Dias. Protocolo de segurança ativado.");
        audio.lang = 'pt-BR';
        window.speechSynthesis.speak(audio);
    }
</script>

</body>
</html>
