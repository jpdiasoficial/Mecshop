<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET | V-TOTAL SHARK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #ff5e00; --g: #00ff41; --bg: #050505; --card: #0d0d0d; --brd: #1a1a1a; --txt: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--txt); height: 100vh; overflow: hidden; position: fixed; width: 100%; }

        /* HEADER */
        header { height: 70px; background: rgba(0,0,0,0.95); border-bottom: 2px solid var(--brd); display: none; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 1000; backdrop-filter: blur(10px); }
        .logo { font-family: 'Orbitron', sans-serif; color: var(--p); font-size: 18px; font-weight: 900; }
        .balance-box { background: #111; padding: 8px 15px; border-radius: 12px; border: 1px solid var(--g); color: var(--g); font-weight: 800; font-size: 14px; }

        /* VIEWS */
        .view { position: absolute; inset: 0; display: none; flex-direction: column; padding: 20px; overflow-y: auto; padding-bottom: 110px; }
        .view.active { display: flex; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* AUTH & CARDS */
        .card { background: var(--card); border: 1px solid var(--brd); border-radius: 20px; padding: 20px; margin-bottom: 15px; position: relative; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; font-size: 13px; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-p { background: var(--p); color: #fff; }
        .btn-g { background: var(--g); color: #000; }
        .btn-s { background: #1a1a1a; color: #fff; border: 1px solid #333; }
        
        input { width: 100%; padding: 16px; background: #000; border: 1px solid #222; border-radius: 12px; color: #fff; margin-bottom: 12px; font-weight: 600; }

        /* NAVBAR */
        nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(0,0,0,0.98); border-top: 1px solid var(--brd); display: none; justify-content: space-around; align-items: center; padding-bottom: 15px; z-index: 1000; }
        .nav-link { color: #444; text-align: center; font-size: 10px; font-weight: 800; text-decoration: none; cursor: pointer; }
        .nav-link.active { color: var(--p); }
        .nav-link i { font-size: 22px; display: block; margin-bottom: 4px; }

        /* GAMES UI */
        .grid-m { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
        .tile { aspect-ratio: 1; background: #161616; border-radius: 10px; border: 1px solid #222; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .crash-display { height: 150px; background: #000; border-radius: 15px; border: 1px dashed var(--brd); display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
    </style>
</head>
<body onload="Shark.init()">

    <div id="scr-auth" class="view active" style="justify-content:center;">
        <div style="text-align:center; margin-bottom:30px;">
            <h1 class="logo" style="font-size:35px;">MEC<span>BET</span></h1>
            <p style="color:#444; font-size:10px; font-weight:800; letter-spacing: 2px;">V-TOTAL ENTERPRISE</p>
        </div>
        <div class="card">
            <h2 id="auth-title" style="margin-bottom:20px; font-size:18px;">Acessar Terminal</h2>
            <input type="text" id="l-user" placeholder="USUÁRIO">
            <input type="password" id="l-pass" placeholder="SENHA">
            <button class="btn btn-p" id="auth-btn" onclick="Shark.Auth.execute()">Entrar na Plataforma</button>
            <button class="btn btn-s" id="auth-toggle" onclick="Shark.Auth.toggleMode()">Não tenho conta (Cadastrar)</button>
            <p onclick="alert('Link de recuperação enviado!')" style="text-align:center; font-size:11px; color:#555; margin-top:15px; cursor:pointer;">Esqueci minha senha</p>
        </div>
    </div>

    <header id="h-main">
        <div class="logo">MEC-BET</div>
        <div class="balance-box">R$ <span id="u-bal">0.00</span></div>
    </header>

    <div id="scr-lobby" class="view">
        <div class="card" style="border-left: 4px solid var(--g);">
            <h3 id="u-welcome">Olá, Shark</h3>
            <p style="font-size:11px; color:#555;">Status: <span style="color:var(--g)">Conectado</span></p>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div class="card" style="margin:0; text-align:center; cursor:pointer;" onclick="Shark.nav('scr-mines')"><i class="fa-solid fa-gem" style="color:var(--g); font-size:25px;"></i><br><small>MINES</small></div>
            <div class="card" style="margin:0; text-align:center; cursor:pointer;" onclick="Shark.nav('scr-crash')"><i class="fa-solid fa-rocket" style="color:var(--p); font-size:25px;"></i><br><small>CRASH</small></div>
        </div>
        <div class="card" style="text-align:center; cursor:pointer; margin-top:12px;" onclick="Shark.nav('scr-wheel')">
            <i class="fa-solid fa-dharmachakra" style="color:var(--p); font-size:25px;"></i><br><small>ROLETA VIP</small>
        </div>
    </div>

    <div id="scr-fin" class="view">
        <h2 style="margin-bottom:15px;">Financeiro</h2>
        <div class="card">
            <small>Saldo Disponível</small>
            <h2 style="color:var(--g)">R$ <span id="f-bal">0.00</span></h2>
            <hr style="border:0; border-top:1px solid #222; margin:15px 0;">
            <button class="btn btn-g"><i class="fa-brands fa-pix"></i> DEPOSITAR</button>
            <button class="btn btn-s" onclick="Shark.Finance.withdraw()"><i class="fa-solid fa-hand-holding-dollar"></i> SACAR PARA PIX</button>
        </div>
    </div>

    <div id="scr-mines" class="view">
        <div class="card" style="text-align:center;">
            <h3>MINES PRO</h3>
            <div class="grid-m" id="m-grid"></div>
            <button id="m-btn" class="btn btn-p" onclick="Shark.Games.Mines.play()">JOGAR (R$ 10,00)</button>
        </div>
    </div>

    <div id="scr-crash" class="view">
        <div class="card" style="text-align:center;">
            <h3>CRASH</h3>
            <div class="crash-display"><h1 id="c-mult" style="font-family:'Orbitron'; font-size:40px; color:var(--g)">1.00x</h1></div>
            <button id="c-btn" class="btn btn-g" onclick="Shark.Games.Crash.start()">APOSTAR (R$ 10,00)</button>
        </div>
    </div>

    <div id="scr-wheel" class="view">
        <div class="card" style="text-align:center;">
            <h3>ROLETA VIP</h3>
            <div style="position:relative; width:200px; height:200px; margin:20px auto; border: 5px solid #111; border-radius: 50%; overflow:hidden;">
                <div id="wheel" style="width:100%; height:100%; background: conic-gradient(#111 0% 12.5%, var(--p) 12.5% 25%, #111 25% 37.5%, var(--p) 37.5% 50%, #111 50% 62.5%, var(--p) 62.5% 75%, #111 75% 87.5%, var(--p) 87.5% 100%); transition: 4s cubic-bezier(0.1, 0, 0.1, 1);"></div>
            </div>
            <button id="w-btn" class="btn btn-p" onclick="Shark.Games.Wheel.spin()">GIRAR (R$ 5,00)</button>
        </div>
    </div>

    <div id="scr-admin" class="view">
        <h2 style="color:var(--p)">SHARK CONTROL</h2>
        <div class="card" style="display:flex; justify-content:space-around; text-align:center;">
            <div><small>LUCRO CASA</small><h3 id="a-ggr" style="color:var(--g)">R$ 0.00</h3></div>
            <div><small>USUÁRIOS</small><h3 id="a-count">0</h3></div>
        </div>
        <div id="a-list"></div>
    </div>

    <nav id="n-main">
        <a class="nav-link active" onclick="Shark.nav('scr-lobby', this)"><i class="fa-solid fa-house"></i>HOME</a>
        <a class="nav-link" onclick="Shark.nav('scr-fin', this)"><i class="fa-solid fa-wallet"></i>BANCA</a>
        <a class="nav-link" id="n-adm" style="display:none;" onclick="Shark.nav('scr-admin', this)"><i class="fa-solid fa-shield-halved"></i>ADMIN</a>
        <a class="nav-link" onclick="location.reload()"><i class="fa-solid fa-right-from-bracket"></i>SAIR</a>
    </nav>

    <script>
        const Shark = {
            db: JSON.parse(localStorage.getItem('MEC_DATA')) || [],
            u: null, mode: 'login', ggr: 0,

            init() {
                const s = sessionStorage.getItem('MEC_SESS');
                if(s) { this.u = this.db.find(x => x.name === s); if(this.u) this.unlock(); }
            },

            Auth: {
                toggleMode() {
                    this.mode = (this.mode === 'login' ? 'reg' : 'login');
                    document.getElementById('auth-title').innerText = (this.mode === 'login' ? 'Acessar Terminal' : 'Criar Nova Conta');
                    document.getElementById('auth-btn').innerText = (this.mode === 'login' ? 'Entrar na Plataforma' : 'Finalizar Cadastro');
                    document.getElementById('auth-toggle').innerText = (this.mode === 'login' ? 'Não tenho conta (Cadastrar)' : 'Já tenho conta (Login)');
                },
                execute() {
                    const n = document.getElementById('l-user').value.toUpperCase().trim();
                    const p = document.getElementById('l-pass').value.trim();
                    if(!n || !p) return alert("Preencha tudo!");

                    let user = Shark.db.find(x => x.name === n);
                    if(this.mode === 'login') {
                        if(!user || user.pass !== p) return alert("Dados inválidos!");
                    } else {
                        if(user) return alert("Usuário já existe!");
                        user = { name: n, pass: p, bal: 50, role: (n==='ADMIN'?'admin':'user'), mode: 'normal' };
                        Shark.db.push(user);
                    }
                    Shark.u = user; sessionStorage.setItem('MEC_SESS', n); Shark.unlock();
                }
            },

            nav(id, el) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(el) { document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active')); el.classList.add('active'); }
                if(id === 'scr-mines') this.Games.Mines.render();
                if(id === 'scr-admin') this.Admin.render();
                this.sync();
            },

            unlock() {
                document.getElementById('scr-auth').classList.remove('active');
                document.getElementById('h-main').style.display = 'flex';
                document.getElementById('n-main').style.display = 'flex';
                if(this.u.role === 'admin') document.getElementById('n-adm').style.display = 'flex';
                this.nav('scr-lobby');
            },

            sync() {
                document.getElementById('u-bal').innerText = this.u.bal.toFixed(2);
                document.getElementById('f-bal').innerText = this.u.bal.toFixed(2);
                document.getElementById('u-welcome').innerText = "Olá, " + this.u.name;
                localStorage.setItem('MEC_DATA', JSON.stringify(this.db));
            },

            Finance: {
                withdraw() {
                    if(Shark.u.bal < 50) return alert("Mínimo R$ 50 para saque!");
                    alert("Saque de R$ " + Shark.u.bal.toFixed(2) + " solicitado!");
                    Shark.u.bal = 0; Shark.sync();
                }
            },

            Games: {
                Mines: {
                    active: false,
                    render() {
                        const g = document.getElementById('m-grid'); g.innerHTML = '';
                        for(let i=0; i<25; i++) g.innerHTML += `<div class="tile" id="t-${i}" onclick="Shark.Games.Mines.click(${i})"><i class="fa-solid fa-gem" style="opacity:0.1"></i></div>`;
                    },
                    play() {
                        if(Shark.u.bal < 10) return alert("Sem saldo!");
                        Shark.u.bal -= 10; Shark.ggr += 10; Shark.sync();
                        this.active = true; this.render();
                    },
                    click(i) {
                        if(!this.active) return;
                        const t = document.getElementById('t-'+i);
                        if(Shark.u.mode === 'lose') {
                            t.style.background = 'red'; t.innerHTML = '💣'; this.active = false;
                        } else { t.style.background = 'var(--g)'; t.innerHTML = '💎'; }
                    }
                },
                Crash: {
                    running: false, mult: 1, timer: null,
                    start() {
                        if(this.running) {
                            clearInterval(this.timer); this.running = false;
                            let win = 10 * this.mult; Shark.u.bal += win; Shark.ggr -= win;
                            alert("Ganhou R$ " + win.toFixed(2)); this.reset(); return;
                        }
                        if(Shark.u.bal < 10) return;
                        Shark.u.bal -= 10; Shark.ggr += 10; this.running = true;
                        document.getElementById('c-btn').innerText = "CASH OUT";
                        this.timer = setInterval(() => {
                            this.mult += 0.03; document.getElementById('c-mult').innerText = this.mult.toFixed(2) + "x";
                            if(Shark.u.mode === 'lose' && this.mult > 1.2) { clearInterval(this.timer); alert("CRASHED!"); this.reset(); }
                        }, 100);
                    },
                    reset() { this.mult = 1; this.running = false; document.getElementById('c-mult').innerText = "1.00x"; document.getElementById('c-btn').innerText = "APOSTAR (R$ 10,00)"; Shark.sync(); }
                },
                Wheel: {
                    spin() {
                        if(Shark.u.bal < 5) return alert("Saldo baixo!");
                        Shark.u.bal -= 5; Shark.ggr += 5; Shark.sync();
                        const w = document.getElementById('wheel');
                        let d = (Shark.u.mode === 'lose' ? 3600 : 3600 + Math.random()*360);
                        w.style.transform = `rotate(${d}deg)`;
                        setTimeout(() => { alert(Shark.u.mode === 'lose' ? "Perdeu!" : "Ganhou Bônus!"); w.style.transition = 'none'; w.style.transform = 'rotate(0deg)'; setTimeout(()=>w.style.transition='4s',50); Shark.sync(); }, 4100);
                    }
                }
            },

            Admin: {
                render() {
                    document.getElementById('a-ggr').innerText = "R$ " + Shark.ggr.toFixed(2);
                    document.getElementById('a-count').innerText = Shark.db.length;
                    const l = document.getElementById('a-list');
                    l.innerHTML = Shark.db.filter(x => x.role !== 'admin').map(u => `
                        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                            <span>${u.name}</span>
                            <button onclick="Shark.Admin.toggle('${u.name}')" style="background:${u.mode==='lose'?'red':'#333'}; padding:8px; border-radius:8px;">${u.mode==='lose'?'LOSS':'NORMAL'}</button>
                        </div>
                    `).join('');
                },
                toggle(n) { const u = Shark.db.find(x => x.name === n); u.mode = (u.mode==='lose'?'normal':'lose'); this.render(); }
            }
        };
    </script>
</body>
</html>
