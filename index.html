<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK V45 | Visão Shark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ff88; --bg: #050505; --card: #121212; --text: #ffffff;
            --accent-blue: #00d4ff; --danger: #ff4444; --glass: rgba(255,255,255,0.05);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }

        .screen { display: none; min-height: 100vh; padding: 20px; flex-direction: column; }
        .active { display: flex; animation: fadeIn 0.4s ease; }

        /* --- AUTH --- */
        .auth-container { justify-content: center; align-items: center; text-align: center; }
        .logo-text { font-size: 32px; font-weight: 800; letter-spacing: 2px; color: var(--primary); margin-bottom: 40px; }
        input { width: 100%; max-width: 320px; background: var(--card); border: 1px solid #333; padding: 18px; border-radius: 12px; color: white; margin-bottom: 15px; outline: none; transition: 0.3s; }
        .btn-main { width: 100%; max-width: 320px; background: var(--primary); color: black; border: none; padding: 18px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* --- DASHBOARD CLIENTE --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .avatar-circle { width: 40px; height: 40px; border: 1px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: bold; }
        .balance-box { margin: 30px 0; }
        .main-balance { font-size: 32px; font-weight: 700; margin-top: 10px; transition: 0.3s; }
        .blur { filter: blur(10px); }

        /* --- PAINEL SHARK (ADM MASTER) --- */
        .shark-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 15px; border-left: 4px solid var(--primary); }
        .import-btn { background: rgba(0, 255, 136, 0.1); border: 2px dashed var(--primary); padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; margin: 10px 0; }

        /* --- MENU & GRID --- */
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; color: #aaa; }
        .icon-box { width: 55px; height: 55px; background: var(--card); border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: var(--primary); border: 1px solid rgba(255,255,255,0.03); }

        /* --- CARTÃO BLACK --- */
        .card-pro { background: linear-gradient(135deg, #1a1a1a 0%, #000 100%); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 25px; position: relative; }
        .card-number { margin-top: 30px; font-family: monospace; font-size: 18px; letter-spacing: 2px; }

        /* --- CÂMERA GLOBAL --- */
        #cam-layer { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .scanner-frame { width: 260px; height: 260px; border: 2px solid var(--primary); border-radius: 20px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-line { position: absolute; width: 100%; height: 2px; background: var(--primary); top: 0; animation: scan 2s linear infinite; box-shadow: 0 0 15px var(--primary); }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen active auth-container">
        <div class="logo-text">MEC-BANK</div>
        <input type="text" id="login-user" placeholder="Digite seu Nome">
        <input type="password" id="login-pass" placeholder="Sua Senha">
        <button class="btn-main" onclick="handleAuth()">Acessar Conta Black</button>
    </div>

    <div id="dash-client" class="screen">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="avatar-circle" id="av-client">S</div>
                <span id="name-client" style="font-weight: 600;">Shark</span>
            </div>
            <i class="fa-solid fa-bell" style="color: #444;"></i>
        </header>

        <section class="balance-box">
            <div class="balance-label" style="color: #666; font-size: 13px;">Saldo disponível <i class="fa-regular fa-eye" onclick="toggleBlur()"></i></div>
            <div class="main-balance blur" id="bal-client">R$ 145.850,90</div>
        </section>

        <nav class="menu-grid">
            <div class="menu-item" onclick="openScanner('PIX')"><div class="icon-box"><i class="fa-solid fa-qrcode"></i></div><span>Pix</span></div>
            <div class="menu-item" onclick="openScanner('BOLETO')"><div class="icon-box"><i class="fa-solid fa-barcode"></i></div><span>Pagar</span></div>
            <div class="menu-item"><div class="icon-box"><i class="fa-solid fa-credit-card"></i></div><span>Cartões</span></div>
            <div class="menu-item"><div class="icon-box"><i class="fa-solid fa-chart-line"></i></div><span>Investir</span></div>
        </nav>

        <div class="card-pro">
            <div style="font-size: 12px; color: var(--primary); font-weight: bold;">MEC-BANK PLATINUM</div>
            <div class="card-number">•••• •••• •••• 8835</div>
            <i class="fa-solid fa-microchip" style="position: absolute; right: 25px; bottom: 25px; font-size: 24px; color: #333;"></i>
        </div>

        <div style="background: var(--card); border-radius: 20px; padding: 20px; flex-grow: 1;">
            <p style="font-size: 14px; color: #666;">Atividade</p>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <div style="width: 40px; height: 40px; background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary);"><i class="fa-solid fa-arrow-down"></i></div>
                    <div><strong style="display: block; font-size: 14px;">Transferência</strong><small style="color: #444;">Hoje às 14:20</small></div>
                </div>
                <span style="color: var(--primary); font-weight: bold;">+ R$ 250,00</span>
            </div>
        </div>
    </div>

    <div id="dash-master" class="screen">
        <header class="header">
            <h2 style="color: var(--primary); font-size: 18px;">SHARK MASTER PANEL</h2>
            <i class="fa-solid fa-power-off" style="color: var(--danger);" onclick="location.reload()"></i>
        </header>

        <div class="shark-grid">
            <div class="stat-card"><small style="color: #666;">Faturamento Total</small><h3 id="master-total">R$ 1.450.850</h3></div>
            <div class="stat-card"><small style="color: #666;">Contas Ativas</small><h3>842</h3></div>
        </div>

        <div class="import-btn" onclick="document.getElementById('fileIn').click()">
            <i class="fa-solid fa-file-csv" style="font-size: 24px; margin-bottom: 10px;"></i>
            <p>IMPORTAR PLANILHA (XLSX/CSV)</p>
            <input type="file" id="fileIn" hidden onchange="importMaster(event)">
        </div>

        <button class="btn-main" style="background: var(--danger); color: white; margin-top: 20px;" onclick="alert('Sistema Bloqueado!')">BLOQUEIO GERAL</button>
    </div>

    <div id="cam-layer">
        <h3 id="cam-title">ESCANEANDO</h3>
        <div class="scanner-frame">
            <div class="scan-line"></div>
            <video id="v-preview" playsinline></video>
        </div>
        <button class="btn-main" style="margin-top: 40px; background: #fff; color: #000;" onclick="closeScanner()">Cancelar</button>
    </div>

    <script>
        function handleAuth() {
            const user = document.getElementById('login-user').value.toLowerCase();
            document.getElementById('auth-screen').classList.remove('active');
            
            if(user === 'shark') {
                document.getElementById('dash-master').classList.add('active');
            } else {
                document.getElementById('name-client').innerText = user;
                document.getElementById('av-client').innerText = user[0].toUpperCase();
                document.getElementById('dash-client').classList.add('active');
            }
        }

        function toggleBlur() {
            document.getElementById('bal-client').classList.toggle('blur');
        }

        async function openScanner(title) {
            document.getElementById('cam-title').innerText = title;
            document.getElementById('cam-layer').style.display = 'flex';
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('v-preview').srcObject = stream;
            document.getElementById('v-preview').play();
        }

        function closeScanner() {
            const video = document.getElementById('v-preview');
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('qr-layer').style.display = 'none'; // Fallback
            document.getElementById('cam-layer').style.display = 'none';
        }

        function importMaster(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                alert("Planilha Master Processada com Sucesso! Dados atualizados.");
                document.getElementById('master-total').innerText = "R$ 1.890.420"; // Exemplo de refresh
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
