<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SERGEL REMANSO CAMPINEIRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #e63946; --blue: #1d3557; --green: #25d366; --bg: #f8f9fa; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; text-transform: uppercase; }
        
        header { background: var(--red); color: #fff; padding: 25px; text-align: center; border-radius: 0 0 20px 20px; }
        .logo-btn { font-weight: 900; font-size: 22px; cursor: pointer; border: none; background: none; color: white; width: 100%; line-height: 1.2; }

        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .info h4 { margin: 0; color: #333; font-size: 13px; }
        .info p { margin: 2px 0; color: var(--red); font-weight: 700; }

        .controls { display: flex; align-items: center; gap: 10px; }
        .btn-qtd { background: #eee; border: none; width: 30px; height: 30px; border-radius: 5px; font-weight: bold; }

        /* RODAPÉ FINALIZAR */
        .footer-cart { position: fixed; bottom: 0; width: 100%; background: #fff; padding: 15px; box-sizing: border-box; border-top: 2px solid #eee; display: flex; flex-direction: column; gap: 10px; }
        .btn-finalizar { background: var(--green); color: white; text-align: center; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 16px; }

        /* PAINEL ADMIN */
        #admin-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 999; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .admin-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; font-size: 11px; }
    </style>
</head>
<body onload="carregar()">

<header>
    <button class="logo-btn" onclick="acessoAdmin()">SERGEL<br>REMANSO CAMPINEIRO</button>
    <div style="font-size: 9px; opacity: 0.9; margin-top: 5px;">SOMENTE RETIRADA NO LOCAL</div>
</header>

<div class="container" id="menu-cliente"></div>

<div class="footer-cart">
    <input type="text" id="cliente-nome" placeholder="SEU NOME PARA RETIRADA">
    <div id="total-display" style="font-weight: bold; text-align: center; color: var(--blue);">TOTAL: R$ 0,00</div>
    <button class="btn-finalizar" onclick="enviarPedido()">FINALIZAR PEDIDO NO ZAP</button>
</div>

<div id="admin-screen">
    <button onclick="fecharAdmin()" style="width: 100%; padding: 10px; background: #333; color: white; border: none; margin-bottom: 20px;">VOLTAR AO CARDÁPIO</button>
    
    <div style="background:#f1f1f1; padding:15px; border-radius:10px;">
        <h3>NOVO SABOR/PRODUTO</h3>
        <input type="text" id="new-nome" placeholder="NOME DO ITEM">
        <input type="number" id="new-preco" placeholder="PREÇO (EX: 25.00)">
        <button onclick="addItem()" style="width:100%; padding:12px; background:var(--blue); color:white; border:none; margin-top:5px;">ADICIONAR</button>
    </div>

    <h3>ESTOQUE E RELATÓRIO</h3>
    <div id="lista-estoque"></div>
    <button onclick="baixarRelatorio()" style="width: 100%; padding: 15px; background: var(--red); color: white; border: none; margin-top: 20px; font-weight: bold;">📊 BAIXAR RELATÓRIO MENSAL</button>
</div>

<script>
    let cardapio = JSON.parse(localStorage.getItem('sergel_remanso_db')) || [
        { id: 1, nome: "PICOLÉ LEITE/ÁGUA", preco: 2.80, status: true },
        { id: 2, nome: "POTE 2L CHOCOLATE", preco: 25.00, status: true }
    ];
    let carrinho = {};
    let vendas = JSON.parse(localStorage.getItem('sergel_vendas_logs')) || [];

    function carregar() { renderCliente(); renderAdmin(); }

    function renderCliente() {
        let h = "";
        cardapio.forEach(p => {
            if(p.status) {
                h += `
                    <div class="card">
                        <div class="info">
                            <h4>${p.nome}</h4>
                            <p>R$ ${p.preco.toFixed(2)}</p>
                        </div>
                        <div class="controls">
                            <button class="btn-qtd" onclick="addCart(${p.id}, -1)">-</button>
                            <span id="qtd-${p.id}">${carrinho[p.id] || 0}</span>
                            <button class="btn-qtd" onclick="addCart(${p.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }
        });
        document.getElementById('menu-cliente').innerHTML = h;
    }

    function addCart(id, qtd) {
        carrinho[id] = (carrinho[id] || 0) + qtd;
        if(carrinho[id] <= 0) delete carrinho[id];
        document.getElementById(`qtd-${id}`).innerText = carrinho[id] || 0;
        atualizarTotal();
    }

    function atualizarTotal() {
        let total = 0;
        for(let id in carrinho) {
            let p = cardapio.find(x => x.id == id);
            total += p.preco * carrinho[id];
        }
        document.getElementById('total-display').innerText = `TOTAL: R$ ${total.toFixed(2)}`;
    }

    function enviarPedido() {
        let nomeCli = document.getElementById('cliente-nome').value;
        if(!nomeCli) return alert("POR FAVOR, DIGITE SEU NOME");
        
        let msg = `*PEDIDO: SERGEL REMANSO*\n`;
        msg += `*CLIENTE:* ${nomeCli.toUpperCase()}\n`;
        msg += `--------------------------\n`;
        
        let total = 0;
        for(let id in carrinho) {
            let p = cardapio.find(x => x.id == id);
            let sub = p.preco * carrinho[id];
            msg += `${carrinho[id]}x ${p.nome} - R$ ${sub.toFixed(2)}\n`;
            total += sub;
            vendas.push({ data: new Date().toLocaleDateString(), item: p.nome, valor: sub });
        }

        if(total === 0) return alert("CARRINHO VAZIO");

        msg += `--------------------------\n`;
        msg += `*TOTAL: R$ ${total.toFixed(2)}*\n\n`;
        msg += `*MODALIDADE: RETIRADA NO LOCAL*\n`;
        msg += `_(NÃO FAZEMOS ENTREGA)_`;

        localStorage.setItem('sergel_vendas_logs', JSON.stringify(vendas));
        window.open(`https://wa.me/551999999999?text=${encodeURIComponent(msg)}`);
    }

    // ADMIN FUNCTIONS
    function renderAdmin() {
        let h = "";
        cardapio.forEach(p => {
            h += `<div class="admin-item">
                <span>${p.nome}</span>
                <button onclick="toggleStatus(${p.id})" style="background:${p.status?'#25d366':'#ccc'}; border:none; color:white; border-radius:5px; padding:5px;">
                    ${p.status ? 'ON' : 'OFF'}
                </button>
            </div>`;
        });
        document.getElementById('lista-estoque').innerHTML = h;
        localStorage.setItem('sergel_remanso_db', JSON.stringify(cardapio));
    }

    function toggleStatus(id) {
        let item = cardapio.find(x => x.id === id);
        item.status = !item.status;
        carregar();
    }

    function addItem() {
        let n = document.getElementById('new-nome').value.toUpperCase();
        let p = parseFloat(document.getElementById('new-preco').value);
        if(n && p) {
            cardapio.push({ id: Date.now(), nome: n, preco: p, status: true });
            carregar();
        }
    }

    function acessoAdmin() {
        if(prompt("SENHA ADMIN:") === "9910") document.getElementById('admin-screen').style.display = "block";
    }
    function fecharAdmin() { document.getElementById('admin-screen').style.display = "none"; }

    function baixarRelatorio() {
        let csv = "DATA,ITEM,VALOR\n";
        vendas.forEach(v => { csv += `${v.data},${v.item},${v.valor}\n`; });
        let blob = new Blob([csv], { type: 'text/csv' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "RELATORIO_MENSAL_SERGEL.csv";
        a.click();
    }
</script>
</body>
</html>
