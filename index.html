<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MECSHOP | Sistema de Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ea1d2c; --dark: #0a0a0a; --card: #141414; --border: #222; --text: #fff; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); margin: 0; overflow-x: hidden; }
        
        /* TELA PÚBLICA (COBERTURA) */
        #site-publico { padding: 100px 20px; text-align: center; transition: 0.5s; }
        .logo { font-size: 50px; font-weight: 800; color: var(--red); margin: 0; }
        .slogan { font-size: 10px; letter-spacing: 5px; color: #555; text-transform: uppercase; }

        /* PAINEL RESTRITO (O ARSENAL) */
        #painel-restrito { display: none; padding: 20px; animation: fadeIn 0.5s; }
        .header-adm { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--red); padding-bottom: 15px; margin-bottom: 20px; }
        
        /* FILTROS */
        .filtros-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 20px; scrollbar-width: none; }
        .btn-filter { background: var(--card); border: 1px solid var(--border); color: #888; padding: 10px 18px; border-radius: 25px; cursor: pointer; white-space: nowrap; font-size: 11px; font-weight: 600; transition: 0.3s; }
        .btn-filter.active { background: var(--red); color: #fff; border-color: var(--red); }

        /* GRID DE MODELOS */
        .grid-arsenal { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .model-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; position: relative; }
        .model-card:hover { border-color: var(--red); transform: translateY(-5px); }
        .model-card b { font-size: 16px; color: var(--red); display: block; margin-bottom: 5px; }
        .model-card p { font-size: 11px; color: #777; margin: 0; }
        .badge-nivel { position: absolute; top: 15px; right: 15px; font-size: 8px; color: #555; font-weight: 800; }

        /* SIMULADOR (CELULAR) */
        #modal-teste { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; align-items: center; justify-content: center; }
        .simulador { width: 90%; max-width: 360px; height: 85vh; background: #fff; border-radius: 30px; border: 8px solid #333; overflow: hidden; color: #333; position: relative; }
        .sim-header { background: var(--red); color: #fff; padding: 15px; font-weight: 800; display: flex; justify-content: space-between; font-size: 14px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="site-publico">
        <h1 class="logo">MECSHOP</h1>
        <div class="slogan">Sistemas de Alta Performance</div>
        <p style="margin-top: 50px; color: #333; font-size: 12px;">Pressione as teclas para autenticar...</p>
        <p style="color: #222; font-size: 10px;">(Dica: digite a senha secreta agora)</p>
    </div>

    <div id="painel-restrito">
        <div class="header-adm">
            <div><b style="color: var(--red);">MECSHOP ARSENAL</b><br><small>Do Micro ao Shark</small></div>
            <button onclick="window.location.reload()" style="background:#222; color:#fff; border:none; padding:8px 15px; border-radius:5px; font-size: 10px;">SAIR</button>
        </div>

        <div class="filtros-nav">
            <button class="btn-filter active" onclick="filtrar('TODOS', this)">TODOS</button>
            <button class="btn-filter" onclick="filtrar('MICRO', this)">MICRO</button>
            <button class="btn-filter" onclick="filtrar('SERVICO', this)">SERVIÇOS</button>
            <button class="btn-filter" onclick="filtrar('LOGISTICA', this)">LOGÍSTICA</button>
            <button class="btn-filter" onclick="filtrar('SHARK', this)">SHARK</button>
        </div>

        <div class="grid-arsenal" id="grid"></div>
    </div>

    <div id="modal-teste" onclick="fecharTeste()">
        <div class="simulador" onclick="event.stopPropagation()">
            <div class="sim-header"><span id="tit-teste">MECSHOP PRO</span> <span>✕</span></div>
            <div id="cont-teste" style="padding: 20px; overflow-y: auto; height: 100%;"></div>
        </div>
    </div>

<script>
    const SENHA_MESTRA = "9910shark"; 
    let buffer = "";

    // Escuta a senha para abrir o Arsenal
    document.addEventListener('keydown', (e) => {
        buffer += e.key.toLowerCase();
        if(buffer.includes(SENHA_MESTRA)) {
            document.getElementById('site-publico').style.display = 'none';
            document.getElementById('painel-restrito').style.display = 'block';
            buffer = "";
        }
    });

    const modelos = [
        { id:1, cat:'MICRO', nome:'Hortifruti Pro', desc:'Organização de pedidos por setor.', demo:'<h3>🍎 Pedido #102</h3><p>• 1kg Tomate<br>• 2x Alface Fresca</p><button style="background:green; color:white; width:100%; border:none; padding:10px;">ENVIAR AO MOTOBOY</button>' },
        { id:8, cat:'SERVICO', nome:'Painel Barbearia', desc:'Agendamento e Status de Cadeira.', demo:'<h3>💈 Status Agenda</h3><p>Cliente: João<br>Serviço: Corte + Barba</p><div style="background:#eee; padding:10px; border-radius:5px;"><b>Status: EM ATENDIMENTO</b></div>' },
        { id:15, cat:'LOGISTICA', nome:'Tênis (Sneakers)', desc:'Grade 34-44 e Etiqueta DHL.', demo:'<h3>👟 Loja de Tênis</h3><p>Modelo: Jordan Retro<br>Tam: 42 | Cor: Black</p><button style="background:black; color:white; width:100%; border:none; padding:10px;">GERAR ETIQUETA DHL</button>' },
        { id:22, cat:'SHARK', nome:'BET-SHARK (Apostas)', desc:'Sinais API e Saque Automático.', demo:'<h3>🎰 Dashboard Shark</h3><p>Saldo Afiliados: R$ 15.400,00</p><div style="background:#00ff00; padding:10px; border-radius:5px; color:#000"><b>SINAL ENVIADO: ENTRAR NO VERMELHO</b></div>' },
        { id:24, cat:'SHARK', nome:'MEC-BANK (Fintech)', desc:'Gestão de Lucro e Vencimentos.', demo:'<h3>🏦 MEC-BANK</h3><p>Lucro Líquido: R$ 8.900,00</p><p>Vencimentos Hoje: 3 boletos</p><button style="background:blue; color:white; width:100%; border:none; padding:10px;">VER FLUXO DE CAIXA</button>' }
    ];

    function filtrar(cat, btn) {
        const grid = document.getElementById('grid');
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const lista = (cat === 'TODOS') ? modelos : modelos.filter(m => m.cat === cat);
        grid.innerHTML = lista.map(m => `
            <div class="model-card" onclick="abrirTeste(${m.id})">
                <div class="badge-nivel">${m.cat}</div>
                <b>${m.nome}</b>
                <p>${m.desc}</p>
            </div>
        `).join('');
    }

    function abrirTeste(id) {
        const m = modelos.find(x => x.id === id);
        document.getElementById('tit-teste').innerText = m.nome;
        document.getElementById('cont-teste').innerHTML = m.demo;
        document.getElementById('modal-teste').style.display = 'flex';
    }

    function fecharTeste() { document.getElementById('modal-teste').style.display = 'none'; }

    filtrar('TODOS', document.querySelector('.btn-filter'));
</script>
</body>
</html>
