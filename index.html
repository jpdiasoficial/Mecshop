<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v79 SHARK | JP MASTER</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --p: #00ff41; --bg: #000; --card: #080808; --brd: #151515; --danger: #ff3131; --blue: #00d4ff; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; font-size: 10px; height: 100vh; overflow: hidden; }
        
        header { padding: 12px; background: #050505; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; color: var(--p); }
        .screen { display: none; height: 100vh; flex-direction: column; background: #000; }
        .active { display: flex !important; }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 150px; }

        /* BOTOES VISÃO SHARK */
        .btn { width: 100%; padding: 16px; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .btn-p { background: var(--p); color: #000; }
        .btn-dark { background: #111; color: #fff; border: 1px solid #222; }
        .btn-danger { background: #200; color: var(--danger); border: 1px solid var(--danger); font-size: 8px; }

        input, select, textarea { width: 100%; padding: 14px; background: #0a0a0a; border: 1px solid #222; color: var(--p); border-radius: 4px; font-family: 'Orbitron'; margin-bottom: 10px; font-size: 11px; }
        
        .card { background: var(--card); border: 1px solid var(--brd); border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .row-viva { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #111; align-items: center; }
        .badge { background: rgba(0,255,65,0.1); color: var(--p); padding: 3px 8px; border-radius: 3px; font-weight: 900; border: 1px solid var(--p); }

        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid #111; margin-bottom: 10px; background: #050505; }
        
        /* TABELA SHARK */
        .table-wrapper { border: 1px solid #111; border-radius: 8px; overflow-x: auto; background: #050505; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #000; color: #444; padding: 10px; text-align: left; font-size: 8px; border-bottom: 2px solid #111; }
        td { padding: 10px; border-bottom: 1px solid #080808; font-size: 10px; color: #ccc; }

        /* PRINT */
        .label-print { display:none; width: 40mm; height: 30mm; background:#fff; color:#000; padding:10px; text-align:center; }
        @media print { .screen, header { display:none !important; } .label-print { display:block !important; } }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active" style="align-items:center; justify-content:center;">
    <div style="font-family:'Orbitron'; color:var(--p); font-size:40px; font-weight:900; text-align:center; line-height:0.8;">LOG-PRO<br><span style="font-size:10px; color:#333; letter-spacing:8px;">SHARK V79</span></div>
    <div style="width: 280px; margin-top:40px;">
        <input type="text" id="user-name" placeholder="OPERADOR">
        <input type="password" id="pass" placeholder="CHAVE SHARK">
        <button class="btn btn-p" onclick="auth()">ENTRAR NO FLUXO</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span>SHARK COMMAND</span> <button onclick="logout()" style="color:var(--danger); background:none; border:none; font-family:'Orbitron';">SAIR</button></header>
    <div class="scroll">
        
        <div class="card">
            <h3 style="color:var(--p); margin-top:0;">1. GESTÃO DE CARGA (IMPORTAR)</h3>
            <textarea id="list-input" placeholder="COPIE E COLE DA PLANILHA (COD, QTD)" style="height:60px;"></textarea>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                <button class="btn btn-p" onclick="enviarCarga()">SUBIR LISTA</button>
                <button class="btn btn-danger" onclick="limparCarga()">APAGAR LISTA</button>
            </div>
        </div>

        <div class="card">
            <h3 style="color:var(--p); margin-top:0;">2. BASE MASTER (ENDEREÇAMENTO)</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                <input type="text" id="m-cod" placeholder="COD">
                <input type="text" id="m-end" placeholder="ENDEREÇO">
            </div>
            <button class="btn btn-dark" onclick="salvarMaster()">ATUALIZAR ENDEREÇO</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead><tr><th>HORA</th><th>OP</th><th>TIPO</th><th>ITEM</th><th>QTD</th><th>END</th></tr></thead>
                <tbody id="audit-body"></tbody>
            </table>
        </div>
        <button class="btn btn-dark" style="margin-top:10px; color:var(--blue);" onclick="exportarRelatorio()">BAIXAR CSV ROI</button>
        <button class="btn btn-danger" onclick="limparLogs()">RESETAR TODA AUDITORIA</button>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span id="display-user">OPERADOR</span> <button onclick="logout()" style="color:var(--danger); background:none; border:none; font-family:'Orbitron';">SAIR</button></header>
    <div class="scroll">
        
        <div class="card" style="border-left: 4px solid var(--p);">
            <h4 style="color:var(--p); margin:0; font-size:8px;">PENDENTE NA DOCA:</h4>
            <div id="op-list-picking" style="font-size:12px; font-weight:900; margin-top:5px;"></div>
        </div>

        <select id="mod-op" onchange="falar(this.value)">
            <option value="ENTRADA">📥 ENTRADA</option>
            <option value="SEPARACAO">📦 SEPARACAO</option>
            <option value="AVARIA">⚠️ AVARIA</option>
            <option value="SAIDA">🚚 EXPEDIÇÃO</option>
        </select>

        <div style="display:flex; gap:5px;">
            <input type="number" id="qtd-bipe" value="1" style="flex:1; text-align:center; font-size:20px;">
            <button class="btn btn-dark" style="flex:1; margin:0;" onclick="toggleCamera()">SCANNER</button>
        </div>

        <div id="reader"></div>

        <div id="op-audit-body" class="card" style="background:#050505; color:#555; font-size:9px; height:60px; overflow:hidden;">
            AGUARDANDO BIPE...
        </div>

        <button class="btn btn-dark" style="color:var(--blue);" onclick="gerarEtiqueta()">IMPRIMIR ETIQUETA</button>
    </div>
</div>

<div id="print-area" class="label-print">
    <div id="lp-nome" style="font-weight:bold; font-size:14px;"></div>
    <div id="lp-cod" style="font-size:10px;"></div>
    <div id="lp-end" style="font-size:22px; font-weight:900; border:2px solid #000; margin-top:5px;"></div>
</div>

<script>
    // --- LÓGICA SHARK ENGINE ---
    let BASE_M = JSON.parse(localStorage.getItem('LP_BASE')) || {};
    let CARGA = JSON.parse(localStorage.getItem('LP_CARGA')) || {};
    let LOGS = JSON.parse(localStorage.getItem('LP_LOGS')) || [];
    let currentUser = localStorage.getItem('LP_SESSION') || "";
    let scanner, camOn = false, ultimoCod = "";

    function falar(t) {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'pt-BR';
        window.speechSynthesis.speak(u);
    }

    function init() {
        if(currentUser) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const screen = (currentUser === "JP" || currentUser === "SHARK") ? 'scr-shark' : 'scr-op';
            document.getElementById(screen).classList.add('active');
            if(currentUser !== "JP") document.getElementById('display-user').innerText = currentUser;
            renderDoca();
            renderShark();
        }
    }

    // --- SISTEMA DE LOGIN ---
    function auth() {
        const u = document.getElementById('user-name').value.toUpperCase().trim();
        const p = document.getElementById('pass').value;
        if((u==="JP"||u==="SHARK") && p==="9910" || u!=="" && p==="1234") {
            localStorage.setItem('LP_SESSION', u);
            location.reload();
        } else {
            falar("Acesso Negado");
            alert("CHAVE INCORRETA");
        }
    }

    function logout() { localStorage.removeItem('LP_SESSION'); location.reload(); }

    // --- GESTÃO DE CARGA (PLANILHA) ---
    function enviarCarga() {
        const texto = document.getElementById('list-input').value;
        const linhas = texto.split('\n');
        linhas.forEach(l => {
            const [cod, qtd] = l.split(',');
            if(cod && qtd) {
                const c = cod.trim();
                CARGA[c] = { cod: c, qtd_pedida: parseInt(qtd), qtd_feita: 0 };
            }
        });
        localStorage.setItem('LP_CARGA', JSON.stringify(CARGA));
        alert("CARGA SINCRONIZADA");
        renderDoca();
    }

    function limparCarga() {
        if(confirm("LIMPAR TODA A LISTA DE CARGA?")) {
            CARGA = {};
            localStorage.setItem('LP_CARGA', JSON.stringify(CARGA));
            renderDoca();
        }
    }

    function limparLogs() {
        if(confirm("APAGAR HISTÓRICO DE AUDITORIA?")) {
            LOGS = [];
            localStorage.setItem('LP_LOGS', JSON.stringify(LOGS));
            renderShark();
        }
    }

    // --- OPERAÇÃO ---
    async function processar(cod) {
        ultimoCod = cod.trim();
        const q = parseInt(document.getElementById('qtd-bipe').value) || 1;
        const tipo = document.getElementById('mod-op').value;
        
        if(!BASE_M[ultimoCod]) {
            falar("Novo item detectado");
            const n = prompt("NOME DO ITEM:");
            const e = prompt("ENDEREÇO:");
            if(n) {
                BASE_M[ultimoCod] = { nome: n.toUpperCase(), endereco: e.toUpperCase() };
                localStorage.setItem('LP_BASE', JSON.stringify(BASE_M));
            } else return;
        }

        const info = BASE_M[ultimoCod];
        const mov = { 
            hora: new Date().toLocaleTimeString(), 
            op: currentUser, t: tipo, n: info.nome, q: q, end: info.endereco 
        };

        LOGS.unshift(mov);
        localStorage.setItem('LP_LOGS', JSON.stringify(LOGS));

        if(tipo === "SEPARACAO" && CARGA[ultimoCod]) {
            CARGA[ultimoCod].qtd_feita += q;
            localStorage.setItem('LP_CARGA', JSON.stringify(CARGA));
            falar("Item Conferido");
        } else {
            falar("Bipado");
        }

        document.getElementById('op-audit-body').innerHTML = `[${mov.hora}] ${info.nome} x${q}<br>` + document.getElementById('op-audit-body').innerHTML;
        renderDoca();
        renderShark();
    }

    function renderDoca() {
        if(!document.getElementById('op-list-picking')) return;
        let h = "";
        Object.values(CARGA).forEach(p => {
            const falta = p.qtd_pedida - p.qtd_feita;
            if(falta > 0) h += `<div class="row-viva"><span>${BASE_M[p.cod]?.nome || p.cod}</span> <span class="badge">FALTAM ${falta}</span></div>`;
        });
        document.getElementById('op-list-picking').innerHTML = h || "CARGA CONCLUÍDA ✅";
    }

    function renderShark() {
        if(!document.getElementById('audit-body')) return;
        let h = "";
        LOGS.slice(0, 50).forEach(m => {
            h += `<tr><td>${m.hora}</td><td>${m.op}</td><td>${m.t}</td><td>${m.n}</td><td>${m.q}</td><td>${m.end}</td></tr>`;
        });
        document.getElementById('audit-body').innerHTML = h;
    }

    // --- AUXILIARES ---
    function salvarMaster() {
        const c = document.getElementById('m-cod').value.trim();
        const e = document.getElementById('m-end').value.toUpperCase();
        if(c && BASE_M[c]) {
            BASE_M[c].endereco = e;
            localStorage.setItem('LP_BASE', JSON.stringify(BASE_M));
            alert("ENDEREÇO ATUALIZADO");
        }
    }

    async function toggleCamera() {
        if(!camOn) {
            scanner = new Html5Qrcode("reader");
            await scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (t) => processar(t));
            camOn = true;
        } else {
            await scanner.stop();
            camOn = false;
        }
    }

    function exportarRelatorio() {
        let csv = "HORA,OP,TIPO,ITEM,QTD,ENDERECO\n";
        LOGS.forEach(m => { csv += `${m.hora},${m.op},${m.t},${m.n},${m.q},${m.end}\n`; });
        const blob = new Blob([csv], {type: 'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `LOGPRO_ROI_SHARK.csv`;
        a.click();
    }

    function gerarEtiqueta() {
        if(!ultimoCod || !BASE_M[ultimoCod]) return alert("BIPE O ITEM");
        document.getElementById('lp-nome').innerText = BASE_M[ultimoCod].nome;
        document.getElementById('lp-cod').innerText = ultimoCod;
        document.getElementById('lp-end').innerText = BASE_M[ultimoCod].endereco;
        window.print();
    }
</script>
</body>
    </html>
