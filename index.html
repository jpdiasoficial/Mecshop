<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | GENESIS V170</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@500&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff9f0a; --bg: #050505; --surface: #121212; --border: rgba(255,159,10,0.3); --green: #30d158; --blue: #0a84ff; --red: #ff375f; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; overflow: hidden; height: 100vh; }
        .glass { background: rgba(25, 25, 25, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 12px; }
        
        /* --- PORTAL --- */
        #portal { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .btn-access { width: 300px; padding: 18px; margin: 10px; background: var(--surface); border: 1px solid var(--border); color: #fff; font-family: 'JetBrains Mono'; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-radius: 4px; }
        
        /* --- LOBBY DIRETORIA --- */
        #lobby { display: none; padding: 20px; animation: fadeIn 0.5s; overflow-y: auto; height: 100vh; }
        .card-adm { background: var(--surface); border: 1px solid var(--primary); padding: 15px; border-radius: 8px; margin-bottom: 20px; }

        /* --- MÓDULOS --- */
        .modulo { display: none; padding: 20px; height: 100vh; animation: fadeIn 0.4s; }
        .display-v { flex: 1; border: 2px solid var(--primary); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: rgba(255,159,10,0.05); margin-bottom: 20px; }
        .terminal { background: #000; color: #666; padding: 15px; height: 150px; overflow-y: auto; font-family: 'JetBrains Mono'; font-size: 11px; border: 1px solid #222; border-radius: 5px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="portal">
    <h1 style="font-family:'Orbitron'; letter-spacing:8px; margin-bottom:30px;">JP DIAS</h1>
    <button class="btn-access" onclick="acesso('GOD')">GOD (OWNER) <span>⚡</span></button>
    <button class="btn-access" onclick="acesso('SHARK')">SHARK (CLIENT) <span>🦈</span></button>
    <button class="btn-access" onclick="acesso('MOTORISTA')">MOTORISTA <span>🚚</span></button>
</div>

<div id="lobby">
    <div id="adm-controls" class="card-adm">
        <h3 style="font-family:'Orbitron'; font-size:12px; color:var(--primary); margin:0;">DIRETORIA ESTRATÉGICA</h3>
        <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
        <label style="font-size:10px;">LIBERAR MOTORISTA: <input type="checkbox" id="check-mot" checked></label><br><br>
        <label style="font-size:10px;">DEFINIR SETOR OPERAÇÃO: 
            <select id="select-setor">
                <option value="ARMAZEM">ARMAZÉM (VOZ ATIVA)</option>
                <option value="CROSSDOCK">CROSSDOCK (LISTA TÉCNICA)</option>
            </select>
        </label>
    </div>
    <div id="botoes-dinamicos"></div>
</div>

<div id="mod-operacao" class="modulo">
    <h2 id="titulo-mod" style="font-family:'Orbitron'; color:var(--primary); font-size:14px;">ARMAZÉM</h2>
    <div class="display-v">
        <div id="display-principal" style="font-family:'Orbitron'; font-size:24px; color:var(--primary);">DIGA "ATIVAR" 3X</div>
    </div>
    <div class="terminal" id="term-log">> AGUARDANDO COMANDO...</div>
    <button onclick="voltar()" style="width:100%; padding:15px; margin-top:20px; background:transparent; border:1px solid var(--red); color:var(--red); font-weight:bold;">SAIR</button>
</div>

<script>
    let roleAtiva = "";
    let counts = { ativar: 0 };
    let etapa = "ESPERA";

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const voice = Recognition ? new Recognition() : null;

    if(voice) {
        voice.continuous = true;
        voice.lang = 'pt-BR';
        voice.onresult = (e) => {
            const fala = e.results[e.results.length - 1][0].transcript.toLowerCase();
            processarVoz(fala);
        };
    }

    function acesso(r) {
        if(r !== 'MOTORISTA') {
            if(prompt("PASSWORD:") !== "123") return;
        }
        roleAtiva = r;
        document.getElementById('portal').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        montarLobby();
    }

    function montarLobby() {
        const bot = document.getElementById('botoes-dinamicos');
        bot.innerHTML = "";
        if(roleAtiva === 'MOTORISTA') {
            if(!document.getElementById('check-mot').checked) return alert("ACESSO BLOQUEADO PELA DIRETORIA");
            bot.innerHTML = `<button class="btn-access" style="width:100%; border-color:var(--blue)" onclick="abrirOp('MOTORISTA')">INICIAR ROTA 🚚</button>`;
        } else {
            const setor = document.getElementById('select-setor').value;
            bot.innerHTML = `<button class="btn-access" style="width:100%" onclick="abrirOp('${setor}')">ENTRAR EM ${setor} 📦</button>`;
        }
    }

    function abrirOp(modo) {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('mod-operacao').style.display = 'flex';
        document.getElementById('titulo-mod').innerText = modo;
        
        if(modo === 'ARMAZEM') {
            if(voice) voice.start();
            falar("Modo Armazém Ativo. Diga ativar três vezes.");
        } else if(modo === 'CROSSDOCK') {
            document.getElementById('display-principal').innerText = "LISTA DE BIPAGEM";
        }
    }

    function processarVoz(txt) {
        if(txt.includes("ativar")) {
            counts.ativar++;
            falar(counts.ativar);
            if(counts.ativar === 3) {
                document.getElementById('display-principal').innerHTML = "CASA A-12<br>4-8-2";
                falar("Ativado. Casa A-12. Código 482.");
                counts.ativar = 0;
            }
        }
    }

    function voltar() {
        if(voice) voice.stop();
        document.getElementById('mod-operacao').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
    }

    function falar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'pt-BR';
        window.speechSynthesis.speak(m);
    }
</script>
</body>
</html>
