<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v84 | SHARK COMMAND</title>
    
    <script src="https://unpkg.com"></script>
    <script src="https://cdn.jsdelivr.net"></script>
    <script src="https://www.gstatic.com"></script>
    <script src="https://www.gstatic.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">

    <style>
        :root { --neon: #00ff41; --bg: #000; --panel: #0d0d0d; --danger: #ff3131; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .shark-font { font-family: 'Orbitron'; color: var(--neon); }
        
        /* TELAS SEPARADAS */
        .screen { display: none; height: 100vh; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .active-screen { display: flex; }

        /* PAINEL SHARK (DASHBOARD) */
        .grid-shark { display: grid; grid-template-columns: 1fr 350px; gap: 20px; flex: 1; overflow: hidden; }
        .card { background: var(--panel); border: 1px solid #222; padding: 15px; border-radius: 10px; }

        /* PAINEL OPERADOR (SCANNER) */
        #reader { width: 100%; border-radius: 15px; border: 2px solid var(--neon); margin-top: 10px; }
        .btn-modo { flex: 1; padding: 15px; background: #111; border: 1px solid #333; color: #666; font-weight: bold; cursor: pointer; }
        .btn-modo.active { border-color: var(--neon); color: var(--neon); background: rgba(0,255,65,0.1); }

        /* CHAT / ORDENS */
        .chat-box { height: 100px; overflow-y: auto; background: #000; border: 1px solid #222; padding: 5px; font-size: 0.8rem; margin-top: 10px; color: var(--neon); }

        /* INPUTS */
        input, textarea { background: #000; color: var(--neon); border: 1px solid var(--neon); padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box; }
        .btn-main { background: var(--neon); color: #000; font-weight: bold; padding: 15px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Orbitron'; }

        #hidden-input { position: absolute; left: -9999px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN -->
    <div id="screen-login" class="screen active-screen" style="justify-content: center; align-items: center;">
        <h1 class="shark-font" style="font-size: 3rem;">LOG-PRO</h1>
        <p style="color:var(--neon); margin-bottom: 30px;">v84 COMMAND & CONTROL</p>
        <input type="password" id="pin" style="width: 250px; font-size: 1.5rem; text-align: center;" placeholder="PIN">
        <button class="btn-main" style="width: 250px; margin-top: 20px;" onclick="auth()">ENTRAR NO SISTEMA</button>
    </div>

    <!-- 2. TELA DO OPERADOR (MOBILE) -->
    <div id="screen-op" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="shark-font" id="op-modo-display">MODO: ENTRADA</span>
            <div id="net-op" style="font-size: 0.6rem; color: var(--neon);">● ONLINE</div>
        </div>
        
        <div id="reader"></div>
        <input type="text" id="hidden-input">

        <div class="card" style="margin-top: 15px;">
            <div id="last-bip" class="shark-font" style="font-size: 1.5rem;">---</div>
            <div id="msg-op" style="color: #00d4ff; font-weight: bold; font-size: 0.8rem;">AGUARDANDO BIP...</div>
        </div>

        <div class="chat-box" id="op-chat">BEM-VINDO AO TURNO, SHARK.</div>
    </div>

    <!-- 3. TELA DO SHARK (ADMIN/DASHBOARD) -->
    <div id="screen-shark" class="screen">
        <div class="grid-shark">
            <div class="col">
                <h2 class="shark-font">DASHBOARD DE OPERAÇÃO</h2>
                <canvas id="chartShark" height="150"></canvas>
                
                <div class="card" style="margin-top: 20px;">
                    <h3>CONTROLO DE CARGA</h3>
                    <textarea id="carga-input" placeholder="CODIGO, QTD"></textarea>
                    <button class="btn-main" style="width: 100%; margin-top: 10px;" onclick="lancarCarga()">DISPARAR PARA OPERACIONAL</button>
                </div>
            </div>

            <div class="col">
                <div class="card" style="height: 100%;">
                    <h3 class="shark-font" style="font-size: 0.8rem;">ESTADO DAS DOCAS</h3>
                    <div id="status-docas" style="height: 300px; overflow-y: auto; font-size: 0.8rem;"></div>
                    
                    <h3 class="shark-font" style="font-size: 0.8rem; margin-top: 20px;">ENVIAR ORDEM DE VOZ</h3>
                    <input type="text" id="chat-msg" placeholder="Digite para o operador ouvir...">
                    <button class="btn-main" style="width: 100%; margin-top: 5px; font-size: 0.7rem;" onclick="enviarOrdem()">ENVIAR COMANDO</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = { apiKey: "AIza...", projectId: "logpro-shark", appId: "1:..." };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userRole = 'OP';

    // 1. AUTENTICAÇÃO INTELIGENTE
    function auth() {
        const pin = document.getElementById('pin').value;
        document.getElementById('screen-login').classList.remove('active-screen');
        
        if(pin === "7979") {
            userRole = 'SHARK';
            document.getElementById('screen-shark').classList.add('active-screen');
            initDashboard();
        } else {
            userRole = 'OP';
            document.getElementById('screen-op').classList.add('active-screen');
            initScanner();
        }
        falar("Sistema Log Pro Inicializado");
    }

    // 2. SISTEMA DE VOZ E COMUNICAÇÃO
    function falar(t) {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'pt-PT';
        window.speechSynthesis.speak(u);
    }

    // Listener de Chat (O Operador ouve o que o Shark escreve)
    db.collection("ordens").doc("atual").onSnapshot(doc => {
        if(doc.exists && userRole === 'OP') {
            const msg = doc.data().msg;
            falar(msg);
            document.getElementById('op-chat').innerHTML = `[ORDEM]: ${msg}<br>` + document.getElementById('op-chat').innerHTML;
        }
    });

    function enviarOrdem() {
        const msg = document.getElementById('chat-msg').value;
        db.collection("ordens").doc("atual").set({ msg, ts: Date.now() });
        document.getElementById('chat-msg').value = "";
    }

    // 3. PROCESSAMENTO DE BIPE (OP)
    async function processar(codigo) {
        const cod = codigo.trim();
        if(!cod) return;
        document.getElementById('last-bip').innerText = cod;

        // Salva Log
        await db.collection("logs").add({ cod, user: 'OP1', ts: firebase.firestore.FieldValue.serverTimestamp() });

        // Lógica de Baixa na Carga
        const ref = db.collection("carga").doc(cod);
        const doc = await ref.get();
        if(doc.exists && doc.data().falta > 0) {
            await ref.update({ falta: firebase.firestore.FieldValue.increment(-1) });
            document.getElementById('msg-op').innerText = "BAIXA CONCLUÍDA!";
            document.getElementById('msg-op').style.color = "var(--neon)";
            falar("Ok");
        } else {
            document.getElementById('msg-op').innerText = "NÃO CONSTA NA CARGA!";
            document.getElementById('msg-op').style.color = "var(--danger)";
            falar("Atenção, item fora da lista");
        }
        document.getElementById('hidden-input').value = "";
    }

    // 4. DASHBOARD (SHARK)
    function initDashboard() {
        const ctx = document.getElementById('chartShark').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Entrada', 'Saída', 'Avaria'], datasets: [{ label: 'Volumes', data: [12, 19, 3], backgroundColor: '#00ff41' }] },
            options: { color: '#fff' }
        });

        // Monitor de Docas Real-Time
        db.collection("carga").onSnapshot(snap => {
            const div = document.getElementById('status-docas');
            div.innerHTML = "";
            snap.forEach(d => {
                div.innerHTML += `<div class="card" style="margin-bottom:5px;">${d.id} - Faltam: ${d.data().falta}</div>`;
            });
        });
    }

    // 5. AUXILIARES
    function lancarCarga() {
        const txt = document.getElementById('carga-input').value;
        txt.split('\n').forEach(l => {
            const [c, q] = l.split(',');
            if(c && q) db.collection("carga").doc(c.trim()).set({ falta: parseInt(q) });
        });
        alert("Carga disparada!");
    }

    function initScanner() {
        const sc = new Html5Qrcode("reader");
        sc.start({ facingMode: "environment" }, { fps: 30, qrbox: 250 }, (t) => processar(t));
        setInterval(() => document.getElementById('hidden-input').focus(), 1000);
        document.getElementById('hidden-input').addEventListener('change', (e) => processar(e.target.value));
    }
</script>
</body>
</html>
