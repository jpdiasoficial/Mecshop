<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO | TECNOLOGIA JP DIAS</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000000; --input-bg: #111111; --out: #ff3b30; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; background: #000; }
        .active { display: flex !important; }
        
        /* ESTILO NEON JP DIAS */
        .logo-main { font-family: 'Orbitron'; color: var(--primary); font-size: 38px; letter-spacing: 4px; margin: 0; }
        .sub-logo { font-size: 8px; color: #444; letter-spacing: 3px; margin-bottom: 40px; }
        
        .input-group { width: 85%; max-width: 400px; }
        input, select { width: 100%; padding: 18px; background: var(--input-bg); border: 1px solid #222; color: #fff; font-family: 'Orbitron'; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        .btn-green { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 11px; }
        
        header { width: 100%; padding: 15px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; font-family: 'Orbitron'; font-size: 10px; }
        .scroll { flex: 1; overflow-y: auto; width: 100%; padding: 20px; box-sizing: border-box; }
        
        #reader { width: 100%; border-radius: 12px; border: 1px solid #222 !important; background: #050505; min-height: 200px; margin-bottom: 15px; display: none; }
        .card { background: #080808; padding: 15px; border-radius: 10px; border-left: 3px solid var(--primary); margin-bottom: 10px; width: 100%; box-sizing: border-box; position: relative; }
        
        table { width: 100%; border-collapse: collapse; font-size: 10px; }
        th { color: #444; text-align: left; padding: 10px; border-bottom: 1px solid #111; }
        td { padding: 12px 10px; border-bottom: 1px solid #050505; color: #888; }
        .btn-del { color: var(--out); background: none; border: 1px solid #222; padding: 5px; border-radius: 4px; font-size: 8px; cursor: pointer; }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active">
    <div class="input-group">
        <h1 class="logo-main">LOG-PRO</h1>
        <p class="sub-logo">SISTEMA TECNOLOGIA JP DIAS</p>
        <input type="password" id="pass" placeholder="SENHA DE ACESSO" inputmode="numeric">
        <button class="btn-green" onclick="auth()">ENTRAR NO SISTEMA</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header>
        <span style="color:var(--primary)">PAINEL DE COMANDO</span>
        <button onclick="limparTudo()" style="background:var(--out); border:none; color:#fff; font-family:'Orbitron'; font-size:8px; padding:5px 10px; border-radius:4px;">ZERAR TUDO</button>
    </header>
    <div class="scroll">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
            <div class="card"><small style="color:#444; font-size:7px;">ESTOQUE ATUAL</small><br><b id="tot-geral" style="font-size:22px;">0</b></div>
            <div class="card"><small style="color:#444; font-size:7px;">SKUs ATIVOS</small><br><b id="tot-itens" style="font-size:22px;">0</b></div>
        </div>
        <table>
            <thead><tr><th>ITEM / REGISTRO</th><th>QTD</th><th>AÇÃO</th></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<div id="scr-op" class="screen">
    <header>
        <span>COLETOR V26.6</span>
        <button id="btn-sync" style="display:none; background:var(--primary); border:none; padding:5px 10px; font-family:'Orbitron'; font-size:9px;" onclick="enviarLote()">SUBIR PARA O PAINEL</button>
    </header>
    <div class="scroll">
        <select id="sel-mod-op">
            <option value="IN">📥 ENTRADA (CADASTRAR)</option>
            <option value="OUT">📤 SAÍDA (BAIXA)</option>
        </select>
        
        <div id="reader"></div>
        <button class="btn-green" id="btn-cam" onclick="toggleCamera()">ABRIR CÂMERA (SCANNER)</button>

        <div id="lote-view" class="card" style="margin-top:20px; border-left-color:#333;">
            <small style="color:#444;">LISTA PARA EMISSÃO: <b id="lote-count" style="color:var(--primary);">0</b></small>
            <div id="lote-list" style="font-size:9px; color:#555; margin-top:10px; max-height:100px; overflow-y:auto;"></div>
        </div>
    </div>
</div>

<div id="modal-cad" class="screen" style="background:rgba(0,0,0,0.9); z-index:100;">
    <div class="input-group">
        <h2 style="font-family:'Orbitron'; color:var(--primary);">CADASTRAR ITEM</h2>
        <input type="text" id="input-nome" placeholder="NOME DO PRODUTO">
        <button class="btn-green" onclick="confirmarCadastro()">SALVAR NO ESTOQUE</button>
    </div>
</div>

<script>
    const canal = new BroadcastChannel('logpro_v26');
    let DB_LOGS = JSON.parse(localStorage.getItem('LOGS_JP')) || [];
    let CADASTRO = JSON.parse(localStorage.getItem('CAD_JP')) || {};
    let LOTE = [];
    let scanner = null;
    let camOn = false;
    let tempCod = "";

    function auth() {
        const p = document.getElementById('pass').value;
        if(p === "9910") ir('scr-shark');
        else if(p === "1234") ir('scr-op');
        else alert("ACESSO NEGADO");
    }

    function ir(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'scr-shark') atualizarPainel();
    }

    async function toggleCamera() {
        const rd = document.getElementById('reader');
        const btn = document.getElementById('btn-cam');
        if(!camOn) {
            rd.style.display = 'block';
            if(!scanner) scanner = new Html5Qrcode("reader");
            await scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => {
                processar(txt);
                toggleCamera(); // Desliga após bipar para economizar bateria
            });
            btn.innerText = "FECHAR CÂMERA";
            camOn = true;
        } else {
            if(scanner) await scanner.stop();
            rd.style.display = 'none';
            btn.innerText = "ABRIR CÂMERA (SCANNER)";
            camOn = false;
        }
    }

    function processar(cod) {
        tempCod = cod.trim();
        if(!CADASTRO[tempCod]) {
            document.getElementById('modal-cad').classList.add('active');
        } else {
            adicionarAoLote(tempCod);
        }
    }

    function confirmarCadastro() {
        const nome = document.getElementById('input-nome').value.toUpperCase();
        if(!nome) return;
        CADASTRO[tempCod] = nome;
        localStorage.setItem('CAD_JP', JSON.stringify(CADASTRO));
        document.getElementById('modal-cad').classList.remove('active');
        adicionarAoLote(tempCod);
    }

    function adicionarAoLote(cod) {
        const mod = document.getElementById('sel-mod-op').value;
        LOTE.unshift({ cod, nome: CADASTRO[cod], m: mod, q: 1, d: new Date().toLocaleString() });
        document.getElementById('lote-count').innerText = LOTE.length;
        document.getElementById('lote-list').innerHTML = LOTE.map(i => `[${i.m}] ${i.nome}<br>`).join('');
        document.getElementById('btn-sync').style.display = 'block';
    }

    function enviarLote() {
        canal.postMessage({ type: 'SYNC', dados: LOTE });
        DB_LOGS = [...LOTE, ...DB_LOGS];
        localStorage.setItem('LOGS_JP', JSON.stringify(DB_LOGS));
        LOTE = [];
        document.getElementById('lote-count').innerText = "0";
        document.getElementById('lote-list').innerHTML = "";
        document.getElementById('btn-sync').style.display = 'none';
        alert("PLANILHA ATUALIZADA NO PAINEL!");
    }

    function removerItem(index) {
        if(confirm("REMOVER ESTE REGISTRO?")) {
            DB_LOGS.splice(index, 1);
            localStorage.setItem('LOGS_JP', JSON.stringify(DB_LOGS));
            atualizarPainel();
        }
    }

    function atualizarPainel() {
        const body = document.getElementById('table-body');
        let saldo = 0;
        body.innerHTML = DB_LOGS.map((l, idx) => {
            l.m === 'IN' ? saldo += l.q : saldo -= l.q;
            return `<tr><td><b>${l.nome}</b><br><small>${l.d}</small></td>
                    <td style="color:${l.m=='IN'?'var(--primary)':'var(--out)'}">${l.m} x${l.q}</td>
                    <td><button class="btn-del" onclick="removerItem(${idx})">DEL</button></td></tr>`;
        }).join('');
        document.getElementById('tot-geral').innerText = saldo;
        document.getElementById('tot-itens').innerText = Object.keys(CADASTRO).length;
    }

    function limparTudo() { if(confirm("DESEJA ZERAR TODO O ESTOQUE E PLANILHA?")) { localStorage.clear(); location.reload(); } }
    function init() { console.log("MODO TESTE ATIVO"); }
    canal.onmessage = (e) => { if(e.data.type === 'SYNC') { DB_LOGS = [...e.data.dados, ...DB_LOGS]; localStorage.setItem('LOGS_JP', JSON.stringify(DB_LOGS)); atualizarPainel(); } };
</script>
</body>
</html>
