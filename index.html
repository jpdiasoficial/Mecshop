<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK V45 | Platinum Shark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #121212; --text: #fff; --danger: #ff4444; --gray: #555; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; }

        /* Telas */
        .screen { display: none; height: 100vh; padding: 20px; flex-direction: column; overflow-y: auto; padding-bottom: 100px; }
        .active { display: flex; animation: fadeIn 0.4s ease; }

        /* Login */
        .auth-screen { justify-content: center; align-items: center; text-align: center; }
        .logo-main { font-size: 42px; font-weight: 900; color: var(--primary); letter-spacing: 4px; margin-bottom: 40px; }
        .login-box { width: 100%; max-width: 320px; }
        input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 18px; border-radius: 15px; color: #fff; margin-bottom: 15px; font-size: 16px; outline: none; }
        .btn-access { width: 100%; background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 15px; font-weight: 900; cursor: pointer; }

        /* Grid de Ícones (Melhoria: 8 Cards com Figurinha) */
        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 25px 0; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; color: #888; cursor: pointer; }
        .icon-circle { width: 60px; height: 60px; background: #181818; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--primary); border: 1px solid #252525; }
        .action-item:active .icon-circle { background: var(--primary); color: #000; }

        /* Câmera Overlay */
        #cam-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; flex-direction: column; }
        video { width: 100%; height: 70%; object-fit: cover; }

        /* Painel Master */
        .stat-box { background: var(--card); padding: 20px; border-radius: 18px; border-left: 4px solid var(--primary); margin-bottom: 15px; }
        
        /* Menu Inferior (Oculto no Login) */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10,10,10,0.95); display: none; justify-content: space-around; padding: 15px 0; border-top: 1px solid #1a1a1a; }
        .nav-link { color: #444; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-link.active-link { color: var(--primary); }
        .nav-link i { font-size: 22px; display: block; margin-bottom: 4px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="scr-auth" class="screen active auth-screen">
        <div class="logo-main">MEC-BANK</div>
        <div class="login-box">
            <input type="text" id="inp-user" placeholder="Usuário (Shark ou Jp)">
            <input type="password" id="inp-pass" placeholder="Senha">
            <button class="btn-access" onclick="processLogin()">ENTRAR</button>
        </div>
    </div>

    <div id="scr-home" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:40px; height:40px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold;">J</div>
                <strong>Olá, Jp</strong>
            </div>
            <i class="fa-solid fa-bell" style="color:var(--primary)"></i>
        </div>

        <div style="background:var(--card); padding:20px; border-radius:20px; border:1px solid #222;">
            <small style="color:#666">Saldo disponível</small>
            <div id="balance" style="font-size:32px; font-weight:900; margin:10px 0;">R$ 145.850,90</div>
            <button style="width:100%; background:transparent; border:1px solid var(--primary); color:var(--primary); padding:10px; border-radius:10px; font-weight:bold;">Ver Extrato</button>
        </div>

        <div class="action-grid">
            <div class="action-item" onclick="openCam()"><div class="icon-circle"><i class="fa-solid fa-qrcode"></i></div><span>Pix</span></div>
            <div class="action-item" onclick="openCam()"><div class="icon-circle"><i class="fa-solid fa-barcode"></i></div><span>Pagar</span></div>
            <div class="action-item" onclick="pixCopyPaste()"><div class="icon-circle"><i class="fa-solid fa-copy"></i></div><span>Copia/Cola</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-mobile-screen"></i></div><span>Recarga</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-hand-holding-dollar"></i></div><span>Empréstimo</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-shield-halved"></i></div><span>Seguros</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-gift"></i></div><span>Mimos</span></div>
            <div class="action-item"><div class="icon-circle"><i class="fa-solid fa-circle-question"></i></div><span>Ajuda</span></div>
        </div>
    </div>

    <div id="scr-master" class="screen">
        <h2>Control Panel</h2>
        <div class="stat-box"><small>Saldos Totais</small><h3>R$ 1.450.850</h3></div>
        <div class="stat-box"><small>Usuários Ativos</small><h3>842</h3></div>
        <div style="border:2px dashed var(--primary); padding:30px; border-radius:20px; text-align:center; color:var(--primary); cursor:pointer;" onclick="document.getElementById('file').click()">
            <i class="fa-solid fa-file-excel" style="font-size:30px"></i>
            <p>SINCRONIZAR PLANILHA XLSX</p>
            <input type="file" id="file" hidden onchange="alert('Dados Sincronizados!')">
        </div>
    </div>

    <nav class="nav-bar" id="navbar">
        <div class="nav-link active-link" onclick="tab('scr-home', this)"><i class="fa-solid fa-house"></i>Início</div>
        <div class="nav-link" onclick="tab('scr-master', this)"><i class="fa-solid fa-gears"></i>Painel</div>
        <div class="nav-link" onclick="location.reload()"><i class="fa-solid fa-power-off"></i>Sair</div>
    </nav>

    <div id="cam-overlay">
        <video id="video" autoplay playsinline></video>
        <div style="padding:20px; text-align:center;">
            <p>Aponte para o código QR ou Boleto</p>
            <button onclick="closeCam()" style="background:var(--danger); color:#fff; padding:15px; width:100%; border:none; border-radius:10px; font-weight:bold;">CANCELAR</button>
        </div>
    </div>

    <script>
        function processLogin() {
            const user = document.getElementById('inp-user').value.toLowerCase();
            document.getElementById('scr-auth').classList.remove('active');
            document.getElementById('navbar').style.display = 'flex';
            
            if(user === 'shark') {
                document.getElementById('scr-master').classList.add('active');
            } else {
                document.getElementById('scr-home').classList.add('active');
            }
        }

        function tab(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-link'));
            el.classList.add('active-link');
        }

        async function openCam() {
            const overlay = document.getElementById('cam-overlay');
            const video = document.getElementById('video');
            overlay.style.display = 'flex';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
            } catch(e) { alert("Câmera não disponível."); closeCam(); }
        }

        function closeCam() {
            const video = document.getElementById('video');
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('cam-overlay').style.display = 'none';
        }

        function pixCopyPaste() {
            const code = prompt("Cole a chave ou código Pix aqui:");
            if(code) alert("Código validado! Processando transferência...");
        }
    </script>
</body>
</html>
