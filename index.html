<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO XMS v82 | FULL FLOW</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { --p: #00ff41; --s: #007aff; --bg: #050505; --sf: #111; --brd: #222; --dg: #ff3b30; --wrn: #ffae00; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; font-size: 11px; height: 100vh; overflow: hidden; text-transform: uppercase; }
        
        /* TELAS */
        .screen { display: none; height: 100vh; flex-direction: column; background: var(--bg); }
        .active { display: flex !important; }
        
        /* CABEÇALHO GALAXY */
        header { padding: 15px; border-bottom: 1px solid var(--brd); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #000; }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        
        /* CARDS E INPUTS */
        .card { background: var(--sf); border: 1px solid var(--brd); border-radius: 8px; padding: 12px; margin-bottom: 12px; position: relative; }
        h3 { font-family: 'Orbitron'; font-size: 11px; color: var(--p); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 11px; margin-bottom: 8px; font-weight: 800; }
        
        /* BOTÕES */
        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.1s; }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: var(--s); color: #fff; }
        .btn-exit { background: none; border: 1px solid var(--dg); color: var(--dg); padding: 5px 12px; font-size: 9px; border-radius: 4px; font-weight: 800; }
        .btn:active { transform: scale(0.98); opacity: 0.8; }

        /* CAMERA BOX */
        #reader { width: 100%; background: #000; border-radius: 8px; border: 1px solid var(--brd); overflow: hidden; margin-bottom: 10px; }

        /* NAVEGAÇÃO INFERIOR */
        .nav-tabs { display: flex; background: #000; border-top: 1px solid var(--brd); position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .nav-tab { flex: 1; padding: 15px; text-align: center; color: #444; cursor: pointer; font-weight: 800; font-size: 9px; }
        .nav-tab.active { color: var(--p); border-top: 2px solid var(--p); background: #0a0a0a; }

        /* DASHBOARD */
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .kpi-card { background: #0a0a0a; border: 1px solid #222; padding: 10px; border-radius: 6px; text-align: center; }
        .kpi-val { font-family: 'Orbitron'; font-size: 16px; color: var(--p); }
        
        table { width: 100%; border-collapse: collapse; font-size: 9px; }
        td, th { padding: 10px 8px; border-bottom: 1px solid #111; text-align: left; }
        .status-pill { padding: 4px 6px; border-radius: 4px; font-size: 8px; font-weight: 900; }
        .st-in { background: var(--s); } .st-sep { background: var(--wrn); color: #000; } .st-out { background: var(--p); color: #000; }
    </style>
</head>
<body onload="render()">

<div id="scr-login" class="screen active" style="justify-content:center; align-items:center; padding:40px;">
    <div style="font-family:'Orbitron'; color:var(--p); font-size:32px; text-align:center;">LOG-PRO<br><span style="font-size:12px; color:#555;">v82 FULL FLOW</span></div>
    <div style="width:100%; margin-top:40px;">
        <input type="password" id="pin" placeholder="PIN ACESSO GALAXY" style="text-align:center;">
        <button class="btn btn-p" onclick="login()">ACESSAR SISTEMA</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span>SHARK MONITOR</span> <button class="btn-exit" onclick="sair()">SAIR</button></header>
    <div class="scroll">
        <div class="kpi-grid">
            <div class="kpi-card"><span class="kpi-val" id="kpi-in">0</span><br><small>ENTRADAS</small></div>
            <div class="kpi-card"><span class="kpi-val" id="kpi-sep" style="color:var(--wrn)">0</span><br><small>PICKING</small></div>
            <div class="kpi-card"><span class="kpi-val" id="kpi-out" style="color:var(--s)">0</span><br><small>SAÍDAS</small></div>
        </div>
        <div class="card">
            <h3><i class="fa-solid fa-tower-broadcast"></i> FLUXO REAL-TIME</h3>
            <table><tbody id="shark-monitor"></tbody></table>
        </div>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span>OPERAÇÃO ATIVA</span> <button class="btn-exit" onclick="sair()">SAIR</button></header>
    <div class="scroll">
        <div class="card">
            <h3><i class="fa-solid fa-camera"></i> SCANNER SENSOR</h3>
            <div id="reader"></div>
            <button class="btn btn-p" id="cam-btn" onclick="toggleCamera()"><i class="fa-solid fa-power-off"></i> LIGAR CÂMERA</button>
        </div>
        <div class="card">
            <h3><i class="fa-solid fa-gears"></i> CONFIGURAÇÃO</h3>
            <select id="mod-op">
                <option value="ENTRADA">📥 ENTRADA</option>
                <option value="SEPARACAO">📦 SEPARAÇÃO</option>
                <option value="SAIDA">🚚 EXPEDIÇÃO</option>
            </select>
            <div id="op-log" style="font-size:10px; color:var(--p); font-weight:800; text-align:center; padding:12px; border: 1px dashed #333; border-radius: 6px;">AGUARDANDO BIPE...</div>
        </div>
    </div>
</div>

<div id="scr-mot" class="screen">
    <header><span>LOGÍSTICA</span> <button class="btn-exit" onclick="sair()">SAIR</button></header>
    <div class="scroll">
        <div class="card" style="border-left: 4px solid var(--s);">
            <h2 style="font-family:'Orbitron';">CARGA #9901</h2>
            <p style="color:var(--s); font-weight: 800;">PLACA: BRA2E19 | STATUS: EM ROTA</p>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn btn-p" onclick="addLog('MOT', 'INICIO', 'ROTA INICIADA')"><i class="fa-solid fa-play"></i> INICIAR</button>
            <button class="btn btn-s" onclick="addLog('MOT', 'CHECKIN', 'LOCAL ALCANÇADO')"><i class="fa-solid fa-location-dot"></i> CHECK-IN</button>
        </div>
        <button class="btn btn-s" style="margin-top:10px; background: #222;" onclick="addLog('MOT', 'FIM', 'ENTREGA CONCLUÍDA')"><i class="fa-solid fa-check-double"></i> FINALIZAR ENTREGA</button>
    </div>
</div>

<div class="nav-tabs" id="main-nav" style="display:none;">
    <div class="nav-tab active" onclick="tab('scr-shark', this)"><i class="fa-solid fa-gauge-high"></i><br>SHARK</div>
    <div class="nav-tab" onclick="tab('scr-op', this)"><i class="fa-solid fa-barcode"></i><br>OPERADOR</div>
    <div class="nav-tab" onclick="tab('scr-mot', this)"><i class="fa-solid fa-truck-fast"></i><br>LOGÍSTICA</div>
</div>

<script>
    let logs = JSON.parse(localStorage.getItem('LOGPRO_V82') || '[]');
    let scanner;
    let camOn = false;

    // LOGIN SISTEMA
    function login() {
        if(document.getElementById('pin').value !== "") {
            document.getElementById('scr-login').classList.remove('active');
            document.getElementById('main-nav').style.display = 'flex';
            tab('scr-shark', document.querySelectorAll('.nav-tab')[0]);
        }
    }

    // SAIR (FECHA TUDO E CÂMERA)
    function sair() {
        if(camOn) toggleCamera();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('scr-login').classList.add('active');
        document.getElementById('main-nav').style.display = 'none';
        document.getElementById('pin').value = '';
    }

    // NAVEGAÇÃO ENTRE ABAS
    function tab(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
        render();
    }

    // GESTÃO DA CÂMERA (BATERIA SAFE)
    function toggleCamera() {
        const btn = document.getElementById('cam-btn');
        if(!camOn) {
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, onScanSuccess);
            btn.innerHTML = "<i class='fa-solid fa-power-off'></i> DESLIGAR SENSOR"; 
            btn.style.background = "#222"; btn.style.color = "#fff";
            camOn = true;
        } else {
            scanner.stop().then(() => {
                document.getElementById('reader').innerHTML = "";
                btn.innerHTML = "<i class='fa-solid fa-power-off'></i> LIGAR CÂMERA"; 
                btn.style.background = "var(--p)"; btn.style.color = "#000";
                camOn = false;
            });
        }
    }

    // SUCESSO NO BIPE
    function onScanSuccess(cod) {
        if (navigator.vibrate) navigator.vibrate(100); // Feedback físico
        
        let qtd = prompt(`BIPE CONFIRMADO: ${cod}\n\nINFORME A QUANTIDADE:`, "1");
        
        if(qtd !== null && qtd !== "") {
            const etapa = document.getElementById('mod-op').value;
            addLog('OP', etapa, `${cod} (QTD: ${qtd})`);
            document.getElementById('op-log').innerHTML = `ÚLTIMO BIPE: <span style="color:#fff">${cod}</span> | QTD: ${qtd}`;
        }
    }

    // REGISTRO DE LOGS
    function addLog(origem, acao, info) {
        logs.unshift({ hora: new Date().toLocaleTimeString(), origem, acao, info });
        // Mantém apenas os últimos 100 para não pesar o browser
        localStorage.setItem('LOGPRO_V82', JSON.stringify(logs.slice(0,100)));
        render();
    }

    // RENDERIZAÇÃO REAL-TIME
    function render() {
        let h = ""; let ent=0, sep=0, out=0;
        logs.forEach(l => {
            let p = l.acao==='ENTRADA'?'st-in':l.acao==='SEPARACAO'?'st-sep':'st-out';
            h += `<tr><td>${l.hora}</td><td><span class="status-pill ${p}">${l.acao}</span></td><td>${l.info}</td></tr>`;
            if(l.acao==='ENTRADA') ent++; 
            if(l.acao==='SEPARACAO') sep++; 
            if(l.acao==='SAIDA' || l.acao==='EXPEDIÇÃO') out++;
        });
        const monitor = document.getElementById('shark-monitor');
        if(monitor) monitor.innerHTML = h;
        
        document.getElementById('kpi-in').innerText = ent;
        document.getElementById('kpi-sep').innerText = sep;
        document.getElementById('kpi-out').innerText = out;
    }
</script>
</body>
</html>
