<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | LOGISTICS CORE V85</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #ff9f0a; 
            --bg: #050505; 
            --surface: rgba(20, 20, 20, 0.8);
            --border: rgba(255, 159, 10, 0.15);
            --green: #32d74b; 
            --red: #ff453a; 
        }

        body { 
            background: var(--bg); 
            color: #f0f0f0; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            text-transform: uppercase;
        }

        /* --- LOGIN DESIGNER --- */
        #portal { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .logo-main {
            font-family: 'Orbitron';
            font-size: 38px;
            letter-spacing: 10px;
            color: #fff;
            margin-bottom: 5px;
        }

        .sub-logo {
            font-size: 9px;
            letter-spacing: 5px;
            color: var(--primary);
            margin-bottom: 40px;
        }

        .btn-entry {
            width: 300px;
            padding: 20px;
            margin: 8px;
            background: transparent;
            border: 1px solid var(--border);
            color: #fff;
            font-family: 'JetBrains Mono';
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s;
            border-radius: 2px;
        }

        .btn-entry:hover {
            border-color: var(--primary);
            background: rgba(255, 159, 10, 0.05);
            letter-spacing: 4px;
        }

        /* --- LOBBY (VISUAL DHL/MELI) --- */
        #lobby { display: none; padding: 25px; animation: fadeIn 0.6s ease; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .id-badge { font-family: 'JetBrains Mono'; color: var(--green); font-size: 11px; border: 1px solid var(--green); padding: 4px 10px; border-radius: 3px; }

        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
        .nav-card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 30px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: 0.3s;
            position: relative;
        }
        .nav-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .nav-card h3 { color: var(--primary); font-family: 'Orbitron'; margin: 0; font-size: 14px; }
        .nav-card p { font-size: 9px; color: #666; margin-top: 8px; font-family: 'JetBrains Mono'; }

        /* --- MODULOS OPERACIONAIS --- */
        .modulo { display: none; padding: 15px; height: 100vh; animation: fadeIn 0.4s; }
        .camera-view { 
            width: 100%; 
            height: 250px; 
            background: #000; 
            border: 1px solid var(--primary); 
            margin-bottom: 15px; 
            position: relative;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        
        /* LINHA DE SCANNER REFINADA */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            top: 0;
            animation: moveScan 3s infinite linear;
        }
        @keyframes moveScan { 0% { top: 0; } 100% { top: 100%; } }

        .btn-action { 
            width: 100%; 
            padding: 18px; 
            background: transparent; 
            border: 1px solid var(--primary); 
            color: var(--primary); 
            font-weight: 900; 
            cursor: pointer; 
            margin-bottom: 10px;
            font-family: 'JetBrains Mono';
        }
        .btn-action:active { background: var(--primary); color: #000; }

        .log-terminal { 
            background: #000; 
            color: var(--green); 
            padding: 15px; 
            height: 130px; 
            overflow-y: auto; 
            font-size: 10px; 
            font-family: 'JetBrains Mono';
            border: 1px solid #1a1a1a;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="portal">
    <div class="logo-main">JP DIAS</div>
    <div class="sub-logo">SYSTEM LOGISTICS // V85</div>
    <button class="btn-entry" onclick="entrar('MASTER')">01. OWNER // PRIVILEGED</button>
    <button class="btn-entry" onclick="entrar('SHARK')">02. SHARK // ADMIN</button>
    <button class="btn-entry" onclick="entrar('EXECUTOR')">03. TECH-OP // FIELD</button>
</div>

<div id="lobby">
    <header class="header-bar">
        <div id="ghost-id" class="id-badge">ID: ---</div>
        <button onclick="location.reload()" style="background:none; border:none; color:#555; cursor:pointer; font-weight:bold;">DISCONNECT_</button>
    </header>

    <div class="nav-grid" id="nav-grid">
        </div>

    <div class="log-terminal" id="term-lobby" style="margin-top:40px;">
        > JP_DIAS_CORE: ONLINE<br>
        > ENCRYPTION: ACTIVE<br>
        > WAITING_FOR_SELECTION...
    </div>
</div>

<div id="mod-operacional" class="modulo">
    <header class="header-bar">
        <button onclick="voltar()" style="background:none; border:none; color:var(--primary); font-weight:bold;">⬅ LOBBY</button>
        <span id="mod-title" style="font-family:'Orbitron'; font-size:12px;">ARMAZÉM</span>
    </header>

    <div class="camera-view">
        <video id="webcam" autoplay playsinline></video>
        <div class="scan-line"></div>
    </div>

    <div id="controles">
        <button class="btn-action" onclick="executarAcao()">INICIAR BIPAGEM (VOZ)</button>
        <button class="btn-action" style="border-color:var(--red); color:var(--red);" onclick="registrarAvaria()">REPORT_AVARIA</button>
    </div>

    <div class="log-terminal" id="term-op">> STANDBY...</div>
</div>

<script>
    let stream = null;
    let userRole = "";

    function entrar(role) {
        if(role !== 'EXECUTOR') {
            if(prompt("ACCESS KEY:") !== "123") return;
        }
        userRole = role;
        document.getElementById('portal').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('ghost-id').innerText = `ID: GHOST-${Math.floor(Math.random()*9999)}`;
        montarMenu();
        falar("Protocolo JP Dias iniciado. Identidade protegida.");
    }

    function montarMenu() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        
        // HIERARQUIA DE FUNÇÕES
        if(userRole === 'MASTER' || userRole === 'SHARK') {
            grid.innerHTML += `<div class="nav-card" onclick="abrirMod('TORRE DE CONTROLE')"><h3>🛰️ TORRE MASTER</h3><p>AUDITORIA TOTAL</p></div>`;
        }
        grid.innerHTML += `<div class="nav-card" onclick="abrirMod('ARMAZÉM')"><h3>📦 ARMAZÉM</h3><p>PICKING TRAVA 3</p></div>`;
        grid.innerHTML += `<div class="nav-card" onclick="abrirMod('CROSS DOCK')"><h3>⚡ CROSS DOCK</h3><p>TRIAGEM MOTORISTA</p></div>`;
    }

    async function abrirMod(nome) {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('mod-operacional').style.display = 'block';
        document.getElementById('mod-title').innerText = nome;
        
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('webcam').srcObject = stream;
        } catch (e) { console.log("Câmera indisponível"); }
    }

    function executarAcao() {
        falar("Iniciando. Informe o código de 3 dígitos do produto.");
        let cod = prompt("CÓDIGO:");
        if(cod) {
            addLog(`AÇÃO: ITEM ${cod} BIPADO.`);
            falar("Confirmado. Diga OK.");
        }
    }

    function addLog(msg) {
        const t = `> [${new Date().toLocaleTimeString()}] ${msg}<br>`;
        document.getElementById('term-op').innerHTML += t;
    }

    function falar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'pt-BR';
        window.speechSynthesis.speak(m);
    }

    function voltar() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('mod-operacional').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
    }

    function registrarAvaria() {
        let mot = prompt("MOTIVO DA AVARIA:");
        addLog(`AVARIA: ${mot}`);
        falar("Avaria reportada ao Shark.");
    }
</script>

</body>
</html>
