<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mini Bet</title>

<style>
body{
font-family: Arial;
background:#0f172a;
color:white;
text-align:center;
}

.container{
margin-top:100px;
}

button{
padding:10px 20px;
margin:10px;
font-size:18px;
cursor:pointer;
}

#result{
font-size:24px;
margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>Mini Casa de Aposta</h1>

<h2>Saldo: R$ <span id="saldo">100</span></h2>

<p>Aposte 10 reais</p>

<button onclick="apostar()">Girar Roleta</button>

<div id="result"></div>

</div>

<script>

let saldo = 100;

function apostar(){

if(saldo < 10){
document.getElementById("result").innerHTML="Saldo insuficiente";
return;
}

saldo -= 10;

let chance = Math.random();

if(chance > 0.5){
saldo += 20;
document.getElementById("result").innerHTML="🎉 Você ganhou!";
}else{
document.getElementById("result").innerHTML="❌ Você perdeu!";
}

document.getElementById("saldo").innerHTML = saldo;

}

</script>

</body>
</html>
