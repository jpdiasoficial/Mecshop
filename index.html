<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v75.1 | JP TECNOLOGIA</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --border: #222; --sep: #ffae00; --danger: #ff3b30; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; font-size: 10px; height: 100vh; overflow: hidden; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; background: #000; z-index: 10; }
        .active { display: flex !important; }
        header { padding: 12px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #050505; }
        .scroll { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 150px; }
        .presence-bar { display: flex; gap: 10px; padding: 8px 12px; background: #0a0a0a; border-bottom: 1px solid #222; font-size: 8px; }
        .online { color: var(--primary); font-weight: bold; text-shadow: 0 0 5px var(--primary); }
        .stats { display: flex; gap: 8px; padding: 10px; background: #080808; border-bottom: 1px solid #111; }
        .card { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 4px; text-align: center; }
        .card span { display: block; font-size: 14px; color: var(--primary); font-family: 'Orbitron'; }
        .table-wrapper { border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; background: #080808; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: #111; color: #555; padding: 10px; text-align: left; font-size: 7px; border-bottom: 1px solid #222; }
        td { padding: 10px; border-bottom: 1px solid #151515; white-space: nowrap; font-size: 9px; }
        .btn-green { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 4px; cursor: pointer; }
        input, select, textarea { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: 'Orbitron'; margin-bottom: 5px; box-sizing: border-box; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid #222; margin-bottom: 10px; }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active" style="align-items:center; justify-content:center;">
    <div style="font-family:'Orbitron'; color:var(--primary); font-size:35px; text-align:center;">LOG-PRO<br><span style="font-size:8px; color:#444;">VERIFIED v75.1</span></div>
    <div style="width: 80%; max-width: 300px; margin-top:20px;">
        <input type="text" id="user-name" placeholder="USUÁRIO">
        <input type="password" id="pass" placeholder="CHAVE MESTRA">
        <button class="btn-green" onclick="auth()">ENTRAR NA REDE</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span id="shark-title">GESTOR</span> <button onclick="logout()" style="color:var(--danger); background:none; border:none;">SAIR</button></header>
    <div class="presence-bar"><span id="st-jp">JP: ⚪</span> <span id="st-shark">SHARK: ⚪</span> <span id="st-op">OP: ⚪</span></div>
    
    <div style="padding: 10px; background: #080808; border-bottom: 1px solid #222;">
        <canvas id="prodChart" style="width: 100%; height: 110px;"></canvas>
    </div>

    <div class="stats">
        <div class="card">ITENS BASE <span id="stat-total">0</span></div>
        <div class="card">PENDÊNCIAS <span id="stat-pedidos">0</span></div>
    </div>

    <div class="scroll">
        <div style="padding: 10px; border: 1px dashed var(--primary); margin-bottom: 10px; background: #050505;">
            <p style="margin:0 0 5px 0; font-size:7px; color:var(--primary);">ENTRADA MANUAL / AJUSTE RÁPIDO</p>
            <div style="display:flex; gap:5px;">
                <input type="text" id="ins-cod" placeholder="COD" style="margin:0;">
                <input type="number" id="ins-qtd" value="1" style="margin:0; width:60px;">
                <button onclick="processarManual()" style="background:var(--primary); border:none; padding:10px; border-radius:4px; font-weight:bold;">ADD</button>
            </div>
        </div>

        <h3>HISTÓRICO COMPLETO</h3>
        <div class="table-wrapper"><table><thead><tr><th>HORA</th><th>OP</th><th>TIPO</th><th>ITEM</th><th>QTD</th></tr></thead><tbody id="audit-body"></tbody></table></div>
        
        <h3>INVENTÁRIO ATUALIZADO</h3>
        <div class="table-wrapper"><table><thead><tr><th>CÓDIGO</th><th>NOME DO PRODUTO</th><th>SALDO REAL</th></tr></thead><tbody id="stock-body"></tbody></table></div>
        
        <div style="display:flex; gap:5px;">
            <button onclick="exportar('print')" class="btn-green" style="background:#fff; font-size:8px;">🖨️ IMPRIMIR</button>
            <button onclick="exportar('email')" class="btn-green" style="background:#444; color:#fff; font-size:8px;">📧 E-MAIL</button>
        </div>
    </div>
    <button onclick="ir('scr-config')" style="position:fixed; bottom:20px; right:20px; width:50px; height:50px; border-radius:50%; background:var(--primary); border:none;">⚙️</button>
</div>

<div id="scr-op" class="screen">
    <header><span id="display-user">OPERADOR</span> <button onclick="logout()" style="color:var(--danger); background:none; border:none;">SAIR</button></header>
    <div class="scroll">
        <div id="op-list-picking" style="border: 2px solid var(--sep); padding:10px; color:var(--sep); margin-bottom:10px; background:#120e00;">Carregando demandas...</div>
        <div id="reader"></div>
        <button class="btn-green" id="btn-cam" onclick="toggleCamera()">ATIVAR SCANNER</button>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <select id="mod-op" style="flex:2;"><option value="SAIDA">SAÍDA / PICKING</option><option value="ENTRADA">ENTRADA</option></select>
            <input type="number" id="qtd-bipe" value="1" style="flex:0.6; text-align:center;">
        </div>
        <div id="op-audit-body" style="font-size:8px; margin-top:15px; color:#555;"></div>
    </div>
</div>

<div id="scr-config" class="screen">
    <header><span>BASE DE DADOS</span> <button onclick="ir('scr-shark')">VOLTAR</button></header>
    <div class="scroll">
        <textarea id="import-area" style="height:300px;" placeholder="COD, NOME"></textarea>
        <button class="btn-green" onclick="salvarConfig()">SALVAR BASE</button>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top:20px; color:red; background:none; border:none; width:100%;">LIMPAR TUDO</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit, setDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRDhONvvzZmo2csXksqHs6E6vV3MuvLSs",
        authDomain: "log-pro-jp.firebaseapp.com",
        projectId: "log-pro-jp",
        storageBucket: "log-pro-jp.firebasestorage.app",
        messagingSenderId: "481645607846",
        appId: "1:481645607846:web:fd55dd943718ad78386d67"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let BASE = JSON.parse(localStorage.getItem('LP_BASE')) || {};
    let MOVS = []; let myChart; let currentUser = localStorage.getItem('LP_SESSION') || ""; let scanner, camOn = false;

    // PRESENÇA REAL-TIME
    async function heartbeat() { if(currentUser) await setDoc(doc(db, "presenca", currentUser), { u: currentUser, t: serverTimestamp() }); }
    setInterval(heartbeat, 15000);
    onSnapshot(collection(db, "presenca"), (s) => { s.docs.forEach(d => { const p = d.data(); const el = document.getElementById("st-"+p.u.toLowerCase()); if(el) el.innerHTML = `${p.u}: <span class="online">🟢 ON</span>`; }); });

    // ESCUTADOR DE LOGS
    onSnapshot(query(collection(db, "logs"), orderBy("data_hora", "desc"), limit(50)), (snap) => {
        MOVS = snap.docs.map(d => d.data());
        render();
    });

    // ESCUTADOR DE SEPARAÇÃO
    onSnapshot(collection(db, "separacao"), (s) => {
        let hO = ""; let count = 0;
        s.docs.forEach(d => { const p = d.data(); const f = p.qtd_pedida - p.qtd_feita; if(f > 0) { hO += `<div>📦 ${p.nome}: FALTAM ${f}</div>`; count++; } });
        document.getElementById('op-list-picking').innerHTML = hO || "TUDO OK! ✅";
        document.getElementById('stat-pedidos').innerText = count;
    });

    window.processarManual = () => {
        const c = document.getElementById('ins-cod').value;
        const q = parseInt(document.getElementById('ins-qtd').value);
        if(c && q) { 
            processar(c, q); 
            document.getElementById('ins-cod').value = ''; // CORREÇÃO: Limpar campo após inserir
        }
    };

    window.processar = async (cod, qtd) => {
        let c = cod.trim(); const q = qtd || parseInt(document.getElementById('qtd-bipe').value) || 1;
        if(!BASE[c]) { const n = prompt("NOME DO PRODUTO:"); if(n) BASE[c]=n.toUpperCase(); else return; }
        
        const mov = { cod:c, n:BASE[c], t:document.getElementById('mod-op')?.value || 'ENTRADA', q:q, op:currentUser, data_hora:serverTimestamp(), d_str:new Date().toLocaleTimeString() };
        await addDoc(collection(db, "logs"), mov);
        
        if(mov.t === "SAIDA") {
            const r = doc(db, "separacao", c); const d = await getDoc(r);
            if(d.exists()) await updateDoc(r, { qtd_feita: d.data().qtd_feita + q });
        }
        localStorage.setItem('LP_BASE', JSON.stringify(BASE));
    };

    window.render = () => {
        let saldos = {}; Object.keys(BASE).forEach(k => saldos[k] = { n: BASE[k], s: 0 });
        let htmlHist = "";
        MOVS.forEach(m => {
            if(saldos[m.cod]) { m.t === 'ENTRADA' ? saldos[m.cod].s += m.q : saldos[m.cod].s -= m.q; }
            htmlHist += `<tr><td>${m.d_str}</td><td>${m.op}</td><td>${m.t}</td><td>${m.n}</td><td>${m.q}</td></tr>`;
        });
        document.getElementById('audit-body').innerHTML = htmlHist;
        document.getElementById('stock-body').innerHTML = Object.keys(saldos).map(k => `<tr><td>${k}</td><td>${saldos[k].n}</td><td>${saldos[k].s}</td></tr>`).join('');
        document.getElementById('stat-total').innerText = Object.keys(BASE).length;
        updateChart();
    };

    function updateChart() {
        const ctx = document.getElementById('prodChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: MOVS.slice(0,8).map(m => m.d_str).reverse(), datasets: [{ label: 'VOLUME', data: MOVS.slice(0,8).map(m => m.q), backgroundColor: '#00ff41' }] },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }

    window.auth = () => {
        const u = document.getElementById('user-name').value.toUpperCase().trim();
        const p = document.getElementById('pass').value;
        if((u==="JP"||u==="SHARK")&&p==="9910") { currentUser=u; localStorage.setItem('LP_SESSION',u); location.reload(); }
        else if(u==="OP"&&p==="1234") { currentUser=u; localStorage.setItem('LP_SESSION',u); location.reload(); }
        else alert("CHAVE INVÁLIDA");
    };

    window.toggleCamera = async () => {
        if(!camOn) { scanner = new Html5Qrcode("reader"); await scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (t)=>processar(t)); camOn=true; }
        else { await scanner.stop(); camOn=false; }
    };

    window.salvarConfig = () => {
        document.getElementById('import-area').value.split('\n').forEach(l=>{const d=l.split(','); if(d[0]&&d[1]) BASE[d[0].trim()]=d[1].trim().toUpperCase();});
        localStorage.setItem('LP_BASE', JSON.stringify(BASE)); alert("BASE SINCRONIZADA!"); render();
    };

    window.logout = () => { localStorage.removeItem('LP_SESSION'); location.reload(); };
    window.ir = (id) => { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); };
    window.init = () => { if(currentUser) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); if(currentUser==='OP') document.getElementById('scr-op').classList.add('active'); else document.getElementById('scr-shark').classList.add('active'); heartbeat(); } };
</script>
</body>
</html>
