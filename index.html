<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK V45.9 | JP Dias Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #00ffa3; --bg: #000; --card: #0d0d0d; --border: #1a1a1a; --danger: #ff4d4d; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* --- ANIMAÇÕES --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .anim { animation: fadeIn 0.4s ease forwards; }

        /* --- TELAS --- */
        .screen { display: none; height: 100vh; flex-direction: column; overflow-y: auto; padding: 20px 20px 120px 20px; }
        .active { display: flex; }

        /* --- HEADER FIXO --- */
        header { 
            height: 90px; padding: 0 20px; display: flex; justify-content: space-between; 
            align-items: center; background: #000; position: sticky; top: 0; z-index: 100;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; background: #111; border: 1.5px solid var(--p); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--p); font-weight: 800; font-size: 18px; }
        .rank-tag { background: rgba(0, 255, 163, 0.1); border: 1px solid var(--p); color: var(--p); font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; }

        /* --- CARDS --- */
        .card-bal { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 25px; margin-bottom: 20px; position: relative; }
        .blur { filter: blur(10px); opacity: 0.2; }
        .eye-btn { position: absolute; top: 25px; right: 25px; color: #333; font-size: 18px; cursor: pointer; }

        /* --- GRID DE AÇÕES --- */
        .grid-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 30px; }
        .action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.1s; }
        .action-btn:active { transform: scale(0.9); }
        .icon-bg { width: 60px; height: 60px; background: #111; border: 1px solid var(--border); border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--p); font-size: 20px; }
        .action-btn span { font-size: 11px; color: #777; font-weight: 600; }

        /* --- CARTÃO SHARK --- */
        .platinum-card { 
            background: linear-gradient(135deg, #0a0a0a 0%, #151515 100%); 
            border: 1px solid #222; border-radius: 24px; padding: 25px; height: 200px; 
            position: relative; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .plat-label { color: var(--p); font-weight: 900; letter-spacing: 2px; font-size: 11px; }
        .plat-number { color: #333; font-size: 22px; letter-spacing: 4px; margin: 30px 0 10px; font-weight: 600; }
        .plat-limit { font-size: 20px; font-weight: 800; color: #fff; }
        .chip { width: 40px; height: 30px; background: linear-gradient(135deg, #d4af37, #f1c40f); border-radius: 6px; position: absolute; right: 25px; top: 25px; }

        /* --- EXTRATO --- */
        .extrato-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); }
        .extrato-icon { width: 40px; height: 40px; background: #111; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; }

        /* --- NAV BAR --- */
        nav { 
            position: fixed; bottom: 25px; left: 5%; width: 90%; height: 70px; 
            background: rgba(10,10,10,0.9); backdrop-filter: blur(10px); 
            border: 1px solid var(--border); border-radius: 20px; 
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-link { color: #444; text-align: center; font-size: 10px; font-weight: 800; text-decoration: none; cursor: pointer; }
        .nav-link.active { color: var(--p); display: flex; flex-direction: column; }
        .nav-link i { font-size: 22px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body onload="Shark.init()">

    <header id="main-header" style="display:none;">
        <div class="user-info">
            <div class="avatar" id="avatar">J</div>
            <div>
                <div style="font-size:14px; font-weight:800;" id="user-name">JP DIAS</div>
                <div class="rank-tag">Platinum Shark</div>
            </div>
        </div>
        <div style="background: rgba(0,255,163,0.1); padding: 8px 15px; border-radius: 12px; border: 1px solid var(--p);">
            <i class="fa-solid fa-bell" style="color:var(--p)"></i>
        </div>
    </header>

    <div id="scr-home" class="screen anim">
        <div class="card-bal">
            <i class="fa-solid fa-eye-slash eye-btn" id="eye" onclick="Shark.toggle()"></i>
            <small style="color:#555; font-weight:800; text-transform:uppercase; font-size:10px;">Saldo Disponível</small>
            <div id="balance" class="blur" style="font-size:34px; font-weight:900; margin:10px 0;">R$ 1.450.850,00</div>
            <button onclick="Shark.go('scr-extrato')" style="width:100%; padding:14px; border-radius:12px; border:1px solid var(--p); background:transparent; color:var(--p); font-weight:800; margin-top:15px; cursor:pointer;">ACESSAR EXTRATO</button>
        </div>

        <div class="grid-actions">
            <div class="action-btn"><div class="icon-bg"><i class="fa-solid fa-bolt"></i></div><span>Pix</span></div>
            <div class="action-btn"><div class="icon-bg"><i class="fa-solid fa-barcode"></i></div><span>Boletos</span></div>
            <div class="action-btn"><div class="icon-bg"><i class="fa-solid fa-arrow-up-right-from-square"></i></div><span>Transf.</span></div>
            <div class="action-btn"><div class="icon-bg"><i class="fa-solid fa-ellipsis"></i></div><span>Mais</span></div>
        </div>

        <div class="platinum-card">
            <div class="chip"></div>
            <div class="plat-label">SHARK PLATINUM</div>
            <div class="plat-number">•••• •••• •••• 8835</div>
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <div>
                    <small style="color:#555; font-weight:700;">Limite disponível</small>
                    <div class="plat-limit">R$ 50.000,00</div>
                </div>
                <div style="display:flex;">
                    <div style="width:30px; height:30px; background:#eb001b; border-radius:50%; opacity:0.8;"></div>
                    <div style="width:30px; height:30px; background:#f79e1b; border-radius:50%; margin-left:-12px; opacity:0.8;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="scr-extrato" class="screen anim">
        <h2 style="margin-bottom:20px; font-weight:900;">Atividades</h2>
        <div id="lista-extrato">
            </div>
    </div>

    <nav id="navbar" style="display:none;">
        <div class="nav-link active" onclick="Shark.go('scr-home', this)"><i class="fa-solid fa-house-chimney-user"></i>Início</div>
        <div class="nav-link" onclick="Shark.go('scr-extrato', this)"><i class="fa-solid fa-receipt"></i>Extrato</div>
        <div class="nav-link" onclick="location.reload()" style="color:var(--danger)"><i class="fa-solid fa-power-off"></i>Sair</div>
    </nav>

    <script>
        const Shark = {
            isHidden: true,
            balance: 1450850.00,

            init() {
                // Simulação de login automático para teste
                document.getElementById('main-header').style.display = 'flex';
                document.getElementById('navbar').style.display = 'flex';
                this.renderExtrato();
                this.go('scr-home');
            },

            toggle() {
                this.isHidden = !this.isHidden;
                document.getElementById('balance').classList.toggle('blur', this.isHidden);
                document.getElementById('eye').className = this.isHidden ? 'fa-solid fa-eye-slash eye-btn' : 'fa-solid fa-eye eye-btn';
            },

            go(id, el) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                
                if(el) {
                    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
                    el.classList.add('active');
                }
            },

            renderExtrato() {
                const dados = [
                    {t: 'Depósito Recebido', v: '+ R$ 5.000,00', d: 'Hoje, 10:24', c: 'var(--p)', i: 'fa-arrow-down'},
                    {t: 'Pagamento Boleto', v: '- R$ 450,00', d: 'Ontem, 18:10', c: '#ff4d4d', i: 'fa-barcode'},
                    {t: 'Transferência Pix', v: '- R$ 1.200,00', d: '08 Mar, 12:00', c: '#fff', i: 'fa-bolt'}
                ];
                
                let html = '';
                dados.forEach(item => {
                    html += `
                        <div class="extrato-item">
                            <div style="display:flex; align-items:center;">
                                <div class="extrato-icon"><i class="fa-solid ${item.i}" style="color:${item.c}"></i></div>
                                <div>
                                    <div style="font-size:14px; font-weight:700;">${item.t}</div>
                                    <small style="color:#555;">${item.d}</small>
                                </div>
                            </div>
                            <div style="font-weight:800; color:${item.c}">${item.v}</div>
                        </div>
                    `;
                });
                document.getElementById('lista-extrato').innerHTML = html;
            }
        };
    </script>
</body>
</html>
