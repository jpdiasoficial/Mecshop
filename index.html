<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v80 | SHARK MODE</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #00ff41; --bg: #000; --card: #0a0a0a; --brd: #222; --danger: #ff3b30; }
        * { box-sizing: border-box; outline: none; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; font-size: 10px; height: 100vh; overflow: hidden; }
        
        header { padding: 15px; border-bottom: 2px solid #111; display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #050505; color: var(--p); }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; height: calc(100vh - 130px); }

        /* DASHBOARD SHARK */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: var(--card); border: 1px solid var(--brd); padding: 12px; border-radius: 8px; border-left: 3px solid var(--p); }
        .stat-box h2 { margin: 5px 0 0 0; font-size: 18px; font-family: 'Orbitron'; }

        /* INPUTS SHARK */
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: 'Orbitron'; margin-bottom: 8px; }
        .btn { width: 100%; padding: 16px; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-p { background: var(--p); color: #000; }

        /* NAV SHARK */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #050505; border-top: 1px solid #222; display: flex; padding: 10px; z-index: 200; }
        .nav-item { flex: 1; text-align: center; color: #444; font-size: 8px; font-weight: 800; }
        .nav-item.active { color: var(--p); }
        .nav-item i { display: block; font-size: 18px; margin-bottom: 4px; }

        .screen { display: none; height: 100%; }
        .screen.active { display: block; }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active">
    <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
        <div style="font-family:'Orbitron'; color:var(--p); font-size:35px; text-align:center;">LOG-PRO<br><span style="font-size:10px; color:#444; letter-spacing:5px;">INTELLIGENCE</span></div>
        <input type="text" id="user-name" placeholder="USUÁRIO" style="margin-top:30px;">
        <input type="password" id="pass" placeholder="CHAVE">
        <button class="btn btn-p" onclick="auth()">ACESSAR SISTEMA</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span>DASHBOARD ADMIN</span> <i class="fa-solid fa-tower-broadcast"></i></header>
    <div class="scroll">
        <div class="dash-grid">
            <div class="stat-box"><small>ESTOQUE TOTAL</small><h2 id="total-itens">0</h2></div>
            <div class="stat-box"><small>PENDÊNCIAS</small><h2 id="total-pendente" style="color:var(--danger)">0</h2></div>
        </div>
        <div id="audit-log" style="background:#050505; border:1px solid #111; padding:10px; border-radius:8px;">
            <small style="color:var(--p)">AUDITORIA EM TEMPO REAL</small>
            <div id="log-list" style="margin-top:10px;"></div>
        </div>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span>DOCA OPERACIONAL</span> <i class="fa-solid fa-barcode"></i></header>
    <div class="scroll">
        <select id="mod-op">
            <option value="ENTRADA">📥 ENTRADA</option>
            <option value="SAIDA">🚚 SAÍDA</option>
        </select>
        <input type="text" id="barcode-manual" placeholder="BIPE O CÓDIGO">
        <button class="btn btn-p" onclick="processarManual()">REGISTRAR MOVIMENTAÇÃO</button>
        <div id="feedback" style="margin-top:20px; text-align:center; font-weight:800;"></div>
    </div>
</div>

<nav id="main-nav" class="nav-bar" style="display:none;">
    <div class="nav-item active" id="nav-shark" onclick="nav('shark')"><i class="fa-solid fa-chart-line"></i>PAINEL</div>
    <div class="nav-item" id="nav-op" onclick="nav('op')"><i class="fa-solid fa-truck-loading"></i>DOCA</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRDhONvvzZmo2csXksqHs6E6vV3MuvLSs",
        authDomain: "log-pro-jp.firebaseapp.com",
        projectId: "log-pro-jp",
        storageBucket: "log-pro-jp.firebasestorage.app",
        messagingSenderId: "481645607846",
        appId: "1:481645607846:web:fd55dd943718ad78386d67"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentUser = localStorage.getItem('LP_SESSION') || "";

    // ESCUTA REAL-TIME (DASHBOARD)
    onSnapshot(query(collection(db, "logs"), orderBy("data_hora", "desc"), limit(10)), (snap) => {
        let h = ""; 
        snap.forEach(doc => {
            const m = doc.data();
            h += `<div style='border-bottom:1px solid #111; padding:5px 0;'>[${m.t}] ${m.cod} - ${m.op}</div>`;
        });
        document.getElementById('log-list').innerHTML = h;
        document.getElementById('total-itens').innerText = snap.size;
    });

    window.processarManual = async () => {
        const cod = document.getElementById('barcode-manual').value.trim();
        const tipo = document.getElementById('mod-op').value;
        if(!cod) return;

        await addDoc(collection(db, "logs"), { 
            cod: cod, t: tipo, op: currentUser, data_hora: serverTimestamp() 
        });

        document.getElementById('feedback').innerHTML = `<span style="color:var(--p)">REGISTRADO: ${cod}</span>`;
        document.getElementById('barcode-manual').value = "";
        if(navigator.vibrate) navigator.vibrate(100);
    };

    window.auth = () => {
        const u = document.getElementById('user-name').value.toUpperCase();
        const p = document.getElementById('pass').value;
        if((u==="JP"||u==="SHARK")&&p==="9910" || u==="OP"&&p==="1234") {
            localStorage.setItem('LP_SESSION', u);
            location.reload();
        } else alert("ACESSO NEGADO");
    };

    window.nav = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('scr-'+id).classList.add('active');
        document.getElementById('nav-'+id).classList.add('active');
    };

    window.init = () => {
        if(currentUser) {
            document.getElementById('scr-login').classList.remove('active');
            document.getElementById(currentUser === "OP" ? 'scr-op' : 'scr-shark').classList.add('active');
            document.getElementById('main-nav').style.display = 'flex';
        }
    };
</script>
</body>
</html>
