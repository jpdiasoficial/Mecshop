<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v83 | SHARK ENTERPRISE</title>
    
    <!-- Bibliotecas de Combate -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="https://unpkg.com"></script>
    <script src="https://cdn.jsdelivr.net"></script>
    <script src="https://www.gstatic.com"></script>
    <script src="https://www.gstatic.com"></script>

    <style>
        :root { --neon: #00ff41; --bg: #000; --card: #0d0d0d; --danger: #ff3131; --blue: #00d4ff; --dark-gray: #1a1a1a; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .shark-font { font-family: 'Orbitron', sans-serif; color: var(--neon); text-shadow: 0 0 10px rgba(0,255,65,0.4); }

        /* HEADER & STATUS */
        header { padding: 10px 20px; background: #050505; border-bottom: 2px solid var(--dark-gray); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: var(--neon); box-shadow: 0 0 8px var(--neon); }
        .offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* APP LAYOUT */
        #app { display: none; flex: 1; overflow-y: auto; padding: 15px; }
        .grid-main { display: grid; grid-template-columns: 1fr 350px; gap: 15px; }

        /* MODOS E SCANNER */
        .modos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .btn-m { background: #111; border: 1px solid #333; padding: 12px 5px; border-radius: 6px; font-size: 0.65rem; color: #666; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-m.active { border-color: var(--neon); color: var(--neon); background: rgba(0,255,65,0.1); }
        #reader { width: 100%; border-radius: 12px; border: 1px solid #222; overflow: hidden; margin-bottom: 10px; }

        /* DASHBOARD & INFO */
        .card { background: var(--card); border: 1px solid var(--dark-gray); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-val { font-family: 'Orbitron'; font-size: 1.1rem; color: var(--blue); }

        /* LISTAS VIVAS */
        .scroll-list { height: 250px; overflow-y: auto; border: 1px solid #111; border-radius: 5px; background: #050505; }
        .row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #111; font-size: 0.8rem; }
        .badge { background: rgba(0,255,65,0.1); color: var(--neon); padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        /* PAINEL SHARK (ADMIN) */
        #shark-only { display: none; margin-top: 10px; border: 1px dashed var(--neon); padding: 15px; }
        textarea { width: 100%; height: 60px; background: #000; color: var(--neon); border: 1px solid #333; padding: 8px; font-size: 0.75rem; margin-bottom: 10px; resize: none; }
        .btn-shark { width: 100%; padding: 10px; border: none; border-radius: 4px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; margin-bottom: 5px; }

        #hidden-input { position: absolute; left: -9999px; }
        @media (max-width: 900px) { .grid-main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen" style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h1 class="shark-font" style="font-size: 3rem; margin:0;">LOG-PRO</h1>
        <p style="color:var(--neon); letter-spacing: 5px; font-size: 0.8rem;">V83 ENTERPRISE</p>
        <input type="password" id="pin" style="background:#000; color:var(--neon); border:1px solid var(--neon); padding:15px; width:200px; text-align:center; margin:20px; font-size:1.5rem;" placeholder="PIN">
        <button class="btn-shark" style="background:var(--neon); width:200px;" onclick="logar()">ACESSO TERMINAL</button>
    </div>

    <!-- APP -->
    <div id="app">
        <header>
            <div>
                <span id="net-dot" class="status-dot online"></span>
                <span id="user-info" class="shark-font" style="font-size: 0.7rem;">OP: TERMINAL</span>
            </div>
            <div id="clock" class="shark-font" style="font-size: 0.8rem;">00:00:00</div>
        </header>

        <div class="grid-main">
            <!-- COLUNA ESQUERDA: OPERAÇÃO -->
            <div class="col">
                <div class="modos">
                    <div class="btn-m active" id="m-ENTRADA" onclick="setModo('ENTRADA')">ENTRADA</div>
                    <div class="btn-m" id="m-SEPARACAO" onclick="setModo('SEPARACAO')">SEP.</div>
                    <div class="btn-m" id="m-AVARIA" onclick="setModo('AVARIA')">AVARIA</div>
                    <div class="btn-m" id="m-SAIDA" onclick="setModo('SAIDA')">SAÍDA</div>
                </div>

                <div id="reader"></div>
                <input type="text" id="hidden-input">

                <div class="card">
                    <div style="display: flex; justify-content: space-between;">
                        <div>
                            <small style="color:#555;">ÚLTIMO BIP</small>
                            <div id="last-code" class="shark-font" style="font-size: 1.5rem;">---</div>
                        </div>
                        <div id="feedback" style="font-weight:bold; color:var(--blue);">AGUARDANDO...</div>
                    </div>
                    <!-- DADOS DWS -->
                    <div class="stats-grid">
                        <div><label style="font-size:0.6rem; color:#444;">PESO</label><div class="stat-val" id="dws-peso">0.0kg</div></div>
                        <div><label style="font-size:0.6rem; color:#444;">VOL.</label><div class="stat-val" id="dws-vol">0m³</div></div>
                        <div><label style="font-size:0.6rem; color:#444;">STATUS</label><div class="stat-val" id="dws-st" style="font-size:0.7rem; color:var(--neon);">PRONTO</div></div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="shark-font" style="font-size: 0.7rem; margin:0 0 10px 0;">PENDÊNCIAS EM TEMPO REAL</h3>
                    <div class="scroll-list" id="lista-viva"></div>
                </div>
            </div>

            <!-- COLUNA DIREITA: DASHBOARD SHARK -->
            <div class="col">
                <div class="card">
                    <h3 class="shark-font" style="font-size: 0.7rem; margin:0;">KPI PRODUTIVIDADE (H)</h3>
                    <canvas id="prodChart" height="200"></canvas>
                </div>

                <div id="shark-only" class="card">
                    <h3 class="shark-font" style="font-size: 0.7rem; margin:0 0 10px 0;">MASTER COMMAND</h3>
                    <textarea id="cmd-input" placeholder="CODIGO, QTD (Lançar Carga)"></textarea>
                    <button class="btn-shark" style="background:var(--neon);" onclick="lancarCarga()">DISPARAR CARGA</button>
                    <button class="btn-shark" style="background:var(--blue);" onclick="exportarCSV()">RELATÓRIO ROI (CSV)</button>
                    <button class="btn-shark" style="background:var(--danger); color:white;" onclick="resetar()">LIMPAR DOCAS</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. FIREBASE & OFFLINE-FIRST
        const firebaseConfig = { apiKey: "AIza...", projectId: "logpro-shark", appId: "1:..." };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.enablePersistence().catch(e => console.warn(e.code));

        let state = { role: 'OP', modo: 'ENTRADA', count: 0 };
        const sync = new BroadcastChannel('shark_v83');

        // 2. VOZ & NOTIFICAÇÃO
        function falar(t, err = false) {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'pt-PT'; u.rate = 1.1;
            window.speechSynthesis.speak(u);
            if(navigator.vibrate) navigator.vibrate(err ? [100, 50, 100] : 100);
        }

        // 3. LOGIN & DASHBOARD
        let chart;
        function initChart() {
            const ctx = document.getElementById('prodChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: ['08h','10h','12h','14h','16h','18h'], datasets: [{ label: 'Bipes', data: [0,0,0,0,0,0], borderColor: '#00ff41', tension: 0.4 }] },
                options: { plugins: { legend: { display: false } }, scales: { y: { display: false } } }
            });
        }

        function logar() {
            const p = document.getElementById('pin').value;
            if(p === "7979") {
                state.role = 'SHARK';
                document.getElementById('shark-only').style.display = 'block';
                document.getElementById('user-info').innerText = "JP | SHARK MASTER";
            }
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            initChart();
            startSystems();
        }

        // 4. MUDANÇA DE MODO (SYNC TOTAL)
        function setModo(m) {
            state.modo = m;
            document.querySelectorAll('.btn-m').forEach(b => b.classList.remove('active'));
            document.getElementById('m-'+m.replace('Ç','C')).classList.add('active');
            sync.postMessage({ type: 'MODO', val: m });
            falar("Modo " + m);
        }
        sync.onmessage = (e) => { if(e.data.type === 'MODO') setModo(e.data.val); };

        // 5. CÉREBRO LOGÍSTICO (BIPE + DWS)
        async function processarBipe(codigo) {
            const cod = codigo.trim(); if(!cod) return;
            document.getElementById('last-code').innerText = cod;
            document.getElementById('feedback').innerText = "PROCESSANDO...";

            try {
                // Registro de Log (ROI)
                await db.collection("logs").add({ cod, modo: state.modo, user: state.role, ts: firebase.firestore.FieldValue.serverTimestamp() });
                
                // Simulação DWS (Pode ligar a balança real aqui via API)
                const pesoSim = (Math.random() * 5).toFixed(2);
                document.getElementById('dws-peso').innerText = pesoSim + "kg";
                document.getElementById('dws-vol').innerText = "0.0" + Math.floor(Math.random()*9) + "m³";

                if(state.modo === "SEPARACAO") {
                    const ref = db.collection("carga").doc(cod);
                    const doc = await ref.get();
                    if(doc.exists && doc.data().falta > 0) {
                        await ref.update({ falta: firebase.firestore.FieldValue.increment(-1) });
                        falar("OK");
                        document.getElementById('feedback').style.color = "var(--neon)";
                    } else {
                        falar("Item fora da carga", true);
                        document.getElementById('feedback').style.color = "var(--danger)";
                    }
                } else { falar("Registado"); }
            } catch(e) { console.error(e); }
            document.getElementById('hidden-input').value = "";
        }

        // 6. SNAPSHOTS REAL-TIME
        db.collection("carga").onSnapshot(snap => {
            const list = document.getElementById('lista-viva');
            list.innerHTML = "";
            snap.forEach(d => {
                if(d.data().falta > 0) {
                    list.innerHTML += `<div class="row"><span>📦 ${d.id}</span><span class="badge">${d.data().falta}</span></div>`;
                }
            });
        });

        // 7. FUNÇÕES SHARK
        async function lancarCarga() {
            const lines = document.getElementById('cmd-input').value.split('\n');
            const batch = db.batch();
            lines.forEach(l => {
                const [c, q] = l.split(',');
                if(c && q) batch.set(db.collection("carga").doc(c.trim()), { falta: parseInt(q) });
            });
            await batch.commit();
            falar("Carga disparada para as docas");
            document.getElementById('cmd-input').value = "";
        }

        async function exportarCSV() {
            const snap = await db.collection("logs").orderBy("ts", "desc").limit(500).get();
            let csv = "DATA,MODO,CODIGO,OPERADOR\n";
            snap.forEach(d => { const l = d.data(); csv += `${l.ts?.toDate().toLocaleString()},${l.modo},${l.cod},${l.user}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `SHARK_LOGS.csv`; a.click();
        }

        async function resetar() { if(confirm("LIMPAR DOCAS?")) { const s = await db.collection("carga").get(); s.forEach(d => d.ref.delete()); } }

        // MONITOR
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
            document.getElementById('net-dot').className = navigator.onLine ? "status-dot online" : "status-dot offline";
        }, 1000);

        function startSystems() {
            const scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 30, qrbox: 250 }, (t) => processarBipe(t));
            setInterval(() => document.getElementById('hidden-input').focus(), 1000);
            document.getElementById('hidden-input').addEventListener('change', (e) => processarBipe(e.target.value));
        }
    </script>
</body>
</html>
