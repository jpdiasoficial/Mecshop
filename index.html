<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | GENESIS V110</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #ff9f0a; --bg: #050505; --surface: rgba(20, 20, 20, 0.95);
            --border: rgba(255, 159, 10, 0.2); --green: #32d74b; --blue: #007aff; --red: #ff453a;
        }
        body { background: var(--bg); color: #f0f0f0; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; overflow-x: hidden; }

        /* --- PORTAL DE ENTRADA (MÉTODO HIERÁRQUICO) --- */
        #portal { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #111 0%, #000 100%); }
        .logo-box { text-align: center; margin-bottom: 30px; }
        .logo-box h1 { font-family: 'Orbitron'; font-size: 35px; letter-spacing: 12px; color: #fff; margin: 0; }
        
        .auth-grid { display: grid; grid-template-columns: 1fr; gap: 10px; width: 320px; }
        .btn-access { 
            padding: 18px; background: var(--surface); border: 1px solid var(--border); 
            color: #fff; font-family: 'JetBrains Mono'; font-size: 11px; font-weight: bold; 
            cursor: pointer; transition: 0.3s; text-align: left; display: flex; justify-content: space-between;
        }
        .btn-access:hover { border-color: var(--primary); background: rgba(255,159,10,0.1); transform: scale(1.02); }

        /* --- LOBBY MASTER (VISÃO DE DEUS) --- */
        #lobby { display: none; padding: 20px; animation: fadeIn 0.5s; }
        .header-main { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #333; }
        
        .grid-dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-monitor { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; border-top: 3px solid var(--primary); }
        .card-monitor h3 { font-family: 'Orbitron'; font-size: 12px; color: var(--primary); margin: 0 0 15px 0; }

        /* --- MÓDULOS OPERACIONAIS --- */
        .modulo { display: none; padding: 15px; animation: fadeIn 0.4s; }
        .camera-box { width: 100%; height: 220px; background: #000; border: 1px solid var(--primary); position: relative; overflow: hidden; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .scan-line { position: absolute; top: 0; width: 100%; height: 2px; background: var(--primary); box-shadow: 0 0 15px var(--primary); animation: scan 3s infinite linear; }

        /* --- ELEMENTOS REFINADOS --- */
        .staff-row { display: flex; justify-content: space-between; font-family: 'JetBrains Mono'; font-size: 10px; padding: 8px 0; border-bottom: 1px solid #222; }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; background: var(--green); margin-right: 5px; animation: pulse 1.5s infinite; }
        .btn-cmd { width: 100%; padding: 15px; background: transparent; border: 1px solid var(--primary); color: var(--primary); font-weight: 900; cursor: pointer; margin-top: 10px; }
        .terminal { background: #000; color: var(--green); padding: 10px; font-family: 'JetBrains Mono'; font-size: 10px; height: 100px; overflow-y: auto; margin-top: 10px; border: 1px solid #222; }

        @keyframes scan { from { top: 0; } to { top: 100%; } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="portal">
    <div class="logo-box">
        <h1>JP DIAS</h1>
        <p style="color:var(--primary); font-size:9px; letter-spacing:5px;">GENESIS LOGISTICS CORE</p>
    </div>
    <div class="auth-grid">
        <button class="btn-access" onclick="entrar('DONO')">01. PROPRIETÁRIO <span>👑</span></button>
        <button class="btn-access" onclick="entrar('SHARK')">02. ADMIN (SHARK) <span>🦈</span></button>
        <button class="btn-access" onclick="entrar('SUPERVISOR')">03. SUPERVISOR <span>🛡️</span></button>
        <button class="btn-access" onclick="entrar('LIDER')">04. LÍDER <span>🎖️</span></button>
        <button class="btn-access" onclick="entrar('OPERACIONAL')">05. OPERACIONAL <span>📦</span></button>
        <button class="btn-access" onclick="entrar('MOTORISTA')" style="border-color:var(--blue);">06. MOTORISTA <span>🚚</span></button>
    </div>
</div>

<div id="lobby">
    <header class="header-main">
        <div id="user-display" style="color:var(--primary); font-family:'Orbitron'; font-size:10px;">ID: GHOST-INIT</div>
        <button onclick="location.reload()" style="background:none; border:none; color:#555; cursor:pointer;">DISCONNECT_</button>
    </header>

    <div class="grid-dash" id="dash-content">
        </div>
</div>

<div id="mod-operacional" class="modulo">
    <header class="header-main">
        <button onclick="voltarLobby()" style="background:none; border:none; color:var(--primary); font-weight:bold;">⬅ VOLTAR</button>
        <span id="mod-title" style="font-family:'Orbitron'; font-size:11px;">ESTAÇÃO TÉCNICA</span>
    </header>

    <div class="camera-box">
        <video id="webcam" autoplay playsinline></video>
        <div class="scan-line"></div>
    </div>

    <button class="btn-cmd" onclick="biparVoz()">BIPAR PRODUTO (VOZ)</button>
    <button class="btn-cmd" style="border-color:var(--red); color:var(--red);" onclick="alert('Avaria Reportada')">SINALIZAR AVARIA</button>
    
    <div class="terminal" id="term-op">> SISTEMA PRONTO PARA BIPAGEM...</div>
</div>

<script>
    let roleAtual = "";
    let stream = null;

    function entrar(role) {
        if(role !== 'OPERACIONAL' && role !== 'MOTORISTA') {
            if(prompt("DIGITE A CHAVE MESTRE:") !== "123") return;
        }
        roleAtual = role;
        document.getElementById('portal').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('user-display').innerText = `MODO: ${role} | ID: ${Math.floor(Math.random()*9999)}`;
        
        falar(`Bem vindo à rede JP Dias. Nível de acesso ${role}.`);
        montarDash();
    }

    function montarDash() {
        const dash = document.getElementById('dash-content');
        dash.innerHTML = "";

        // TODAS AS ENGRENAGENS PARA DONO/SHARK/SUPERVISOR
        if(['DONO', 'SHARK', 'SUPERVISOR'].includes(roleAtual)) {
            dash.innerHTML += `
                <div class="card-monitor">
                    <h3>👥 STAFF REAL-TIME</h3>
                    <div class="staff-row"><span><span class="status-dot"></span>GHOST-44</span><span>ARMAZÉM</span><span><button onclick="alert('Editando...')">EDIT</button></span></div>
                    <div class="staff-row"><span><span class="status-dot"></span>GHOST-12</span><span>CROSSDOCK</span><span><button onclick="alert('Editando...')">EDIT</button></span></div>
                    <div class="staff-row"><span><span class="status-dot" style="background:var(--blue)"></span>MOT-778</span><span>EM ROTA</span><span><button onclick="alert('Localizar...')">MAP</button></span></div>
                </div>
                <div class="card-monitor">
                    <h3>📊 PERFORMANCE GLOBAL</h3>
                    <p style="font-size:10px;">BIPAGENS HOJE: 1.240</p>
                    <div style="width:100%; height:5px; background:#222;"><div style="width:75%; height:100%; background:var(--green);"></div></div>
                    <button class="btn-cmd" onclick="abrirModulo('AUDITORIA')">AUDITAR AGORA</button>
                </div>
            `;
        }

        // ACESSOS COMUNS
        dash.innerHTML += `
            <div class="card-monitor">
                <h3>📦 OPERAÇÃO DE CAMPO</h3>
                <button class="btn-cmd" onclick="abrirModulo('ARMAZÉM')">ACESSAR ARMAZÉM</button>
                <button class="btn-cmd" onclick="abrirModulo('CROSSDOCK')">ACESSAR CROSSDOCK</button>
            </div>
        `;

        if(roleAtual === 'MOTORISTA') {
            dash.innerHTML += `
                <div class="card-monitor" style="border-top-color:var(--blue)">
                    <h3>🚚 ROTA DO MOTORISTA</h3>
                    <p style="font-size:10px;">MANIFESTO: #9921-A</p>
                    <button class="btn-cmd" style="border-color:var(--blue); color:var(--blue);">INICIAR GPS ROTA</button>
                </div>
            `;
        }
    }

    async function abrirModulo(nome) {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('mod-operacional').style.display = 'block';
        document.getElementById('mod-title').innerText = nome;
        
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('webcam').srcObject = stream;
        } catch(e) { console.log("Sem câmera"); }
    }

    function biparVoz() {
        falar("Aponte para o código. Informe os 3 dígitos.");
        let c = prompt("CÓDIGO:");
        if(c) {
            document.getElementById('term-op').innerHTML += `> ITEM ${c} VALIDADO.<br>`;
            falar("Confirmado. Diga OK para a próxima etapa.");
        }
    }

    function voltarLobby() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('mod-operacional').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
    }

    function falar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'pt-BR';
        window.speechSynthesis.speak(m);
    }
</script>

</body>
</html>
