<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MecShop Independent Units</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff0000; --gold: #d4af37; --nu: #820ad1; --dark: #000; }
        body { background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; text-align: center; }
        
        /* O "DESIGN MEC" INDEPENDENTE */
        .app-window { width: 100%; max-width: 400px; height: 650px; background: #050505; border: 1px solid #111; border-radius: 40px; margin: 20px auto; overflow: hidden; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        .notch { width: 120px; height: 25px; background: #000; position: absolute; top: 0; left: 50%; transform: translateX(-50%); border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 10; }
        
        /* HEADER ESTILO NATIVO */
        .status-bar { padding: 15px 25px; display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; }
        
        /* CONTEÚDO DINÂMICO */
        .content { padding: 20px; }
        .card-main { background: #111; border-radius: 25px; padding: 25px; margin-top: 10px; border-left: 5px solid var(--red); text-align: left; }
        .shark-btn { background: var(--gold); color: #000; border: none; padding: 15px; border-radius: 15px; font-family: 'Orbitron'; font-size: 10px; width: 100%; margin-top: 20px; }
        
        /* BOTÃO DE TRANSIÇÃO ENTRE APPS */
        .dock { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 20px; display: flex; gap: 15px; backdrop-filter: blur(10px); }
        .dock-item { width: 35px; height: 35px; background: #111; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="app-window" id="app-frame">
    <div class="notch"></div>
    <div class="status-bar"><span>9:41</span><span>MEC-BANK 💳</span></div>
    
    <div class="content" id="app-body">
        <div style="background:var(--nu); padding:30px; border-radius:30px; text-align:left; margin-top:20px;">
            <p style="font-size:12px; opacity:0.7;">Saldo Total</p>
            <h2 style="font-family:'Orbitron'; font-size:28px;">R$ 45.200,90</h2>
        </div>
        
        <div class="card-main">
            <b>Última Venda Sergel</b>
            <p style="font-size:12px; opacity:0.5;">+ R$ 15,00 (Pote V10)</p>
        </div>

        <button class="shark-btn" onclick="alert('AUDITORIA SHARK: Sistema Saudável')">ABRIR MODO SHARK</button>
    </div>

    <div class="dock">
        <div class="dock-item" onclick="changeApp('bank')">💳</div>
        <div class="dock-item" onclick="changeApp('log')">📦</div>
        <div class="dock-item" onclick="changeApp('sergel')">🍦</div>
        <div class="dock-item" onclick="changeApp('rota')">📍</div>
    </div>
</div>

<script>
    function changeApp(type) {
        const body = document.getElementById('app-body');
        const header = document.querySelector('.status-bar span:last-child');
        
        if(type === 'log') {
            header.innerText = "LOG-PRO 📦";
            body.innerHTML = `<div style="height:250px; background:#111; border:2px dashed var(--red); border-radius:30px; display:flex; align-items:center; justify-content:center;">SCANNER ATIVO</div><button class="shark-btn">RELATÓRIO DE CARGA</button>`;
        } else if(type === 'sergel') {
            header.innerText = "SERGEL 🍦";
            body.innerHTML = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><div style="background:#111; height:120px; border-radius:20px;"></div><div style="background:#111; height:120px; border-radius:20px;"></div></div><button class="shark-btn">LUCRO DO DIA</button>`;
        } else if(type === 'bank') {
            location.reload();
        }
    }
</script>

</body>
</html>
