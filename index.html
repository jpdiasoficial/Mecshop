<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | GENESIS V195</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff9f0a; --bg: #050505; --surface: #121212; --border: rgba(255,159,10,0.3); --red: #ff375f; --blue: #0a84ff; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; overflow: hidden; height: 100vh; }
        .glass { background: rgba(25, 25, 25, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 12px; }
        
        /* --- PORTAL DE ACESSO --- */
        #portal { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #ghost-trigger { font-family: 'Orbitron'; letter-spacing: 10px; color: #151515; cursor: pointer; user-select: none; margin-bottom: 20px; transition: 0.3s; }
        
        .btn-access { width: 280px; padding: 20px; margin: 10px; background: var(--surface); border: 1px solid var(--border); color: #fff; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-radius: 8px; font-size: 12px; }
        .btn-access:hover { border-color: var(--primary); background: #1a1a1a; }

        /* --- PAINEL MASTER (DIRETORIA) --- */
        #painel-master { display: none; padding: 20px; height: 100vh; overflow-y: auto; box-sizing: border-box; }
        .section { padding: 15px; margin-bottom: 20px; border-left: 4px solid var(--primary); background: #111; border-radius: 4px; }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #111; padding: 15px; border-radius: 8px; border: 1px solid #222; text-align: center; }
        .stat-card b { display: block; color: var(--primary); font-family: 'Orbitron'; font-size: 18px; }

        /* --- MÓDULOS OPERACIONAIS --- */
        .mod-op { display: none; height: 100vh; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .display-v { flex: 1; border: 2px solid var(--primary); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: rgba(255,159,10,0.05); }
    </style>
</head>
<body>

<div id="portal">
    <h1 id="ghost-trigger" onclick="ghostLogin()">JP DIAS</h1>
    
    <div class="glass" style="padding: 20px; display: flex; flex-direction: column;">
        <button class="btn-access" onclick="entrarOp('SHARK')">LOGIN GESTOR (SHARK) <span>🦈</span></button>
        <button class="btn-access" onclick="entrarOp('ARMAZEM')">OPERAÇÃO ARMAZÉM <span>🎙️</span></button>
        <button class="btn-access" onclick="entrarOp('CROSSDOCK')" style="border-color: var(--blue);">MODO CROSSDOCK <span>📦</span></button>
    </div>
</div>

<div id="painel-master">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="font-family:'Orbitron'; font-size:12px; color:var(--primary);">GENESIS | CONTROL PANEL</h2>
        <button onclick="location.reload()" style="background:none; border:1px solid var(--red); color:var(--red); padding:5px 10px; font-size:10px; cursor:pointer; border-radius:4px;">SAIR</button>
    </div>

    <div class="grid-stats">
        <div class="stat-card"><b>R$ 1.680</b><small style="font-size:9px;">ROI ECONOMIA</small></div>
        <div class="stat-card" style="border-color:var(--blue);"><b>12ms</b><small style="font-size:9px;">LATÊNCIA REDE</small></div>
    </div>

    <div class="section glass">
        <h4 style="font-family:'Orbitron'; font-size:10px; margin-top:0;">AUDITORIA DE GHOSTS</h4>
        <div id="logs" style="font-size:10px; color:#666; font-family: monospace;">
            > GHOST-01: 22s (ELITE)<br>
            > GHOST-05: 89s (ATENÇÃO)
        </div>
    </div>
</div>

<div id="mod-armazem" class="mod-op">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <span style="font-family:'Orbitron'; color:var(--primary); font-size:10px;">MODO: ARMAZÉM</span>
        <button onclick="location.reload()" style="background:none; border:none; color:var(--red); font-size:10px;">SAIR</button>
    </div>
    <div class="display-v">
        <div id="voz-status" style="font-family:'Orbitron'; font-size:20px; color:var(--primary);">DIGA "ATIVAR" 3X</div>
        <div style="font-size:10px; color:#444; margin-top:10px;">RECONHECIMENTO DE VOZ ATIVO</div>
    </div>
</div>

<div id="mod-crossdock" class="mod-op">
    <h3 style="font-family:'Orbitron'; font-size:12px; color:var(--blue);">LISTA CROSSDOCK</h3>
    <div style="background:#111; flex:1; border-radius:10px; padding:15px; border:1px solid #222;">
        <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #222; font-size:12px;">
            <span>PRODUTO #998</span> <span style="color:var(--blue);">BIPAR</span>
        </div>
    </div>
    <button onclick="location.reload()" class="btn-access" style="width:100%; border-color:var(--red); margin-top:10px; justify-content:center;">SAIR DA OPERAÇÃO</button>
</div>

<script>
    let clicks = 0;
    let ativarCount = 0;

    // LOGIN GHOST (DONO)
    function ghostLogin() {
        clicks++;
        if(clicks === 5) {
            let pass = prompt("CHAVE MASTER:");
            if(pass === "9910") {
                document.getElementById('portal').style.display = 'none';
                document.getElementById('painel-master').style.display = 'block';
                falar("Acesso mestre concedido. Bem vindo J P.");
            }
            clicks = 0;
        }
        setTimeout(() => { clicks = 0; }, 3000); // Reset clicks after 3s
    }

    // LOGIN OPERACIONAL
    function entrarOp(modo) {
        document.getElementById('portal').style.display = 'none';
        if(modo === 'SHARK') {
            if(prompt("SENHA GESTOR:") === "123") {
                document.getElementById('painel-master').style.display = 'block';
            } else {
                location.reload();
            }
        } else if(modo === 'ARMAZEM') {
            document.getElementById('mod-armazem').style.display = 'flex';
            iniciarVoz();
        } else {
            document.getElementById('mod-crossdock').style.display = 'flex';
        }
    }

    // MOTOR DE VOZ
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    const voiceEngine = Speech ? new Speech() : null;

    function iniciarVoz() {
        if(voiceEngine) {
            voiceEngine.continuous = true;
            voiceEngine.lang = 'pt-BR';
            voiceEngine.onresult = (e) => {
                const txt = e.results[e.results.length-1][0].transcript.toLowerCase();
                if(txt.includes("ativar")) {
                    ativarCount++;
                    falar(ativarCount);
                    if(ativarCount === 3) {
                        document.getElementById('voz-status').innerHTML = "CASA A-12<br>FINAL: 482";
                        falar("Ativado. Vá para a Casa A-12. Código final 482.");
                        ativarCount = 0;
                    }
                }
            };
            voiceEngine.start();
        }
    }

    function falar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'pt-BR';
        window.speechSynthesis.speak(m);
    }
</script>
</body>
</html>
