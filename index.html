<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET INFINITY | MASTER EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --p: #ff5e00; --g: #00ff41; --gold: #d4af37; --danger: #ff3b30;
            --bg: #020202; --card: #0d0d0d; --border: #1a1a1a;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        .view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); z-index: 10; overflow-y: auto; padding-bottom: 90px; }
        .view.active { display: flex; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        header { height: 65px; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo { font-weight: 900; font-size: 22px; color: var(--gold); }

        .card { background: var(--card); margin: 12px; padding: 20px; border-radius: 20px; border: 1px solid var(--border); position: relative; }
        .btn { border: none; border-radius: 14px; font-weight: 900; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn-p { background: linear-gradient(90deg, #ff5e00, #ff8c00); color: #fff; padding: 16px; width: 100%; }
        .btn-g { background: linear-gradient(90deg, #00ff41, #00cc33); color: #000; padding: 16px; width: 100%; }
        
        .bet-selector { display: flex; align-items: center; background: #000; border-radius: 15px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 10px; }
        .bet-btn { padding: 15px 20px; background: #111; color: #fff; border: none; font-weight: 900; cursor: pointer; }
        .bet-value { flex: 1; text-align: center; font-weight: 900; color: var(--gold); }

        .m-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; background: #000; padding: 12px; border-radius: 18px; border: 1px solid var(--border); }
        .tile { aspect-ratio: 1/1; background: #111; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: 0.2s; border-bottom: 4px solid #000; }
        .tile.open { border-bottom: none; transform: scale(0.92); background: #1a1a1a; }

        input { width:100%; padding:18px; background:var(--card); border:1px solid var(--border); border-radius:15px; color:#fff; margin-bottom:12px; outline:none; }
        .link-text { font-size: 11px; color: #555; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: rgba(5,5,5,0.95); border-top: 1px solid var(--border); display: none; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-link { color: #333; font-size: 10px; font-weight: 900; text-align: center; }
        .nav-link.active { color: var(--gold); }
    </style>
</head>
<body onload="App.init()">

    <div id="scr-auth" class="view active">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:35px;">
            <div class="logo" style="font-size:45px; margin-bottom:30px;">MEC-BET</div>
            <input type="text" id="u-in" placeholder="USUÁRIO OU EMAIL">
            <input type="password" id="p-in" placeholder="SENHA">
            <button class="btn btn-p" onclick="App.Auth.login()">ENTRAR</button>
            <div style="display:flex; gap:20px; margin-top:15px;">
                <span class="link-text" onclick="App.Router.go('scr-reg')">CRIAR CONTA</span>
                <span class="link-text" onclick="App.Router.go('scr-forgot')">ESQUECI A SENHA</span>
            </div>
        </div>
    </div>

    <div id="scr-reg" class="view">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:35px;">
            <h2 style="margin-bottom:20px;">CADASTRO</h2>
            <input type="text" placeholder="NOME COMPLETO">
            <input type="email" placeholder="E-MAIL">
            <input type="password" placeholder="CRIE UMA SENHA">
            <button class="btn btn-g" onclick="App.Router.go('scr-auth')">FINALIZAR REGISTRO</button>
            <span class="link-text" onclick="App.Router.go('scr-auth')">VOLTAR AO LOGIN</span>
        </div>
    </div>

    <div id="scr-forgot" class="view">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:35px;">
            <h2 style="margin-bottom:20px;">RECUPERAR</h2>
            <p style="font-size:11px; color:#555; text-align:center; margin-bottom:20px;">Digite seu e-mail para receber o link.</p>
            <input type="email" placeholder="SEU E-MAIL">
            <button class="btn btn-p" onclick="alert('LINK ENVIADO!'); App.Router.go('scr-auth')">ENVIAR LINK</button>
            <span class="link-text" onclick="App.Router.go('scr-auth')">VOLTAR AO LOGIN</span>
        </div>
    </div>

    <div id="scr-lobby" class="view">
        <header><div class="logo">MEC-BET</div><div id="u-lvl" style="font-size:10px; color:var(--gold);">LVL 1</div></header>
        <div class="card" style="border-left: 5px solid var(--g);">
            <p style="font-size:10px; color:#444;">SALDO DISPONÍVEL</p>
            <h1 id="u-saldo" style="font-size:45px;">R$ 0,00</h1>
            <button class="btn btn-g" style="margin-top:15px;" onclick="App.System.deposit()">DEPOSITAR</button>
        </div>
        <div style="padding:15px;"><div class="card" onclick="App.Router.go('scr-mines')" style="cursor:pointer;"><i class="fa-solid fa-gem" style="color:var(--gold); margin-right:10px;"></i> JOGAR MINES PRO</div></div>
    </div>

    <div id="scr-mines" class="view">
        <header><i class="fa-solid fa-chevron-left" onclick="App.Router.go('scr-lobby')"></i><div id="m-saldo" style="color:var(--g); font-weight:900;">R$ 0,00</div><i class="fa-solid fa-rotate"></i></header>
        <div style="padding:15px;">
            <div class="m-grid" id="m-board"></div>
            
            <div class="bet-selector" style="margin-top:20px;">
                <button class="bet-btn" onclick="App.Game.changeBet(-5)">-</button>
                <div class="bet-value" id="bet-display">APOSTA: R$ 10</div>
                <button class="bet-btn" onclick="App.Game.changeBet(5)">+</button>
            </div>

            <button id="m-start" class="btn btn-p" onclick="App.Game.Mines.start()">INICIAR JOGO</button>
            <button id="m-cash" class="btn btn-g" style="display:none;" onclick="App.Game.Mines.cashout()">COLETAR LUCRO</button>
            <p id="m-msg" style="text-align:center; margin-top:15px; color:var(--gold); font-weight:900;"></p>
        </div>
    </div>

    <div id="scr-admin" class="view">
        <header><div class="logo" style="color:var(--p)">SHARK CONTROL</div><i class="fa-solid fa-eye-slash" onclick="App.Router.go('scr-lobby')"></i></header>
        <div style="padding:15px;">
            <div class="card" style="border-top: 3px solid var(--p);">
                <p style="font-size:10px;">LUCRO DA CASA (GGR)</p>
                <h2 id="adm-profit">R$ 0,00</h2>
            </div>
            <div id="adm-list"></div>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-link active" onclick="App.Router.go('scr-lobby')"><i class="fa-solid fa-house"></i><br>INÍCIO</div>
        <div class="nav-link" onclick="App.Router.go('scr-mines')"><i class="fa-solid fa-gem"></i><br>MINES</div>
        <div id="nav-shark" class="nav-link" style="display:none; color:var(--gold)" onclick="App.Router.go('scr-admin')"><i class="fa-solid fa-crown"></i><br>SHARK</div>
        <div class="nav-link" onclick="App.Auth.logout()"><i class="fa-solid fa-user"></i><br>SAIR</div>
    </nav>

    <script>
        const App = {
            db: JSON.parse(localStorage.getItem('MEC_MASTER_V10')) || [],
            curr: null,
            bet: 10,

            init() {
                window.addEventListener('storage', () => {
                    this.db = JSON.parse(localStorage.getItem('MEC_MASTER_V10'));
                    if(this.curr) {
                        this.curr = this.db.find(u => u.user === this.curr.user);
                        this.System.syncUI();
                    }
                });
                const sess = sessionStorage.getItem('MEC_SESS');
                if(sess) {
                    this.curr = this.db.find(u => u.user === sess);
                    if(this.curr) this.System.unlock();
                }
                this.Game.Mines.render();
            },

            Auth: {
                login() {
                    let u = document.getElementById('u-in').value.toUpperCase();
                    if(!u) return;
                    let user = App.db.find(x => x.user === u);
                    if(!user) {
                        user = { user: u, saldo: 0, lvl: 1, role: u === 'ADMIN' ? 'admin' : 'player', mode: 'auto' };
                        App.db.push(user); App.System.save();
                    }
                    sessionStorage.setItem('MEC_SESS', u);
                    location.reload();
                },
                logout() { sessionStorage.clear(); location.reload(); }
            },

            Game: {
                changeBet(val) {
                    App.bet += val;
                    if(App.bet < 5) App.bet = 5;
                    document.getElementById('bet-display').innerText = `APOSTA: R$ ${App.bet}`;
                },
                Mines: {
                    playing: false, mult: 1,
                    start() {
                        if(App.curr.saldo < App.bet) return alert("SALDO INSUFICIENTE!");
                        App.curr.saldo -= App.bet; App.System.saveSync();
                        this.playing = true; this.mult = 1;
                        document.getElementById('m-start').style.display = 'none';
                        document.getElementById('m-cash').style.display = 'block';
                        this.render();
                    },
                    render() {
                        const board = document.getElementById('m-board'); board.innerHTML = '';
                        const bPos = Math.floor(Math.random() * 25);
                        for(let i=0; i<25; i++) {
                            let t = document.createElement('div'); t.className = 'tile';
                            t.onclick = () => {
                                if(!this.playing || t.classList.contains('open')) return;
                                t.classList.add('open');
                                let isBomb = (i === bPos);
                                if(App.curr.mode === 'win') isBomb = false;
                                if(App.curr.mode === 'lose') isBomb = true;

                                if(isBomb) {
                                    t.innerHTML = '💣'; t.style.color = 'red'; this.end(false);
                                } else {
                                    t.innerHTML = '💎'; t.style.color = 'var(--g)';
                                    this.mult += 0.8;
                                    document.getElementById('m-cash').innerText = `COLETAR R$ ${(App.bet * this.mult).toFixed(2)}`;
                                }
                            };
                            board.appendChild(t);
                        }
                    },
                    cashout() { App.curr.saldo += (App.bet * this.mult); this.end(true); },
                    end(win) {
                        this.playing = false;
                        document.getElementById('m-start').style.display = 'block';
                        document.getElementById('m-cash').style.display = 'none';
                        document.getElementById('m-msg').innerText = win ? "GANHOU!" : "PERDEU!";
                        if(win) App.curr.lvl += 1;
                        App.System.saveSync();
                    }
                }
            },

            System: {
                unlock() {
                    document.getElementById('scr-auth').classList.remove('active');
                    document.getElementById('navbar').style.display = 'flex';
                    if(App.curr.role === 'admin') {
                        document.getElementById('scr-admin').classList.add('active');
                        document.getElementById('nav-shark').style.display = 'block';
                    } else { document.getElementById('scr-lobby').classList.add('active'); }
                    this.syncUI();
                },
                syncUI() {
                    document.getElementById('u-saldo').innerText = `R$ ${App.curr.saldo.toFixed(2)}`;
                    document.getElementById('m-saldo').innerText = `R$ ${App.curr.saldo.toFixed(2)}`;
                    if(App.curr.role === 'admin') this.loadShark();
                },
                loadShark() {
                    const list = document.getElementById('adm-list');
                    let profit = 0;
                    list.innerHTML = App.db.filter(u => u.role !== 'admin').map(u => {
                        profit += (u.lvl * 20) - u.saldo;
                        return `
                        <div class="card" style="margin:5px 0; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                            <div><b>${u.user}</b><br><small style="color:var(--g)">R$ ${u.saldo.toFixed(2)}</small></div>
                            <div style="display:flex; gap:5px;">
                                <button onclick="App.System.admMod('${u.user}', 50)" style="background:var(--g); border:none; padding:8px 12px; border-radius:8px; font-weight:bold;">+</button>
                                <button onclick="App.System.admMod('${u.user}', -50)" style="background:var(--danger); border:none; padding:8px 12px; border-radius:8px; color:white; font-weight:bold;">-</button>
                                <button onclick="App.System.admMode('${u.user}','win')" style="background:var(--gold); border:none; padding:8px 12px; border-radius:8px;">🏆</button>
                                <button onclick="App.System.admMode('${u.user}','lose')" style="background:#444; border:none; padding:8px 12px; border-radius:8px; color:#fff;">💀</button>
                            </div>
                        </div>`;
                    }).join('');
                    document.getElementById('adm-profit').innerText = `R$ ${Math.abs(profit).toFixed(2)}`;
                },
                admMod(name, val) { let u = App.db.find(x => x.user === name); u.saldo += val; this.saveSync(); },
                admMode(name, mode) { let u = App.db.find(x => x.user === name); u.mode = mode; this.saveSync(); },
                save() { localStorage.setItem('MEC_MASTER_V10', JSON.stringify(App.db)); },
                saveSync() { this.save(); this.syncUI(); },
                deposit() { App.curr.saldo += 100; this.saveSync(); alert("PIX SIMULADO!"); }
            },

            Router: {
                go(id) {
                    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                    document.getElementById(id).classList.add('active');
                }
            }
        };
    </script>
</body>
</html>
