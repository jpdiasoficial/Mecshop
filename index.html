<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | GENESIS V160</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&family=Orbitron:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff9f0a; --bg: #050505; --surface: #121212; --border: rgba(255,159,10,0.3); --green: #32d74b; --red: #ff375f; --blue: #0a84ff; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; overflow: hidden; }
        
        /* PORTAL & HIERARQUIA */
        #portal { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #111 0%, #000 100%); }
        .btn-access { width: 300px; padding: 18px; margin: 8px; background: var(--surface); border: 1px solid var(--border); color: #fff; font-family: 'JetBrains Mono'; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-radius: 4px; }
        
        /* PAINEL DIRETORIA (GOD/SHARK) */
        #lobby { display: none; padding: 20px; animation: fadeIn 0.5s; overflow-y: auto; height: 100vh; }
        .card-adm { background: var(--surface); border: 1px solid var(--primary); padding: 15px; border-radius: 8px; margin-bottom: 20px; }

        /* MÓDULOS OPERACIONAIS */
        .modulo { display: none; padding: 20px; height: 100vh; animation: fadeIn 0.4s; }
        .camera-box { width: 100%; height: 220px; background: #000; border: 2px solid var(--primary); border-radius: 12px; position: relative; overflow: hidden; }
        .scan-line { position: absolute; top: 0; width: 100%; height: 2px; background: var(--primary); box-shadow: 0 0 15px var(--primary); animation: scan 3s infinite linear; }
        
        /* INTERFACE DE VOZ & LISTA */
        .terminal { background: #000; color: #666; padding: 15px; height: 180px; overflow-y: auto; font-family: 'JetBrains Mono'; font-size: 11px; border: 1px solid #222; margin-top: 15px; border-radius: 5px; }
        .display-instrucao { background: #111; padding: 15px; text-align: center; color: var(--primary); font-family: 'Orbitron'; font-size: 14px; border: 1px solid var(--border); margin-top: 10px; }
        
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="portal">
    <h1 style="font-family:'Orbitron'; letter-spacing:8px; margin-bottom:30px;">JP DIAS</h1>
    <button class="btn-access" onclick="acesso('GOD')">GOD (OWNER) <span>⚡</span></button>
    <button class="btn-access" onclick="acesso('SHARK')">SHARK (CLIENT) <span>🦈</span></button>
    <button class="btn-access" onclick="acesso('SUPERVISOR')">SUPERVISOR <span>🛡️</span></button>
    <button class="btn-access" onclick="acesso('OPERACIONAL')">OPERACIONAL <span>📦</span></button>
    <button class="btn-access" onclick="acesso('MOTORISTA')" style="border-color:var(--blue);">MOTORISTA <span>🚚</span></button>
</div>

<div id="lobby">
    <div id="adm-controls" class="card-adm" style="display:none;">
        <h3 style="font-family:'Orbitron'; font-size:12px; color:var(--primary); margin:0;">DIRETORIA ESTRATÉGICA</h3>
        <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
        <label style="font-size:10px;">LIBERAR MOTORISTA: <input type="checkbox" id="check-mot" checked></label><br><br>
        <label style="font-size:10px;">DEFINIR SETOR OP: 
            <select id="select-setor">
                <option value="ARMAZÉM">ARMAZÉM (VOZ ATIVA)</option>
                <option value="CROSSDOCK">CROSSDOCK (LISTA TÉCNICA)</option>
            </select>
        </label>
    </div>
    <div id="botoes-dinamicos"></div>
</div>

<div id="mod-armazem" class="modulo">
    <h2 style="font-family:'Orbitron'; color:var(--primary); font-size:14px;">ARMAZÉM SÉRIE V</h2>
    <div class="display-instrucao" id="display-voz">DIGA "ATIVAR" 3X PARA INICIAR</div>
    <div class="terminal" id="term-armazem">> AGUARDANDO ATIVAÇÃO TRIPLA...</div>
    <button onclick="voltar()" style="width:100%; padding:15px; margin-top:20px; background:transparent; border:1px solid var(--red); color:var(--red); font-weight:bold;">SAIR</button>
</div>

<div id="mod-motorista" class="modulo">
    <h2 style="font-family:'Orbitron'; color:var(--blue); font-size:14px;">ROTA INTELIGENTE</h2>
    <div class="terminal" style="height:120px; border-color:var(--blue);">
        > CARGA: #9902-B | ROTA: SUL 01<br>
        > BIPAGEM DE CAIXA: PENDENTE
    </div>
    <div style="width:100%; height:200px; background:#111; border:1px solid var(--blue); border-radius:8px; display:flex; align-items:center; justify-content:center;">
        <span style="color:var(--blue); font-size:10px;">[ GPS INTERATIVO ATIVO ]</span>
    </div>
    <button onclick="voltar()" style="width:100%; padding:15px; margin-top:20px; background:transparent; border:1px solid var(--blue); color:var(--blue); font-weight:bold;">CONCLUIR ROTA</button>
</div>

<script>
    let roleAtiva = "";
    let countAtivar = 0;
    let countDesativar = 0;
    let etapa = "STANDBY"; // STANDBY, CODIGO, QUANTIDADE, OK

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const voice = Recognition ? new Recognition() : null;

    if(voice) {
        voice.continuous = true;
        voice.lang = 'pt-BR';
        voice.onresult = (e) => {
            const fala = e.results[e.results.length - 1][0].transcript.toLowerCase();
            processarVoz(fala);
        };
        voice.onend = () => { if(etapa !== "STANDBY") voice.start(); };
    }

    function acesso(r) {
        if(!['OPERACIONAL', 'MOTORISTA'].includes(r)) {
            if(prompt("CHAVE MESTRE DIRETORIA:") !== "123") return;
        }
        roleAtiva = r;
        document.getElementById('portal').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        if(['GOD', 'SHARK', 'SUPERVISOR'].includes(r)) document.getElementById('adm-controls').style.display = 'block';
        montarLobby();
    }

    function montarLobby() {
        const bot = document.getElementById('botoes-dinamicos');
        bot.innerHTML = "";
        if(roleAtiva === 'MOTORISTA') {
            if(!document.getElementById('check-mot').checked) return alert("ACESSO BLOQUEADO PELA DIRETORIA");
            bot.innerHTML = `<button class="btn-access" style="width:100%; border-color:var(--blue)" onclick="abrirMod('mod-motorista')">INICIAR ROTA 🚚</button>`;
        } else {
            const setor = document.getElementById('select-setor').value;
            bot.innerHTML = `<button class="btn-access" style="width:100%" onclick="abrirMod('mod-armazem')">ENTRAR EM ${setor} 📦</button>`;
        }
    }

    function abrirMod(id) {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById(id).style.display = 'block';
        if(id === 'mod-armazem') {
            etapa = "ESPERA_ATIVAR";
            if(voice) voice.start();
        }
    }

    function processarVoz(txt) {
        // ATIVAÇÃO
        if(etapa === "ESPERA_ATIVAR" && txt.includes("ativar")) {
            countAtivar++;
            falar(countAtivar);
            if(countAtivar === 3) {
                etapa = "CONFIRM_CODIGO";
                countAtivar = 0;
                falar("Ativado. Vá para a Casa A-12. Código final 4-8-2.");
                document.getElementById('display-voz').innerText = "CASA A-12 | FINAL 482";
            }
        }
        // DESATIVAÇÃO
        else if(txt.includes("desativar")) {
            countDesativar++;
            falar(countDesativar);
            if(countDesativar === 3) {
                etapa = "STANDBY";
                countDesativar = 0;
                falar("Sistema desativado.");
                voltar();
            }
        }
        // FLUXO DE TRABALHO (OK)
        else if(etapa === "CONFIRM_CODIGO" && txt.includes("482")) {
            falar("Código correto. Informe a quantidade.");
            etapa = "CONFIRM_QTD";
            document.getElementById('display-voz').innerText = "INFORME A QUANTIDADE";
        }
        else if(etapa === "CONFIRM_QTD" && (txt.includes("ok") || !isNaN(parseInt(txt)))) {
            falar("Confirmado. Diga OK para finalizar item.");
            etapa = "CONFIRM_OK";
        }
        else if(etapa === "CONFIRM_OK" && txt.includes("ok")) {
            falar("Item registrado. Próximo.");
            document.getElementById('term-armazem').innerHTML += "> ITEM 482 FINALIZADO POR VOZ.<br>";
            etapa = "CONFIRM_CODIGO"; // Reinicia o ciclo
        }
    }

    function voltar() {
        if(voice) voice.stop();
        document.querySelectorAll('.modulo').forEach(m => m.style.display = 'none');
        document.getElementById('lobby').style.display = 'block';
        etapa = "STANDBY";
    }

    function falar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'pt-BR';
        window.speechSynthesis.speak(m);
    }
</script>
</body>
</html>
