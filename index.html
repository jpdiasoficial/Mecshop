<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO | JP DIAS TECHNOLOGY</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --card: #0a0a0a; --out: #ff3b30; --in: #00d4ff; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; background: #000; }
        .active { display: flex !important; }
        
        header { width: 100%; padding: 15px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; font-family: 'Orbitron'; font-size: 10px; background: rgba(0,0,0,0.95); z-index: 10; }
        .scroll { flex: 1; overflow-y: auto; width: 100%; padding: 20px; box-sizing: border-box; padding-bottom: 120px; }
        
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #151515; margin-bottom: 12px; }
        input, select, textarea { width: 100%; padding: 16px; background: #0d0d0d; border: 1px solid #222; color: #fff; font-family: 'Orbitron'; border-radius: 8px; margin-bottom: 15px; outline: none; box-sizing: border-box; font-size: 11px; }
        .btn-green { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 11px; }
        
        /* TRAVA ANTI-BIPE (0.5s) */
        #reader-container { position: relative; width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #222; margin-bottom: 15px; }
        #cooldown-bar { width: 0%; height: 6px; background: var(--primary); position: absolute; bottom: 0; left: 0; z-index: 5; }
        .locked { filter: grayscale(1) opacity(0.5); }
        
        .badge-cod { background: #111; color: var(--primary); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 9px; }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active" style="align-items: center; justify-content: center; text-align: center;">
    <h1 style="font-family:'Orbitron'; color:var(--primary); font-size:32px; letter-spacing:5px;">LOG-PRO</h1>
    <p style="font-size:7px; color:#444;">V36.5 | ARMOR & HIGH-SPEED</p>
    <div style="width: 85%; max-width: 350px;">
        <input type="password" id="pass" placeholder="CHAVE DE ACESSO" inputmode="numeric">
        <button class="btn-green" onclick="auth()">CONECTAR</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header>
        <span style="color:var(--primary)">SHARK HUB</span>
        <div style="display:flex; gap:8px;">
            <button onclick="ir('scr-config')" style="background:#111; border:1px solid #333; color:#fff; font-size:8px; padding:8px; border-radius:4px;">GERAR BASE</button>
            <button onclick="exportarCSV()" style="background:#111; border:1px solid #222; color:var(--primary); font-size:8px; padding:8px; border-radius:4px;">EXCEL</button>
            <button onclick="ir('scr-login')" style="background:none; border:none; color:#444; font-size:8px;">SAIR</button>
        </div>
    </header>
    <div class="scroll">
        <div id="dashboard" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;"></div>
        <div id="main-list"></div>
    </div>
</div>

<div id="scr-config" class="screen">
    <header><span>GESTÃO DE PRODUTOS</span> <button onclick="ir('scr-shark')">X</button></header>
    <div class="scroll">
        <div class="card" style="border-top: 2px solid var(--primary);">
            <small style="color:var(--primary); font-size:8px;">INSERIR INDIVIDUAL</small>
            <input type="text" id="conf-cod" placeholder="CÓDIGO DE BARRAS">
            <input type="text" id="conf-nome" placeholder="NOME DO PRODUTO">
            <button class="btn-green" onclick="salvarNaBase()">CADASTRAR</button>
        </div>

        <div style="text-align:center; margin: 10px 0; color:#333; font-size:9px;">——— OU ———</div>

        <div class="card" style="border-top: 2px solid var(--in);">
            <small style="color:var(--in); font-size:8px;">IMPORTAR LISTA (CODIGO,NOME)</small>
            <textarea id="import-area" placeholder="12345,PRODUTO A&#10;67890,PRODUTO B" rows="4" style="margin-top:10px; font-family:monospace; font-size:10px;"></textarea>
            <button class="btn-green" style="background:var(--in);" onclick="importarLista()">SUBIR PLANILHA</button>
        </div>
        
        <div id="base-list-preview" style="margin-top:20px;"></div>
    </div>
</div>

<div id="scr-op" class="screen">
    <header>
        <span>COLLECTOR</span>
        <button id="btn-sync" style="display:none; background:var(--primary); border:none; padding:8px 12px; font-family:'Orbitron'; font-size:8px; border-radius:4px;" onclick="enviarLote()">SUBIR LOTE</button>
    </header>
    <div class="scroll">
        <div style="display:flex; gap:10px;">
            <select id="sel-mod-op" style="flex:2;">
                <option value="IN">📥 ENTRADA</option>
                <option value="OUT">📤 SAÍDA</option>
            </select>
            <input type="number" id="qtd-bipe" value="1" style="flex:1; text-align:center; color:var(--primary);">
        </div>

        <div id="reader-container">
            <div id="reader"></div>
            <div id="cooldown-bar"></div>
        </div>

        <div style="display:flex; gap:10px;">
            <button class="btn-green" id="btn-cam" onclick="toggleCamera()" style="flex:4;">SCANNER</button>
            <button class="btn-green" onclick="toggleFlash()" style="flex:1; background:#222; color:#fff;">⚡</button>
        </div>

        <div id="feedback-op" class="card" style="display:none; margin-top:20px; border-color:var(--primary); text-align: center;">
            <b id="op-nome-view" style="font-size:16px;"></b><br>
            <span id="op-cod-view" class="badge-cod"></span>
        </div>
    </div>
</div>

<script>
    const canal = new BroadcastChannel('logpro_v36');
    let BASE = JSON.parse(localStorage.getItem('LP_BASE')) || {}; 
    let MOVS = JSON.parse(localStorage.getItem('LP_MOVS')) || []; 
    let LOTE = [];
    let scanner = null, camOn = false, isLocked = false, flashOn = false;

    function auth() {
        const p = document.getElementById('pass').value;
        if(p === "9910") ir('scr-shark');
        else if(p === "1234") ir('scr-op');
        else alert("ACESSO NEGADO");
    }

    function ir(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'scr-shark') atualizarPainel();
        if(id === 'scr-config') renderBase();
    }

    // GESTÃO DA BASE
    function salvarNaBase() {
        const c = document.getElementById('conf-cod').value.trim();
        const n = document.getElementById('conf-nome').value.toUpperCase();
        if(c && n) { BASE[c] = n; salvarEAtualizar(); document.getElementById('conf-cod').value=""; document.getElementById('conf-nome').value=""; }
    }

    function importarLista() {
        const texto = document.getElementById('import-area').value;
        const linhas = texto.split('\n');
        let cont = 0;
        linhas.forEach(l => {
            const d = l.split(',');
            if(d.length >= 2) { const c = d[0].trim(); const n = d[1].trim().toUpperCase(); if(c && n) { BASE[c] = n; cont++; } }
        });
        if(cont > 0) { salvarEAtualizar(); document.getElementById('import-area').value=""; alert(cont + " ITENS CARREGADOS!"); }
    }

    function salvarEAtualizar() { localStorage.setItem('LP_BASE', JSON.stringify(BASE)); renderBase(); }

    function renderBase() {
        const keys = Object.keys(BASE);
        document.getElementById('base-list-preview').innerHTML = `<small style="color:#444;">ITENS NA BASE: ${keys.length}</small>` + 
        keys.map(k => `<div class="card" style="padding:10px; font-size:9px; display:flex; justify-content:space-between;"><div><b>${BASE[k]}</b><br>${k}</div><button onclick="removerBase('${k}')" style="color:red; background:none; border:none;">×</button></div>`).join('');
    }

    function removerBase(k) { if(confirm("EXCLUIR?")) { delete BASE[k]; salvarEAtualizar(); } }

    // PROCESSO DE BIPE (0.5s DELAY)
    function processar(cod) {
        if(isLocked) return;
        const itemNome = BASE[cod.trim()];
        if(!itemNome) { vibrate([100,50,100]); alert("NÃO CADASTRADO!"); return; }
        
        isLocked = true;
        const bar = document.getElementById('cooldown-bar');
        document.getElementById('reader-container').classList.add('locked');
        bar.style.transition = "width 0.5s linear";
        bar.style.width = '100%';

        document.getElementById('feedback-op').style.display = 'block';
        document.getElementById('op-nome-view').innerText = itemNome;
        document.getElementById('op-cod-view').innerText = cod;
        
        const m = document.getElementById('sel-mod-op').value;
        const q = parseInt(document.getElementById('qtd-bipe').value) || 1;
        LOTE.unshift({ cod, nome: itemNome, m, q, d: new Date().toLocaleString() });
        document.getElementById('btn-sync').style.display = 'block';
        
        beep(850, 0.08); vibrate(40);

        setTimeout(() => {
            isLocked = false;
            document.getElementById('reader-container').classList.remove('locked');
            bar.style.transition = "none";
            bar.style.width = '0%';
        }, 500); 
    }

    function enviarLote() {
        MOVS = [...LOTE, ...MOVS];
        localStorage.setItem('LP_MOVS', JSON.stringify(MOVS));
        canal.postMessage('SYNC');
        LOTE = []; document.getElementById('btn-sync').style.display = 'none';
        alert("SINCRONIZADO!");
    }

    function atualizarPainel() {
        const dash = document.getElementById('dashboard');
        let totais = {};
        MOVS.forEach(mov => {
            if(!totais[mov.cod]) totais[mov.cod] = { nome: mov.nome, saldo: 0 };
            mov.m === 'IN' ? totais[mov.cod].saldo += mov.q : totais[mov.cod].saldo -= mov.q;
        });
        let totalGeral = Object.values(totais).reduce((a, b) => a + b.saldo, 0);
        dash.innerHTML = `<div class="card"><small>ESTOQUE TOTAL</small><br><b style="font-size:24px;">${totalGeral}</b></div><div class="card"><small>ITENS BASE</small><br><b style="font-size:24px;">${Object.keys(BASE).length}</b></div>`;
        document.getElementById('main-list').innerHTML = Object.keys(totais).map(k => `<div class="card"><div style="display:flex; justify-content:space-between;"><div><b>${totais[k].nome}</b><br><small>${k}</small></div><b style="font-size:20px; color:var(--primary)">${totais[k].saldo}</b></div></div>`).join('');
    }

    async function toggleCamera() {
        const rd = document.getElementById('reader'), btn = document.getElementById('btn-cam');
        if(!camOn) {
            rd.style.display = 'block';
            if(!scanner) scanner = new Html5Qrcode("reader");
            await scanner.start({ facingMode: "environment" }, { fps: 30, qrbox: 250 }, (txt) => { processar(txt); });
            btn.innerText = "PARAR"; camOn = true;
        } else { if(scanner) await scanner.stop(); rd.style.display = 'none'; btn.innerText = "SCANNER"; camOn = false; }
    }

    function toggleFlash() { if(camOn) { flashOn = !flashOn; scanner.applyVideoConstraints({ advanced: [{ torch: flashOn }] }); } }

    function exportarCSV() {
        let csv = "DATA,ITEM,BARCODE,TIPO,QTD\n";
        MOVS.forEach(m => csv += `${m.d},${m.nome},${m.cod},${m.m},${m.q}\n`);
        const b = new Blob([csv], {type: 'text/csv'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'ESTOQUE_FINAL.csv'; a.click();
    }

    function beep(f, d) { try { const c=new AudioContext(); const o=c.createOscillator(); o.connect(c.destination); o.frequency.value=f; o.start(); o.stop(c.currentTime+d); } catch(e){} }
    function vibrate(ms) { if(navigator.vibrate) navigator.vibrate(ms); }
    function init() { console.log("LOG-PRO V36.5 READY"); }
    canal.onmessage = () => { MOVS = JSON.parse(localStorage.getItem('LP_MOVS')); atualizarPainel(); };
</script>
</body>
</html>
