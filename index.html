<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK | Visão Shark V45</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #00ff88; --bg: #030303; --card: rgba(255, 255, 255, 0.05); --glass: blur(12px); }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: #fff; margin: 0; overflow-x: hidden; }

        /* --- SISTEMA DE TELAS --- */
        .screen { display: none; min-height: 100vh; padding: 20px; flex-direction: column; }
        .active { display: flex; animation: slideUp 0.5s ease; }

        /* --- LOGIN SHARK --- */
        .login-box { justify-content: center; align-items: center; text-align: center; }
        .logo-bank { font-size: 35px; font-weight: 900; color: var(--accent); letter-spacing: -1px; margin-bottom: 30px; }
        input[type="text"], input[type="password"] { width: 100%; max-width: 320px; background: #111; border: 1px solid #333; padding: 18px; border-radius: 15px; color: #fff; margin-bottom: 12px; }
        .btn-main { width: 100%; max-width: 320px; padding: 18px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; background: var(--accent); color: #000; }

        /* --- 01. PAINEL SHARK (DONO/ADMIN) --- */
        .nav-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; }
        .shark-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card-stat { background: var(--card); backdrop-filter: var(--glass); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .import-box { background: rgba(0, 255, 136, 0.1); border: 2px dashed var(--accent); padding: 25px; border-radius: 20px; text-align: center; cursor: pointer; }
        
        /* --- 02. VISÃO CLIENTE (MEC-BANK) --- */
        .black-card { background: linear-gradient(135deg, #111, #222); border: 1px solid #444; border-radius: 25px; padding: 25px; margin-bottom: 25px; position: relative; overflow: hidden; }
        .balance-box { font-size: 28px; font-weight: 700; margin: 15px 0; cursor: pointer; }
        .balance-hidden { filter: blur(8px); }
        .actions-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; font-size: 12px; }
        .action-btn { background: var(--card); padding: 15px 10px; border-radius: 15px; cursor: pointer; }
        .action-btn i { font-size: 20px; color: var(--accent); margin-bottom: 8px; }

        /* --- CÂMERA DE ELITE (PIX/BOLETO) --- */
        #cam-layer { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        video { width: 90%; border-radius: 30px; border: 3px solid var(--accent); }
        .cam-frame { position: absolute; width: 250px; height: 250px; border: 2px solid var(--accent); box-shadow: 0 0 50px rgba(0,255,136,0.3); border-radius: 20px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="login" class="screen active login-box">
        <div class="logo-bank">MEC-BANK</div>
        <input type="text" id="access-id" placeholder="ID de Acesso (Shark, Operador ou Cliente)">
        <button class="btn-main" onclick="auth()">ACESSAR CONTA BLACK</button>
    </div>

    <div id="shark-panel" class="screen">
        <div class="nav-header">
            <h3>Visão Shark Master</h3>
            <button onclick="location.reload()" style="background:none; border:none; color:#ff4444;"><i class="fa-solid fa-power-off"></i></button>
        </div>
        <div class="shark-grid">
            <div class="card-stat"><small>LUCRO TOTAL</small><h2 id="total-profit">R$ 128.500</h2></div>
            <div class="card-stat"><small>CONTAS ATIVAS</small><h2>482</h2></div>
        </div>
        
        <div class="import-box" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-file-excel" style="font-size: 30px; margin-bottom: 10px;"></i>
            <p>SUBIR PLANILHA DE SALDOS</p>
            <input type="file" id="fileInput" hidden accept=".xlsx, .csv" onchange="importData(event)">
        </div>
        
        <h4 style="margin-top: 30px;">Fluxo de Transações</h4>
        <div id="transaction-log" style="font-size: 13px; color: #aaa;">
            <div class="card-stat" style="margin-bottom: 8px;">Pix Recebido: R$ 1.200,00 - 19:05</div>
        </div>
    </div>

    <div id="client-app" class="screen">
        <div class="nav-header">
            <span>Olá, **Shark Client**</span>
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold;">JP</div>
        </div>

        <div class="black-card">
            <small style="opacity: 0.7;">Saldo disponível <i class="fa-solid fa-eye" onclick="toggleBalance()"></i></small>
            <div id="balance" class="balance-box balance-hidden">R$ 25.450,88</div>
            <div style="font-size: 14px; opacity: 0.6;">MEC-CARD Platinum Final 8845</div>
        </div>

        <div class="actions-row">
            <div class="action-btn" onclick="openCam('ESCANEAR PIX')"><i class="fa-solid fa-qrcode"></i><br>Pix</div>
            <div class="action-btn" onclick="openCam('PAGAR BOLETO')"><i class="fa-solid fa-barcode"></i><br>Boleto</div>
            <div class="action-btn"><i class="fa-solid fa-arrow-trend-up"></i><br>Investir</div>
            <div class="action-btn"><i class="fa-solid fa-ellipsis"></i><br>Mais</div>
        </div>
    </div>

    <div id="cam-layer">
        <h3 id="cam-title">ESCANEANDO...</h3>
        <div class="cam-frame"></div>
        <video id="webcam" playsinline></video>
        <button class="btn-main" style="background: #fff; margin-top: 30px;" onclick="closeCam()">CANCELAR</button>
    </div>

    <script>
        // Lógica de Autenticação
        function auth() {
            const user = document.getElementById('access-id').value.toLowerCase();
            document.getElementById('login').classList.remove('active');
            if(user === 'shark') document.getElementById('shark-panel').classList.add('active');
            else if(user === 'cliente') document.getElementById('client-app').classList.add('active');
            else alert('Acesso não identificado');
        }

        // Upgrade: Visibilidade de Saldo
        function toggleBalance() {
            document.getElementById('balance').classList.toggle('balance-hidden');
        }

        // Upgrade: Motor de Câmera Real (Pix e Boleto)
        async function openCam(type) {
            document.getElementById('cam-title').innerText = type;
            document.getElementById('cam-layer').style.display = 'flex';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('webcam').srcObject = stream;
                document.getElementById('webcam').play();
            } catch(e) { alert('Erro ao acessar câmera: ' + e); closeCam(); }
        }

        function closeCam() {
            const v = document.getElementById('webcam');
            if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('cam-layer').style.display = 'none';
        }

        // Upgrade 45: Inteligência de Planilha
        function importData(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                // Simulação de Processamento
                alert(`Sucesso, Shark! ${jsonData.length} contas atualizadas via planilha.`);
                document.getElementById('total-profit').innerText = "R$ 185.200"; // Exemplo de update real
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
    </html>
