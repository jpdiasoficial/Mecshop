<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO | DEV JP DIAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #00ff41; --s: #007aff; --bg: #000; --sf: #0a0a0a; --brd: #1a1a1a; --dg: #ff3b30; }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; font-size: 11px; height: 100vh; overflow: hidden; text-transform: uppercase; }
        
        /* HEADER */
        header { padding: 15px; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; background: #000; z-index: 101; position: relative; }
        .logo-main { font-family: 'Orbitron'; color: var(--p); font-size: 18px; font-weight: 900; letter-spacing: 2px; }
        .logo-sub { font-family: 'Orbitron'; color: #fff; font-size: 8px; opacity: 0.5; display: block; letter-spacing: 2px; }

        .screen { display: none; height: 100vh; flex-direction: column; }
        .active-screen { display: flex !important; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px 15px 160px 15px; }
        
        /* ASSINATURA JP DIAS FIXA */
        .dev-credit { position: fixed; bottom: 70px; width: 100%; text-align: center; font-family: 'Orbitron'; font-size: 8px; color: #444; letter-spacing: 2px; padding: 10px; background: rgba(0,0,0,0.95); z-index: 99; border-top: 1px solid #111; }
        .dev-credit b { color: var(--p); }

        .card { background: var(--sf); border: 1px solid var(--brd); border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; overflow: hidden; }
        .card::after { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--p); }
        
        h3 { font-family: 'Orbitron'; font-size: 9px; color: var(--p); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        input, select { width: 100%; padding: 12px; background: #050505; border: 1px solid #222; color: #fff; border-radius: 8px; font-size: 11px; margin-bottom: 8px; font-weight: 700; border-left: 2px solid transparent; transition: 0.2s; }
        input:focus, select:focus { border-left: 2px solid var(--p); background: #111; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-p { background: var(--p); color: #000; box-shadow: 0 0 10px rgba(0, 255, 65, 0.1); }
        .btn-s { background: var(--s); color: #fff; }
        .btn-d { background: var(--dg); color: #fff; }

        /* KPIS */
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .kpi-box { background: #0a0a0a; border: 1px solid #222; padding: 10px 5px; border-radius: 8px; text-align: center; }
        .kpi-box span { font-family: 'Orbitron'; font-size: 14px; color: var(--p); display: block; margin-bottom: 2px; }
        .kpi-box small { font-size: 7px; color: #666; font-weight: 800; letter-spacing: 1px; }
        
        /* ALERTA ESTOQUE */
        .low-stock { color: var(--dg) !important; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .bottom-nav { display: none; background: #000; border-top: 2px solid var(--brd); position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-size: 8px; font-weight: 800; gap: 4px; cursor: pointer; }
        .active-tab { color: var(--p); border-top: 3px solid var(--p); background: #050505; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #111; background: #050505; margin-bottom: 4px; border-radius: 6px; }
        .status-tag { font-size: 7px; padding: 4px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; display: inline-block; margin-bottom: 8px; }
    </style>
</head>
<body onload="inicializarApp()">

    <div id="tela-login" class="screen active-screen" style="justify-content:center; padding:40px;">
        <div style="text-align:center; margin-bottom:60px;">
            <h1 style="font-family:'Orbitron'; color:var(--p); font-size:45px; letter-spacing:2px; margin:0;">LOG-PRO</h1>
            <p style="color:#555; font-size:10px; letter-spacing:5px; margin-top:5px; font-family:'Orbitron';">INTEL v1.0</p>
        </div>
        <button class="btn btn-p" onclick="login('admin')" style="margin-bottom:12px;"><i class="fa-solid fa-crown"></i> ADMIN MASTER</button>
        <button class="btn btn-s" onclick="login('operador')" style="margin-bottom:12px;"><i class="fa-solid fa-box-open"></i> OPERADOR WMS</button>
        <button class="btn btn-d" onclick="login('motorista')"><i class="fa-solid fa-truck-fast"></i> MOTORISTA ROTA</button>
        <p style="text-align:center; font-family:'Orbitron'; font-size:8px; color:#333; margin-top:50px; letter-spacing:2px;">DEV BY <b>JP DIAS</b></p>
    </div>

    <div id="tela-admin" class="screen">
        <header>
            <div><span class="logo-main">LOG-PRO</span><span class="logo-sub">ADMIN PANEL</span></div>
            <button onclick="logout()" style="background:none; border:1px solid var(--dg); color:var(--dg); font-size:7px; padding:5px 10px; font-family:'Orbitron'; border-radius:4px;">SAIR</button>
        </header>
        <div class="scroll-area">
            <div class="kpi-grid">
                <div class="kpi-box"><span id="adm-sku">0</span><small>SKUS</small></div>
                <div class="kpi-box"><span id="adm-est">0</span><small>ESTOQUE</small></div>
                <div class="kpi-box"><span id="adm-ava" style="color:var(--dg)">0</span><small>AVARIA</small></div>
                <div class="kpi-box"><span id="adm-rta" style="color:var(--s)">0</span><small>ROTAS</small></div>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-barcode"></i> NOVO SKU</h3>
                <input type="text" id="add-ean" placeholder="EAN OU CÓDIGO">
                <input type="text" id="add-nome" placeholder="NOME DO PRODUTO">
                <button class="btn btn-p" onclick="cadastrarProduto()">SALVAR NO BANCO</button>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-list-check"></i> LOGS DE MOVIMENTAÇÃO</h3>
                <div id="log-global-list"></div>
            </div>
        </div>
    </div>

    <div id="tela-operador" class="screen">
        <header>
            <div><span class="logo-main">LOG-PRO</span><span class="logo-sub">TERMINAL WMS</span></div>
            <button onclick="logout()" style="background:none; border:1px solid var(--dg); color:var(--dg); font-size:7px; padding:5px 10px; font-family:'Orbitron'; border-radius:4px;">SAIR</button>
        </header>
        <div class="scroll-area">
            <div class="card">
                <div id="reader-wms" style="width:100%; min-height:180px; background:#000; border:2px solid var(--p); display:none; margin-bottom:10px; border-radius:8px; overflow:hidden;"></div>
                <button class="btn btn-p" id="btn-cam-wms" onclick="toggleScanner()"><i class="fa-solid fa-camera"></i> SCANNER CAMERA</button>
            </div>
            <div class="card">
                <h3>REGISTRAR ITEM</h3>
                <select id="mov-tipo">
                    <option value="ENTRADA">📥 ENTRADA DE ESTOQUE</option>
                    <option value="SEPARACAO">📦 SEPARAÇÃO P/ ROTA</option>
                    <option value="AVARIA">⚠️ AVARIA</option>
                </select>
                <input type="text" id="mov-ean" placeholder="EAN OU BIP">
                <button class="btn btn-s" onclick="processarMovimento()">CONFIRMAR REGISTRO</button>
            </div>
            <div class="card">
                <h3>FECHAR ROMANEIO</h3>
                <input type="text" id="mot-rota" placeholder="NOME DO MOTORISTA">
                <button class="btn btn-d" onclick="fecharRota()"><i class="fa-solid fa-truck-ramp-box"></i> GERAR CARGA</button>
            </div>
        </div>
    </div>

    <div id="tela-motorista" class="screen">
        <header>
            <div><span class="logo-main">LOG-PRO</span><span class="logo-sub">LOGÍSTICA / ROTAS</span></div>
            <button onclick="logout()" style="background:none; border:1px solid var(--dg); color:var(--dg); font-size:7px; padding:5px 10px; font-family:'Orbitron'; border-radius:4px;">SAIR</button>
        </header>
        <div class="scroll-area" id="lista-entregas"></div>
    </div>

    <div id="dev-footer" class="dev-credit" style="display:none;">DEVELOPED BY <b>JP DIAS</b></div>

    <div class="bottom-nav" id="bot-nav">
        <div class="nav-item" id="nv-adm" onclick="navegar('tela-admin', this)"><i class="fa-solid fa-crown"></i>ADMIN</div>
        <div class="nav-item" id="nv-op" onclick="navegar('tela-operador', this)"><i class="fa-solid fa-barcode"></i>WMS</div>
        <div class="nav-item" id="nv-mt" onclick="navegar('tela-motorista', this)"><i class="fa-solid fa-truck"></i>ROTA</div>
    </div>

    <script>
        // BANCO DE DADOS LOCAL - PERSISTÊNCIA TOTAL
        let db = JSON.parse(localStorage.getItem('LOGPRO_FINAL') || '{"produtos":{}, "logs":[], "rotas":[]}');
        let scannerAtivo = false;
        let html5QrCode;

        function inicializarApp() { render(); }

        function save() { localStorage.setItem('LOGPRO_FINAL', JSON.stringify(db)); render(); }

        function login(role) {
            document.getElementById('tela-login').classList.remove('active-screen');
            document.getElementById('bot-nav').style.display = 'flex';
            document.getElementById('dev-footer').style.display = 'block';
            
            // Controle de visualização de abas
            document.getElementById('nv-adm').style.display = (role==='admin') ? 'flex' : 'none';
            document.getElementById('nv-op').style.display = (role!=='motorista') ? 'flex' : 'none';
            document.getElementById('nv-mt').style.display = (role!=='operador') ? 'flex' : 'none';
            
            let alvo = role === 'admin' ? 'tela-admin' : (role === 'operador' ? 'tela-operador' : 'tela-motorista');
            navegar(alvo, document.getElementById('nv-' + (role==='admin'?'adm':role==='operador'?'op':'mt')));
        }

        function logout() { location.reload(); }

        function navegar(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-screen');
            el.classList.add('active-tab');
        }

        function cadastrarProduto() {
            let e = document.getElementById('add-ean').value.trim();
            let n = document.getElementById('add-nome').value.trim();
            if(e && n) { 
                db.produtos[e] = n; 
                save(); 
                alert("PRODUTO CADASTRADO!"); 
                document.getElementById('add-ean').value=''; 
                document.getElementById('add-nome').value=''; 
            } else {
                alert("PREENCHA EAN E NOME.");
            }
        }

        function processarMovimento(eanLido = null) {
            let ean = (eanLido || document.getElementById('mov-ean').value).trim();
            if(!ean) return;
            
            if(!db.produtos[ean]) {
                let n = prompt("EAN NÃO CADASTRADO! DIGITE O NOME DO PRODUTO:");
                if(n) db.produtos[ean] = n; else return;
            }
            
            let qtd = prompt("QUANTIDADE:", "1");
            if(qtd && !isNaN(qtd)) {
                db.logs.unshift({ 
                    id: Date.now(), 
                    tipo: document.getElementById('mov-tipo').value, 
                    ean: ean, 
                    nome: db.produtos[ean], 
                    qtd: parseInt(qtd), 
                    rotaId: null 
                });
                save(); 
                document.getElementById('mov-ean').value = "";
            }
        }

        function fecharRota() {
            let mot = document.getElementById('mot-rota').value.trim();
            if(!mot) return alert("INFORME O NOME DO MOTORISTA!");
            
            let itens = db.logs.filter(l => l.tipo === 'SEPARACAO' && !l.rotaId);
            if(itens.length === 0) return alert("NENHUM ITEM SEPARADO PARA ROTA.");
            
            let idR = "RT-" + Math.floor(1000 + Math.random() * 9000);
            itens.forEach(i => i.rotaId = idR);
            db.rotas.unshift({ id: idR, mot: mot, status: 'EM ROTA', itens: [...itens], data: new Date().toLocaleDateString() });
            
            save(); 
            document.getElementById('mot-rota').value = "";
            alert(`ROMANEIO ${idR} GERADO PARA ${mot}!`);
        }

        function concluirEntrega(id) {
            if(confirm("CONFIRMAR ENTREGA DESTA CARGA?")) {
                let r = db.rotas.find(x => x.id === id);
                r.status = 'ENTREGUE';
                save();
            }
        }

        function render() {
            let est = 0, ava = 0, logsH = "", rotasH = "";
            
            // Cálculos Dinâmicos
            db.logs.forEach(l => {
                if(l.tipo === 'ENTRADA') est += l.qtd;
                if(l.tipo === 'SEPARACAO') est -= l.qtd;
                if(l.tipo === 'AVARIA') ava += l.qtd;
                
                let cor = l.tipo === 'ENTRADA' ? 'var(--p)' : (l.tipo === 'AVARIA' ? 'var(--dg)' : 'var(--s)');
                logsH += `<div class="item-row">
                    <div><b style="color:${cor}">${l.tipo}</b><br><small style="color:#aaa">${l.nome}</small></div>
                    <b style="font-size:12px">${l.qtd} UN</b>
                </div>`;
            });

            // Atualiza Dashboard Admin
            if(document.getElementById('adm-sku')) {
                document.getElementById('adm-sku').innerText = Object.keys(db.produtos).length;
                let elEst = document.getElementById('adm-est');
                elEst.innerText = est;
                
                // Inteligência: Piscar se estoque menor que 5
                if(est < 5 && est > 0) elEst.classList.add('low-stock'); else elEst.classList.remove('low-stock');
                
                document.getElementById('adm-ava').innerText = ava;
                document.getElementById('adm-rta').innerText = db.rotas.filter(r=>r.status==='EM ROTA').length;
                document.getElementById('log-global-list').innerHTML = logsH || "<p style='text-align:center;color:#444;font-size:9px;'>SEM MOVIMENTAÇÕES</p>";
            }

            // Atualiza Tela Motorista
            db.rotas.forEach(r => {
                let bgTag = r.status === 'ENTREGUE' ? '#222' : 'var(--s)';
                let corTag = r.status === 'ENTREGUE' ? '#666' : '#fff';
                
                rotasH += `<div class="card" style="border-color:${r.status==='ENTREGUE'?'#111':'var(--brd)'}">
                    <span class="status-tag" style="background:${bgTag}; color:${corTag}">${r.status}</span>
                    <h3 style="margin-top:0;">CARGA ${r.id}</h3>
                    <p style="font-size:9px; color:#888; margin-bottom:12px;">MOT: <b style="color:#ccc">${r.mot}</b> | DATA: ${r.data}</p>
                    <div style="margin-bottom:15px; border-top:1px dashed #222; padding-top:10px; font-size:10px; color:#aaa; line-height:1.6;">
                        ${r.itens.map(i => `• ${i.nome} <b style="color:#fff">(${i.qtd}x)</b>`).join('<br>')}
                    </div>
                    ${r.status === 'EM ROTA' ? `<button class="btn btn-p" onclick="concluirEntrega('${r.id}')"><i class="fa-solid fa-check-double"></i> CONFIRMAR ENTREGA</button>` : `<p style="text-align:center; color:#444; font-weight:900; font-family:'Orbitron'; font-size:10px;">CARGA FINALIZADA</p>`}
                </div>`;
            });
            if(document.getElementById('lista-entregas')) {
                document.getElementById('lista-entregas').innerHTML = rotasH || "<p style='text-align:center;color:#444;font-size:9px;margin-top:20px;'>NENHUMA CARGA ATRIBUÍDA</p>";
            }
        }

        function toggleScanner() {
            if(!scannerAtivo) {
                document.getElementById('reader-wms').style.display='block';
                html5QrCode = new Html5Qrcode("reader-wms");
                html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => { 
                    processarMovimento(txt); 
                    toggleScanner(); 
                });
                document.getElementById('btn-cam-wms').innerHTML = '<i class="fa-solid fa-xmark"></i> CANCELAR SCANNER';
                document.getElementById('btn-cam-wms').classList.replace('btn-p', 'btn-d');
                scannerAtivo = true;
            } else {
                html5QrCode.stop().then(() => { 
                    document.getElementById('reader-wms').style.display='none'; 
                    scannerAtivo = false; 
                    document.getElementById('btn-cam-wms').innerHTML = '<i class="fa-solid fa-camera"></i> SCANNER CAMERA'; 
                    document.getElementById('btn-cam-wms').classList.replace('btn-d', 'btn-p');
                });
            }
        }
    </script>
</body>
</html>
