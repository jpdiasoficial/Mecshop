<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v110 | JP DIAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #00ff41; --s: #007aff; --bg: #000; --sf: #0a0a0a; --brd: #1a1a1a; --dg: #ff3b30; }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; font-size: 11px; height: 100vh; overflow: hidden; text-transform: uppercase; }
        
        /* HEADER COM LOGO PEDIDA */
        header { padding: 15px; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; background: #000; }
        .logo-area { font-family: 'Orbitron'; line-height: 1; }
        .logo-main { color: var(--p); font-size: 18px; font-weight: 900; letter-spacing: 2px; }
        .logo-sub { color: #fff; font-size: 8px; letter-spacing: 4px; display: block; opacity: 0.6; margin-top: 2px; }

        .screen { display: none; height: 100vh; flex-direction: column; }
        .active-screen { display: flex !important; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px 15px 130px 15px; }
        
        /* FOOTER DO DESENVOLVEDOR */
        .dev-tag { position: fixed; bottom: 75px; width: 100%; text-align: center; font-family: 'Orbitron'; font-size: 8px; color: #444; letter-spacing: 2px; padding: 8px; background: rgba(0,0,0,0.9); z-index: 99; border-top: 1px solid #111; }
        .dev-tag b { color: var(--p); }

        .card { background: var(--sf); border: 1px solid var(--brd); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        h3 { font-family: 'Orbitron'; font-size: 9px; color: var(--p); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-left: 3px solid var(--p); padding-left: 8px; }
        
        input, select { width: 100%; padding: 12px; background: #050505; border: 1px solid #222; color: #fff; border-radius: 8px; font-size: 11px; margin-bottom: 8px; font-weight: 700; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: var(--s); color: #fff; }
        .btn-d { background: var(--dg); color: #fff; }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .kpi-box { background: #0a0a0a; border: 1px solid #222; padding: 10px 5px; border-radius: 8px; text-align: center; }
        .kpi-box span { font-family: 'Orbitron'; font-size: 14px; color: var(--p); display: block; }
        
        /* ALERTA DE ESTOQUE BAIXO */
        .low-stock { color: var(--dg) !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .bottom-nav { display: none; background: #000; border-top: 2px solid var(--brd); position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-size: 8px; font-weight: 800; gap: 4px; }
        .active-tab { color: var(--p); border-top: 3px solid var(--p); background: #050505; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #111; background: #050505; margin-bottom: 2px; }
    </style>
</head>
<body onload="inicializarApp()">

    <div id="tela-login" class="screen active-screen" style="justify-content:center; padding:40px;">
        <div style="text-align:center; margin-bottom:50px;">
            <h1 style="font-family:'Orbitron'; color:var(--p); font-size:40px; letter-spacing:2px;">SHARK</h1>
            <p style="color:#555; font-size:9px; letter-spacing:4px;">INTEL v110</p>
        </div>
        <button class="btn btn-p" onclick="login('shark')" style="margin-bottom:12px;">👑 ADMIN MASTER</button>
        <button class="btn btn-s" onclick="login('operador')" style="margin-bottom:12px;">📦 OPERADOR WMS</button>
        <button class="btn btn-d" onclick="login('motorista')">🚚 MOTORISTA ROTA</button>
        <p style="text-align:center; font-family:'Orbitron'; font-size:8px; color:#333; margin-top:40px; letter-spacing:2px;">DEV BY <b>JP DIAS</b></p>
    </div>

    <div id="tela-shark" class="screen">
        <header>
            <div class="logo-area"><span class="logo-main">LOG-PRO</span><span class="logo-sub">SHARK INTEL</span></div>
            <button onclick="logout()" style="background:none; border:1px solid var(--dg); color:var(--dg); font-size:7px; padding:4px 8px; font-family:'Orbitron';">SAIR</button>
        </header>
        <div class="scroll-area">
            <div class="kpi-grid">
                <div class="kpi-box"><span id="sk-inv">0</span><small>SKUS</small></div>
                <div class="kpi-box"><span id="sk-est">0</span><small>ESTQ</small></div>
                <div class="kpi-box"><span id="sk-ava" style="color:var(--dg)">0</span><small>AVA</small></div>
                <div class="kpi-box"><span id="sk-rta" style="color:var(--s)">0</span><small>ROTAS</small></div>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-plus-circle"></i> NOVO SKU</h3>
                <input type="text" id="sk-ean" placeholder="EAN/CÓDIGO">
                <input type="text" id="sk-nome" placeholder="NOME DO PRODUTO">
                <button class="btn btn-p" onclick="sharkSaveSku()">SALVAR NO BANCO</button>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-list"></i> LOGS DE MOVIMENTAÇÃO</h3>
                <div id="shark-log-list"></div>
            </div>
        </div>
    </div>

    <div id="tela-operador" class="screen">
        <header>
            <div class="logo-area"><span class="logo-main">WMS</span><span class="logo-sub">OPERATOR</span></div>
            <button onclick="logout()" style="background:none; border:1px solid var(--dg); color:var(--dg); font-size:7px; padding:4px 8px; font-family:'Orbitron';">SAIR</button>
        </header>
        <div class="scroll-area">
            <div class="card">
                <div id="reader-op" style="width:100%; min-height:180px; background:#000; border:2px solid var(--p); display:none; margin-bottom:10px;"></div>
                <button class="btn btn-p" id="btn-cam" onclick="toggleCam()">ACIONAR SCANNER</button>
            </div>
            <div class="card">
                <h3>REGISTRO</h3>
                <select id="op-tipo">
                    <option value="ENTRADA">📥 ENTRADA</option>
                    <option value="SEPARACAO">📦 SEPARAÇÃO</option>
                    <option value="AVARIA">⚠️ AVARIA</option>
                </select>
                <input type="text" id="op-ean" placeholder="EAN OU BIP">
                <button class="btn btn-s" onclick="opRegistrar()">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <div id="tela-motorista" class="screen">
        <header>
            <div class="logo-area"><span class="logo-main">ROTA</span><span class="logo-sub">DRIVER</span></div>
            <button onclick="logout()" style="background:none; border:1px solid var(--dg); color:var(--dg); font-size:7px; padding:4px 8px; font-family:'Orbitron';">SAIR</button>
        </header>
        <div class="scroll-area" id="motorista-content"></div>
    </div>

    <div id="dev-footer" class="dev-tag" style="display:none;">DEVELOPED BY <b>JP DIAS</b></div>

    <div class="bottom-nav" id="bot-nav">
        <div class="nav-item" id="nv-sk" onclick="navegar('tela-shark', this)"><i class="fa-solid fa-crown"></i>SHARK</div>
        <div class="nav-item" id="nv-op" onclick="navegar('tela-operador', this)"><i class="fa-solid fa-barcode"></i>WMS</div>
        <div class="nav-item" id="nv-mt" onclick="navegar('tela-motorista', this)"><i class="fa-solid fa-truck"></i>ROTA</div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('SHARK_V110') || '{"produtos":{}, "logs":[], "romaneios":[]}');
        let html5QrCode, camAtiva = false;

        function inicializarApp() { render(); }

        function login(role) {
            document.getElementById('tela-login').classList.remove('active-screen');
            document.getElementById('bot-nav').style.display = 'flex';
            document.getElementById('dev-footer').style.display = 'block';
            document.getElementById('nv-sk').style.display = (role==='shark') ? 'flex' : 'none';
            document.getElementById('nv-op').style.display = (role!=='motorista') ? 'flex' : 'none';
            document.getElementById('nv-mt').style.display = (role!=='operador') ? 'flex' : 'none';
            navegar('tela-'+role, document.getElementById('nv-'+(role=='operador'?'op':role=='motorista'?'mt':'sk')));
        }

        function logout() {
            document.getElementById('bot-nav').style.display = 'none';
            document.getElementById('dev-footer').style.display = 'none';
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('tela-login').classList.add('active-screen');
        }

        function navegar(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-screen');
            el.classList.add('active-tab');
            render();
        }

        function opRegistrar(eanLido = null) {
            let ean = eanLido || document.getElementById('op-ean').value;
            if(!ean) return;
            if(!db.produtos[ean]) {
                let n = prompt("PRODUTO NOVO! NOME:");
                if(n) db.produtos[ean] = n; else return;
            }
            let qtd = prompt("QTD:", "1");
            if(qtd) {
                db.logs.unshift({ id: Date.now(), tipo: document.getElementById('op-tipo').value, ean: ean, nome: db.produtos[ean], qtd: parseInt(qtd), romaneio: null });
                save(); render();
                document.getElementById('op-ean').value = "";
            }
        }

        function render() {
            let estTotal = 0, avarias = 0, shLogs = "";
            db.logs.forEach((l, idx) => {
                if(l.tipo === 'ENTRADA') estTotal += l.qtd;
                if(l.tipo === 'SEPARACAO') estTotal -= l.qtd;
                if(l.tipo === 'AVARIA') avarias += l.qtd;
                shLogs += `<div class="item-row"><div><b>${l.tipo}</b><br><small>${l.nome}</small></div><b>${l.qtd}</b></div>`;
            });

            if(document.getElementById('sk-inv')) {
                document.getElementById('sk-inv').innerText = Object.keys(db.produtos).length;
                let elEst = document.getElementById('sk-est');
                elEst.innerText = estTotal;
                // Alerta Crítico (menos de 5 itens)
                if(estTotal < 5) elEst.classList.add('low-stock'); else elEst.classList.remove('low-stock');
                
                document.getElementById('sk-ava').innerText = avarias;
                document.getElementById('sk-rta').innerText = db.romaneios.filter(r=>r.status==='EM ROTA').length;
                document.getElementById('shark-log-list').innerHTML = shLogs;
            }
        }

        function sharkSaveSku() {
            let e = document.getElementById('sk-ean').value;
            let n = document.getElementById('sk-nome').value;
            if(e && n) { db.produtos[e] = n; save(); render(); alert("SKU SALVO!"); }
        }

        function save() { localStorage.setItem('SHARK_V110', JSON.stringify(db)); }

        function toggleCam() {
            if(!camAtiva) {
                document.getElementById('reader-op').style.display='block';
                html5QrCode = new Html5Qrcode("reader-op");
                html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => { opRegistrar(txt); toggleCam(); });
                document.getElementById('btn-cam').innerText="PARAR"; camAtiva=true;
            } else {
                html5QrCode.stop().then(() => { document.getElementById('reader-op').style.display='none'; camAtiva=false; document.getElementById('btn-cam').innerText="ACIONAR SCANNER"; });
            }
        }
    </script>
</body>
</html>
