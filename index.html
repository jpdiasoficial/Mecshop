<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECSHOP | Pitch de Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ea1d2c; --dark: #0a0a0a; --card: #111; --text: #fff; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        /* LOGIN */
        #tela-login { width: 320px; text-align: center; animation: fadeIn 0.5s; }
        .logo { font-size: 35px; font-weight: 800; color: var(--red); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #1a1a1a; border: 1px solid #222; border-radius: 8px; color: #fff; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: var(--red); border: none; border-radius: 8px; color: #fff; font-weight: 800; cursor: pointer; }

        /* PAINEL PRINCIPAL */
        #painel { display: none; width: 100%; max-width: 900px; padding: 20px; animation: fadeIn 0.5s; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        /* SIMULAÇÃO IPHONE */
        .iphone { background: #fff; border-radius: 35px; border: 8px solid #333; color: #333; height: 580px; overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .ip-header { background: var(--red); color: #fff; padding: 15px; text-align: center; font-weight: 800; font-size: 13px; }
        
        /* STATUS SYNC */
        .status-area { margin: 15px; padding: 20px; background: #f4f4f4; border-radius: 15px; text-align: center; border: 2px dashed #ccc; }
        .status-val { font-size: 20px; font-weight: 800; color: var(--red); display: block; margin-top: 5px; }

        /* PAINEL DE COMANDO */
        .controles { padding: 20px; background: var(--card); border: 1px solid #222; border-radius: 20px; color: #fff; }
        .btn-c { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; color: #fff; transition: 0.2s; }
        .btn-c:active { transform: scale(0.95); }

        /* SIMULADOR DE ROI (LUCRO) */
        #simulador-lucro { margin-top: 25px; padding: 20px; background: #000; border: 1px solid #0f0; border-radius: 15px; display: none; }
        .calc-input { background: #111; border: 1px solid #333; color: #0f0; font-family: monospace; padding: 5px; width: 70px; text-align: center; border-radius: 4px; }
        .res-lucro { color: #0f0; font-weight: 800; font-size: 20px; display: block; margin-top: 10px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 750px) { .grid { grid-template-columns: 1fr; } .iphone { height: 500px; } }
    </style>
</head>
<body>

    <div id="tela-login">
        <h1 class="logo">MECSHOP</h1>
        <p style="color:#555; font-size:10px; letter-spacing:2px; margin-bottom:20px;">TECNOLOGIA DE ESCALA</p>
        <input type="text" id="user" placeholder="usuário (jp ou shark)">
        <input type="password" id="pass" placeholder="senha">
        <button onclick="logar()">ENTRAR NO ARSENAL</button>
    </div>

    <div id="painel">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 id="boas-vindas" style="margin:0; font-size: 18px;"></h2>
            <button onclick="window.location.reload()" style="width:auto; padding: 5px 15px; background:#333; font-size:10px;">SAIR</button>
        </div>

        <div class="grid">
            <div class="iphone">
                <div class="ip-header">VISÃO DO OPERADOR / CLIENTE</div>
                <div class="status-area">
                    <small style="color:#999; font-weight:800;">STATUS DA OPERAÇÃO</small>
                    <span id="sync-val" class="status-val">AGUARDANDO...</span>
                </div>
                <div style="padding: 15px;">
                    <small style="font-weight:800;">RELATÓRIO DE CAMPO:</small>
                    <textarea id="nota-op" oninput="sync('NOTA', this.value)" style="width:100%; height:100px; margin-top:10px; border-radius:10px; border:1px solid #ddd; padding:10px; font-family:inherit;" placeholder="O operador reporta aqui..."></textarea>
                    <p style="font-size: 9px; color: #999; margin-top: 10px;">Sincronização ativa via LocalStorage.</p>
                </div>
            </div>

            <div class="controles">
                <p style="margin-top:0; color:var(--red); font-weight:800;">CENTRAL DE COMANDO</p>
                <button class="btn-c" style="background:#ffa500" onclick="sync('STATUS', '📦 EM SEPARAÇÃO')">ORDEM: SEPARAÇÃO</button>
                <button class="btn-c" style="background:#007bff" onclick="sync('STATUS', '🚚 SAIU P/ ENTREGA')">ORDEM: SAÍDA</button>
                <button class="btn-c" style="background:#28a745" onclick="sync('STATUS', '✅ ENTREGUE')">ORDEM: FINALIZAR</button>

                <div id="simulador-lucro">
                    <p style="color:#0f0; font-weight:800; margin-top:0; font-size: 12px;">💸 CALCULADORA DE ECONOMIA (ROI)</p>
                    <div style="font-size: 11px; line-height: 25px;">
                        Vendas/Mês: <input type="number" id="v-mes" class="calc-input" value="200" oninput="calc()"> <br>
                        Custo do erro (R$): <input type="number" id="v-perda" class="calc-input" value="45" oninput="calc()">
                    </div>
                    <hr style="border:0; border-top:1px solid #111; margin: 10px 0;">
                    <small style="color:#888;">Economia com a Automação:</small>
                    <span class="res-lucro" id="total-lucro">R$ 9.000,00</span>
                </div>
            </div>
        </div>
    </div>

<script>
    let uLogado = "";
    
    function logar() {
        const u = document.getElementById('user').value.toLowerCase();
        const p = document.getElementById('pass').value;
        
        // Senha Mestra: 9910shark
        if(p === "9910shark" && (u === 'shark' || u === 'jp')) {
            uLogado = u;
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('painel').style.display = 'block';
            document.getElementById('boas-vindas').innerText = "PAINEL: " + u.toUpperCase();
            
            // Se for SHARK, mostra a calculadora de lucro
            if(u === 'shark') {
                document.getElementById('simulador-lucro').style.display = 'block';
            }
            
            // Carrega estados anteriores
            document.getElementById('sync-val').innerText = localStorage.getItem('p_status') || "OFFLINE";
            document.getElementById('nota-op').value = localStorage.getItem('p_nota') || "";
        } else {
            alert("Acesso negado. Verifique usuário e senha.");
        }
    }

    function sync(tipo, val) {
        if(tipo === 'STATUS') {
            localStorage.setItem('p_status', val);
            document.getElementById('sync-val').innerText = val;
            
            // Efeito visual de brilho no simulador
            const display = document.getElementById('sync-val');
            display.style.transform = "scale(1.1)";
            setTimeout(() => { display.style.transform = "scale(1)"; }, 200);
        } else {
            localStorage.setItem('p_nota', val);
        }
    }

    function calc() {
        const v = document.getElementById('v-mes').value;
        const p = document.getElementById('v-perda').value;
        const total = v * p;
        document.getElementById('total-lucro').innerText = "R$ " + total.toLocaleString('pt-BR') + ",00";
    }

    // Ouvinte para atualizar caso você abra em duas abas reais no mesmo navegador
    window.addEventListener('storage', (e) => {
        if(e.key === 'p_status') document.getElementById('sync-val').innerText = e.newValue;
        if(e.key === 'p_nota') document.getElementById('nota-op').value = e.newValue;
    });
</script>
</body>
</html>
