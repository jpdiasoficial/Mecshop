<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHARK-BET | CONTROLE TOTAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #ff5e00; --g: #00ff41; --bg: #030303; --card: #0d0d0d; --brd: #1a1a1a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; position: fixed; width: 100%; }

        /* FIX: HEADER FIXO E INDEPENDENTE */
        header { 
            height: 70px; 
            background: rgba(0,0,0,0.95); 
            border-bottom: 1px solid var(--brd); 
            display: none; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 20px; 
            position: fixed; 
            top: 0; 
            width: 100%; 
            z-index: 2000; 
            backdrop-filter: blur(10px); 
        }
        .logo { font-family: 'Orbitron', sans-serif; color: var(--p); font-size: 20px; font-weight: 900; }
        .bal-box { background: #000; border: 1px solid var(--g); padding: 8px 12px; border-radius: 12px; color: var(--g); font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 8px; }

        /* VIEWS COM PADDING PARA NÃO BATER NO HEADER */
        .view { position: absolute; inset: 0; display: none; flex-direction: column; padding: 90px 20px 110px 20px; overflow-y: auto; }
        .view.active { display: flex; animation: sharkIn 0.3s ease-out; }
        @keyframes sharkIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* UI ELEMENTS */
        .card { background: var(--card); border: 1px solid var(--brd); border-radius: 20px; padding: 20px; margin-bottom: 15px; position: relative; overflow: hidden; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.2s; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-p { background: var(--p); color: #fff; }
        .btn-g { background: var(--g); color: #000; }
        .btn-s { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        /* ENGINE DE APOSTA */
        .bet-engine { display: flex; align-items: center; justify-content: space-between; background: #000; border: 1px solid #222; border-radius: 14px; padding: 6px; margin: 15px 0; }
        .ctrl { width: 40px; height: 40px; background: #1a1a1a; border: none; border-radius: 10px; color: #fff; font-size: 18px; cursor: pointer; }
        .v-bet { font-family: 'Orbitron'; color: var(--p); font-weight: 900; }

        /* GAMES */
        .m-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .m-tile { aspect-ratio: 1; background: #111; border-radius: 10px; border: 1px solid #222; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .m-tile.win { background: var(--g); color: #000; box-shadow: 0 0 15px var(--g); border: none; }
        .m-tile.lose { background: #ff0033; color: #fff; box-shadow: 0 0 15px #ff0033; border: none; }

        .c-area { height: 160px; background: #000; border-radius: 15px; border: 1px solid #222; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        .c-num { font-family: 'Orbitron'; font-size: 45px; font-weight: 900; color: var(--g); }

        /* NAV BAR */
        nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: #000; border-top: 1px solid var(--brd); display: none; justify-content: space-around; align-items: center; padding-bottom: 15px; z-index: 2000; }
        .n-item { color: #555; text-decoration: none; text-align: center; font-size: 10px; font-weight: 800; cursor: pointer; }
        .n-item.active { color: var(--p); }
        .n-item i { font-size: 22px; display: block; margin-bottom: 4px; }

        input { width: 100%; padding: 16px; background: #000; border: 1px solid #222; border-radius: 12px; color: #fff; margin-bottom: 10px; font-weight: 600; }
    </style>
</head>
<body onload="Shark.init()">

    <header id="h-main">
        <div class="logo">SHARK CONTROL</div>
        <div class="bal-box" onclick="Shark.nav('scr-fin')">R$ <span id="u-bal">0.00</span></div>
    </header>

    <div id="scr-auth" class="view active" style="justify-content:center; padding: 20px;">
        <div style="text-align:center; margin-bottom:30px;">
            <h1 class="logo" style="font-size:40px;">SHARK<span>BET</span></h1>
            <p style="color:#444; font-size:10px; letter-spacing:2px;">PLATAFORMA V-ULTIMATE</p>
        </div>
        <div class="card">
            <input type="text" id="l-user" placeholder="USUÁRIO">
            <input type="password" id="l-pass" placeholder="SENHA">
            <button class="btn btn-p" onclick="Shark.Auth.run()">Acessar Terminal</button>
        </div>
    </div>

    <div id="scr-lobby" class="view">
        <div class="card" style="border-left: 4px solid var(--g);">
            <h2 id="u-welcome">Olá, Shark</h2>
            <small style="color:var(--g)">Sessão criptografada e segura.</small>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div class="card" onclick="Shark.nav('scr-mines')" style="text-align:center;">
                <i class="fa-solid fa-gem" style="color:var(--g); font-size:30px; margin-bottom:10px;"></i><br><b>MINES PRO</b>
            </div>
            <div class="card" onclick="Shark.nav('scr-crash')" style="text-align:center;">
                <i class="fa-solid fa-rocket" style="color:var(--p); font-size:30px; margin-bottom:10px;"></i><br><b>CRASH</b>
            </div>
        </div>
        <button class="btn btn-g" onclick="Shark.nav('scr-fin')">DEPOSITAR AGORA</button>
    </div>

    <div id="scr-mines" class="view">
        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <b style="color:var(--g)">MINES PRO</b>
                <span style="font-size:10px; background:#000; padding:4px 8px; border-radius:5px;">3 BOMBAS</span>
            </div>
            <div class="m-grid" id="m-grid"></div>
            <div class="bet-engine">
                <button class="ctrl" onclick="Shark.adj(-10)">-</button>
                <div class="v-bet">R$ <span id="m-bet-val">10.00</span></div>
                <button class="ctrl" onclick="Shark.adj(10)">+</button>
            </div>
            <button id="m-btn" class="btn btn-p" onclick="Shark.Games.Mines.play()">INICIAR JOGO</button>
        </div>
    </div>

    <div id="scr-crash" class="view">
        <div class="card">
            <h3 style="text-align:center; margin-bottom:15px; color:var(--p)">CRASH SHARK</h3>
            <div class="c-area"><div id="c-mult" class="c-num">1.00x</div></div>
            <div class="bet-engine">
                <button class="ctrl" onclick="Shark.adj(-10)">-</button>
                <div class="v-bet">R$ <span id="c-bet-val">10.00</span></div>
                <button class="ctrl" onclick="Shark.adj(10)">+</button>
            </div>
            <button id="c-btn" class="btn btn-g" onclick="Shark.Games.Crash.start()">APOSTAR</button>
        </div>
    </div>

    <div id="scr-fin" class="view">
        <div class="card">
            <small>Saldo para Saque</small>
            <h2 style="color:var(--g); margin:10px 0;">R$ <span id="f-bal">0.00</span></h2>
            <button class="btn btn-g" style="margin-bottom:10px;">DEPOSITAR</button>
            <button class="btn btn-s" onclick="Shark.Finance.withdraw()">SOLICITAR SAQUE PIX</button>
        </div>
    </div>

    <div id="scr-admin" class="view">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="card"><small>LUCRO CASA</small><h2 id="a-ggr" style="color:var(--g)">R$ 0.00</h2></div>
            <div class="card"><small>USUÁRIOS</small><h2 id="a-count">1</h2></div>
        </div>
        <div id="a-list"></div>
    </div>

    <nav id="n-main">
        <a class="n-item active" onclick="Shark.nav('scr-lobby', this)"><i class="fa-solid fa-house"></i>HOME</a>
        <a class="n-item" onclick="Shark.nav('scr-fin', this)"><i class="fa-solid fa-wallet"></i>BANCA</a>
        <a class="n-item" id="n-adm" style="display:none;" onclick="Shark.nav('scr-admin', this)"><i class="fa-solid fa-shield-halved"></i>ADMIN</a>
        <a class="n-item" onclick="location.reload()"><i class="fa-solid fa-right-from-bracket"></i>SAIR</a>
    </nav>

    <script>
        const Shark = {
            db: JSON.parse(localStorage.getItem('SHARK_V3')) || [{name:'ADMIN', pass:'123', bal:100, role:'admin', mode:'normal'}],
            u: null, bet: 10, ggr: 0,

            init() {
                const s = sessionStorage.getItem('SHARK_SESS');
                if(s) { this.u = this.db.find(x => x.name === s); if(this.u) this.unlock(); }
            },

            Auth: {
                run() {
                    const n = document.getElementById('l-user').value.toUpperCase().trim();
                    const p = document.getElementById('l-pass').value.trim();
                    let u = Shark.db.find(x => x.name === n);
                    if(!u || u.pass !== p) return alert("Acesso negado");
                    Shark.u = u; sessionStorage.setItem('SHARK_SESS', n); Shark.unlock();
                }
            },

            // FIX: NAVEGAÇÃO QUE RESOLVE O BUG DO TOPO
            nav(id, el) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                const target = document.getElementById(id);
                target.classList.add('active');
                target.scrollTop = 0; // Reseta o scroll da tela nova

                if(el) {
                    document.querySelectorAll('.n-item').forEach(l => l.classList.remove('active'));
                    el.classList.add('active');
                }

                // Força o header a se comportar
                const header = document.getElementById('h-main');
                header.style.display = 'flex';
                
                this.sync(); 

                if(id === 'scr-mines') this.Games.Mines.render();
                if(id === 'scr-admin') this.Admin.render();
            },

            unlock() {
                document.getElementById('scr-auth').classList.remove('active');
                document.getElementById('h-main').style.display = 'flex';
                document.getElementById('n-main').style.display = 'flex';
                if(this.u.role === 'admin') document.getElementById('n-adm').style.display = 'flex';
                this.nav('scr-lobby');
            },

            sync() {
                document.getElementById('u-bal').innerText = this.u.bal.toFixed(2);
                document.getElementById('f-bal').innerText = this.u.bal.toFixed(2);
                document.getElementById('m-bet-val').innerText = this.bet.toFixed(2);
                document.getElementById('c-bet-val').innerText = this.bet.toFixed(2);
                document.getElementById('u-welcome').innerText = "Olá, " + this.u.name;
                localStorage.setItem('SHARK_V3', JSON.stringify(this.db));
            },

            adj(v) { this.bet = Math.max(1, this.bet + v); this.sync(); },

            Finance: {
                withdraw() { alert("Saque PIX processando..."); Shark.u.bal = 0; Shark.sync(); }
            },

            Games: {
                Mines: {
                    active: false,
                    render() {
                        const g = document.getElementById('m-grid'); g.innerHTML = '';
                        for(let i=0; i<25; i++) g.innerHTML += `<div class="m-tile" id="t-${i}" onclick="Shark.Games.Mines.click(${i})"><i class="fa-solid fa-gem" style="opacity:0.1"></i></div>`;
                    },
                    play() {
                        if(this.active) { alert("Saque realizado!"); this.active = false; Shark.sync(); return; }
                        if(Shark.u.bal < Shark.bet) return alert("Sem saldo");
                        Shark.u.bal -= Shark.bet; Shark.ggr += Shark.bet; Shark.sync();
                        this.active = true; this.render();
                        document.getElementById('m-btn').innerText = "CASH OUT";
                    },
                    click(i) {
                        if(!this.active) return;
                        const t = document.getElementById('t-'+i);
                        if(Shark.u.mode === 'lose') {
                            t.classList.add('lose'); t.innerHTML = '💣'; this.active = false;
                            setTimeout(() => { this.render(); document.getElementById('m-btn').innerText = "INICIAR JOGO"; }, 1000);
                        } else { 
                            t.classList.add('win'); t.innerHTML = '💎'; 
                            Shark.u.bal += (Shark.bet * 0.2); Shark.sync();
                        }
                    }
                },
                Crash: {
                    running: false, mult: 1, timer: null,
                    start() {
                        if(this.running) {
                            clearInterval(this.timer); this.running = false;
                            let win = Shark.bet * this.mult; Shark.u.bal += win; Shark.ggr -= win;
                            alert("Win: R$ " + win.toFixed(2)); this.reset(); return;
                        }
                        if(Shark.u.bal < Shark.bet) return;
                        Shark.u.bal -= Shark.bet; Shark.ggr += Shark.bet; Shark.sync();
                        this.running = true; this.mult = 1.0;
                        document.getElementById('c-btn').innerText = "CASH OUT";
                        this.timer = setInterval(() => {
                            this.mult += 0.05;
                            document.getElementById('c-mult').innerText = this.mult.toFixed(2) + "x";
                            if(Shark.u.mode === 'lose' && this.mult > 1.2) this.crash();
                            if(Math.random() < 0.03) this.crash();
                        }, 100);
                    },
                    crash() { clearInterval(this.timer); this.running = false; document.getElementById('c-mult').innerText = "BUST!"; setTimeout(() => this.reset(), 1500); },
                    reset() { document.getElementById('c-mult').innerText = "1.00x"; document.getElementById('c-btn').innerText = "APOSTAR"; Shark.sync(); }
                }
            },

            Admin: {
                render() {
                    document.getElementById('a-ggr').innerText = "R$ " + Shark.ggr.toFixed(2);
                    document.getElementById('a-count').innerText = Shark.db.length;
                    const l = document.getElementById('a-list');
                    l.innerHTML = Shark.db.filter(x => x.role !== 'admin').map(u => `
                        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                            <div><b>${u.name}</b><br><small>R$ ${u.bal.toFixed(2)}</small></div>
                            <button onclick="Shark.Admin.toggle('${u.name}')" class="btn" style="width:80px; padding:8px; background:${u.mode==='lose'?'red':'#222'}">${u.mode==='lose'?'LOSS':'NORM'}</button>
                        </div>
                    `).join('');
                },
                toggle(n) { const u = Shark.db.find(x => x.name === n); u.mode = u.mode === 'lose' ? 'normal' : 'lose'; this.render(); Shark.sync(); }
            }
        };
    </script>
</body>
</html>
