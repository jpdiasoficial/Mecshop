<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v80 | ULTRA SHARK EDITION</title>
    <!-- Fontes e Icons -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="https://unpkg.com"></script>
    <!-- Firebase SDK (Modular para velocidade) -->
    <script src="https://www.gstatic.com"></script>
    <script src="https://www.gstatic.com"></script>

    <style>
        :root { 
            --neon: #00ff41; --bg: #000; --card: #111; --danger: #ff3e3e; 
            --warning: #ffcc00; --blue: #00d4ff;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* 1. EFEITO MATRIX/SHARK */
        .neon-border { border: 1px solid var(--neon); box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
        .shark-font { font-family: 'Orbitron', sans-serif; color: var(--neon); text-shadow: 0 0 5px var(--neon); }

        /* 2. LAYOUT DINÂMICO */
        header { 
            padding: 10px 20px; border-bottom: 2px solid #222; 
            display: flex; justify-content: space-between; align-items: center; background: #080808;
        }

        #app { display: none; flex: 1; overflow-y: auto; padding: 15px; }

        /* 3. MODOS DE OPERAÇÃO - UI MELHORADA */
        .grid-modos { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .btn-modo { 
            background: #151515; border: 1px solid #333; padding: 12px; border-radius: 8px; 
            font-size: 0.75rem; text-align: center; cursor: pointer; transition: 0.2s;
            font-weight: bold; color: #888;
        }
        .btn-modo.active { border-color: var(--neon); color: var(--neon); background: rgba(0,255,65,0.05); }

        /* 4. ÁREA DE SCANNER */
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 12px; border: 2px solid #222; }
        .last-action { 
            background: var(--card); padding: 15px; border-radius: 10px; margin: 15px 0;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 5. PAINEL DE CARGA (REAL-TIME) */
        .container-monitor { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .painel-lista { background: #0a0a0a; border-radius: 10px; padding: 15px; border: 1px solid #222; height: 350px; overflow-y: auto; }
        .item-row { 
            display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #1a1a1a;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* 6. STATUS DE CONEXÃO */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: var(--neon); box-shadow: 0 0 8px var(--neon); }
        .offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

        /* 7. BOTÕES DE AÇÃO SHARK */
        .admin-controls { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-action { padding: 12px; border: none; border-radius: 6px; font-family: 'Orbitron'; font-size: 0.7rem; cursor: pointer; }
        .btn-green { background: var(--neon); color: #000; }
        .btn-blue { background: var(--blue); color: #000; }

        /* INPUT ESCONDIDO PARA LEITORES USB */
        #hidden-input { position: absolute; left: -9999px; }

        @media (max-width: 700px) { .container-monitor { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- TELA LOGIN -->
    <div id="tela-login" style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h1 class="shark-font" style="font-size: 3rem; margin:0;">LOG-PRO</h1>
        <p style="color:var(--neon); letter-spacing: 5px;">V80 SHARK</p>
        <input type="password" id="pin" class="neon-border" style="background:#000; color:var(--neon); padding:15px; width:250px; text-align:center; margin:20px; font-size:1.5rem;" placeholder="PIN SHARK">
        <button class="btn-green btn-action" style="width:250px; font-size:1rem;" onclick="autenticar()">ACESSAR TERMINAL</button>
    </div>

    <!-- SISTEMA PRINCIPAL -->
    <div id="app">
        <header>
            <div>
                <span id="status-icon" class="status-dot online"></span>
                <span class="shark-font" style="font-size: 0.8rem;" id="display-user">OPERADOR</span>
            </div>
            <div class="shark-font" style="font-size: 0.9rem; color: var(--neon);" id="clock">00:00:00</div>
        </header>

        <div class="grid-modos">
            <div class="btn-modo active" id="m-entrada" onclick="mudarModo('ENTRADA')">📥 ENTRADA</div>
            <div class="btn-modo" id="m-separa" onclick="mudarModo('SEPARAÇÃO')">📦 SEPARAÇÃO</div>
            <div class="btn-modo" id="m-avaria" onclick="mudarModo('AVARIA')">⚠️ AVARIA</div>
            <div class="btn-modo" id="m-saida" onclick="mudarModo('SAÍDA')">🚚 SAÍDA</div>
        </div>

        <div id="reader"></div>
        <input type="text" id="hidden-input">

        <div class="last-action neon-border">
            <div>
                <small style="color:#666; display:block;">ÚLTIMA LEITURA:</small>
                <span id="last-barcode" class="shark-font">---</span>
            </div>
            <div id="last-status" style="font-size: 0.7rem; font-weight: bold;">AGUARDANDO...</div>
        </div>

        <div class="container-monitor">
            <!-- Coluna Operacional -->
            <div class="painel-lista">
                <h3 class="shark-font" style="font-size: 0.7rem; border-bottom: 1px solid #333; padding-bottom: 5px;">PENDÊNCIAS DE CARGA</h3>
                <div id="lista-pendencias"></div>
            </div>

            <!-- Coluna Shark (Admin) -->
            <div id="shark-only" style="display: none;">
                <div class="painel-lista">
                    <h3 class="shark-font" style="font-size: 0.7rem; border-bottom: 1px solid #333; padding-bottom: 5px;">COMANDOS DO DONO</h3>
                    <textarea id="csv-input" style="width:100%; height:100px; background:#111; color:var(--neon); border:1px solid #333; font-size:0.8rem; padding:10px;" placeholder="COLE AQUI: CODIGO,QTD (Ex: 7891,10)"></textarea>
                    
                    <div class="admin-controls">
                        <button class="btn-green btn-action" onclick="gerarCarga()">🚀 LANÇAR CARGA</button>
                        <button class="btn-blue btn-action" onclick="exportarCSV()">📊 LOGS (CSV)</button>
                        <button class="btn-action" style="background:#ff3e3e; grid-column: span 2;" onclick="resetarSistema()">🧨 RESET GERAL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURAÇÃO FIREBASE (Substitua pelos seus dados)
        const firebaseConfig = { apiKey: "AIza...", projectId: "logpro-v80", appId: "1:..." };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // 2. CANAL DE COMUNICAÇÃO ENTRE ABAS (SYNC)
        const syncChannel = new BroadcastChannel('logpro_sync');

        let userState = { role: 'OP', modo: 'ENTRADA' };

        // 3. RELÓGIO E CONEXÃO
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
            document.getElementById('status-icon').className = navigator.onLine ? 'status-dot online' : 'status-dot offline';
        }, 1000);

        // 4. AUTENTICAÇÃO
        function autenticar() {
            const pin = document.getElementById('pin').value;
            if (pin === "7979") { // PIN SHARK
                userState.role = 'SHARK';
                document.getElementById('shark-only').style.display = 'block';
                document.getElementById('display-user').innerText = "JP | SHARK";
            }
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            iniciarLeitores();
        }

        // 5. MUDANÇA DE MODO COM SYNC ENTRE ABAS
        function mudarModo(novoModo) {
            userState.modo = novoModo;
            document.querySelectorAll('.btn-modo').forEach(b => b.classList.remove('active'));
            const btnId = novoModo === 'ENTRADA' ? 'm-entrada' : novoModo === 'SEPARAÇÃO' ? 'm-separa' : novoModo === 'AVARIA' ? 'm-avaria' : 'm-saida';
            document.getElementById(btnId).classList.add('active');
            vibrar(60);
            
            // Avisa a outra aba que mudei o modo aqui
            syncChannel.postMessage({ type: 'MODO_CHANGED', val: novoModo });
        }

        syncChannel.onmessage = (ev) => {
            if (ev.data.type === 'MODO_CHANGED') {
                mudarModo(ev.data.val);
            }
        };

        // 6. PROCESSAMENTO DE BIPE (CÉREBRO)
        async function processarBipe(codigo) {
            const code = codigo.trim();
            if (!code) return;

            vibrar(100);
            document.getElementById('last-barcode').innerText = code;
            document.getElementById('last-status').innerText = "PROCESSANDO...";
            document.getElementById('last-status').style.color = 'var(--blue)';

            try {
                // Registo de Log Global
                await db.collection("logs").add({
                    code, modo: userState.modo, user: userState.role, time: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Lógica de Separação em Tempo Real
                if (userState.modo === "SEPARAÇÃO") {
                    const sepRef = db.collection("carga_ativa").doc(code);
                    const doc = await sepRef.get();
                    if (doc.exists && doc.data().falta > 0) {
                        await sepRef.update({ falta: firebase.firestore.FieldValue.increment(-1) });
                        document.getElementById('last-status').innerText = "OK: BAIXA REALIZADA";
                        document.getElementById('last-status').style.color = 'var(--neon)';
                    } else {
                        document.getElementById('last-status').innerText = "ERRO: FORA DA LISTA";
                        document.getElementById('last-status').style.color = 'var(--danger)';
                    }
                } else {
                    document.getElementById('last-status').innerText = "OK: REGISTADO";
                    document.getElementById('last-status').style.color = 'var(--neon)';
                }
            } catch (e) {
                console.error(e);
            }
            
            document.getElementById('hidden-input').value = "";
        }

        // 7. ESCUTA DE CARGA (REAL-TIME)
        db.collection("carga_ativa").orderBy("falta", "desc").onSnapshot(snap => {
            const container = document.getElementById('lista-pendencias');
            container.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                if (data.falta > 0) {
                    container.innerHTML += `
                        <div class="item-row">
                            <span>📦 ${doc.id}</span>
                            <span class="shark-font" style="font-size:0.8rem;">FALTAM: ${data.falta}</span>
                        </div>
                    `;
                }
            });
        });

        // 8. FUNÇÕES SHARK (ADMIN)
        async function gerarCarga() {
            const data = document.getElementById('csv-input').value.split('\n');
            const batch = db.batch();
            data.forEach(line => {
                const [cod, qtd] = line.split(',');
                if (cod && qtd) {
                    const ref = db.collection("carga_ativa").doc(cod.trim());
                    batch.set(ref, { falta: parseInt(qtd.trim()) });
                }
            });
            await batch.commit();
            document.getElementById('csv-input').value = "";
            alert("CARGA LANÇADA NO SISTEMA!");
        }

        async function exportarCSV() {
            const logs = await db.collection("logs").orderBy("time", "desc").limit(500).get();
            let csv = "DATA,MODO,CODIGO,USER\n";
            logs.forEach(d => {
                const log = d.data();
                csv += `${log.time?.toDate().toLocaleString()},${log.modo},${log.code},${log.user}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `LOGPRO_EXPORT.csv`;
            a.click();
        }

        function vibrar(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

        function iniciarLeitores() {
            // Scanner Câmara
            const scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 25, qrbox: 250 }, (txt) => processarBipe(txt));

            // Scanner Físico (USB/BT)
            document.addEventListener('keydown', () => document.getElementById('hidden-input').focus());
            document.getElementById('hidden-input').addEventListener('change', (e) => processarBipe(e.target.value));
        }

        async function resetarSistema() {
            if(confirm("LIMPAR TODA A OPERAÇÃO?")) {
                const snap = await db.collection("carga_ativa").get();
                snap.forEach(d => d.ref.delete());
            }
        }
    </script>
</body>
</html>
