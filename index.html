<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO MASTER | v70-v73</title>
    <style>
        :root { --neon: #00ff41; --bg: #000; --warn: #ffae00; --danger: #ff3b30; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; text-transform: uppercase; overflow: hidden; }
        
        /* HEADER v50/v70 */
        .header { padding: 10px; border-bottom: 2px solid #222; background: #000; position: sticky; top: 0; z-index: 100; }
        .logo { color: var(--neon); font-size: 20px; font-weight: bold; text-align: center; text-shadow: 0 0 10px var(--neon); }
        
        .dash-v70 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 10px 0; }
        .card { background: #0a0a0a; border: 1px solid #333; padding: 10px 2px; text-align: center; }
        .card b { display: block; font-size: 22px; color: var(--neon); }
        .card span { font-size: 8px; color: #666; }

        /* SEPARAÇÃO v40/v71 (O QUE ESTAVA FALTANDO) */
        .area-separacao { background: #080808; border: 1px solid var(--warn); margin: 10px; padding: 10px; border-radius: 4px; max-height: 150px; overflow-y: auto; }
        .item-sep { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 8px 0; font-size: 12px; }
        .item-sep b { color: var(--warn); font-size: 14px; }

        /* BOTÕES v30/v73 */
        .grid-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 0 10px; }
        .btn { padding: 15px 5px; border: 1px solid #444; font-weight: bold; cursor: pointer; font-size: 10px; border-radius: 4px; }
        .btn-ent { background: #002200; color: var(--neon); border-color: var(--neon); }
        .btn-sep { background: #221100; color: var(--warn); border-color: var(--warn); }
        .btn-sai { background: #220000; color: var(--danger); border-color: var(--danger); }

        /* TABELA v72/v73 (500 LINHAS) */
        .container-v70 { height: calc(100vh - 420px); overflow-y: auto; background: #020202; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; }
        th { background: #111; color: #444; padding: 10px; text-align: left; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #111; color: #aaa; }
        tr:nth-child(even) { background: #050505; }

        .input-v72 { width: 95%; padding: 12px; background: #0a0a0a; border: 1px solid #333; color: var(--neon); margin: 10px 2.5%; box-sizing: border-box; outline: none; }
    </style>
</head>
<body onload="init()">

<div class="header">
    <div class="logo">LOG-PRO SHARK v73</div>
    <div class="dash-v70">
        <div class="card"><b id="d-sku">0</b><span>SKUS B18</span></div>
        <div class="card"><b id="d-mov">0</b><span>BIPES</span></div>
        <div class="card"><b id="d-pen" style="color:var(--warn)">0</b><span>ORDENS</span></div>
    </div>
    <div class="grid-btns">
        <button class="btn btn-ent" onclick="lancar('ENTRADA')">ENTRADA</button>
        <button class="btn btn-sep" onclick="lancarDemanda()">NOVA ORDEM</button>
        <button class="btn btn-sai" onclick="lancar('SAIDA')">SAÍDA</button>
    </div>
</div>

<div class="area-separacao" id="lista-separacao">
    <div style="color:var(--warn); font-size:10px; text-align:center; margin-bottom:5px;">⚠️ LISTA DE SEPARAÇÃO ATIVA (ABATER NO BIPE)</div>
    <div id="itens-pendentes">
        </div>
</div>

<input type="text" id="filtro" class="input-v72" placeholder="🔍 FILTRAR NAS 500 LINHAS..." onkeyup="filtrar()">

<div class="container-v70">
    <table>
        <thead>
            <tr><th>HORA</th><th>OP</th><th>TIPO</th><th>PRODUTO</th><th>QTD</th><th>SALDO</th></tr>
        </thead>
        <tbody id="corpo-v70"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit, doc, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const cfg = { apiKey: "AIzaSyDRDhONvvzZmo2csXksqHs6E6vV3MuvLSs", authDomain: "log-pro-jp.firebaseapp.com", projectId: "log-pro-jp", storageBucket: "log-pro-jp.firebasestorage.app", messagingSenderId: "481645607846", appId: "1:481645607846:web:fd55dd943718ad78386d67" };
    const app = initializeApp(cfg);
    const db = getFirestore(app);

    let BASE = JSON.parse(localStorage.getItem('LP_v73_B')) || {};

    // v73: MONITOR DE 500 LINHAS + SALDO B18
    onSnapshot(query(collection(db, "logs"), orderBy("data_hora", "desc"), limit(500)), (sn) => {
        const movs = sn.docs.map(d => d.data());
        let sld = {}; Object.keys(BASE).forEach(k => sld[k] = 0);
        [...movs].reverse().forEach(m => { if(sld[m.c] !== undefined) m.t === 'ENTRADA' ? sld[m.c]+=m.q : sld[m.c]-=m.q; });

        let h = "";
        movs.forEach(m => {
            const s = sld[m.c] || 0;
            h += `<tr class="item-row">
                <td style="color:#444">${m.d_s}</td>
                <td style="color:var(--neon)">${m.op || 'PAI'}</td>
                <td style="color:${m.t==='ENTRADA'?'#00ff41':'#ff3b30'}">${m.t}</td>
                <td>${BASE[m.c] || m.c}</td>
                <td><b>${m.q}</b></td>
                <td style="color:#fff">${s}</td>
            </tr>`;
        });
        document.getElementById('corpo-v70').innerHTML = h;
        document.getElementById('d-sku').innerText = Object.keys(BASE).length;
        document.getElementById('d-mov').innerText = movs.length;
    });

    // v40/v71: MONITOR DE SEPARAÇÃO (ALERTA)
    onSnapshot(collection(db, "separacao"), (sn) => {
        let h = ""; let p = 0;
        sn.docs.forEach(d => {
            const m = d.data();
            const falta = m.qtd_p - m.qtd_f;
            if(falta > 0) {
                h += `<div class="item-sep"><span>${m.nome}</span><b>${falta} UN</b></div>`;
                p++;
            }
        });
        document.getElementById('itens-pendentes').innerHTML = h || "<center style='color:#333'>NENHUMA ORDEM ATIVA</center>";
        document.getElementById('d-pen').innerText = p;
    });

    window.lancarDemanda = async () => {
        const c = prompt("SKU PARA SEPARAR:");
        const q = prompt("QUANTIDADE TOTAL:");
        if(c && q) {
            await setDoc(doc(db, "separacao", c), { nome: BASE[c]||c, qtd_p: parseInt(q), qtd_f: 0 });
            alert("ORDEM LANÇADA!");
        }
    };

    window.lancar = async (t) => {
        const c = prompt("SKU:"); const q = prompt("QTD:");
        if(c && q) {
            if(navigator.vibrate) navigator.vibrate(50); // v30
            await addDoc(collection(db, "logs"), { c, t, q: parseInt(q), op: "PAI", data_hora: serverTimestamp(), d_s: new Date().toLocaleTimeString() });
            
            // LÓGICA DE ABATE v71: Se for SAÍDA, abate da separação automaticamente
            if(t === 'SAIDA') {
                const ref = doc(db, "separacao", c);
                const d = await getDoc(ref);
                if(d.exists()) await updateDoc(ref, { qtd_f: d.data().qtd_f + parseInt(q) });
            }
        }
    };

    window.filtrar = () => {
        const f = document.getElementById('filtro').value.toUpperCase();
        document.querySelectorAll('.item-row').forEach(r => r.style.display = r.innerText.toUpperCase().includes(f) ? "" : "none");
    };
</script>
</body>
        </html>
