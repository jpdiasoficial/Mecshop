<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG PRO v80 | VISÃO SHARK</title>
    <style>
        :root { 
            --accent: #00FF41; 
            --bg: #050505; 
            --card: #121212;
            --text: #E0E0E0;
            --danger: #FF3131;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; }
        
        .header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .shark-badge { background: var(--accent); color: black; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 3px; }

        .tab-content { display: none; height: calc(100vh - 130px); overflow-y: auto; padding: 15px; }
        .active { display: block; }

        /* Estilo Operador */
        .scanner-area { background: var(--card); border: 2px solid #333; border-radius: 12px; padding: 30px 20px; text-align: center; margin-bottom: 15px; }
        input#barcode { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--accent); color: var(--accent); font-size: 28px; text-align: center; outline: none; margin-top: 20px; font-family: monospace; }
        
        /* Estilo Painel */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 8px; border-top: 2px solid var(--accent); text-align: center; }
        .stat-card small { color: #888; font-size: 10px; text-transform: uppercase; }
        .stat-card div { font-size: 24px; font-weight: bold; color: var(--accent); }

        .log-item { background: var(--card); margin-bottom: 8px; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); border-right: 1px solid #222; }
        .log-info { display: flex; flex-direction: column; }
        .log-code { font-family: monospace; font-size: 16px; color: white; }
        .log-time { font-size: 11px; color: #666; }

        /* Menu Inferior */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; border-top: 1px solid #222; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-size: 11px; border: none; background: none; font-weight: bold; }
        .nav-item.active-nav { color: var(--accent); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }

        .btn-clear { background: #1a1a1a; color: var(--danger); border: 1px solid var(--danger); padding: 12px; border-radius: 6px; width: 100%; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-weight: 900; letter-spacing: 1px;">LOG PRO <span style="color:var(--accent)">V80</span></span>
        <span class="shark-badge">SHARK MODE</span>
    </div>

    <div id="tab-operador" class="tab-content active">
        <div class="scanner-area">
            <small style="color: var(--accent); letter-spacing: 2px;">PRONTO PARA BIPAGEM</small>
            <input type="text" id="barcode" placeholder="BIPE O CÓDIGO" autofocus autocomplete="off">
        </div>
        <div id="feedback" style="text-align: center; font-size: 14px; min-height: 20px;"></div>
    </div>

    <div id="tab-painel" class="tab-content">
        <div class="stats-grid">
            <div class="stat-card"><small>Objetos</small><div id="count-total">0</div></div>
            <div class="stat-card"><small>Status</small><div style="font-size:14px; color: white;">ONLINE</div></div>
        </div>
        <div id="lista-logs"></div>
        <button class="btn-clear" onclick="limparOperacao()">REINICIAR FLUXO</button>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active-nav" onclick="irPara('tab-operador', this)">
            <span class="nav-icon">📦</span> OPERADOR
        </button>
        <button class="nav-item" onclick="irPara('tab-painel', this)">
            <span class="nav-icon">📊</span> PAINEL
        </button>
    </nav>

    <script>
        const input = document.getElementById('barcode');
        const feedback = document.getElementById('feedback');

        // Processa ao dar Enter (comum em leitores de código de barras)
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                salvarObjeto(input.value);
            }
        });

        function salvarObjeto(valor) {
            if (!valor.trim()) return;

            const novoLog = {
                id: valor.toUpperCase(),
                hora: new Date().toLocaleTimeString('pt-BR'),
                data: new Date().toLocaleDateString('pt-BR')
            };

            let banco = JSON.parse(localStorage.getItem('log_pro_db') || "[]");
            banco.unshift(novoLog);
            localStorage.setItem('log_pro_db', JSON.stringify(banco));

            // Feedback Visual e Tátil
            feedback.innerHTML = `<span style="color:var(--accent)">✔ OBJETO ${valor} REGISTRADO</span>`;
            if(navigator.vibrate) navigator.vibrate(60);
            
            input.value = "";
            input.focus();
            
            setTimeout(() => { feedback.innerHTML = ""; }, 2000);
        }

        function carregarPainel() {
            let banco = JSON.parse(localStorage.getItem('log_pro_db') || "[]");
            document.getElementById('count-total').innerText = banco.length;
            
            const container = document.getElementById('lista-logs');
            container.innerHTML = banco.map(item => `
                <div class="log-item">
                    <div class="log-info">
                        <span class="log-code">${item.id}</span>
                        <span class="log-time">${item.hora} - ${item.data}</span>
                    </div>
                    <span style="font-size:10px; font-weight:bold; color:var(--accent)">OK</span>
                </div>
            `).join('');
        }

        function irPara(abaId, botao) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active-nav'));
            
            document.getElementById(abaId).classList.add('active');
            botao.classList.add('active-nav');
            
            if(abaId === 'tab-painel') carregarPainel();
            if(abaId === 'tab-operador') setTimeout(() => input.focus(), 200);
        }

        function limparOperacao() {
            if(confirm("Zerar base de dados local?")) {
                localStorage.removeItem('log_pro_db');
                carregarPainel();
            }
        }

        // Mantém o foco se clicar fora
        document.addEventListener('click', () => {
            if(document.getElementById('tab-operador').classList.contains('active')) input.focus();
        });
    </script>
</body>
</html>
