<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Platform</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

header{
background:#020617;
padding:15px;
font-size:22px;
font-weight:bold;
}

.container{
max-width:600px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#22c55e;
border:none;
border-radius:6px;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.hidden{
display:none;
}

.admin{
background:#7c3aed;
}

#wheel{
width:200px;
height:200px;
border-radius:50%;
border:10px solid white;
margin:auto;
background:conic-gradient(
#22c55e 0deg 90deg,
#ef4444 90deg 180deg,
#22c55e 180deg 270deg,
#ef4444 270deg 360deg
);
transition:transform 3s;
}

</style>

</head>

<body>

<header>JP Platform</header>

<div class="container">

<div id="loginBox" class="card">

<h3>Login</h3>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>

<p onclick="showRegister()" style="cursor:pointer">Criar conta</p>

</div>

<div id="registerBox" class="card hidden">

<h3>Cadastro</h3>

<input id="newUser" placeholder="Usuário">
<input id="newPass" type="password" placeholder="Senha">

<button onclick="register()">Cadastrar</button>

</div>

<div id="dashboard" class="hidden">

<div class="card">

<h3>Bem-vindo <span id="username"></span></h3>

<p>Saldo: R$ <span id="saldo">0</span></p>

<button onclick="ganhar()">Ganhar saldo</button>

</div>

<div class="card">

<h3>Roleta da sorte</h3>

<div id="wheel"></div>

<button onclick="girar()">Girar</button>

<p id="resultado"></p>

</div>

<div class="card">

<h3>Histórico saldo</h3>

<canvas id="grafico" width="300" height="150"></canvas>

</div>

<div id="adminPanel" class="card admin hidden">

<h3>Painel Admin</h3>

<p>Total usuários: <span id="totalUsers"></span></p>

<button onclick="reset()">Reset sistema</button>

</div>

<button onclick="logout()">Sair</button>

</div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || []

let saldo = parseFloat(localStorage.getItem("saldo")) || 0

let historico = JSON.parse(localStorage.getItem("hist")) || []

function showRegister(){

loginBox.classList.add("hidden")

registerBox.classList.remove("hidden")

}

function register(){

let u=newUser.value
let p=newPass.value

users.push({user:u,pass:p})

localStorage.setItem("users",JSON.stringify(users))

alert("Conta criada")

location.reload()

}

function login(){

let u=user.value
let p=pass.value

let found = users.find(x=>x.user==u && x.pass==p)

if(u=="admin" && p=="123"){

openDashboard(u,true)

return

}

if(found){

openDashboard(u,false)

}else{

alert("Login inválido")

}

}

function openDashboard(user,isAdmin){

loginBox.classList.add("hidden")

dashboard.classList.remove("hidden")

username.innerText=user

saldoEl = document.getElementById("saldo")

saldoEl.innerText=saldo

if(isAdmin){

adminPanel.classList.remove("hidden")

totalUsers.innerText=users.length

}

drawChart()

}

function ganhar(){

saldo+=10

saveSaldo()

}

function girar(){

let deg=Math.floor(Math.random()*360)+720

wheel.style.transform="rotate("+deg+"deg)"

setTimeout(()=>{

if(deg%2==0){

saldo+=20

resultado.innerText="Você ganhou 20"

}else{

saldo-=10

resultado.innerText="Você perdeu 10"

}

saveSaldo()

},3000)

}

function saveSaldo(){

localStorage.setItem("saldo",saldo)

saldoEl.innerText=saldo

historico.push(saldo)

localStorage.setItem("hist",JSON.stringify(historico))

drawChart()

}

function drawChart(){

let c=document.getElementById("grafico")

let ctx=c.getContext("2d")

ctx.clearRect(0,0,c.width,c.height)

ctx.beginPath()

historico.forEach((v,i)=>{

let x=i*30

let y=150-v

if(i==0)ctx.moveTo(x,y)

else ctx.lineTo(x,y)

})

ctx.strokeStyle="lime"

ctx.stroke()

}

function logout(){

location.reload()

}

function reset(){

localStorage.clear()

location.reload()

}

</script>

</body>
</html>
