<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v85 (BACK TO 73)</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #00ff41; --s: #ffae00; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; text-transform: uppercase; overflow: hidden; }
        
        /* Layout v73: Simples e Funcional */
        .screen { display: none; height: 100vh; flex-direction: column; }
        .active { display: flex; }
        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; }
        .content { flex: 1; overflow-y: auto; padding: 15px; }

        /* Blocos de Dados */
        .card { background: #0a0a0a; border: 1px solid #222; padding: 12px; border-radius: 5px; margin-bottom: 10px; }
        .line-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #111; font-size: 12px; }
        
        /* Inputs Estilo Terminal */
        input, select { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: var(--p); margin-bottom: 10px; border-radius: 3px; font-weight: bold; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: var(--s); color: #000; }
        
        /* Auditoria/WMS */
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { text-align: left; color: #555; padding: 5px; }
        td { padding: 8px 5px; border-bottom: 1px solid #111; }
        .tag { font-size: 9px; padding: 2px 4px; border-radius: 2px; font-weight: bold; }
        .t-ent { background: #003311; color: var(--p); }
        .t-sai { background: #331100; color: var(--s); }

        #reader { width: 100%; background: #000; border-radius: 5px; }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active" style="justify-content:center; align-items:center;">
    <div style="width:80%; text-align:center;">
        <h2 style="color:var(--p); letter-spacing:5px;">LOG-PRO</h2>
        <input type="text" id="user" placeholder="USUÁRIO">
        <input type="password" id="pass" placeholder="SENHA">
        <button class="btn btn-p" onclick="auth()">LOG-IN</button>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span>OP: <span id="n-op"></span></span> <button onclick="logout()">SAIR</button></header>
    <div class="content">
        <div class="card">
            <div style="color:var(--s); font-size:10px; margin-bottom:10px;">ORDENS DE SEPARAÇÃO</div>
            <div id="list-op"></div>
        </div>
        <div id="reader"></div>
        <button class="btn btn-p" id="b-cam" onclick="toggleCam()" style="margin-top:10px;">LER CÓDIGO</button>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <select id="m-op" style="flex:2;"><option value="SAIDA">SAÍDA</option><option value="ENTRADA">ENTRADA</option></select>
            <input type="number" id="q-op" value="1" style="flex:1; text-align:center;">
        </div>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span>WMS SHARK</span> <button onclick="logout()">SAIR</button></header>
    <div class="content">
        <div class="card">
            <textarea id="inp-list" placeholder="CÓDIGO, QUANTIDADE" style="width:100%; background:#000; color:var(--s); border:1px solid #222; padding:10px;"></textarea>
            <button class="btn btn-s" onclick="sendOrder()" style="margin-top:5px; padding:10px;">ENVIAR PARA CAMPO</button>
        </div>
        
        <div style="display:flex; gap:5px; margin-bottom:15px;">
            <button class="btn btn-p" style="padding:10px;" onclick="ir('scr-base')">BASE DE ITENS</button>
            <button class="btn btn-p" style="padding:10px;" onclick="exportar()">EXPORTAR</button>
        </div>

        <div class="card">
            <table>
                <thead><tr><th>ITEM</th><th>SALDO</th><th>STATUS</th></tr></thead>
                <tbody id="tb-stock"></tbody>
            </table>
        </div>

        <div style="color:#444; font-size:10px; margin:15px 0 5px 0;">AUDITORIA DE MOVIMENTOS</div>
        <div class="card">
            <table id="tb-audit"></table>
        </div>
    </div>
</div>

<div id="scr-base" class="screen">
    <header><span>CADASTRO MESTRE</span> <button onclick="ir('scr-shark')">VOLTAR</button></header>
    <div class="content">
        <textarea id="imp-txt" style="width:100%; height:300px; background:#111; color:var(--p); border:1px solid #333;" placeholder="COD, NOME DO PRODUTO"></textarea>
        <button class="btn btn-p" onclick="saveBase()" style="margin-top:10px;">SALVAR BASE B18</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit, setDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const config = { apiKey: "AIzaSyDRDhONvvzZmo2csXksqHs6E6vV3MuvLSs", authDomain: "log-pro-jp.firebaseapp.com", projectId: "log-pro-jp", storageBucket: "log-pro-jp.firebasestorage.app", messagingSenderId: "481645607846", appId: "1:481645607846:web:fd55dd943718ad78386d67" };
    const app = initializeApp(config);
    const db = getFirestore(app);
    
    let BASE = JSON.parse(localStorage.getItem('JP_BASE')) || {};
    let user = localStorage.getItem('JP_USER') || "";
    let scan, cam = false;

    // Monitor de Ordens (Simplificado v73)
    onSnapshot(collection(db, "separacao"), (s) => {
        let h = ""; s.docs.forEach(d => {
            const p = d.data(); const f = p.qtd_p - p.qtd_f;
            if(f > 0) h += `<div class="line-item"><span>${p.nome}</span> <b style="color:var(--s)">FALTA ${f}</b></div>`;
        });
        document.getElementById('list-op').innerHTML = h || "SEM PENDÊNCIAS";
    });

    // Auditoria e Estoque
    onSnapshot(query(collection(db, "logs"), orderBy("data_hora", "desc"), limit(50)), (sn) => {
        const logs = sn.docs.map(d => d.data());
        let sld = {}; Object.keys(BASE).forEach(k => sld[k] = { n: BASE[k], s: 0 });
        let hA = "";
        logs.forEach(m => {
            if(sld[m.c]) m.t === 'ENTRADA' ? sld[m.c].s += m.q : sld[m.c].s -= m.q;
            hA += `<tr><td>${m.d_s}</td><td>${m.op}</td><td><span class="tag ${m.t==='ENTRADA'?'t-ent':'t-sai'}">${m.t}</span></td><td>${m.n}</td><td>${m.q}</td></tr>`;
        });
        document.getElementById('tb-audit').innerHTML = hA;
        document.getElementById('tb-stock').innerHTML = Object.keys(sld).map(k => `<tr><td>${sld[k].n}</td><td>${sld[k].s}</td><td><span class="tag ${sld[k].s>0?'t-ent':'t-sai'}">${sld[k].s>0?'OK':'OFF'}</span></td></tr>`).join('');
    });

    window.bipe = async (cod) => {
        let c = cod.trim(); const q = parseInt(document.getElementById('q-op').value) || 1;
        const m = document.getElementById('m-op').value;
        if(!BASE[c]) { const n = prompt("NOME:"); if(n) BASE[c]=n.toUpperCase(); else return; }
        
        await addDoc(collection(db, "logs"), { c, n: BASE[c], t: m, q, op: user, data_hora: serverTimestamp(), d_s: new Date().toLocaleTimeString() });
        if(m === "SAIDA") {
            const r = doc(db, "separacao", c); const d = await getDoc(r);
            if(d.exists()) await updateDoc(r, { qtd_f: d.data().qtd_f + q });
        }
        localStorage.setItem('JP_BASE', JSON.stringify(BASE));
    };

    window.sendOrder = async () => {
        const lines = document.getElementById('inp-list').value.split('\n');
        for(let l of lines) {
            const [c, q] = l.split(',');
            if(c && q) await setDoc(doc(db, "separacao", c.trim()), { cod: c.trim(), nome: BASE[c.trim()] || "ITEM "+c, qtd_p: parseInt(q), qtd_f: 0 });
        }
        alert("ENVIADO!"); document.getElementById('inp-list').value = "";
    };

    window.auth = () => {
        const u = document.getElementById('user').value.toUpperCase();
        const p = document.getElementById('pass').value;
        if((u==="JP"||u==="SHARK")&&p==="9910" || (u==="OP"&&p==="1234")) { user=u; localStorage.setItem('JP_USER', u); location.reload(); }
    };

    window.toggleCam = async () => {
        if(!cam) { scan = new Html5Qrcode("reader"); await scan.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (t)=>bipe(t)); cam=true; }
        else { await scan.stop(); cam=false; }
    };

    window.saveBase = () => {
        document.getElementById('imp-txt').value.split('\n').forEach(l => { const d = l.split(','); if(d[0] && d[1]) BASE[d[0].trim()] = d[1].trim().toUpperCase(); });
        localStorage.setItem('JP_BASE', JSON.stringify(BASE)); alert("BASE ATUALIZADA!");
    };

    window.ir = (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); };
    window.logout = () => { localStorage.clear(); location.reload(); };
    window.exportar = () => { window.print(); };
    window.init = () => { if(user) { ir(user === 'OP' ? 'scr-op' : 'scr-shark'); document.getElementById('n-op').innerText = user; } };
</script>
</body>
    </html>
