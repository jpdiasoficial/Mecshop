<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v102 | SHARK HIERARCHY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #00ff41; --s: #007aff; --bg: #000; --sf: #0a0a0a; --brd: #1a1a1a; --dg: #ff3b30; --w: #ffae00; }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; font-size: 11px; height: 100vh; overflow: hidden; text-transform: uppercase; }
        .screen { display: none; height: 100vh; flex-direction: column; }
        .active-screen { display: flex !important; }
        header { padding: 15px; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #000; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px 15px 100px 15px; }
        .card { background: var(--sf); border: 1px solid var(--brd); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        h3 { font-family: 'Orbitron'; font-size: 9px; color: var(--p); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-left: 3px solid var(--p); padding-left: 8px; }
        input, select { width: 100%; padding: 14px; background: #050505; border: 1px solid #222; color: #fff; border-radius: 8px; font-size: 11px; margin-bottom: 10px; font-weight: 700; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: var(--s); color: #fff; }
        .btn-d { background: var(--dg); color: #fff; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .kpi-box { background: #0a0a0a; border: 1px solid #222; padding: 10px 5px; border-radius: 8px; text-align: center; }
        .kpi-box span { font-family: 'Orbitron'; font-size: 14px; color: var(--p); display: block; }
        .bottom-nav { display: none; background: #000; border-top: 2px solid var(--brd); position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-size: 8px; font-weight: 800; gap: 4px; }
        .active-tab { color: var(--p); border-top: 3px solid var(--p); background: #050505; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 9px; }
        .log-table td { padding: 12px 5px; border-bottom: 1px solid #111; }
        .pill { padding: 3px 6px; border-radius: 4px; font-weight: 900; font-size: 7px; color: #000; }
    </style>
</head>
<body onload="inicializarApp()">

    <div id="tela-login" class="screen active-screen" style="justify-content:center; padding:40px;">
        <h1 style="font-family:'Orbitron'; color:var(--p); text-align:center; font-size:35px; letter-spacing: -2px;">LOG-PRO</h1>
        <p style="color:#555; font-size:8px; text-align:center; margin-bottom:40px; letter-spacing: 2px;">SISTEMA OPERACIONAL HIERÁRQUICO</p>
        <button class="btn btn-p" onclick="login('shark')" style="margin-bottom:12px;"><i class="fa-solid fa-crown"></i> ACESSO SHARK</button>
        <button class="btn btn-s" onclick="login('operador')" style="margin-bottom:12px;"><i class="fa-solid fa-barcode"></i> ACESSO OPERADOR</button>
        <button class="btn btn-d" onclick="login('motorista')"><i class="fa-solid fa-truck"></i> ACESSO MOTORISTA</button>
    </div>

    <div id="tela-shark" class="screen">
        <header><span>SHARK PANEL</span> <button onclick="location.reload()" style="background:none; border:none; color:var(--dg); font-family:'Orbitron'; font-size:9px;">SAIR</button></header>
        <div class="scroll-area">
            <div class="kpi-grid">
                <div class="kpi-box"><span id="kpi-ent">0</span><small>ENT</small></div>
                <div class="kpi-box"><span id="kpi-sep">0</span><small>SEP</small></div>
                <div class="kpi-box"><span id="kpi-sai">0</span><small>SAI</small></div>
                <div class="kpi-box"><span id="kpi-est" style="color:var(--s)">0</span><small>SALDO</small></div>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-boxes-stacked"></i> INVENTÁRIO REAL</h3>
                <div id="estoque-detalhado"></div>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-terminal"></i> COMANDO CENTRAL</h3>
                <input type="text" id="cmd-ean" placeholder="EAN">
                <input type="number" id="cmd-qtd" placeholder="QTD">
                <button class="btn btn-p" onclick="lancarOrdem()">GERAR ORDEM SEPARAÇÃO</button>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-database"></i> CONFIGURAÇÃO SKU</h3>
                <input type="text" id="cad-ean" placeholder="EAN NOVO">
                <input type="text" id="cad-nome" placeholder="NOME DO PRODUTO">
                <button class="btn btn-s" onclick="cadastrarManual()">SALVAR NO BANCO</button>
                <button class="btn btn-d" onclick="limparTudo()" style="margin-top:10px; height:30px; font-size:8px;">LIMPAR TODO O SISTEMA</button>
            </div>
        </div>
    </div>

    <div id="tela-operador" class="screen">
        <header><span>OPERADOR</span></header>
        <div class="scroll-area">
            <div class="card">
                <div id="reader-op" style="width:100%; min-height:160px; background:#000; border:2px solid var(--p); display:none; margin-bottom:10px;"></div>
                <button class="btn btn-p" id="btn-cam" onclick="toggleCam()">ABRIR SCANNER</button>
            </div>
            <div class="card">
                <h3>AÇÃO DE ARMAZÉM</h3>
                <select id="op-tipo">
                    <option value="ENTRADA">📥 ENTRADA</option>
                    <option value="SEPARACAO">📦 SEPARAÇÃO</option>
                    <option value="SAIDA">🚚 SAÍDA</option>
                </select>
                <input type="text" id="ean-op" placeholder="EAN MANUAL">
                <button class="btn btn-s" onclick="confirmarBip()">REGISTRAR BIP</button>
            </div>
            <div class="card">
                <h3>MEU HISTÓRICO</h3>
                <table class="log-table"><tbody id="tabela-logs"></tbody></table>
            </div>
        </div>
    </div>

    <div id="tela-motorista" class="screen">
        <header><span>MOTORISTA</span></header>
        <div class="scroll-area">
            <div class="card" id="card-rota">
                <h3>ENTREGAS ATIVAS</h3>
                <p style="opacity:0.3; text-align:center; padding:20px;">NENHUM ROMANEIO DISPONÍVEL</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav" id="nav-principal">
        <div class="nav-item" id="nav-shark" onclick="navegar('tela-shark', this)"><i class="fa-solid fa-crown"></i>SHARK</div>
        <div class="nav-item" id="nav-op" onclick="navegar('tela-operador', this)"><i class="fa-solid fa-barcode"></i>OP</div>
        <div class="nav-item" id="nav-mot" onclick="navegar('tela-motorista', this)"><i class="fa-solid fa-truck"></i>ROTA</div>
    </div>

    <script>
        // LÓGICA CORE (MESMA DO INÍCIO)
        let logs = JSON.parse(localStorage.getItem('L95') || '[]');
        let produtos = JSON.parse(localStorage.getItem('P95') || '{}');
        let ordens = JSON.parse(localStorage.getItem('O95') || '[]');
        let html5QrCode, camAtiva = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function bip(sucesso = true) {
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.frequency.value = sucesso ? 880 : 220;
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function inicializarApp() { renderizarTudo(); }

        function login(role) {
            document.getElementById('tela-login').classList.remove('active-screen');
            document.getElementById('nav-principal').style.display = 'flex';
            
            // ESCONDE ABAS CONFORME HIERARQUIA
            document.getElementById('nav-shark').style.display = (role === 'shark') ? 'flex' : 'none';
            document.getElementById('nav-op').style.display = (role === 'shark' || role === 'operador') ? 'flex' : 'none';
            document.getElementById('nav-mot').style.display = (role === 'shark' || role === 'motorista') ? 'flex' : 'none';

            let destino = 'tela-' + role;
            let navAlvo = document.getElementById('nav-' + (role === 'operador' ? 'op' : role === 'motorista' ? 'mot' : 'shark'));
            navegar(destino, navAlvo);
        }

        function navegar(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-screen');
            el.classList.add('active-tab');
            renderizarTudo();
        }

        // --- INTELIGÊNCIA EM TEMPO REAL ---
        function confirmarBip(eanLido = null) {
            let ean = eanLido || document.getElementById('ean-op').value;
            if(!ean) return;

            if(!produtos[ean]) {
                let n = prompt("SKU DESCONHECIDO! NOME:");
                if(n) { produtos[ean] = n; localStorage.setItem('P95', JSON.stringify(produtos)); } else return;
            }

            let tipo = document.getElementById('op-tipo').value;
            let qtd = prompt(`QTD PARA ${tipo}:`, "1");
            
            if(qtd) {
                bip(true);
                logs.unshift({ data: new Date().toLocaleString(), tipo: tipo, info: `${produtos[ean]} (${ean}) | QTD: ${qtd}` });
                localStorage.setItem('L95', JSON.stringify(logs.slice(0, 500)));
                renderizarTudo();
                document.getElementById('ean-op').value = "";
            }
        }

        function renderizarTudo() {
            let h="", ent=0, sep=0, sai=0, estTotal=0, saldos={};

            logs.forEach(l => {
                let q = parseInt(l.info.split('QTD: ')[1]) || 0;
                let nome = l.info.split(' (')[0];
                saldos[nome] = saldos[nome] || 0;

                if(l.tipo === 'ENTRADA') { ent += q; estTotal += q; saldos[nome] += q; }
                if(l.tipo === 'SEPARACAO') { sep += q; estTotal -= q; saldos[nome] -= q; }
                if(l.tipo === 'SAIDA') { sai += q; }

                let cor = l.tipo === 'ENTRADA' ? '#007aff' : l.tipo === 'SEPARACAO' ? '#ffae00' : '#00ff41';
                h += `<tr><td>${l.data.split(' ')[1]}</td><td><span class="pill" style="background:${cor}">${l.tipo}</span></td><td>${l.info}</td></tr>`;
            });

            // DASHBOARD SHARK
            if(document.getElementById('kpi-ent')) {
                document.getElementById('kpi-ent').innerText = ent;
                document.getElementById('kpi-sep').innerText = sep;
                document.getElementById('kpi-sai').innerText = sai;
                document.getElementById('kpi-est').innerText = estTotal;
            }

            // LISTA DE ESTOQUE SKU (SHARK)
            let estHtml = "";
            for(let p in saldos) {
                if(saldos[p] !== 0) estHtml += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #111;"><span>${p}</span><b style="color:var(--p)">${saldos[p]} UN</b></div>`;
            }
            if(document.getElementById('estoque-detalhado')) document.getElementById('estoque-detalhado').innerHTML = estHtml || "ARMAZÉM VAZIO";
            
            // LOGS OPERADOR
            if(document.getElementById('tabela-logs')) document.getElementById('tabela-logs').innerHTML = h;
        }

        function toggleCam() {
            if(!camAtiva) {
                document.getElementById('reader-op').style.display='block';
                html5QrCode = new Html5Qrcode("reader-op");
                html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => { confirmarBip(txt); toggleCam(); });
                document.getElementById('btn-cam').innerText="PARAR"; camAtiva=true;
            } else {
                html5QrCode.stop().then(() => { document.getElementById('reader-op').style.display='none'; camAtiva=false; document.getElementById('btn-cam').innerText="ABRIR SCANNER"; });
            }
        }

        function cadastrarManual() {
            let e = document.getElementById('cad-ean').value;
            let n = document.getElementById('cad-nome').value;
            if(e && n) { produtos[e] = n; localStorage.setItem('P95', JSON.stringify(produtos)); renderizarTudo(); alert("SKU SALVO!"); }
        }

        function limparTudo() { if(confirm("Deseja resetar todo o estoque e logs?")) { localStorage.clear(); location.reload(); } }

        window.addEventListener('storage', () => {
            logs = JSON.parse(localStorage.getItem('L95') || '[]');
            produtos = JSON.parse(localStorage.getItem('P95') || '{}');
            renderizarTudo();
        });
    </script>
</body>
</html>
