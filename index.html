<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO | SISTEMA JP</title>
    <style>
        :root { --neon: #00ff41; --bg: #000; --gold: #ffae00; --blue: #007aff; --red: #ff3b30; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; text-transform: uppercase; overflow-x: hidden; }
        
        /* TELAS E LOGIN */
        .tela { display: none; padding: 20px; min-height: 100vh; }
        #tela-login { display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #111, #000); }
        
        /* CABEÇALHO COM BOTÃO SAIR */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
        .btn-sair { background: var(--red); color: #fff; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 10px; }

        /* BOTÕES DE COMANDO */
        .btn-menu { width: 90%; padding: 20px; margin: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn-acao { width: 100%; padding: 25px; margin: 10px 0; border-radius: 10px; font-weight: bold; font-size: 12px; border: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .btn-acao:active { transform: scale(0.98); background: #222; }

        /* QUADROS DE INFORMAÇÃO */
        .quadro { background: #080808; border: 1px solid #1a1a1a; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        .titulo-quadro { font-size: 10px; color: #555; margin-bottom: 8px; display: block; border-bottom: 1px solid #111; }
        .item-lista { display: flex; justify-content: space-between; font-size: 11px; padding: 8px 0; border-bottom: 1px solid #0d0d0d; }

        /* LANTERNA FLUTUANTE (SÓ NO BIPE) */
        #btn-flash { position: fixed; bottom: 30px; right: 30px; width: 75px; height: 75px; background: var(--gold); border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 35px; z-index: 1000; border: none; box-shadow: 0 0 25px var(--gold); color: #000; }
    </style>
</head>
<body onload="atualizarTudo()">

<div id="tela-login" class="tela" style="display: flex;">
    <h1 style="color: var(--neon); letter-spacing: 8px; margin-bottom: 40px;">LOG-PRO</h1>
    <button class="btn-menu" style="background: var(--neon); color: #000;" onclick="irPara('dono')">👑 DONO (JP)</button>
    <button class="btn-menu" style="background: var(--blue); color: #fff;" onclick="irPara('shark')">🦈 SHARK (DIRETOR)</button>
    <button class="btn-menu" style="background: #222; color: #fff;" onclick="irPara('op')">📦 OPERACIONAL</button>
</div>

<div id="painel-dono" class="tela">
    <div class="header">
        <b style="color: var(--neon)">COMANDO JP</b>
        <button class="btn-sair" onclick="logout()">SAIR</button>
    </div>
    <button class="btn-acao" onclick="window.print()">🖨️ IMPRIMIR ROMANEIO / RELATÓRIO</button>
    <div class="quadro">
        <span class="titulo-quadro">AUDITORIA DE MOVIMENTOS (MÉTRICA)</span>
        <div id="logs-jp"></div>
    </div>
</div>

<div id="painel-shark" class="tela">
    <div class="header">
        <b style="color: var(--blue)">DIRETORIA SHARK</b>
        <button class="btn-sair" onclick="logout()">SAIR</button>
    </div>
    <button class="btn-acao" style="border-color: var(--blue);" onclick="criarDemanda()">📋 LANÇAR NOVA DEMANDA / ROTA</button>
    <div class="quadro">
        <span class="titulo-quadro">PENDÊNCIAS DO DIA</span>
        <div id="demandas-shark"></div>
    </div>
</div>

<div id="painel-op" class="tela">
    <div class="header">
        <b>OPERAÇÃO GALPÃO</b>
        <button class="btn-sair" onclick="logout()">SAIR</button>
    </div>
    <button class="btn-acao" style="background: #001a00; color: var(--neon); border-color: var(--neon);" onclick="processoBipe('ENTRADA')">📥 RECEBIMENTO (BIPAR)</button>
    <button class="btn-acao" style="background: #1a0000; color: var(--red); border-color: var(--red);" onclick="processoBipe('SAIDA')">🚀 EXPEDIÇÃO (BIPAR)</button>
    <div class="quadro">
        <span class="titulo-quadro">MINHA LISTA DE TAREFAS</span>
        <div id="demandas-op"></div>
    </div>
</div>

<button id="btn-flash" onclick="toggleFlash()">🔦</button>

<script>
    // Banco de Dados Local (Simulado para teste, integra com Firebase depois)
    let PRODUTOS = JSON.parse(localStorage.getItem('DB_PROD')) || {};
    let MOVS = JSON.parse(localStorage.getItem('DB_MOVS')) || [];
    let DEMANDAS = JSON.parse(localStorage.getItem('DB_DEM')) || [];

    function irPara(nivel) {
        document.querySelectorAll('.tela').forEach(t => t.style.display = 'none');
        document.getElementById('painel-' + nivel).style.display = 'block';
    }

    function logout() { location.reload(); }

    // FUNÇÃO DO OPERADOR (SCANNER + LANTERNA + CADASTRO)
    async function processoBipe(tipo) {
        document.getElementById('btn-flash').style.display = 'flex';
        let sku = prompt("AGUARDANDO LEITURA DO SCANNER (SKU/LOTE):");
        
        if(!sku) { finalizarBipe(); return; }

        // AUTO-CADASTRO (Se não existir no sistema)
        if(!PRODUTOS[sku]) {
            let nome = prompt("⚠️ PRODUTO NÃO CADASTRADO! DIGITE O NOME PARA REGISTRAR:");
            if(nome) {
                PRODUTOS[sku] = nome.toUpperCase();
                localStorage.setItem('DB_PROD', JSON.stringify(PRODUTOS));
            } else { finalizarBipe(); return; }
        }

        let qtd = prompt(`QUANTIDADE PARA ${PRODUTOS[sku]}:`);
        if(qtd) {
            MOVS.push({sku, nome: PRODUTOS[sku], qtd, tipo, hora: new Date().toLocaleTimeString()});
            localStorage.setItem('DB_MOVS', JSON.stringify(MOVS));
            alert("BIPE CONFIRMADO NO ARMAZÉM!");
            atualizarTudo();
        }
        finalizarBipe();
    }

    function finalizarBipe() { document.getElementById('btn-flash').style.display = 'none'; }

    // FUNÇÃO DO SHARK (LANÇAR)
    function criarDemanda() {
        let rota = prompt("QUAL A ROTA OU ROMANEIO?");
        let sku = prompt("QUAL O SKU?");
        let qtd = prompt("QUAL A QUANTIDADE?");
        if(rota && sku && qtd) {
            DEMANDAS.push({rota, sku, qtd, status: 'PENDENTE'});
            localStorage.setItem('DB_DEM', JSON.stringify(DEMANDAS));
            atualizarTudo();
        }
    }

    function atualizarTudo() {
        // Atualiza a visão do Shark e Op
        let h = "";
        DEMANDAS.forEach(d => {
            h += `<div class="item-lista"><span>${d.rota} | ${d.sku}</span><b>${d.qtd} UN</b></div>`;
        });
        document.getElementById('demandas-shark').innerHTML = h || "NENHUMA ROTA ATIVA";
        document.getElementById('demandas-op').innerHTML = h || "LISTA VAZIA";

        // Atualiza Logs do JP
        let m = "";
        MOVS.slice(-10).reverse().forEach(log => {
            m += `<div class="item-lista" style="color:#666">${log.hora} - ${log.tipo}: ${log.nome} (${log.qtd})</div>`;
        });
        document.getElementById('logs-jp').innerHTML = m || "SEM MOVIMENTAÇÃO";
    }

    // LANTERNA (API Flash)
    let flashAtivo = false;
    async function toggleFlash() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
            const track = stream.getVideoTracks()[0];
            flashAtivo = !flashAtivo;
            await track.applyConstraints({advanced: [{torch: flashAtivo}]});
        } catch(e) { alert("LANTERNA INDISPONÍVEL"); }
    }
</script>
</body>
</html>
