<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v98 | SHARK COMMAND</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #00ff41; --s: #007aff; --bg: #000; --sf: #0a0a0a; --brd: #1a1a1a; --dg: #ff3b30; --w: #ffae00; }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; font-size: 11px; height: 100vh; overflow: hidden; text-transform: uppercase; }
        .screen { display: none; height: 100vh; flex-direction: column; }
        .active-screen { display: flex !important; }
        header { padding: 15px; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #000; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px 15px 100px 15px; }
        .card { background: var(--sf); border: 1px solid var(--brd); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        h3 { font-family: 'Orbitron'; font-size: 9px; color: var(--p); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-left: 3px solid var(--p); padding-left: 8px; }
        input, select { width: 100%; padding: 14px; background: #050505; border: 1px solid #222; color: #fff; border-radius: 8px; font-size: 11px; margin-bottom: 10px; font-weight: 700; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: var(--s); color: #fff; }
        .btn-d { background: var(--dg); color: #fff; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .kpi-box { background: #0a0a0a; border: 1px solid #222; padding: 10px 5px; border-radius: 8px; text-align: center; }
        .kpi-box span { font-family: 'Orbitron'; font-size: 14px; color: var(--p); display: block; }
        .bottom-nav { display: flex; background: #000; border-top: 2px solid var(--brd); position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-size: 8px; font-weight: 800; gap: 5px; }
        .active-tab { color: var(--p); border-top: 3px solid var(--p); background: #050505; }
        table { width: 100%; border-collapse: collapse; font-size: 9px; }
        td { padding: 12px 5px; border-bottom: 1px solid #111; }
        .pill { padding: 4px 6px; border-radius: 4px; font-weight: 900; font-size: 7px; color: #000; }
        .task-card { border-left: 4px solid var(--s); padding: 10px; background: #111; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body onload="inicializarApp()">

    <div id="tela-login" class="screen active-screen" style="justify-content:center; align-items:center; padding:40px;">
        <h1 style="font-family:'Orbitron'; color:var(--p); font-size:35px;">LOG-PRO</h1>
        <p style="color:#555; font-size:9px; margin-bottom:40px;">v98 | SHARK COMMAND CENTER</p>
        <input type="password" id="pin-acesso" placeholder="PIN" style="text-align:center;">
        <button class="btn btn-p" onclick="realizarLogin()">INICIAR OPERAÇÃO</button>
    </div>

    <div id="tela-shark" class="screen">
        <header><span>SHARK PANEL</span> <button onclick="location.reload()" class="btn-d" style="width:50px; height:20px; font-size:7px;">SAIR</button></header>
        <div class="scroll-area">
            <div class="kpi-grid">
                <div class="kpi-box"><span id="kpi-ent">0</span><small>ENT</small></div>
                <div class="kpi-box"><span id="kpi-sep">0</span><small>SEP</small></div>
                <div class="kpi-box"><span id="kpi-sai">0</span><small>SAI</small></div>
                <div class="kpi-box"><span id="kpi-est">0</span><small>ESTOQUE</small></div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-bullseye"></i> COMANDO CENTRAL (O.S)</h3>
                <input type="text" id="cmd-ean" placeholder="EAN DO PRODUTO">
                <input type="number" id="cmd-qtd" placeholder="QTD">
                <select id="cmd-tipo">
                    <option value="SEPARACAO">ORDEM DE SEPARAÇÃO</option>
                    <option value="SAIDA">ORDEM DE EXPEDIÇÃO</option>
                </select>
                <button class="btn btn-s" onclick="lancarOrdem()">DISPARAR COMANDO</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-microchip"></i> MONITOR DE ORDENS</h3>
                <div id="monitor-ordens"></div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-database"></i> CADASTRO SKU</h3>
                <input type="text" id="cad-ean" placeholder="EAN">
                <input type="text" id="cad-nome" placeholder="NOME PRODUTO">
                <button class="btn btn-p" onclick="cadastrarManual()">SALVAR</button>
                <button class="btn btn-d" style="margin-top:10px; font-size:7px; height:30px;" onclick="resetSistema()">RESET TOTAL</button>
            </div>
        </div>
    </div>

    <div id="tela-operador" class="screen">
        <header><span>OPERADOR</span></header>
        <div class="scroll-area">
            <div class="card">
                <div id="reader-op" style="width:100%; min-height:150px; background:#000; border:2px solid var(--p); display:none; margin-bottom:10px;"></div>
                <button class="btn btn-p" id="btn-cam-op" onclick="controleCamera()">ABRIR SCANNER</button>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-barcode"></i> BIPAGEM DIRETA</h3>
                <select id="op-tipo">
                    <option value="ENTRADA">📥 ENTRADA</option>
                    <option value="SEPARACAO">📦 SEPARAÇÃO</option>
                    <option value="SAIDA">🚚 SAÍDA</option>
                </select>
                <input type="text" id="ean-manual" placeholder="EAN MANUAL">
                <button class="btn btn-s" onclick="processarManual()">CONFIRMAR BIP</button>
            </div>
            <div class="card">
                <h3>LOGS RECENTES</h3>
                <table><tbody id="tabela-logs"></tbody></table>
            </div>
        </div>
    </div>

    <div class="bottom-nav" id="nav-principal" style="display:none;">
        <div class="nav-item active-tab" onclick="navegar('tela-shark', this)"><i class="fa-solid fa-shuttle-space"></i>SHARK</div>
        <div class="nav-item" onclick="navegar('tela-operador', this)"><i class="fa-solid fa-barcode"></i>OPERADOR</div>
    </div>

    <script>
        // MANTENDO A LÓGICA DE DADOS ORIGINAL
        let logs = JSON.parse(localStorage.getItem('L95') || '[]');
        let produtos = JSON.parse(localStorage.getItem('P95') || '{}');
        let ordens = JSON.parse(localStorage.getItem('O95') || '[]');
        let html5QrCode, isCameraOpen = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tocarBip(t) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(t === 'sucesso' ? 880 : 220, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        // AUTO-SYNC ENTRE ABAS (O segredo do tempo real)
        window.addEventListener('storage', () => {
            logs = JSON.parse(localStorage.getItem('L95') || '[]');
            produtos = JSON.parse(localStorage.getItem('P95') || '{}');
            ordens = JSON.parse(localStorage.getItem('O95') || '[]');
            renderizarTudo();
        });

        function inicializarApp() { renderizarTudo(); }
        function realizarLogin() { document.getElementById('tela-login').classList.remove('active-screen'); document.getElementById('nav-principal').style.display = 'flex'; navegar('tela-shark', document.querySelector('.nav-item')); }

        function navegar(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-screen');
            el.classList.add('active-tab');
            renderizarTudo();
        }

        // LÓGICA DE COMANDO (SHARK)
        function lancarOrdem() {
            let e = document.getElementById('cmd-ean').value;
            let q = document.getElementById('cmd-qtd').value;
            let t = document.getElementById('cmd-tipo').value;
            if(!produtos[e] || !q) return alert("SKU NÃO LOCALIZADO!");
            
            ordens.unshift({ id: Date.now(), ean: e, nome: produtos[e], qtd: q, tipo: t, status: 'PENDENTE' });
            localStorage.setItem('O95', JSON.stringify(ordens));
            tocarBip('sucesso');
            renderizarTudo();
            document.getElementById('cmd-ean').value = "";
            document.getElementById('cmd-qtd').value = "";
        }

        // LÓGICA DE EXECUÇÃO (OPERADOR)
        function handleBip(c) {
            tocarBip('sucesso');
            if(!produtos[c]) {
                let n = prompt("NOVO PRODUTO DETECTADO! NOME:");
                if(n) { produtos[c] = n; localStorage.setItem('P95', JSON.stringify(produtos)); } else return;
            }

            // Alerta de Comando do Shark
            let os = ordens.find(o => o.ean === c && o.status === 'PENDENTE');
            if(os) {
                if(confirm(`🚨 COMANDO SHARK ATIVO!\n${os.tipo}: ${os.qtd} UN de ${os.nome}\nEXECUTAR AGORA?`)) {
                    os.status = 'EM ANDAMENTO';
                    localStorage.setItem('O95', JSON.stringify(ordens));
                }
            }

            let t = document.getElementById('op-tipo').value;
            let q = prompt(`PRODUTO: ${produtos[c]}\nQTD PARA ${t}:`, "1");
            if(q) {
                logs.unshift({t: new Date().toLocaleString(), a: t, i: `${produtos[c]} (${c}) | QTD: ${q}`});
                localStorage.setItem('L95', JSON.stringify(logs.slice(0, 1000)));
                renderizarTudo();
            }
        }

        function renderizarTudo() {
            let h="", ent=0, sep=0, sai=0, est=0;
            // Processa Logs e KPIs
            logs.forEach(l => {
                let q = parseInt(l.i.split('QTD: ')[1]) || 0;
                if(l.a === 'ENTRADA') { ent += q; est += q; }
                else if(l.a === 'SEPARACAO') { sep += q; est -= q; }
                else if(l.a === 'SAIDA') { sai += q; }
                let cor = l.a === 'ENTRADA' ? '#007aff' : l.a === 'SEPARACAO' ? '#ffae00' : '#00ff41';
                h += `<tr><td>${l.t.split(' ')[1]}</td><td><span class="pill" style="background:${cor}">${l.a}</span></td><td>${l.i}</td></tr>`;
            });
            document.getElementById('tabela-logs').innerHTML = h;
            document.getElementById('kpi-ent').innerText = ent;
            document.getElementById('kpi-sep').innerText = sep;
            document.getElementById('kpi-sai').innerText = sai;
            document.getElementById('kpi-est').innerText = est;

            // Monitor de Ordens
            let oh = "";
            ordens.forEach(o => {
                let cor = o.status === 'PENDENTE' ? 'var(--w)' : 'var(--p)';
                oh += `<div class="task-card">
                        <div><b>${o.nome}</b><br><small>${o.qtd} UN | ${o.tipo}</small></div>
                        <span style="font-size:7px; padding:3px 6px; border-radius:3px; background:${cor}; color:#000; font-weight:900;">${o.status}</span>
                      </div>`;
            });
            document.getElementById('monitor-ordens').innerHTML = oh || "<p style='opacity:0.2; text-align:center;'>AGUARDANDO COMANDOS...</p>";
        }

        function cadastrarManual() {
            let e = document.getElementById('cad-ean').value;
            let n = document.getElementById('cad-nome').value;
            if(e && n) { produtos[e] = n; localStorage.setItem('P95', JSON.stringify(produtos)); renderizarTudo(); alert("SKU SALVO!"); }
        }

        function processarManual() { let e = document.getElementById('ean-manual').value; if(e) handleBip(e); document.getElementById('ean-manual').value=""; }
        function resetSistema() { if(confirm("LIMPAR TUDO?")) { localStorage.clear(); location.reload(); } }

        function controleCamera() {
            if(!isCameraOpen) {
                document.getElementById('reader-op').style.display = 'block';
                html5QrCode = new Html5Qrcode("reader-op");
                html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, handleBip);
                document.getElementById('btn-cam-op').innerText = "FECHAR CÂMERA"; isCameraOpen = true;
            } else {
                html5QrCode.stop().then(() => { document.getElementById('reader-op').style.display = 'none'; isCameraOpen = false; document.getElementById('btn-cam-op').innerText = "ABRIR CÂMERA"; });
            }
        }
    </script>
</body>
</html>
