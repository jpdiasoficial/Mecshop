<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | SUPREME ENTERPRISE V70</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --orange: #ff9f0a; --bg: #050505; --glass: rgba(30, 30, 30, 0.9); --green: #32d74b; --red: #ff453a; --blue: #007aff; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; text-transform: uppercase; overflow-x: hidden; }
        
        /* --- PORTAL DE ACESSO (HIERARQUIA) --- */
        #portal-entrada { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); }
        .btn-hierarquia { width: 300px; padding: 20px; margin: 10px; border: 1px solid rgba(255,255,255,0.1); background: var(--glass); color: #fff; border-radius: 15px; font-weight: 900; cursor: pointer; transition: 0.3s; letter-spacing: 2px; }
        .btn-hierarquia:hover { border-color: var(--orange); box-shadow: 0 0 20px rgba(255, 159, 10, 0.2); }

        /* --- LOBBY (MENU PRINCIPAL) --- */
        #lobby { display: none; padding: 20px; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .menu-item { background: var(--glass); padding: 40px 20px; border-radius: 20px; border: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .menu-item:hover { border-color: var(--orange); transform: scale(1.02); }

        /* --- MÓDULOS ESPECÍFICOS --- */
        .modulo { display: none; padding: 15px; }
        .card { background: var(--glass); border-radius: 15px; padding: 20px; border-top: 4px solid var(--orange); margin-bottom: 15px; }
        .btn-op { width: 100%; padding: 18px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--orange); background: transparent; color: var(--orange); font-weight: 900; cursor: pointer; }
        .btn-op:active { background: var(--orange); color: #000; }
        
        /* --- MONITORAMENTO & LOGS --- */
        .logs { background: #000; color: var(--green); font-family: 'Roboto Mono', monospace; height: 150px; overflow-y: scroll; padding: 15px; font-size: 11px; border: 1px solid #222; border-radius: 10px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #222; }
        .mic-on { color: var(--red); font-size: 10px; font-weight: bold; animation: pulse 1s infinite; display: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="portal-entrada">
    <h1 style="font-family:'Orbitron'; color:var(--orange); margin-bottom:40px; letter-spacing:5px;">JP DIAS CORE</h1>
    <button class="btn-hierarquia" onclick="login('SHARK')">DONO / SHARK</button>
    <button class="btn-hierarquia" onclick="login('ADMIN')">ADMIN / RH</button>
    <button class="btn-hierarquia" onclick="login('OPERACIONAL')">OPERACIONAL</button>
</div>

<div id="lobby">
    <header>
        <button onclick="logout()" style="background:none; border:none; color:#666; cursor:pointer;">⬅ SAIR</button>
        <div id="status-user" style="color:var(--orange); font-weight:900;">GESTOR: ---</div>
    </header>
    <h2 style="margin-top:40px; font-family:'Orbitron';">SELECIONE O MÓDULO</h2>
    <div class="menu-grid">
        <div class="menu-item" onclick="abrirMod('ARMAZEM')">📦 ARMAZÉM<br><small style="color:#666">WMS & ESTOQUE</small></div>
        <div class="menu-item" onclick="abrirMod('CROSSDOCK')">⚡ CROSS DOCK<br><small style="color:#666">TRIAGEM & CARGA</small></div>
    </div>
</div>

<div id="mod-armazem" class="modulo">
    <header><button onclick="voltarLobby()">⬅ LOBBY</button> <span>ARMAZÉM WMS</span></header>
    <div class="card">
        <button class="btn-op" onclick="fluxoWMS()">INICIAR PICKING VOZ</button>
        <button class="btn-op" style="border-color:var(--red); color:var(--red);" onclick="fAvaria()">REGISTRAR AVARIA</button>
    </div>
    <div class="logs" id="logWMS">> AGUARDANDO BIPI...</div>
</div>

<div id="mod-crossdock" class="modulo">
    <header><button onclick="voltarLobby()">⬅ LOBBY</button> <span>CROSS DOCK FLOW</span></header>
    <div class="card">
        <button class="btn-op" onclick="fluxoDoca()">TRIAGEM DE DOCA</button>
        <button class="btn-op" style="border-color:#fff; color:#fff;" onclick="fMonitor()">MONITORAR MOTORISTAS</button>
    </div>
    <div class="logs" id="logCross">> MONITORAMENTO DE CARGA ATIVO...</div>
</div>

<div id="mod-gestor" class="modulo">
    <header><button onclick="voltarLobby()">⬅ LOBBY</button> <span>TORRE DE COMANDO</span></header>
    <div class="card" style="border-color:var(--green)">
        <h3>AUDITORIA EM TEMPO REAL</h3>
        <div class="logs" id="logShark" style="height:250px;">> BUSCANDO DADOS DO GALPÃO...</div>
        <button class="btn-op" style="margin-top:15px; border-color:var(--green); color:var(--green);" onclick="fAuditar()">AUDITAR TODOS OS PROCESSOS</button>
    </div>
</div>

<div id="mic" class="mic-on" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%);">🎙 ESCUTANDO "OK"...</div>

<script>
    let cargo = "";
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'pt-BR';

    function falar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'pt-BR';
        m.rate = 1.1;
        m.onend = () => { startMic(); };
        window.speechSynthesis.speak(m);
    }

    function startMic() {
        document.getElementById('mic').style.display = 'block';
        recognition.start();
    }

    recognition.onresult = (e) => {
        const voz = e.results[0][0].transcript.toLowerCase();
        if(voz.includes("ok")) {
            falar("Confirmado. Prosseguindo etapa.");
            addLog("VOZ: OPERADOR CONFIRMOU OK.");
        }
        document.getElementById('mic').style.display = 'none';
    };

    function login(tipo) {
        if(tipo !== 'OPERACIONAL') {
            let p = prompt("SENHA DE ACESSO HIERÁRQUICO:");
            if(p !== "123") return;
        }
        cargo = tipo;
        document.getElementById('portal-entrada').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('status-user').innerText = `ACESSO: ${tipo}`;
        falar(`Bem vindo ao sistema JP Dias. Modo ${tipo} ativado.`);
    }

    function abrirMod(mod) {
        document.getElementById('lobby').style.display = 'none';
        if(cargo === 'SHARK' || cargo === 'ADMIN') {
            document.getElementById('mod-gestor').style.display = 'block';
            addLog(`SISTEMA: ${cargo} ACESSOU A TORRE DE COMANDO.`);
        } else {
            if(mod === 'ARMAZEM') document.getElementById('mod-armazem').style.display = 'block';
            if(mod === 'CROSSDOCK') document.getElementById('mod-crossdock').style.display = 'block';
        }
    }

    // FLUXO ARMAZÉM PASSO A PASSO
    function fluxoWMS() {
        falar("Iniciando Picking. Rua B. Confirme os 3 dígitos do produto.");
        let r = prompt("RUA B - DIGITE O CÓDIGO:");
        if(r) {
            falar("Código validado. Nível 2. Diga OK para finalizar.");
            addLog(`WMS: ITEM ${r} SEPARADO COM SUCESSO.`);
        }
    }

    // FLUXO CROSSDOCK MOTORISTAS
    function fluxoDoca() {
        falar("Triagem doca 4. Identifique o motorista e o manifesto.");
        let m = prompt("NOME DO MOTORISTA / MANIFESTO:");
        addLog(`CROSS: MOTORISTA ${m} EM CARREGAMENTO.`);
    }

    function addLog(msg) {
        const agora = new Date().toLocaleTimeString();
        const texto = `> [${agora}] ${msg}<br>`;
        document.getElementById('logWMS').innerHTML += texto;
        document.getElementById('logCross').innerHTML += texto;
        document.getElementById('logShark').innerHTML += texto;
    }

    function voltarLobby() {
        document.querySelectorAll('.modulo').forEach(m => m.style.display = 'none');
        document.getElementById('lobby').style.display = 'block';
    }

    function logout() { location.reload(); }
</script>

</body>
</html>
