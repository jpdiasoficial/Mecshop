<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HG MOTORS | DIAMOND EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37; --platinum: #E5E4E2; --bg: #030303;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-gold: rgba(212, 175, 55, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; letter-spacing: -0.02em; }

        /* HEADER DIAMOND */
        header {
            position: fixed; top: 0; width: 100%; z-index: 2000; padding: 25px;
            background: linear-gradient(to bottom, rgba(3,3,3,0.9), transparent);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }
        .logo-box img { height: 45px; filter: drop-shadow(0 0 15px var(--neon-gold)); }

        /* HERO VISUAL SECTION */
        .hero-visual {
            height: 100vh; width: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, var(--bg) 80%);
            position: relative; overflow: hidden;
        }
        .hero-visual::before {
            content: ''; position: absolute; top: -50%; width: 200%; height: 200%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.05; animation: rotate 60s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .hero-content h2 { font-size: 10vw; font-weight: 800; line-height: 0.9; text-transform: uppercase; margin-bottom: 10px; background: linear-gradient(180deg, #fff 0%, #444 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-content p { font-size: 14px; letter-spacing: 5px; color: var(--gold); font-weight: 300; text-transform: uppercase; }

        /* CATEGORIAS FLOATING */
        .floating-nav {
            display: flex; gap: 15px; padding: 30px 20px; overflow-x: auto;
            scrollbar-width: none; position: relative; z-index: 10;
        }
        .floating-nav::-webkit-scrollbar { display: none; }
        .nav-item {
            min-width: 120px; height: 160px; background: var(--glass-bg);
            border: 1px solid var(--glass-border); border-radius: 30px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .nav-item.active { background: #fff; border-color: #fff; transform: translateY(-10px); }
        .nav-item i { font-size: 24px; color: var(--gold); margin-bottom: 15px; transition: 0.3s; }
        .nav-item.active i { color: #000; }
        .nav-item span { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #555; }
        .nav-item.active span { color: #000; }

        /* VITRINE DE LUXO */
        .lux-feed { padding: 40px 20px; display: grid; grid-template-columns: 1fr; gap: 40px; max-width: 800px; margin: 0 auto; }
        
        .lux-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 40px; padding: 10px; position: relative;
            transition: 0.5s;
        }
        .lux-card:hover { transform: scale(1.02); border-color: var(--gold); }

        .lux-img-box {
            width: 100%; height: 400px; border-radius: 32px; overflow: hidden;
            position: relative;
        }
        .lux-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .lux-badge {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 10px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
            font-size: 11px; font-weight: 700;
        }

        .lux-info { padding: 30px 20px; }
        .lux-brand { color: var(--gold); font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .lux-title { font-size: 32px; font-weight: 800; margin: 5px 0 20px; line-height: 1; }
        
        .lux-price-tag {
            background: #fff; color: #000; padding: 25px; border-radius: 25px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .lux-price-tag .val { font-size: 30px; font-weight: 800; }
        .lux-price-tag .label { font-size: 10px; font-weight: 700; text-transform: uppercase; opacity: 0.5; }

        .lux-btn {
            margin-top: 15px; width: 100%; background: var(--bg); color: #fff;
            padding: 22px; border-radius: 25px; border: 1px solid var(--glass-border);
            font-weight: 800; text-transform: uppercase; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s; cursor: pointer;
        }
        .lux-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }

    </style>
</head>
<body onload="render('TODOS')">

    <header>
        <div class="logo-box"><img src="5565.png" alt="HG LOGO"></div>
        <div class="menu-trigger" style="color: var(--gold);"><i class="fa-solid fa-ellipsis-vertical"></i></div>
    </header>

    <section class="hero-visual">
        <div class="hero-content">
            <p>Selection & Luxury</p>
            <h2>HG MOTORS</h2>
            <p style="color: #fff; letter-spacing: 2px; margin-top: 10px; opacity: 0.5;">Sinta a Experiência Diamond</p>
        </div>
    </section>

    <div class="floating-nav">
        <div class="nav-item active" onclick="tab(this, 'TODOS')"><i class="fa-solid fa-chess-king"></i><span>Elite</span></div>
        <div class="nav-item" onclick="tab(this, 'SEDAN')"><i class="fa-solid fa-car-side"></i><span>Sedans</span></div>
        <div class="nav-item" onclick="tab(this, 'SUV')"><i class="fa-solid fa-shuttle-space"></i><span>SUVs</span></div>
        <div class="nav-item" onclick="tab(this, 'MOTO')"><i class="fa-solid fa-bolt"></i><span>Motos</span></div>
    </div>

    <main class="lux-feed" id="main-vitrine"></main>

    <script>
        const estoque = [
            { cat: 'SEDAN', marca: 'BMW', nome: '320i M Sport', preco: '249.900', img: '5739.jpg', specs: 'Carbon Fiber Interior' },
            { cat: 'SUV', marca: 'JEEP', nome: 'Compass Longitude', preco: '158.900', img: '5743.jpg', specs: 'Diesel High Torque' },
            { cat: 'SEDAN', marca: 'HONDA', nome: 'Civic G10 EXL', preco: '119.900', img: '5745.jpg', specs: 'Perfect Conditions' },
            { cat: 'SUV', marca: 'CHEVROLET', nome: 'Equinox Premier', preco: '145.900', img: '5746.jpg', specs: 'Full AWD System' },
            { cat: 'MOTO', marca: 'HONDA', nome: 'CB 500X', preco: '38.500', img: '5740.jpg', specs: 'Adventure Ready' }
        ];

        function render(f) {
            const vitrine = document.getElementById('main-vitrine');
            const lista = f === 'TODOS' ? estoque : estoque.filter(v => v.cat === f);
            
            vitrine.innerHTML = lista.map(v => `
                <article class="lux-card">
                    <div class="lux-img-box">
                        <img src="${v.img}" alt="${v.nome}" loading="lazy">
                        <div class="lux-badge">${v.specs}</div>
                    </div>
                    <div class="lux-info">
                        <span class="lux-brand">${v.marca} // PREMIUM</span>
                        <h3 class="lux-title">${v.nome}</h3>
                        
                        <div class="lux-price-tag">
                            <div>
                                <span class="label">Investment</span>
                                <span class="val">R$ ${v.preco}</span>
                            </div>
                            <i class="fa-solid fa-arrow-up-right-from-square" style="opacity: 0.2"></i>
                        </div>
                        
                        <button class="lux-btn" onclick="window.open('https://wa.me/5519999999999')">
                            <i class="fa-brands fa-whatsapp"></i> Reserve esta Unidade
                        </button>
                    </div>
                </article>
            `).join('');
        }

        function tab(el, cat) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            render(cat);
            window.scrollTo({ top: window.innerHeight + 100, behavior: 'smooth' });
        }
    </script>
</body>
</html>
