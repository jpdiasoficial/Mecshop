<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MecShop Corporate v10</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ea1d2c; --gold: #c5a059; --dark: #0d0d0d; --card: #1a1a1a; --nu: #820ad1; --green: #25d366; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        
        .screen { display: none; height: 100vh; flex-direction: column; animation: fadeIn 0.3s ease; }
        .active { display: flex !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* HEADER ESTILO CORPORATE */
        header { padding: 18px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .logo-text { font-family: 'Orbitron'; color: #fff; font-size: 13px; letter-spacing: 1px; }

        /* HUB - GRID IGUAL À IMAGEM */
        .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; overflow-y: auto; }
        .hub-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #333; text-align: center; cursor: pointer; transition: 0.2s; }
        .hub-card:active { transform: scale(0.95); border-color: var(--red); }
        .hub-card i { font-size: 30px; display: block; margin-bottom: 10px; }
        .hub-card span { font-family: 'Orbitron'; font-size: 9px; color: #fff; }

        /* SELETOR DE MODO (SHARK VS CLIENTE) */
        .mode-selector { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 25px; }
        .mode-btn { width: 100%; padding: 25px; border-radius: 18px; border: 1px solid #444; background: #111; cursor: pointer; text-align: left; }
        .mode-btn h2 { font-family: 'Orbitron'; font-size: 16px; margin-bottom: 5px; }
        .mode-btn.shark { border-color: var(--gold); color: var(--gold); }
        .mode-btn.user { border-color: var(--red); color: var(--red); }

        /* INTERFACES ESPECÍFICAS (MEC-BANK, ROTA, ETC) */
        .content-area { flex: 1; padding: 20px; overflow-y: auto; }
        
        /* MEC-BANK STYLE */
        .nu-card { background: var(--nu); padding: 25px; border-radius: 20px; margin-bottom: 15px; position: relative; }
        .nu-card h2 { font-size: 22px; margin-top: 10px; }
        
        /* SERGEL/HOT-MEC STYLE (GRID DE PRODUTOS) */
        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .prod-card { background: #1a1a1a; border-radius: 15px; padding: 10px; text-align: center; border: 1px solid #333; }
        .prod-card img { width: 100%; border-radius: 10px; margin-bottom: 8px; }

        /* SHARK DASHBOARD (GRÁFICOS) */
        .chart-box { background: #111; border: 1px solid var(--gold); border-radius: 15px; padding: 15px; margin-bottom: 10px; }
        .chart-line { height: 60px; border-bottom: 2px solid #333; position: relative; display: flex; align-items: flex-end; gap: 5px; padding-bottom: 5px; }
        .bar { flex: 1; background: var(--gold); border-radius: 2px; }

        .btn-action { width: 100%; padding: 18px; border-radius: 15px; border: none; font-weight: 800; font-family: 'Orbitron'; cursor: pointer; margin-top: 10px; text-transform: uppercase; font-size: 11px; }
        #reader { width: 100%; border-radius: 20px; display: none; margin-bottom: 15px; border: 2px solid var(--red); }
    </style>
</head>
<body onload="checkSession()">

<div id="scr-login" class="screen active" style="justify-content:center; align-items:center; padding:30px;">
    <div style="font-family:'Orbitron'; font-size:30px; margin-bottom:40px;">MecShop</div>
    <input type="password" id="access-key" placeholder="ACCESS KEY 9910" style="width:100%; max-width:280px; padding:18px; background:#111; border:1px solid #333; color:#fff; border-radius:15px; text-align:center; font-family:'Orbitron';">
    <button onclick="doLogin()" class="btn-action" style="background:var(--red); color:#fff; max-width:280px;">LOGIN</button>
</div>

<div id="scr-hub" class="screen">
    <header><span class="logo-text">Corporate v10</span><button onclick="logout()" style="background:none; border:none; color:#fff; font-size:11px;">SAIR</button></header>
    <div class="hub-grid">
        <div class="hub-card" onclick="selectMod('bank', 'MEC-BANK')"><i style="color:var(--nu)">💳</i><span>MEC-BANK</span></div>
        <div class="hub-card" onclick="selectMod('log', 'LOG-PRO WMS')"><i style="color:var(--gold)">📦</i><span>LOG-PRO WMS</span></div>
        <div class="hub-card" onclick="selectMod('sergel', 'SERGEL DELIVERY')"><i style="color:#fff">🍦</i><span>SERGEL DELIVERY</span></div>
        <div class="hub-card" onclick="selectMod('rota', 'ESTRATÉGIA ROTA')"><i style="color:var(--red)">📍</i><span>ESTRATÉGIA ROTA</span></div>
        <div class="hub-card" onclick="selectMod('hot', 'HOT-MEC')"><i style="color:#007bff">📚</i><span>HOT-MEC</span></div>
        <div class="hub-card" onclick="selectMod('bet', 'BET GAME')"><i style="color:var(--green)">🎰</i><span>GAMES & BET</span></div>
    </div>
</div>

<div id="scr-mode" class="screen">
    <header><b id="mod-title" style="font-family:'Orbitron';"></b><button onclick="go('scr-hub')">VOLTAR</button></header>
    <div class="mode-selector">
        <div class="mode-btn shark" onclick="start('shark')"><h2>SHARK</h2><p>Performance Dashboard & Audit.</p></div>
        <div class="mode-btn user" onclick="start('user')"><h2>OPERADOR / CLIENTE</h2><p>Direct Action & Terminal.</p></div>
    </div>
</div>

<div id="scr-exec" class="screen">
    <header><b id="exec-title" style="font-size:11px; font-family:'Orbitron';"></b><button onclick="closeApp()">VOLTAR</button></header>
    <div id="ui-body" class="content-area"></div>
</div>

<script>
    let currentRole = "user";
    let currentMod = "";
    let qrcode = null;

    function doLogin() { if(document.getElementById('access-key').value === "9910") { localStorage.setItem('m_auth', '1'); go('scr-hub'); } }
    function selectMod(id, name) { currentMod = id; document.getElementById('mod-title').innerText = name; go('scr-mode'); }

    function start(role) {
        currentRole = role;
        document.getElementById('exec-title').innerText = `${currentMod.toUpperCase()} | ${role.toUpperCase()}`;
        const body = document.getElementById('ui-body');
        go('scr-exec');

        if(role === 'shark') {
            renderShark(body);
        } else {
            renderUser(body);
        }
    }

    function renderShark(body) {
        body.innerHTML = `
            <div class="chart-box">
                <small style="color:var(--gold)">BALANCE</small>
                <h2 style="font-family:'Orbitron'">R$ 350.400,00</h2>
            </div>
            <div class="chart-box">
                <small>PERFORMANCE DASHBOARD</small>
                <div class="chart-line">
                    <div class="bar" style="height:30%"></div><div class="bar" style="height:60%"></div><div class="bar" style="height:45%"></div>
                    <div class="bar" style="height:90%"></div><div class="bar" style="height:70%"></div>
                </div>
            </div>
            <div class="chart-box">
                <p style="font-size:10px">AUDIT SHIELD: <span style="color:var(--green)">ACTIVE</span></p>
                <p style="font-size:10px">ESTRATEGIA: <span style="color:var(--red)">HORTOLÂNDIA v10</span></p>
            </div>`;
    }

    function renderUser(body) {
        if(currentMod === 'bank') {
            body.innerHTML = `
                <div class="nu-card"><h4>nu</h4><h2>R$ 4.520,00</h2></div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <button class="btn-action" style="background:#222">PIX</button><button class="btn-action" style="background:#222">PAY</button>
                </div>`;
        } else if(currentMod === 'log') {
            body.innerHTML = `<div id="reader"></div><button class="btn-action" style="background:var(--red)" onclick="startScan()">C79 SCANNER</button><div id="log-list" style="font-size:10px; margin-top:10px; color:var(--green)"></div>`;
        } else if(currentMod === 'rota') {
            body.innerHTML = `<div style="background:#111; height:200px; border-radius:20px; border:1px solid #333; display:flex; align-items:center; justify-content:center; color:#555">ESTRATÉGIA ROTA MAP</div><button class="btn-action" style="background:var(--red)">OTIMIZAR ROTA</button>`;
        } else if(currentMod === 'sergel') {
            body.innerHTML = `<div class="prod-grid">
                <div class="prod-card"><div style="background:#333; height:80px; border-radius:10px; margin-bottom:5px"></div><b>SORVETE V10</b><button class="btn-action" style="background:var(--green)" onclick="zap()">WHATSAPP</button></div>
                <div class="prod-card"><div style="background:#333; height:80px; border-radius:10px; margin-bottom:5px"></div><b>AÇAÍ V10</b><button class="btn-action" style="background:var(--green)" onclick="zap()">WHATSAPP</button></div>
            </div>`;
        } else if(currentMod === 'hot') {
            body.innerHTML = `<h3>COURSES/E-BOOKS</h3><div class="stat" style="background:#111; padding:15px; border-radius:15px; margin-top:10px"><b>ESTRATÉGIA SHARK</b><br><small>Comissão: 60%</small><button class="btn-action" style="background:var(--red)">COPIAR LINK</button></div>`;
        } else {
            body.innerHTML = `<div style="background:#111; border:1px solid var(--green); padding:20px; border-radius:20px"><b>GAME LIVE</b><br><span style="color:var(--green)">ODD: 2.50</span></div><button class="btn-action" style="background:var(--green)">APOSTAR</button>`;
        }
    }

    function startScan() {
        document.getElementById('reader').style.display='block';
        qrcode = new Html5Qrcode("reader");
        qrcode.start({ facingMode: "environment" }, { fps: 30, qrbox: 250 }, (t) => {
            document.getElementById('log-list').innerHTML += `> BIPE: ${t}<br>`;
        });
    }

    function zap() { window.open("https://wa.me/5519991234567?text=Pedido-MecShop"); }
    function go(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function closeApp() { if(qrcode) { qrcode.stop(); qrcode = null; } go('scr-mode'); }
    function checkSession() { if(localStorage.getItem('m_auth')) go('scr-hub'); }
    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
