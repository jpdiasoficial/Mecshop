<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MecShop OS | Evolution</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #ea1d2c; --shark: #c5a059; --bg: #000; --card: #0a0a0a; --accent: #820ad1; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        
        /* Sistema de Camadas Inteligentes */
        .layer { display: none; height: 100vh; flex-direction: column; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .layer.active { display: flex; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Interface Estilo "OS" (Sistema Operacional) */
        .glass-header { padding: 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
        .os-logo { font-family: 'Orbitron'; font-weight: 900; background: linear-gradient(45deg, #fff, var(--main)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 18px; }

        /* Grid Inteligente */
        .app-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; overflow-y: auto; flex: 1; }
        .app-tile { background: var(--card); border: 1px solid #1a1a1a; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .app-tile::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--main); opacity: 0.3; }
        .app-tile i { font-size: 28px; margin-bottom: 12px; }
        .app-tile span { font-family: 'Orbitron'; font-size: 9px; letter-spacing: 1px; color: #888; }

        /* Widgets do Shark */
        .shark-panel { background: linear-gradient(135deg, #111, #000); border: 1px solid var(--shark); border-radius: 25px; padding: 20px; margin: 20px; }
        .balance-label { font-size: 10px; color: var(--shark); text-transform: uppercase; letter-spacing: 2px; }
        .balance-value { font-size: 32px; font-weight: 800; font-family: 'Orbitron'; margin: 5px 0; }

        /* Botões Estilo "Tesla" */
        .btn-action { width: 100%; padding: 20px; border-radius: 18px; border: none; font-weight: 700; font-family: 'Orbitron'; font-size: 12px; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .btn-primary { background: var(--main); color: #fff; box-shadow: 0 10px 20px rgba(234, 29, 44, 0.2); }
        .btn-shark { background: var(--shark); color: #000; }

        /* Barra de Navegação Inferior */
        .nav-bar { height: 70px; background: #050505; border-top: 1px solid #111; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #444; font-size: 20px; cursor: pointer; }
        .nav-item.active { color: var(--main); }
    </style>
</head>
<body onload="initOS()">

<div id="layer-login" class="layer active" style="justify-content:center; align-items:center; padding:40px;">
    <div class="os-logo" style="font-size:40px; margin-bottom:60px;">MECSHOP</div>
    <div style="width:100%; max-width:300px;">
        <input type="password" id="sys-key" placeholder="IDENTIFYING..." style="width:100%; padding:20px; background:#0a0a0a; border:1px solid #222; border-radius:20px; color:#fff; text-align:center; font-family:'Orbitron'; margin-bottom:20px;">
        <button onclick="bootSystem()" class="btn-action btn-primary">UNLOCK SYSTEM</button>
    </div>
</div>

<div id="layer-hub" class="layer">
    <div class="glass-header">
        <div class="os-logo">CORE OS v10</div>
        <div style="width:35px; height:35px; border-radius:50%; background:var(--shark); display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold; font-size:10px;">SH</div>
    </div>
    
    <div class="shark-panel" onclick="openMod('shark-main')">
        <p class="balance-label">Total Holding Revenue</p>
        <h2 class="balance-value">R$ 1.250.000</h2>
        <div style="width:100%; height:2px; background:#222; margin:15px 0;"></div>
        <p style="font-size:10px; color:var(--green)">+ 12.5% vs last month</p>
    </div>

    <div class="app-container">
        <div class="app-tile" onclick="openMod('bank')"><i style="color:var(--accent)">💳</i><span>MEC-BANK</span></div>
        <div class="app-tile" onclick="openMod('log')"><i style="color:var(--shark)">📦</i><span>LOG-PRO</span></div>
        <div class="app-tile" onclick="openMod('sergel')"><i style="color:#fff">🍦</i><span>SERGEL</span></div>
        <div class="app-tile" onclick="openMod('rota')"><i style="color:var(--main)">📍</i><span>ROTAS</span></div>
        <div class="app-tile" onclick="openMod('hot')"><i style="color:#007bff">📚</i><span>AFILIADOS</span></div>
        <div class="app-tile" onclick="openMod('bet')"><i style="color:#25d366">🎰</i><span>GAMES</span></div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active">🏠</div>
        <div class="nav-item">📊</div>
        <div class="nav-item">⚙️</div>
    </div>
</div>

<div id="layer-mod" class="layer">
    <div class="glass-header">
        <button onclick="backToHub()" style="background:none; border:none; color:#fff; font-size:20px;">←</button>
        <div id="mod-name" class="os-logo" style="font-size:12px;">MODULE</div>
        <div id="role-tag" style="font-size:8px; border:1px solid var(--main); padding:4px 8px; border-radius:10px;">OPERATOR</div>
    </div>
    <div id="mod-content" style="flex:1; overflow-y:auto; padding:20px;"></div>
</div>

<script>
    let session = { role: 'shark', app: '' };

    function bootSystem() {
        if(document.getElementById('sys-key').value === "9910") {
            switchLayer('layer-hub');
        }
    }

    function openMod(id) {
        session.app = id;
        document.getElementById('mod-name').innerText = id.toUpperCase();
        const content = document.getElementById('mod-content');
        switchLayer('layer-mod');

        if(id === 'bank') {
            content.innerHTML = `
                <div style="background:var(--accent); padding:30px; border-radius:30px; margin-bottom:20px; box-shadow:0 20px 40px rgba(130,10,209,0.3);">
                    <p style="font-size:12px; opacity:0.8;">Available Balance</p>
                    <h2 style="font-size:32px; font-family:'Orbitron';">R$ 4.520,00</h2>
                </div>
                <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:15px; text-align:center;">
                    <div style="background:#111; padding:15px; border-radius:20px;">PIX</div>
                    <div style="background:#111; padding:15px; border-radius:20px;">PAY</div>
                    <div style="background:#111; padding:15px; border-radius:20px;">CARD</div>
                </div>
            `;
        } else if(id === 'log') {
            content.innerHTML = `
                <div id="reader-container" style="width:100%; border-radius:30px; overflow:hidden; border:2px solid var(--main); margin-bottom:20px; display:none;">
                    <div id="reader" style="width:100%;"></div>
                </div>
                <button class="btn-action btn-primary" onclick="startScanner()">ACTIVATE SCANNER C79</button>
                <div id="bipe-log" style="margin-top:20px; font-family:'Orbitron'; font-size:10px; color:var(--shark);"></div>
            `;
        } else if(id === 'shark-main') {
             content.innerHTML = `
                <div class="shark-panel" style="margin:0; border-color:var(--main);">
                    <p class="balance-label" style="color:var(--main);">Shark Global Audit</p>
                    <h2 class="balance-value">R$ 45.200,00</h2>
                    <p style="font-size:10px; opacity:0.5;">Daily Net Profit</p>
                </div>
                <button class="btn-action btn-shark">GENERATE FULL AUDIT</button>
                <button class="btn-action" style="background:#111; color:#fff;">SYSTEM REBOOT</button>
            `;
        } else {
            content.innerHTML = `<div style="text-align:center; padding:100px 0; opacity:0.2;">MOD_READY_FOR_SYNC</div>`;
        }
    }

    function startScanner() {
        document.getElementById('reader-container').style.display = 'block';
        const scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 30, qrbox: 250 }, (t) => {
            document.getElementById('bipe-log').innerHTML += `> SCAN_SUCCESS: ${t}<br>`;
        });
    }

    function switchLayer(id) {
        document.querySelectorAll('.layer').forEach(l => l.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function backToHub() { switchLayer('layer-hub'); }
    function initOS() { /* Ready */ }
</script>
</body>
</html>
