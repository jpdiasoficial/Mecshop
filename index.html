<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v95 | JPDIAS INTEGRATED</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #00ff41; --bg: #000; --card: #080808; --brd: #1a1a1a; --danger: #ff3131; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; height: 100vh; overflow: hidden; }
        
        /* HEADER JPDIAS */
        header { padding: 15px; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #030303; color: var(--p); }
        .scroll { height: calc(100vh - 140px); overflow-y: auto; padding: 15px; }

        /* CARDS E STATUS */
        .grid-kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .kpi-card { background: var(--card); border: 1px solid var(--brd); padding: 15px; border-radius: 10px; border-left: 4px solid var(--p); }
        .kpi-card small { color: #666; font-size: 8px; font-weight: 800; }
        .kpi-card div { font-size: 20px; font-family: 'Orbitron'; margin-top: 5px; }

        /* INPUTS FULL INTEGRATED */
        .form-shark { background: var(--card); border: 1px solid var(--brd); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 14px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; font-family: 'Orbitron'; margin-bottom: 10px; font-size: 12px; }
        .btn { width: 100%; padding: 16px; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-p { background: var(--p); color: #000; }
        .btn-ghost { background: transparent; border: 1px solid #333; color: #fff; }

        /* ABAS E NAVEGAÇÃO */
        .nav-full { position: fixed; bottom: 0; width: 100%; background: #030303; border-top: 1px solid var(--brd); display: flex; padding: 10px; z-index: 1000; }
        .nav-btn { flex: 1; text-align: center; color: #444; font-size: 9px; font-weight: 800; border: none; background: none; }
        .nav-btn.active { color: var(--p); }
        .nav-btn i { display: block; font-size: 20px; margin-bottom: 5px; }

        .screen { display: none; height: 100%; }
        .screen.active { display: block; }

        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; border: 1px solid var(--brd); }
    </style>
</head>
<body onload="checkAuth()">

<div id="scr-login" class="screen active">
    <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px;">
        <div style="font-family:'Orbitron'; color:var(--p); font-size:38px; text-align:center; line-height:0.9;">LOG-PRO<br><span style="font-size:12px; color:#444; letter-spacing:6px;">JPDIAS v95</span></div>
        <div style="width: 100%; margin-top:40px;">
            <input type="text" id="user" placeholder="USUÁRIO">
            <input type="password" id="pass" placeholder="CHAVE DE ACESSO">
            <button class="btn btn-p" onclick="login()">AUTENTICAR NO SERVIDOR</button>
        </div>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span>DASHBOARD MASTER</span> <span id="status-live" style="font-size:8px; color:var(--p)">● LIVE</span></header>
    <div class="scroll">
        <div class="grid-kpi">
            <div class="kpi-card"><small>SALDO GLOBAL</small><div id="kpi-saldo">0</div></div>
            <div class="kpi-card" style="border-left-color: var(--danger);"><small>AVARIAS</small><div id="kpi-avaria">0</div></div>
        </div>
        <div class="form-shark">
            <label style="color:var(--p); font-size:9px;">CADASTRO DE MATRIZ</label>
            <input type="text" id="m-cod" placeholder="EAN / CÓDIGO">
            <input type="text" id="m-nome" placeholder="NOME DO PRODUTO">
            <button class="btn btn-ghost" onclick="saveMaster()">SALVAR NA BASE M</button>
        </div>
        <div id="logs-list"></div>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span>TERMINAL DE DOCA</span> <button onclick="logout()" style="background:none; border:none; color:var(--danger); font-size:10px;">SAIR</button></header>
    <div class="scroll">
        <select id="tipo-op">
            <option value="ENTRADA">📥 ENTRADA DE CARGA</option>
            <option value="SAIDA">🚚 EXPEDIÇÃO / SAÍDA</option>
            <option value="AVARIA">⚠️ BLOQUEIO / AVARIA</option>
        </select>
        <div id="reader"></div>
        <button class="btn btn-ghost" id="cam-btn" onclick="toggleCam()" style="margin-bottom:10px;"><i class="fa-solid fa-camera"></i> LIGAR SCANNER</button>
        <input type="text" id="manual-cod" placeholder="OU DIGITE O CÓDIGO">
        <button class="btn btn-p" onclick="processManual()">REGISTRAR AGORA</button>
    </div>
</div>

<nav id="main-nav" class="nav-full" style="display:none;">
    <button class="nav-btn active" id="n-shark" onclick="tab('shark')"><i class="fa-solid fa-tower-cell"></i>PAINEL</button>
    <button class="nav-btn" id="n-op" onclick="tab('op')"><i class="fa-solid fa-barcode"></i>DOCA</button>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRDhONvvzZmo2csXksqHs6E6vV3MuvLSs",
        authDomain: "log-pro-jp.firebaseapp.com",
        projectId: "log-pro-jp",
        storageBucket: "log-pro-jp.firebasestorage.app",
        messagingSenderId: "481645607846",
        appId: "1:481645607846:web:fd55dd943718ad78386d67"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let user = localStorage.getItem('v95_session');
    let html5QrCode, camActive = false;

    // REAL-TIME INTEGRATION
    if(user) {
        onSnapshot(collection(db, "base_master"), (snap) => {
            let s = 0; let a = 0;
            snap.forEach(d => { s += d.data().saldo || 0; a += d.data().avaria || 0; });
            if(document.getElementById('kpi-saldo')) document.getElementById('kpi-saldo').innerText = s;
            if(document.getElementById('kpi-avaria')) document.getElementById('kpi-avaria').innerText = a;
        });

        onSnapshot(query(collection(db, "logs"), orderBy("dt", "desc"), limit(15)), (snap) => {
            const list = document.getElementById('logs-list');
            if(!list) return;
            list.innerHTML = snap.docs.map(d => {
                const l = d.data();
                return `<div style="background:#111; padding:10px; border-radius:6px; margin-bottom:5px; border-left:2px solid ${l.t==='AVARIA'?'red': 'var(--p)'}">
                    <small style="color:#666">${l.h}</small> | <b>${l.cod}</b> [${l.t}]
                </div>`;
            }).join('');
        });
    }

    window.saveMaster = async () => {
        const c = document.getElementById('m-cod').value;
        const n = document.getElementById('m-nome').value.toUpperCase();
        if(c && n) {
            await setDoc(doc(db, "base_master", c), { nome: n, saldo: 0, avaria: 0 }, { merge: true });
            alert("ITEM REGISTRADO NA BASE M");
            document.getElementById('m-cod').value = ""; document.getElementById('m-nome').value = "";
        }
    };

    window.processManual = async (c) => {
        const cod = c || document.getElementById('manual-cod').value;
        const tipo = document.getElementById('tipo-op').value;
        if(!cod) return;

        await addDoc(collection(db, "logs"), {
            cod: cod, t: tipo, op: user, h: new Date().toLocaleTimeString(), dt: serverTimestamp()
        });

        if(navigator.vibrate) navigator.vibrate(80);
        document.getElementById('manual-cod').value = "";
    };

    window.login = () => {
        const u = document.getElementById('user').value.toUpperCase();
        const p = document.getElementById('pass').value;
        if((u==='JP'||u==='SHARK') && p==='9910' || u==='OP' && p==='1234') {
            localStorage.setItem('v95_session', u);
            location.reload();
        } else alert("CREDENCIAIS INVÁLIDAS");
    };

    window.logout = () => { localStorage.removeItem('v95_session'); location.reload(); };
    window.tab = (t) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('scr-'+t).classList.add('active');
        document.getElementById('n-'+t).classList.add('active');
    };

    window.toggleCam = async () => {
        const btn = document.getElementById('cam-btn');
        if(!camActive) {
            html5QrCode = new Html5Qrcode("reader");
            await html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (txt) => processManual(txt));
            camActive = true; btn.style.color = "var(--danger)";
        } else {
            await html5QrCode.stop();
            camActive = false; btn.style.color = "#fff";
        }
    };

    window.checkAuth = () => {
        if(user) {
            document.getElementById('scr-login').classList.remove('active');
            document.getElementById(user==='OP'?'scr-op':'scr-shark').classList.add('active');
            document.getElementById('main-nav').style.display = 'flex';
        }
    };
</script>
</body>
</html>
