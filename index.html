<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK V45 | Shark Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #111; --text: #fff; --gray: #888; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; height: 100vh; overflow: hidden; }

        /* Telas */
        .screen { display: none; height: 100vh; flex-direction: column; overflow-y: auto; }
        .active { display: flex; animation: fadeIn 0.4s ease; }
        
        /* Ajuste de Padding para Telas com Nav */
        .with-nav { padding-bottom: 90px; }

        /* TELA DE LOGIN - SEM BARRA */
        #scr-login { justify-content: center; align-items: center; padding: 40px; background: #000; z-index: 100; position: relative; }
        .logo-main { font-size: 35px; font-weight: 900; color: var(--primary); margin-bottom: 50px; text-shadow: 0 0 20px rgba(0,255,136,0.3); }
        .input-group { width: 100%; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; color: var(--gray); margin-bottom: 8px; margin-left: 5px; }
        .input-group input { width: 100%; background: #151515; border: 1px solid #252525; padding: 20px; border-radius: 15px; color: #fff; font-size: 16px; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary); outline: none; background: #1a1a1a; }
        .btn-login { width: 100%; background: var(--primary); color: #000; border: none; padding: 20px; border-radius: 15px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 10px; }

        /* HOME ESTILO PREMIUM */
        .header-home { padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; }

        .balance-card { background: #111; margin: 0 15px; padding: 25px; border-radius: 24px; border: 1px solid #222; }
        .balance-blur { filter: blur(10px); }
        
        /* GRID DE SERVIÇOS */
        .services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 25px 15px; }
        .service-item { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
        .icon-box { width: 60px; height: 60px; background: #151515; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--primary); border: 1px solid #222; }
        .service-item span { font-size: 12px; font-weight: 500; color: #eee; }

        /* BARRA DE NAVEGAÇÃO - OCULTA POR PADRÃO */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; background: rgba(10, 10, 10, 0.95); 
            display: none; /* Inicia oculta */
            justify-content: space-around; padding: 15px 0; 
            border-top: 1px solid #1a1a1a; backdrop-filter: blur(10px); 
        }
        .nav-item { color: #555; text-align: center; font-size: 10px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.3s; }
        .nav-item i { font-size: 22px; }
        .nav-item.active-nav { color: var(--primary); }

        /* PAINEL DE CONTROLE (MASTER) */
        .admin-stat { background: linear-gradient(145deg, #111, #080808); padding: 20px; border-radius: 20px; border-left: 4px solid var(--primary); margin-bottom: 15px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="scr-login" class="screen active">
        <div class="logo-main">MEC-BANK</div>
        <div class="input-group">
            <label>Usuário Master ou Cliente</label>
            <input type="text" id="user-input" placeholder="Shark ou Jp">
        </div>
        <div class="input-group">
            <label>Senha de Acesso</label>
            <input type="password" placeholder="••••••••">
        </div>
        <button class="btn-login" onclick="autenticar()">ENTRAR COM SEGURANÇA</button>
        <p style="font-size: 11px; color: #333; margin-top: 40px;">Versão V45.8835 Platinum Edition</p>
    </div>

    <div id="scr-home" class="screen with-nav">
        <div class="header-home">
            <div class="user-info">
                <div class="avatar">J</div>
                <span style="font-weight: 700;">Olá, Jp</span>
            </div>
            <i class="fa-solid fa-bell" style="color: var(--primary); font-size: 20px;"></i>
        </div>

        <div class="balance-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="color:var(--gray); font-size: 14px;">Saldo disponível</span>
                <i class="fa-solid fa-eye" id="eye-icon" onclick="toggleBalance()"></i>
            </div>
            <div id="main-balance" class="balance-blur" style="font-size: 32px; font-weight: 800; margin: 15px 0;">R$ 145.850,90</div>
            <button style="width:100%; background:transparent; border:1px solid var(--primary); color:var(--primary); padding:12px; border-radius:12px; font-weight:600;">Ver Extrato Detalhado</button>
        </div>

        <div class="services-grid">
            <div class="service-item"><div class="icon-box"><i class="fa-solid fa-qrcode"></i></div><span>Pix</span></div>
            <div class="service-item"><div class="icon-box"><i class="fa-solid fa-barcode"></i></div><span>Pagar</span></div>
            <div class="service-item"><div class="icon-box"><i class="fa-solid fa-money-bill-transfer"></i></div><span>Transf.</span></div>
            <div class="service-item"><div class="icon-box"><i class="fa-solid fa-mobile-screen"></i></div><span>Recarga</span></div>
            <div class="service-item"><div class="icon-box"><i class="fa-solid fa-hand-holding-dollar"></i></div><span>Empréstimo</span></div>
            <div class="service-item"><div class="icon-box"><i class="fa-solid fa-shield-halved"></i></div><span>Seguros</span></div>
            <div class="service-item"><div class="icon-box"><i class="fa-solid fa-gift"></i></div><span>Mimos</span></div>
            <div class="service-item"><div class="icon-box"><i class="fa-solid fa-circle-question"></i></div><span>Ajuda</span></div>
        </div>
    </div>

    <div id="scr-master" class="screen with-nav">
        <div style="padding: 25px;">
            <h2 style="color:var(--primary); margin:0;">Control Panel</h2>
            <p style="color:var(--gray); font-size:12px;">Gestão de Operações Master</p>
            
            <div class="admin-stat">
                <small style="color:var(--gray); text-transform:uppercase; font-size:10px;">Saldo em Custódia</small>
                <div style="font-size: 24px; font-weight: 800; margin-top:5px;">R$ 1.450.850,00</div>
            </div>
            <div class="admin-stat">
                <small style="color:var(--gray); text-transform:uppercase; font-size:10px;">Usuários Conectados</small>
                <div style="font-size: 24px; font-weight: 800; margin-top:5px;">842</div>
            </div>

            <div style="border: 2px dashed #222; border-radius:20px; padding:30px; text-align:center; color:var(--primary); margin-bottom:20px;">
                <i class="fa-solid fa-cloud-arrow-up" style="font-size:30px;"></i>
                <p style="font-weight:700; margin:10px 0 0 0;">SINCRONIZAR XLSX</p>
            </div>
        </div>
    </div>

    <nav class="nav-bar" id="main-nav">
        <a href="#" class="nav-item active-nav" onclick="changeTab('scr-home', this)"><i class="fa-solid fa-house"></i>Início</a>
        <a href="#" class="nav-item" onclick="changeTab('scr-home', this)"><i class="fa-solid fa-list-ul"></i>Extrato</a>
        <a href="#" class="nav-item" onclick="changeTab('scr-master', this)"><i class="fa-solid fa-gears"></i>Painel</a>
        <a href="#" class="nav-item" onclick="location.reload()" style="color:var(--danger)"><i class="fa-solid fa-power-off"></i>Sair</a>
    </nav>

    <script>
        function autenticar() {
            const user = document.getElementById('user-input').value.trim().toLowerCase();
            const loginScreen = document.getElementById('scr-login');
            const navBar = document.getElementById('main-nav');

            // Remove a tela de login
            loginScreen.classList.remove('active');
            
            // Mostra a barra de navegação
            navBar.style.display = 'flex';

            if(user === 'shark') {
                document.getElementById('scr-master').classList.add('active');
                updateNav(2); // Ativa ícone do Painel
            } else {
                document.getElementById('scr-home').classList.add('active');
                updateNav(0); // Ativa ícone Home
            }
        }

        function changeTab(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            el.classList.add('active-nav');
        }

        function updateNav(index) {
            const items = document.querySelectorAll('.nav-item');
            items.forEach(n => n.classList.remove('active-nav'));
            items[index].classList.add('active-nav');
        }

        function toggleBalance() {
            const bal = document.getElementById('main-balance');
            const icon = document.getElementById('eye-icon');
            bal.classList.toggle('balance-blur');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        }
    </script>
</body>
</html>
