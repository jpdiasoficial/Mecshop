<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP PLATFORM | SHARK EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --green: #22c55e; --red: #ef4444; --gold: #d4af37; --bg: #020617; --card: #1e293b; --purple: #7c3aed; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial; }
        body { margin: 0; background: var(--bg); color: white; text-align: center; }
        
        header { background: #000; padding: 20px; font-size: 24px; font-weight: 900; border-bottom: 2px solid var(--gold); }
        .container { max-width: 500px; margin: auto; padding: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        
        input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; background: #0f172a; color: white; }
        button { width: 100%; padding: 15px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-green { background: var(--green); color: white; }
        .btn-purple { background: var(--purple); color: white; }
        
        .hidden { display: none; }
        
        /* ROLETA MELHORADA */
        #wheel { width: 220px; height: 220px; border-radius: 50%; border: 8px solid #334155; margin: 20px auto; 
                 background: conic-gradient(var(--green) 0deg 90deg, #111 90deg 180deg, var(--green) 180deg 270deg, #111 270deg 360deg);
                 transition: transform 4s cubic-bezier(0.1, 0, 0, 1); position: relative; }
        #wheel::after { content: '▼'; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 30px; }

        /* LISTA DE USUÁRIOS NO ADMIN */
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #334155; font-size: 13px; }
    </style>
</head>
<body>

<header>JP PLATFORM <small style="font-size: 10px; color: var(--gold);">V4.0</small></header>

<div class="container">
    <div id="authBox" class="card">
        <h3 id="authTitle">LOGIN</h3>
        <input id="userIn" placeholder="Usuário">
        <input id="passIn" type="password" placeholder="Senha">
        <button class="btn-green" onclick="App.handleAuth()">ENTRAR / CADASTRAR</button>
        <p style="font-size: 12px; margin-top: 15px; color: #94a3b8;">SISTEMA MULTI-USUÁRIO ATIVO</p>
    </div>

    <div id="dash" class="hidden">
        <div class="card" style="border-bottom: 4px solid var(--green);">
            <h3>OLÁ, <span id="uName" style="color: var(--gold);"></span></h3>
            <p style="font-size: 25px; font-weight: bold;">R$ <span id="uSaldo">0.00</span></p>
            <canvas id="grafico" width="300" height="100" style="margin-top: 10px;"></canvas>
        </div>

        <div class="card">
            <div id="wheel"></div>
            <button class="btn-green" id="btnGirar" onclick="App.Game.girar()">APOSTAR R$ 10.00</button>
            <p id="res" style="margin-top: 10px; font-weight: bold;"></p>
        </div>

        <div id="adminBox" class="card hidden" style="background: #2e1065; border: 1px solid var(--gold);">
            <h3 style="color: var(--gold);"><i class="fa-solid fa-crown"></i> PAINEL SHARK</h3>
            <div id="userList" style="text-align: left; margin-top: 15px;"></div>
            <button class="btn-purple" style="margin-top: 20px;" onclick="App.System.reset()">RESETA SISTEMA</button>
        </div>

        <button onclick="location.reload()" style="background: transparent; color: #64748b; border: 1px solid #334155;">SAIR DA CONTA</button>
    </div>
</div>

<script>
const App = {
    users: JSON.parse(localStorage.getItem("JP_USERS")) || [],
    current: null,

    handleAuth() {
        let u = userIn.value, p = passIn.value;
        if(!u || !p) return alert("Preencha tudo!");

        let found = this.users.find(x => x.user == u);
        
        if(found) { // Login
            if(found.pass == p) this.start(found);
            else alert("Senha errada!");
        } else { // Cadastro automático
            let newUser = { user: u, pass: p, saldo: 0, hist: [0], role: u == 'admin' ? 'admin' : 'player' };
            this.users.push(newUser);
            this.save();
            this.start(newUser);
        }
    },

    start(user) {
        this.current = user;
        authBox.classList.add("hidden");
        dash.classList.remove("hidden");
        uName.innerText = user.user;
        if(user.role == 'admin') this.System.loadAdmin();
        this.System.updateUI();
    },

    Game: {
        girar() {
            if(App.current.saldo < 10 && App.current.role != 'admin') return alert("Saldo insuficiente!");
            App.current.saldo -= 10;
            btnGirar.disabled = true;
            let deg = Math.floor(Math.random() * 3600) + 1080;
            wheel.style.transform = `rotate(${deg}deg)`;

            setTimeout(() => {
                let win = (deg % 2 == 0); // Lógica simples: se par, ganha
                let premio = win ? 25 : 0;
                App.current.saldo += premio;
                App.current.hist.push(App.current.saldo);
                res.innerText = win ? "GANHOU R$ 25!" : "PERDEU!";
                res.style.color = win ? "lime" : "red";
                btnGirar.disabled = false;
                App.save();
                App.System.updateUI();
            }, 4000);
        }
    },

    System: {
        updateUI() {
            uSaldo.innerText = App.current.saldo.toFixed(2);
            this.drawChart();
        },
        drawChart() {
            let ctx = grafico.getContext("2d");
            ctx.clearRect(0,0,300,100);
            ctx.beginPath(); ctx.strokeStyle = "#22c55e";
            App.current.hist.slice(-10).forEach((v, i) => {
                let x = i * 30, y = 100 - (v / 2);
                i == 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();
        },
        loadAdmin() {
            adminBox.classList.remove("hidden");
            userList.innerHTML = App.users.map(u => `
                <div class="user-row">
                    <span>${u.user}</span>
                    <button onclick="App.System.addSaldo('${u.user}')" style="width: auto; padding: 5px; font-size: 10px; background: var(--green);">+ R$50</button>
                    <span>R$ ${u.saldo.toFixed(2)}</span>
                </div>
            `).join('');
        },
        addSaldo(username) {
            let user = App.users.find(u => u.user == username);
            user.saldo += 50;
            App.save();
            this.loadAdmin();
            if(App.current.user == username) this.updateUI();
        },
        reset() { localStorage.clear(); location.reload(); }
    },

    save() { localStorage.setItem("JP_USERS", JSON.stringify(this.users)); }
};
</script>
</body>
</html>
