<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HG MOTORS | Galaxy Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff002e;     /* High-Performance Red */
            --success: #00ff66;    /* Neon WhatsApp */
            --bg: #000000;         /* Deep Space */
            --card-bg: rgba(20, 20, 20, 0.7);
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; 
            overflow-x: hidden; scroll-behavior: smooth;
            background-image: radial-gradient(circle at 50% -20%, #1a0005 0%, #000 80%);
        }

        /* HEADER ULTRA-TECH */
        header { 
            height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
        }
        .logo { font-size: 32px; font-weight: 900; letter-spacing: 8px; text-transform: uppercase; color: #fff; }
        .logo span { color: var(--accent); text-shadow: 0 0 20px rgba(255, 0, 46, 0.5); }
        .status-bar { font-size: 9px; text-transform: uppercase; letter-spacing: 3px; color: var(--accent); margin-top: 8px; font-weight: 600; }

        /* NAV TAB-BAR (APP FEEL) */
        .v80-tabs {
            display: flex; justify-content: center; gap: 8px; padding: 15px;
            position: sticky; top: 120px; z-index: 999; background: rgba(0,0,0,0.5);
        }
        .tab {
            background: var(--glass); border: 1px solid var(--border); color: #888;
            padding: 10px 20px; border-radius: 100px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: 0.4s;
        }
        .tab.active { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.2); }

        /* GRID GALAXY */
        .grid { max-width: 450px; margin: 0 auto; padding: 40px 15px; }

        .v-card {
            background: var(--card-bg); border-radius: 24px; margin-bottom: 60px;
            border: 1px solid var(--border); overflow: hidden;
            backdrop-filter: blur(10px); transition: transform 0.5s;
            animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        
        @keyframes reveal { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .v-img-box { position: relative; width: 100%; height: 420px; overflow: hidden; }
        .v-img-box img { width: 100%; height: 100%; object-fit: cover; transition: 1.2s cubic-bezier(0.2, 1, 0.2, 1); }
        .v-card:hover .v-img-box img { transform: scale(1.1); }

        .v-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .v-content { padding: 30px 25px; }
        .v-title { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; line-height: 0.9; margin-bottom: 15px; }
        
        .v-specs-row { display: flex; gap: 10px; margin-bottom: 30px; }
        .v-pill { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; color: #aaa;
        }

        .v-price-box { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 0; border-top: 1px solid var(--border);
        }
        .v-price { font-size: 42px; font-weight: 900; color: #fff; }
        .v-price span { font-size: 16px; color: var(--accent); vertical-align: top; margin-right: 4px; }

        /* BOTÃO MAGNÉTICO */
        .v-cta {
            background: var(--success); color: #000; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            height: 70px; border-radius: 18px; font-weight: 900; font-size: 17px;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 20px 40px rgba(0, 255, 102, 0.2);
            transition: 0.3s;
        }
        .v-cta:active { transform: scale(0.95); filter: brightness(1.2); }

        footer { text-align: center; padding: 100px 20px; opacity: 0.2; font-size: 10px; font-weight: 900; letter-spacing: 5px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">HG <span>MOTORS</span></div>
        <div class="status-bar">SISTEMA V80 ONLINE • HORTOLÂNDIA</div>
    </header>

    <div class="v80-tabs">
        <div class="tab active" onclick="filter('all')">Estoque Total</div>
        <div class="tab" onclick="filter('premium')">Premium</div>
        <div class="tab" onclick="filter('sport')">Sport</div>
    </div>

    <div class="grid" id="main-grid">
        
        <div class="v-card" data-cat="premium">
            <div class="v-img-box">
                <img src="5565.png" alt="Onix" onerror="this.src='https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=800'">
                <div class="v-overlay">
                    <div class="v-pill" style="background: var(--accent); color: #fff; border: none;">DISPONÍVEL AGORA</div>
                </div>
            </div>
            <div class="v-content">
                <h2 class="v-title">Onix Turbo<br>Premier</h2>
                <div class="v-specs-row">
                    <div class="v-pill">2023</div>
                    <div class="v-pill">Automático</div>
                </div>
                <div class="v-price-box">
                    <div class="v-price"><span>R$</span>89.900</div>
                </div>
                <a href="https://wa.me/5519998463668" class="v-cta">Negociar em Segundos</a>
            </div>
        </div>

        <div class="v-card" data-cat="sport">
            <div class="v-img-box">
                <img src="5588.png" alt="Moto" onerror="this.src='https://images.unsplash.com/photo-1558981403-c5f91cbcf523?w=800'">
                <div class="v-overlay">
                    <div class="v-pill" style="background: #fff; color: #000; border: none;">ALTA PERFORMANCE</div>
                </div>
            </div>
            <div class="v-content">
                <h2 class="v-title">CB 500X<br>ABS HONDA</h2>
                <div class="v-specs-row">
                    <div class="v-pill">2021</div>
                    <div class="v-pill">12k KM</div>
                </div>
                <div class="v-price-box">
                    <div class="v-price"><span>R$</span>42.500</div>
                </div>
                <a href="https://wa.me/5519998463668" class="v-cta">Negociar em Segundos</a>
            </div>
        </div>

    </div>

    <footer>
        GALAXY INTERFACE BY JP DIAS
    </footer>

    <script>
        function filter(c) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.v-card').forEach(card => {
                card.style.display = (c === 'all' || card.dataset.cat === c) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
