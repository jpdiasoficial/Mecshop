<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET INFINITY | OS 5.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --p: #ff5e00; --g: #00ff41; --gold: #d4af37; --danger: #ff3b30;
            --bg: #050505; --s: #0d0d0d; --b: #1a1a1a;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* ENGINE DE TELAS */
        .view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); z-index: 10; overflow-y: auto; padding-bottom: 90px; }
        .view.active { display: flex; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* UI COMPONENTS */
        header { height: 70px; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--b); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; sticky: top; z-index: 100; }
        .logo { font-weight: 900; font-size: 22px; color: var(--gold); letter-spacing: -1px; }
        
        .card { background: var(--s); margin: 15px; padding: 20px; border-radius: 20px; border: 1px solid var(--b); position: relative; }
        .btn { border: none; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .btn:active { transform: scale(0.95); }
        .btn-p { background: var(--p); color: #fff; padding: 15px; }
        .btn-g { background: var(--g); color: #000; padding: 15px; }

        /* FEED DE GANHADORES (GATILHO MENTAL) */
        .live-feed { background: rgba(0,255,65,0.05); padding: 8px; font-size: 10px; color: var(--g); text-align: center; border-bottom: 1px solid rgba(0,255,65,0.1); }

        /* GRID DE JOGOS */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .game-item { background: var(--s); border-radius: 15px; border: 1px solid var(--b); height: 140px; display: flex; flex-direction: column; justify-content: flex-end; padding: 15px; position: relative; overflow: hidden; }
        .game-item i { position: absolute; top: 15px; right: 15px; font-size: 30px; opacity: 0.2; }
        .hot-tag { position: absolute; top: 10px; left: 10px; background: var(--danger); font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 900; }

        /* MINES GAME UI */
        .mines-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 15px; background: #000; border-radius: 15px; margin: 10px; border: 1px solid var(--b); }
        .tile { aspect-ratio: 1/1; background: #111; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .tile.open { background: #1a1a1a; }

        /* ADMIN SHARK PANEL */
        .shark-row { background: #080808; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #111; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* NAV BAR */
        nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.95); border-top: 1px solid var(--b); display: none; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-link { color: #444; font-size: 10px; font-weight: 900; text-align: center; }
        .nav-link.active { color: var(--gold); }
    </style>
</head>
<body onload="Mec.start()">

    <div id="scr-auth" class="view active">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px;">
            <div class="logo" style="font-size:45px; margin-bottom:10px;">MEC-BET</div>
            <p style="font-size:10px; color:#222; margin-bottom:40px; letter-spacing:3px;">INFINITY PLATFORM</p>
            <input type="text" id="u-in" placeholder="USUÁRIO" style="width:100%; padding:20px; background:#080808; border:1px solid #111; border-radius:15px; color:#fff; margin-bottom:10px;">
            <input type="password" id="p-in" placeholder="SENHA" style="width:100%; padding:20px; background:#080808; border:1px solid #111; border-radius:15px; color:#fff; margin-bottom:20px;">
            <button class="btn btn-p" style="width:100%;" onclick="Mec.Auth.login()">ACESSAR PLATAFORMA</button>
        </div>
    </div>

    <div id="scr-lobby" class="view">
        <div class="live-feed" id="win-alert">Aguardando novos ganhadores...</div>
        <header>
            <div class="logo">MEC-BET</div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="u-lvl" style="font-size:9px; border:1px solid var(--gold); padding:2px 6px; border-radius:4px; color:var(--gold);">LVL 1</span>
                <i class="fa-solid fa-right-from-bracket" style="color:var(--danger)" onclick="Mec.Auth.logout()"></i>
            </div>
        </header>
        <div class="card" style="border-bottom: 4px solid var(--g);">
            <p style="font-size:10px; color:#444;">SALDO DISPONÍVEL</p>
            <h1 id="u-saldo" style="font-size:45px; letter-spacing:-2px;">R$ 0,00</h1>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn btn-g" style="flex:1" onclick="Mec.Game.addDemo()">DEPOSITAR</button>
                <button class="btn" style="flex:1; background:#111; border:1px solid #222;" onclick="alert('ÁREA DE AFILIADOS INDISPONÍVEL NA DEMO')">AFILIADOS</button>
            </div>
        </div>
        <div class="game-grid">
            <div class="game-item" onclick="Mec.Router.go('scr-mines')" style="border-bottom: 3px solid var(--gold);">
                <div class="hot-tag">🔥 QUENTE</div>
                <i class="fa-solid fa-gem"></i>
                <b style="font-size:12px;">MINES MEC</b>
                <small style="color:var(--g); font-size:9px;">98.2% PAGANDO</small>
            </div>
            <div class="game-item" style="opacity:0.4;">
                <i class="fa-solid fa-plane-up"></i>
                <b style="font-size:12px;">AVIATOR</b>
                <small style="font-size:9px;">EM MANUTENÇÃO</small>
            </div>
        </div>
    </div>

    <div id="scr-mines" class="view">
        <header>
            <i class="fa-solid fa-chevron-left" onclick="Mec.Router.go('scr-lobby')"></i>
            <div class="logo" style="font-size:16px;">MINES PRO</div>
            <div id="m-saldo" style="color:var(--g); font-weight:900;">R$ 0,00</div>
        </header>
        <div class="mines-board" id="m-board"></div>
        <div style="padding:20px;">
            <button id="m-btn-start" class="btn btn-p" style="width:100%;" onclick="Mec.Game.Mines.start()">INICIAR (R$ 10,00)</button>
            <button id="m-btn-cash" class="btn btn-g" style="width:100%; display:none;" onclick="Mec.Game.Mines.cashout()">COLETAR LUCRO</button>
            <p id="m-msg" style="text-align:center; margin-top:15px; font-weight:900; color:var(--gold);"></p>
        </div>
    </div>

    <div id="scr-admin" class="view">
        <header>
            <div class="logo" style="color:var(--p)">SHARK CONTROL</div>
            <i class="fa-solid fa-eye-slash" onclick="Mec.Router.go('scr-lobby')"></i>
        </header>
        <div style="padding:20px;">
            <div class="card" style="margin:0 0 20px 0; border-left:4px solid var(--gold);">
                <p style="font-size:10px;">GGR (LUCRO BRUTO)</p>
                <h2 style="color:var(--g)" id="adm-ggr">R$ 1.450,00</h2>
            </div>
            <h3 style="font-size:12px; color:#444; margin-bottom:10px;">USUÁRIOS ATIVOS</h3>
            <div id="adm-user-list"></div>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-link active" onclick="Mec.Router.go('scr-lobby')"><i class="fa-solid fa-house"></i><br>HOME</div>
        <div class="nav-link" onclick="Mec.Router.go('scr-mines')"><i class="fa-solid fa-gem"></i><br>GAMES</div>
        <div id="nav-shark" class="nav-link" style="display:none; color:var(--gold);" onclick="Mec.Router.go('scr-admin')"><i class="fa-solid fa-crown"></i><br>SHARK</div>
    </nav>

    <script>
        const Mec = {
            db: JSON.parse(localStorage.getItem('MEC_INFINITY_DB')) || [],
            curr: null,

            start() {
                // MOTOR DE SINCRONIZAÇÃO ENTRE ABAS
                window.addEventListener('storage', () => {
                    this.db = JSON.parse(localStorage.getItem('MEC_INFINITY_DB'));
                    if(this.curr) {
                        this.curr = this.db.find(u => u.user === this.curr.user);
                        this.System.syncUI();
                    }
                });

                const sess = sessionStorage.getItem('MEC_SESS');
                if(sess) {
                    this.curr = this.db.find(u => u.user === sess);
                    if(this.curr) this.System.startApp();
                }
                this.System.fakeFeed();
            },

            Auth: {
                login() {
                    let u = document.getElementById('u-in').value.toUpperCase();
                    let p = document.getElementById('p-in').value;
                    if(!u) return;
                    let found = Mec.db.find(x => x.user === u);
                    if(!found) {
                        found = { user: u, pass: p, saldo: 0, lvl: 1, role: u === 'ADMIN' ? 'admin' : 'player', mode: 'auto' };
                        Mec.db.push(found);
                        Mec.System.save();
                    }
                    sessionStorage.setItem('MEC_SESS', u);
                    location.reload();
                },
                logout() { sessionStorage.clear(); location.reload(); }
            },

            Game: {
                addDemo() { Mec.curr.saldo += 100; Mec.System.saveAndSync(); },
                Mines: {
                    playing: false, multiplier: 1, bet: 10,
                    start() {
                        if(Mec.curr.saldo < 10) return alert("SALDO INSUFICIENTE!");
                        Mec.curr.saldo -= 10; Mec.System.saveAndSync();
                        this.playing = true; this.multiplier = 1;
                        document.getElementById('m-btn-start').style.display = 'none';
                        document.getElementById('m-btn-cash').style.display = 'block';
                        document.getElementById('m-msg').innerText = "ESCOLHA OS QUADRADOS";
                        this.render();
                    },
                    render() {
                        const b = document.getElementById('m-board'); b.innerHTML = '';
                        const bombPos = Math.floor(Math.random() * 25);
                        for(let i=0; i<25; i++) {
                            let t = document.createElement('div'); t.className = 'tile';
                            t.onclick = () => {
                                if(!this.playing || t.classList.contains('open')) return;
                                t.classList.add('open');
                                // LÓGICA DE MANIPULAÇÃO SHARK
                                let isBomb = i === bombPos;
                                if(Mec.curr.mode === 'win') isBomb = false;
                                if(Mec.curr.mode === 'lose') isBomb = true;

                                if(isBomb) {
                                    t.innerHTML = '💣'; t.style.color = 'red';
                                    this.end(false);
                                } else {
                                    t.innerHTML = '💎'; t.style.color = 'var(--g)';
                                    this.multiplier += 0.5;
                                    document.getElementById('m-btn-cash').innerText = `COLETAR R$ ${(10 * this.multiplier).toFixed(2)}`;
                                }
                            };
                            b.appendChild(t);
                        }
                    },
                    cashout() {
                        Mec.curr.saldo += (10 * this.multiplier);
                        this.end(true);
                    },
                    end(win) {
                        this.playing = false;
                        document.getElementById('m-btn-start').style.display = 'block';
                        document.getElementById('m-btn-cash').style.display = 'none';
                        document.getElementById('m-msg').innerText = win ? "VOCÊ GANHOU!" : "BOMBA! VOCÊ PERDEU.";
                        if(win) Mec.curr.lvl += 1;
                        Mec.System.saveAndSync();
                    }
                }
            },

            System: {
                startApp() {
                    document.getElementById('scr-auth').classList.remove('active');
                    document.getElementById('navbar').style.display = 'flex';
                    if(Mec.curr.role === 'admin') {
                        document.getElementById('scr-admin').classList.add('active');
                        document.getElementById('nav-shark').style.display = 'block';
                    } else {
                        document.getElementById('scr-lobby').classList.add('active');
                    }
                    this.syncUI();
                    Mec.Game.Mines.render();
                },
                syncUI() {
                    document.getElementById('u-saldo').innerText = `R$ ${Mec.curr.saldo.toFixed(2)}`;
                    document.getElementById('m-saldo').innerText = `R$ ${Mec.curr.saldo.toFixed(2)}`;
                    document.getElementById('u-lvl').innerText = `LVL ${Mec.curr.lvl}`;
                    if(Mec.curr.role === 'admin') this.loadAdmin();
                },
                save() { localStorage.setItem('MEC_INFINITY_DB', JSON.stringify(Mec.db)); },
                saveAndSync() { this.save(); this.syncUI(); },
                loadAdmin() {
                    const list = document.getElementById('adm-user-list');
                    list.innerHTML = Mec.db.filter(u => u.role !== 'admin').map(u => `
                        <div class="shark-row">
                            <div><span class="status-dot" style="background:var(--g)"></span><b>${u.user}</b><br><small>SALDO: R$ ${u.saldo.toFixed(2)}</small></div>
                            <div style="display:flex; gap:5px;">
                                <button onclick="Mec.System.admMod('${u.user}', 100)" style="background:var(--g); border:none; padding:8px; border-radius:8px;"><i class="fa-solid fa-plus"></i></button>
                                <button onclick="Mec.System.admMode('${u.user}', 'win')" style="background:var(--gold); border:none; padding:8px; border-radius:8px;"><i class="fa-solid fa-trophy"></i></button>
                                <button onclick="Mec.System.admMode('${u.user}', 'lose')" style="background:var(--danger); border:none; padding:8px; border-radius:8px;"><i class="fa-solid fa-skull"></i></button>
                            </div>
                        </div>
                    `).join('');
                },
                admMod(name, val) {
                    let u = Mec.db.find(x => x.user === name);
                    u.saldo += val; this.saveAndSync();
                },
                admMode(name, mode) {
                    let u = Mec.db.find(x => x.user === name);
                    u.mode = mode; this.saveAndSync();
                    alert(`USUÁRIO ${name} AGORA EM MODO: ${mode.toUpperCase()}`);
                },
                fakeFeed() {
                    const names = ['JP_ELITE', 'MARCOS_01', 'ANA_BET', 'SHARK_99', 'PLAYER_Vip'];
                    setInterval(() => {
                        const n = names[Math.floor(Math.random()*names.length)];
                        const v = (Math.random()*500).toFixed(2);
                        document.getElementById('win-alert').innerText = `[LIVE] ${n} ACABOU DE GANHAR R$ ${v} NO MINES!`;
                    }, 5000);
                }
            },

            Router: {
                go(id) {
                    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                    document.getElementById(id).classList.add('active');
                    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                }
            }
        };
    </script>
</body>
</html>
