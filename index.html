<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | LOG-PRO V18</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --inbound: #ffcc00; --outbound: #00ff41; --reversa: #ff3b30; --shark: #0a84ff; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; background: var(--bg); }
        .active { display: flex !important; }
        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #050505; font-family: 'Orbitron'; font-size: 10px; }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .btn { width: 100%; padding: 18px; border: none; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; border-radius: 5px; margin-bottom: 10px; transition: 0.2s; }
        .btn-main { background: var(--primary); color: #000; }
        .display { flex: 1; margin: 15px; border: 2px solid var(--primary); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background: #050505; }
        #flash { position: absolute; width: 100%; height: 100%; background: var(--primary); color: #000; display: none; justify-content: center; align-items: center; font-family: 'Orbitron'; font-size: 25px; z-index: 10; }
        input, select { width: 100%; padding: 14px; background: #111; border: 1px solid #333; color: #fff; font-family: 'Orbitron'; font-size: 10px; border-radius: 5px; margin-bottom: 10px; box-sizing: border-box; }
        .kpi { background: #080808; border-left: 4px solid var(--primary); padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #222; }
        .kpi b { font-family: 'Orbitron'; color: var(--primary); font-size: 18px; }
    </style>
</head>
<body onload="boot()">

<div id="flash">OK ✓</div>

<div id="scr-login" class="screen active">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px;">
        <h1 style="font-family:'Orbitron'; color:#151515; font-size:40px; letter-spacing:8px;">JP DIAS</h1>
        <input type="password" id="pass" placeholder="CHAVE DE ACESSO">
        <button class="btn btn-main" onclick="entrar()">CONECTAR</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span>SHARK DASHBOARD</span> <button onclick="location.reload()" style="color:var(--reversa); background:none; border:none;">SAIR</button></header>
    <div class="scroll">
        <div class="kpi"><small>BIPES TOTAIS HOJE</small><br><b id="shark-total">0</b></div>
        <div class="kpi" style="border-left-color:var(--shark)"><small>FILA NUVEM PENDENTE</small><br><b id="shark-queue">0</b></div>
        <button class="btn" style="background:var(--shark); color:#fff;" onclick="exportar()">BAIXAR RELATÓRIO (.TXT)</button>
        <div id="log-feed" style="font-size:9px; color:#555; font-family:monospace; margin-top:10px;"></div>
    </div>
</div>

<div id="scr-setup" class="screen">
    <header><span>CONFIGURAÇÃO</span></header>
    <div class="scroll">
        <label style="font-size:10px; color:var(--primary)">QUEM É VOCÊ?</label>
        <select id="sel-operador">
            <option value="OP-01">OPERADOR 01</option>
            <option value="OP-02">OPERADOR 02</option>
            <option value="GESTOR">GESTOR DE PÁTIO</option>
        </select>
        <label style="font-size:10px; color:var(--primary)">QUAL A ESTAÇÃO?</label>
        <button class="btn" style="background:var(--inbound)" onclick="abrirModulo('INBOUND', 'var(--inbound)')">INBOUND (ENTRADA)</button>
        <button class="btn" style="background:var(--outbound)" onclick="abrirModulo('OUTBOUND', 'var(--outbound)')">OUTBOUND (SAÍDA)</button>
        <button class="btn" style="background:var(--reversa); color:#fff" onclick="abrirModulo('REVERSA', 'var(--reversa)')">REVERSA/AVARIA</button>
    </div>
</div>

<div id="scr-operacao" class="screen">
    <header><span id="txt-modulo">OPERANDO</span> <button onclick="ir('scr-setup')" style="color:#555; border:none; background:none;">TROCAR</button></header>
    <div id="area-display" class="display">
        <h2 id="val-lido" style="font-family:'Orbitron';">AGUARDANDO</h2>
        <input type="text" id="scan-hidden" style="position:absolute; opacity:0;">
    </div>
    <div style="padding:20px; background:#080808; border-top:1px solid #222;">
        <div id="meta-extra" style="display:none;">
            <input type="text" id="inp-meta" placeholder="PLACA OU ROTA">
        </div>
        <input type="text" id="manual" placeholder="BIPE OU DIGITE">
        <button id="btn-acao" class="btn btn-main" onclick="registrar(true)">CONFIRMAR</button>
    </div>
</div>

<script>
    let CORE = { logs: [], queue: [], op: "", mod: "", cor: "", token: "JP_DIAS_2026" };
    const GOOGLE_URL = "SEU_LINK_AQUI"; 

    function boot() {
        const saved = localStorage.getItem('JPD_V18');
        if(saved) CORE = JSON.parse(saved);
        setInterval(sync, 5000);
        updateUI();
    }

    function entrar() {
        const p = document.getElementById('pass').value;
        if(p === "9910") ir('scr-shark');
        else if(p === "1234") ir('scr-setup');
    }

    function ir(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function abrirModulo(m, c) {
        CORE.mod = m; CORE.cor = c;
        CORE.op = document.getElementById('sel-operador').value;
        document.getElementById('txt-modulo').innerText = m;
        document.getElementById('area-display').style.borderColor = c;
        document.getElementById('val-lido').style.color = c;
        document.getElementById('btn-acao').style.background = c;
        document.getElementById('meta-extra').style.display = (m === 'OUTBOUND') ? 'block' : 'none';
        ir('scr-operacao');
        focar();
    }

    function registrar(manual) {
        const inp = manual ? document.getElementById('manual') : document.getElementById('scan-hidden');
        const val = inp.value.trim().toUpperCase();
        const extra = document.getElementById('inp-meta').value || "N/A";

        if(val && val !== CORE.last) {
            const entry = { h: new Date().toLocaleString(), c: val, op: CORE.op, m: CORE.mod, ex: extra, tk: CORE.token };
            CORE.logs.push(entry);
            CORE.queue.push(entry);
            CORE.last = val;
            feedback(c => {
                document.getElementById('val-lido').innerText = val;
                inp.value = "";
                updateUI();
                focar();
            });
        }
    }

    function sync() {
        if(CORE.queue.length > 0 && navigator.onLine) {
            fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(CORE.queue[0]) })
            .then(() => { CORE.queue.shift(); updateUI(); });
        }
    }

    function updateUI() {
        document.getElementById('shark-total').innerText = CORE.logs.length;
        document.getElementById('shark-queue').innerText = CORE.queue.length;
        localStorage.setItem('JPD_V18', JSON.stringify(CORE));
    }

    function feedback(cb) {
        const f = document.getElementById('flash');
        f.style.background = CORE.cor; f.style.display = 'flex';
        setTimeout(() => { f.style.display = 'none'; cb(); }, 250);
    }

    function focar() { setTimeout(() => document.getElementById('scan-hidden').focus(), 400); }
    function exportar() {
        let t = "JP DIAS LOG-PRO - RELATORIO MASTER\n";
        CORE.logs.forEach(l => t += `${l.h} | ${l.c} | ${l.m} | ${l.op}\n`);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([t], {type:'text/plain'}));
        a.download = "LOGPRO_SHARK.txt"; a.click();
    }
    document.addEventListener('click', () => { if(document.getElementById('scr-operacao').classList.contains('active')) focar(); });
</script>
</body>
</html>
