<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BANK | V45 SHARK CONTROL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --p: #00ffa3; --bg: #000; --card: rgba(15, 15, 15, 0.8); --brd: rgba(255, 255, 255, 0.08); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* HEADER PREMIUM */
        header { height: 85px; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--brd); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; position: fixed; top: 0; width: 100%; z-index: 1000; }
        .u-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 14px; background: linear-gradient(135deg, #111, #000); border: 1px solid var(--p); display: flex; align-items: center; justify-content: center; color: var(--p); font-weight: 900; box-shadow: 0 0 15px rgba(0,255,163,0.2); }

        /* VIEWS */
        .view { position: absolute; inset: 0; display: none; padding: 105px 20px 100px; overflow-y: auto; animation: slideUp 0.4s ease; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* CARDS E PRIVACIDADE */
        .card { background: var(--card); border: 1px solid var(--brd); border-radius: 28px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); transition: 0.3s; }
        .val-hide { filter: blur(10px); opacity: 0.1; transition: 0.4s; pointer-events: none; }
        .val-show { filter: blur(0); opacity: 1; }
        .eye-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--p); }

        /* BOTÕES DE AÇÃO */
        .grid-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 25px 0; }
        .action-btn { background: var(--card); border: 1px solid var(--brd); border-radius: 20px; padding: 15px 5px; text-align: center; transition: 0.2s; }
        .action-btn:active { transform: scale(0.9); background: var(--p); color: #000; }
        .action-btn i { font-size: 20px; color: var(--p); margin-bottom: 8px; display: block; }
        .action-btn span { font-size: 10px; font-weight: 700; color: #888; }

        /* CARTÃO VIRTUAL MASTER */
        .card-virtual { background: linear-gradient(135deg, #0a0a0a, #000); height: 210px; border-radius: 25px; border: 1px solid #222; padding: 25px; position: relative; overflow: hidden; }
        .card-virtual::before { content: ''; position: absolute; top: -20%; right: -10%; width: 150px; height: 150px; background: var(--p); filter: blur(80px); opacity: 0.05; }

        /* NAV BAR */
        nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px; background: rgba(15,15,15,0.9); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid var(--brd); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #444; text-decoration: none; text-align: center; font-size: 10px; font-weight: 800; }
        .nav-item.active { color: var(--p); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }

        /* ADMIN SECTION */
        .admin-stat { background: var(--p); color: #000; padding: 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body onload="Shark.init()">

    <header>
        <div class="u-info">
            <div class="avatar" id="avatar-char">J</div>
            <div>
                <div style="font-size:13px; font-weight:800;" id="user-display">JP DIAS</div>
                <div style="font-size:9px; color:var(--p); font-weight:800; letter-spacing:1px;">SHARK PLATINUM</div>
            </div>
        </div>
        <div class="eye-icon" onclick="Shark.toggleEye()">
            <i class="fa-solid fa-eye" id="master-eye"></i>
        </div>
    </header>

    <div id="scr-home" class="view active">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <small style="color:#555; font-weight:800; font-size:10px; letter-spacing:1px;">SALDO EM CONTA</small>
                <i class="fa-solid fa-chevron-right" style="color:#222; font-size:10px;"></i>
            </div>
            <h1 style="font-size:38px; margin:10px 0; font-weight:900; letter-spacing:-1px;">R$ <span id="bal-main" class="val-hide">1.450.000,00</span></h1>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button style="flex:1; background:var(--p); color:#000; border:none; padding:15px; border-radius:14px; font-weight:900; font-size:12px;">DEPÓSITO</button>
                <button style="flex:1; background:#111; color:#fff; border:1px solid #222; padding:15px; border-radius:14px; font-weight:900; font-size:12px;">CARTÕES</button>
            </div>
        </div>

        <div class="grid-actions">
            <div class="action-btn"><i class="fa-solid fa-bolt"></i><span>PIX</span></div>
            <div class="action-btn"><i class="fa-solid fa-barcode"></i><span>BOLETOS</span></div>
            <div class="action-btn" onclick="Shark.nav('scr-admin', this)"><i class="fa-solid fa-shield-halved"></i><span>ADMIN</span></div>
            <div class="action-btn"><i class="fa-solid fa-ellipsis"></i><span>MAIS</span></div>
        </div>

        <div class="card-virtual">
            <div style="display:flex; justify-content:space-between;">
                <span style="font-family:'Orbitron'; font-size:12px; letter-spacing:2px; color:var(--p);">SHARK BANK</span>
                <i class="fa-solid fa-signal" style="color:#333;"></i>
            </div>
            <div style="margin-top:50px; font-size:20px; letter-spacing:4px; color:#444;">•••• •••• •••• 8835</div>
            <div style="margin-top:35px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <small style="color:#333; font-weight:800; display:block; margin-bottom:4px;">LIMITE DISPONÍVEL</small>
                    <b style="font-size:18px;">R$ <span id="bal-card" class="val-hide">50.000,00</span></b>
                </div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png" width="45" style="opacity:0.4;">
            </div>
        </div>
    </div>

    <div id="scr-admin" class="view">
        <div class="admin-stat">
            <div>
                <small style="font-weight:900; font-size:10px;">GGR DA BANCA</small>
                <h2 style="font-size:28px; font-weight:900;">R$ 1.450.850,00</h2>
            </div>
            <i class="fa-solid fa-chart-line" style="font-size:30px;"></i>
        </div>
        <div class="card">
            <canvas id="sharkChart" style="max-height: 250px;"></canvas>
        </div>
        <div class="card" style="text-align:center;">
            <p style="color:#555; font-size:11px; margin-bottom:15px;">UPLOAD DE FLUXO (XLSX)</p>
            <button style="background:none; border:2px dashed var(--p); color:var(--p); padding:20px; width:100%; border-radius:15px; font-weight:900;">
                <i class="fa-solid fa-cloud-arrow-up"></i> SINCRONIZAR PLANILHA
            </button>
        </div>
    </div>

    <nav id="main-nav">
        <a class="nav-item active" onclick="Shark.nav('scr-home', this)"><i class="fa-solid fa-house"></i>Início</a>
        <a class="nav-item"><i class="fa-solid fa-wallet"></i>Extrato</a>
        <a class="nav-item"><i class="fa-solid fa-briefcase"></i>Jobs</a>
        <a class="nav-item" onclick="location.reload()" style="color:#ff4444;"><i class="fa-solid fa-power-off"></i>Sair</a>
    </nav>

    <script>
        const Shark = {
            isHidden: true,
            init() {
                this.initChart();
            },
            toggleEye() {
                this.isHidden = !this.isHidden;
                const eye = document.getElementById('master-eye');
                const balances = [document.getElementById('bal-main'), document.getElementById('bal-card')];
                
                balances.forEach(b => {
                    if (this.isHidden) {
                        b.classList.remove('val-show');
                        b.classList.add('val-hide');
                        eye.classList.replace('fa-eye-slash', 'fa-eye');
                    } else {
                        b.classList.remove('val-hide');
                        b.classList.add('val-show');
                        eye.classList.replace('fa-eye', 'fa-eye-slash');
                    }
                });
            },
            nav(id, el) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(el && el.tagName === 'A') {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    el.classList.add('active');
                }
            },
            initChart() {
                const ctx = document.getElementById('sharkChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'],
                        datasets: [{
                            label: 'Lucro Operacional',
                            data: [12000, 19000, 15000, 25000, 22000, 30000],
                            borderColor: '#00ffa3',
                            tension: 0.4,
                            borderWidth: 3,
                            pointRadius: 0,
                            fill: true,
                            backgroundColor: 'rgba(0, 255, 163, 0.05)'
                        }]
                    },
                    options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, border: { display: false } } } }
                });
            }
        };
    </script>
</body>
</html>
