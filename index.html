<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v83 ULTRA | JP DIAS MASTER</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compatibility.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compatibility.js"></script>

    <style>
        :root { --p: #00ff41; --bg: #000; --card: #080808; --brd: #151515; --danger: #ff3131; --blue: #00d4ff; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; font-size: 10px; height: 100vh; overflow: hidden; }
        
        /* HEADER SHARK */
        header { padding: 12px 15px; background: #050505; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; z-index: 100; font-family: 'Orbitron'; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--p); box-shadow: 0 0 10px var(--p); margin-right: 5px; }
        .offline { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* SCREENS */
        .screen { display: none; height: 100vh; flex-direction: column; background: #000; }
        .active { display: flex !important; }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 120px; }

        /* BOTÕES E INPUTS */
        .card { background: var(--card); border: 1px solid var(--brd); border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        input, select, textarea { width: 100%; padding: 14px; background: #000; border: 1px solid #222; color: var(--p); border-radius: 5px; font-family: 'Orbitron'; margin-bottom: 10px; font-size: 11px; }
        input:focus { border-color: var(--p); }
        .btn { width: 100%; padding: 16px; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-p { background: var(--p); color: #000; }
        .btn-p:active { transform: scale(0.98); background: #00cc33; }
        .btn-dark { background: #111; color: #fff; border: 1px solid #222; }

        /* MODO DE OPERAÇÃO */
        .grid-modos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .btn-m { background: #0a0a0a; border: 1px solid #222; padding: 12px 2px; border-radius: 4px; font-size: 8px; text-align: center; color: #444; font-weight: 900; cursor: pointer; }
        .btn-m.active { border-color: var(--p); color: var(--p); background: rgba(0,255,101,0.05); box-shadow: inset 0 0 10px rgba(0,255,65,0.1); }

        /* LISTA REAL-TIME */
        .row-viva { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #111; font-size: 11px; align-items: center; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .badge { background: rgba(0,255,65,0.1); color: var(--p); padding: 3px 8px; border-radius: 3px; font-weight: 900; border: 1px solid rgba(0,255,65,0.2); }

        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid #222; margin-bottom: 10px; background: #050505; min-height: 180px; }
        
        /* DWS STATS */
        .dws-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .dws-item { background: #050505; border: 1px solid #111; padding: 10px; border-radius: 5px; text-align: center; }
        .dws-item label { font-size: 7px; color: #555; display: block; margin-bottom: 4px; }
        .dws-item span { font-family: 'Orbitron'; font-size: 13px; color: var(--blue); }

        /* MASTER PANEL */
        #shark-panel { display: none; border: 1px dashed var(--p); padding: 15px; border-radius: 10px; margin-top: 15px; background: rgba(0,255,65,0.02); }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active" style="align-items:center; justify-content:center; text-align:center;">
    <div style="font-family:'Orbitron'; color:var(--p); font-size:40px; font-weight:900; line-height:0.8;">LOG-PRO<br><span style="font-size:10px; color:#333; letter-spacing:8px;">V83 ULTRA</span></div>
    <div style="width:260px; margin-top:40px;">
        <input type="password" id="pin" placeholder="PIN MASTER" style="text-align:center; font-size:20px; letter-spacing:10px; border: 1px solid var(--p);">
        <button class="btn btn-p" onclick="auth()">INICIAR OPERAÇÃO</button>
    </div>
</div>

<div id="scr-app" class="screen">
    <header>
        <div><span id="net-dot" class="status-dot"></span> <span id="user-display">OP: TERMINAL</span></div>
        <div id="clock">00:00:00</div>
    </header>

    <div class="scroll">
        <div class="grid-modos">
            <div class="btn-m active" id="m-ENTRADA" onclick="setModo('ENTRADA')">ENTRADA</div>
            <div class="btn-m" id="m-SEPARACAO" onclick="setModo('SEPARACAO')">SEP.</div>
            <div class="btn-m" id="m-AVARIA" onclick="setModo('AVARIA')">AVARIA</div>
            <div class="btn-m" id="m-SAIDA" onclick="setModo('SAIDA')">SAÍDA</div>
        </div>

        <div id="reader"></div>
        <button id="btn-cam" class="btn btn-dark" onclick="toggleCamera()"><i class="fa-solid fa-barcode"></i> ATIVAR SCANNER</button>

        <div class="card" style="display:flex; justify-content:space-between; align-items:center; margin-top:15px; border-left: 4px solid var(--p);">
            <div>
                <small style="color:#444; font-size:8px;">LAST SCAN</small>
                <div id="last-code" style="font-family:'Orbitron'; font-size:22px; color:var(--p);">---</div>
            </div>
            <div id="fb-msg" style="font-weight:900; font-size:10px; color:var(--blue); text-align:right;">READY</div>
        </div>

        <div class="dws-grid">
            <div class="dws-item"><label>WEIGHT (KG)</label><span id="dws-peso">0.00</span></div>
            <div class="dws-item"><label>VOL (M³)</label><span id="dws-vol">0.000</span></div>
        </div>

        <div class="card" style="margin-top:15px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="font-family:'Orbitron'; font-size: 8px; color:var(--p); margin:0;">PENDÊNCIAS DA DOCA</h3>
                <span id="count-carga" class="badge" style="background:var(--p); color:#000;">0</span>
            </div>
            <div id="lista-viva"></div>
        </div>

        <div id="shark-panel">
            <h3 style="font-family:'Orbitron'; font-size: 9px; color:var(--p);">MASTER COMMAND CENTER</h3>
            <textarea id="bulk-input" placeholder="FORMATO: CÓDIGO, QUANTIDADE (Lançar Carga)"></textarea>
            <button class="btn btn-p" onclick="dispararCarga()">DISPARAR PARA TERMINAIS</button>
            <button class="btn btn-dark" style="margin-top:10px; color:var(--blue);" onclick="exportarRelatorio()">EXPORTAR LOGS ROI (CSV)</button>
            <button class="btn btn-dark" style="margin-top:5px; color:var(--danger); font-size:8px;" onclick="resetarDoca()">LIMPAR DOCAS</button>
        </div>
    </div>
</div>

<script>
    // --- 1. CONFIGURAÇÃO FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyDRDhONvvzZmo2csXksqHs6E6vV3MuvLSs",
        projectId: "log-pro-jp",
        appId: "1:481645607846:web:fd55dd943718ad78386d67"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const sync = new BroadcastChannel('logpro_ultra_v83');
    
    let modoAtivo = 'ENTRADA';
    let userRole = 'OP';
    let camOn = false;
    let scanner;

    // --- 2. INTELIGÊNCIA DE VOZ E HAPTIC ---
    function falar(t, erro = false) {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'pt-BR'; u.rate = 1.1;
        window.speechSynthesis.speak(u);
        if(navigator.vibrate) navigator.vibrate(erro ? [150, 50, 150] : 80);
    }

    // --- 3. SINCRONIZAÇÃO DE MODO (BROADCAST) ---
    function setModo(m) {
        modoAtivo = m;
        document.querySelectorAll('.btn-m').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m.replace('Í','I').replace('Ç','C')).classList.add('active');
        sync.postMessage({ type: 'MODO', val: m });
        falar("MODO " + m);
    }
    sync.onmessage = (e) => { if(e.data.type === 'MODO') setModo(e.data.val); };

    // --- 4. CÉREBRO LOGÍSTICO (BIPE) ---
    async function processarBipe(codigo) {
        const cod = codigo.trim();
        if(!cod) return;
        
        document.getElementById('last-code').innerText = cod;
        document.getElementById('fb-msg').innerText = "SYNC...";

        try {
            // Auditoria em tempo real
            await db.collection("logs").add({
                cod, modo: modoAtivo, op: userRole, ts: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Inteligência DWS (Peso Simulado)
            const peso = (Math.random() * 3).toFixed(2);
            document.getElementById('dws-peso').innerText = peso;
            document.getElementById('dws-vol').innerText = "0.00" + Math.floor(Math.random()*9);

            if(modoAtivo === 'SEPARACAO') {
                const ref = db.collection("carga").doc(cod);
                const d = await ref.get();
                if(d.exists && d.data().falta > 0) {
                    await ref.update({ falta: firebase.firestore.FieldValue.increment(-1) });
                    falar("OK");
                    updateFB("CONFERIDO", "var(--p)");
                } else {
                    falar("ITEM FORA DA LISTA", true);
                    updateFB("NÃO CONSTA", "var(--danger)");
                }
            } else {
                falar("REGISTRADO");
                updateFB("SUCESSO", "var(--p)");
            }
        } catch(e) { console.error(e); }
    }

    function updateFB(t, c) {
        const el = document.getElementById('fb-msg');
        el.innerText = t; el.style.color = c;
    }

    // --- 5. COMANDOS MASTER (SHARK) ---
    async function dispararCarga() {
        const linhas = document.getElementById('bulk-input').value.split('\n');
        const batch = db.batch();
        linhas.forEach(l => {
            const [c, q] = l.split(',');
            if(c && q) batch.set(db.collection("carga").doc(c.trim()), { falta: parseInt(q) });
        });
        await batch.commit();
        falar("CARGA LANÇADA PARA DOCAS");
        document.getElementById('bulk-input').value = "";
    }

    async function exportarRelatorio() {
        const snap = await db.collection("logs").orderBy("ts", "desc").limit(100).get();
        let csv = "DATA,MODO,CODIGO,OPERADOR\n";
        snap.forEach(d => { 
            const l = d.data(); 
            csv += `${l.ts?.toDate().toLocaleString() || ''},${l.modo},${l.cod},${l.op}\n`; 
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `LOGPRO_ROI_SHARK.csv`;
        a.click();
    }

    async function resetarDoca() {
        if(confirm("LIMPAR TODA A CARGA?")) {
            const snap = await db.collection("carga").get();
            snap.forEach(d => d.ref.delete());
        }
    }

    // --- 6. SISTEMA E CÂMERA ---
    function auth() {
        const p = document.getElementById('pin').value;
        if(p === "7979") {
            userRole = 'SHARK MASTER';
            document.getElementById('shark-panel').style.display = 'block';
            document.getElementById('user-display').innerText = "JP | SHARK MASTER";
        }
        document.getElementById('scr-login').classList.remove('active');
        document.getElementById('scr-app').classList.add('active');
        falar("TERMINAL ATIVO");
        initScanner();
    }

    async function toggleCamera() {
        if(!camOn) {
            await scanner.start({ facingMode: "environment" }, { fps: 25, qrbox: 250 }, (t) => processarBipe(t));
            camOn = true; document.getElementById('btn-cam').style.background = "var(--danger)";
        } else {
            await scanner.stop(); camOn = false; document.getElementById('btn-cam').style.background = "#111";
        }
    }

    function initScanner() { scanner = new Html5Qrcode("reader"); }

    // --- 7. LISTENERS REAL-TIME ---
    db.collection("carga").onSnapshot(snap => {
        const list = document.getElementById('lista-viva');
        let count = 0;
        list.innerHTML = "";
        snap.forEach(d => {
            if(d.data().falta > 0) {
                count++;
                list.innerHTML += `<div class="row-viva"><span>📦 ${d.id}</span><span class="badge">${d.data().falta} UN</span></div>`;
            }
        });
        document.getElementById('count-carga').innerText = count;
    });

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        document.getElementById('net-dot').className = navigator.onLine ? "status-dot" : "status-dot offline";
    }, 1000);

    window.init = () => { console.log("LOG-PRO V83 ULTRA - VISÃO SHARK ON"); };
</script>
</body>
</html>
