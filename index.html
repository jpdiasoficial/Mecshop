<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEC-BET OS | COMPLETE ECOSYSTEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #ff5e00; --g: #00ff41; --bg: #050505; --card: #0f0f0f; --brd: #1c1c1c; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; outline: none; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* UI ESTRUTURAL */
        header { height: 70px; background: #000; border-bottom: 1px solid var(--brd); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 100; }
        .view { position: absolute; inset: 70px 0 85px 0; display: none; overflow-y: auto; background: var(--bg); padding: 15px; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* PAINEL ADMIN (O CÉREBRO) */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border: 1px solid var(--brd); padding: 15px; border-radius: 15px; }
        .stat-card small { color: #666; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .stat-card h2 { font-family: 'Orbitron'; font-size: 18px; color: var(--g); margin-top: 5px; }

        /* GAME UI (O CORAÇÃO) */
        .game-box { height: 280px; background: #000; border-radius: 25px; border: 1px solid var(--brd); position: relative; overflow: hidden; margin-bottom: 15px; }
        #chart { width: 100%; height: 100%; }
        #mult { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Orbitron'; font-size: 60px; font-weight: 900; pointer-events: none; text-shadow: 0 0 20px rgba(255,255,255,0.2); }

        /* CONTROLES */
        .bet-area { background: var(--card); border: 1px solid var(--brd); border-radius: 20px; padding: 20px; }
        .btn { border: none; border-radius: 15px; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; width: 100%; }
        .btn-play { height: 65px; background: var(--p); color: #fff; font-size: 18px; box-shadow: 0 5px 0 #9c3a00; }
        .btn-cash { height: 65px; background: var(--g); color: #000; font-size: 18px; box-shadow: 0 5px 0 #009c27; }
        .btn:active { transform: translateY(3px); box-shadow: none; }

        /* NAVBAR */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: #000; border-top: 1px solid var(--brd); display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; }
        .nav-item { color: #444; text-align: center; font-size: 10px; font-weight: 700; cursor: pointer; }
        .nav-item.active { color: var(--p); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; }

        /* TABELA ADMIN */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: #444; font-size: 10px; padding: 10px; border-bottom: 1px solid var(--brd); }
        td { padding: 12px 10px; border-bottom: 1px solid #111; font-size: 13px; }
        .badge-lose { background: rgba(255,0,0,0.1); color: red; padding: 4px 8px; border-radius: 5px; font-size: 10px; font-weight: 900; }
    </style>
</head>
<body onload="Core.boot()">

    <header>
        <div style="font-family:'Orbitron'; font-weight:900; color:var(--p)">MEC-BET <span style="color:#fff">OS</span></div>
        <div style="background:#111; padding:8px 15px; border-radius:10px; border:1px solid #222; color:var(--g); font-weight:900;">
            R$ <span id="top-bal">0.00</span>
        </div>
    </header>

    <div id="v-admin" class="view">
        <h3 style="margin-bottom:15px; font-weight:800;">RELATÓRIO 24H</h3>
        <div class="stats-grid">
            <div class="stat-card"><small>GGR Total</small><h2 id="st-ggr">R$ 0.00</h2></div>
            <div class="stat-card"><small>Ativos</small><h2 id="st-users">0</h2></div>
            <div class="stat-card"><small>Depósitos</small><h2 style="color:#fff" id="st-dep">R$ 0.00</h2></div>
            <div class="stat-card"><small>Saques</small><h2 style="color:red" id="st-out">R$ 0.00</h2></div>
        </div>
        
        <h3 style="margin:20px 0 10px; font-weight:800;">JOGADORES EM TEMPO REAL</h3>
        <div id="user-table-container" style="background:var(--card); border-radius:15px; border:1px solid var(--brd);">
            <table>
                <thead><tr><th>PLAYER</th><th>SALDO</th><th>STATUS</th><th>AÇÃO</th></tr></thead>
                <tbody id="user-list"></tbody>
            </table>
        </div>
    </div>

    <div id="v-game" class="view">
        <div class="game-box">
            <canvas id="chart"></canvas>
            <div id="mult">1.00x</div>
        </div>
        <div class="bet-area">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
                <span style="font-weight:800; color:#555">VALOR DA APOSTA</span>
                <b style="font-size:20px">R$ <span id="bet-display">10</span></b>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
                <button class="btn" style="background:#222; color:#fff; height:45px;" onclick="Core.Game.adj(-10)">-10</button>
                <button class="btn" style="background:#222; color:#fff; height:45px;" onclick="Core.Game.adj(10)">+10</button>
            </div>
            <button id="btn-play" class="btn btn-play" onclick="Core.Game.start()">INICIAR RODADA</button>
            <button id="btn-cash" class="btn btn-cash" style="display:none;" onclick="Core.Game.cashout()">CASH OUT</button>
        </div>
    </div>

    <div id="v-wallet" class="view">
        <div class="stat-card" style="padding:40px; text-align:center;">
            <i class="fa-solid fa-wallet" style="font-size:50px; color:var(--p); margin-bottom:20px;"></i>
            <p style="color:#666">SALDO DISPONÍVEL</p>
            <h1 style="font-size:40px; margin:10px 0;" id="wall-bal">R$ 0.00</h1>
            <button class="btn btn-cash" style="margin-top:20px;" onclick="Core.Sys.deposit()">DEPOSITAR VIA PIX</button>
        </div>
    </div>

    <nav>
        <div class="nav-item" id="n-admin" onclick="Core.Router.go('v-admin', this)"><i class="fa-solid fa-chart-pie"></i>ADM</div>
        <div class="nav-item active" onclick="Core.Router.go('v-game', this)"><i class="fa-solid fa-rocket"></i>JOGAR</div>
        <div class="nav-item" onclick="Core.Router.go('v-wallet', this)"><i class="fa-solid fa-wallet"></i>CARTEIRA</div>
    </nav>

    <script>
        const Core = {
            state: {
                user: null,
                db: JSON.parse(localStorage.getItem('MEC_DB_V_FINAL')) || [],
                stats: JSON.parse(localStorage.getItem('MEC_STATS')) || { ggr: 0, dep: 0, out: 0 },
                game: { running: false, m: 1.00, bet: 10 }
            },

            boot() {
                // Login automático para teste
                let session = sessionStorage.getItem('MEC_SESS');
                if(!session) {
                    session = "PLAYER_" + Math.floor(Math.random()*999);
                    sessionStorage.setItem('MEC_SESS', session);
                }
                
                let u = this.state.db.find(x => x.name === session);
                if(!u) {
                    u = { name: session, bal: 100, role: (session.includes('ADMIN') ? 'admin' : 'user'), mode: 'auto' };
                    this.state.db.push(u);
                }
                this.state.user = u;
                this.Router.go('v-game', document.querySelectorAll('.nav-item')[1]);
                this.Sys.sync();
            },

            Game: {
                cvs: null, ctx: null, pts: [],
                adj(v) { Core.state.game.bet = Math.max(10, Core.state.game.bet + v); Core.Sys.sync(); },
                start() {
                    if(Core.state.user.bal < Core.state.game.bet) return alert("SALDO INSUFICIENTE");
                    Core.state.user.bal -= Core.state.game.bet;
                    Core.state.stats.dep += Core.state.game.bet; // Simula entrada no GGR
                    Core.Sys.sync();
                    
                    this.cvs = document.getElementById('chart'); this.ctx = this.cvs.getContext('2d');
                    this.cvs.width = this.cvs.offsetWidth; this.cvs.height = this.cvs.offsetHeight;
                    
                    document.getElementById('btn-play').style.display = 'none';
                    document.getElementById('btn-cash').style.display = 'block';
                    
                    Core.state.game.running = true;
                    Core.state.game.m = 1.00;
                    this.pts = [{x: 0, y: this.cvs.height}];

                    let limit = (Math.random() * 5 + 1.1).toFixed(2);
                    if(Core.state.user.mode === 'lose') limit = (Math.random() * 0.2 + 1.01).toFixed(2);

                    this.loop = setInterval(() => {
                        Core.state.game.m += (Core.state.game.m * 0.04);
                        document.getElementById('mult').innerText = Core.state.game.m.toFixed(2) + 'x';
                        this.draw();
                        if(Core.state.game.m >= limit) this.crash();
                    }, 100);
                },
                draw() {
                    this.ctx.clearRect(0,0,this.cvs.width, this.cvs.height);
                    let x = (Core.state.game.m - 1) * 50;
                    let y = this.cvs.height - ((Core.state.game.m - 1) * 50);
                    this.pts.push({x, y});
                    this.ctx.strokeStyle = Core.state.game.m > 2 ? '#00ff41' : '#ff5e00';
                    this.ctx.lineWidth = 5; this.ctx.beginPath();
                    this.pts.forEach((p,i) => { if(i===0) this.ctx.moveTo(p.x, p.y); else this.ctx.lineTo(p.x, p.y); });
                    this.ctx.stroke();
                },
                crash() {
                    clearInterval(this.loop);
                    Core.state.game.running = false;
                    document.getElementById('mult').style.color = 'red';
                    // Se perdeu, o valor da aposta vai pro GGR do ADM
                    Core.state.stats.ggr += Core.state.game.bet;
                    setTimeout(() => {
                        document.getElementById('btn-play').style.display = 'block';
                        document.getElementById('btn-cash').style.display = 'none';
                        document.getElementById('mult').style.color = '#fff';
                        document.getElementById('mult').innerText = '1.00x';
                        this.ctx.clearRect(0,0,this.cvs.width, this.cvs.height);
                        Core.Sys.sync();
                    }, 2000);
                },
                cashout() {
                    if(!Core.state.game.running) return;
                    let win = Core.state.game.bet * Core.state.game.m;
                    Core.state.user.bal += win;
                    Core.state.stats.out += win;
                    Core.state.game.running = false;
                    clearInterval(this.loop);
                    alert("CASH OUT: R$ " + win.toFixed(2));
                    this.crash();
                }
            },

            Sys: {
                sync() {
                    const b = Core.state.user.bal.toFixed(2);
                    document.getElementById('top-bal').innerText = b;
                    document.getElementById('wall-bal').innerText = "R$ " + b;
                    document.getElementById('bet-display').innerText = Core.state.game.bet;
                    
                    // Stats Admin
                    document.getElementById('st-ggr').innerText = "R$ " + Core.state.stats.ggr.toFixed(2);
                    document.getElementById('st-users').innerText = Core.state.db.length;
                    document.getElementById('st-dep').innerText = "R$ " + Core.state.stats.dep.toFixed(2);
                    document.getElementById('st-out').innerText = "R$ " + Core.state.stats.out.toFixed(2);

                    this.renderUsers();
                    localStorage.setItem('MEC_DB_V_FINAL', JSON.stringify(Core.state.db));
                    localStorage.setItem('MEC_STATS', JSON.stringify(Core.state.stats));
                },
                renderUsers() {
                    document.getElementById('user-list').innerHTML = Core.state.db.map(u => `
                        <tr>
                            <td><b>${u.name}</b></td>
                            <td>R$ ${u.bal.toFixed(2)}</td>
                            <td>${u.mode === 'lose' ? '<span class="badge-lose">CONTROLADO</span>' : 'NORMAL'}</td>
                            <td><button onclick="Core.Sys.setLose('${u.name}')" style="border:none; background:#222; color:#fff; padding:5px; border-radius:5px; font-size:10px;">FORCE LOSE</button></td>
                        </tr>
                    `).join('');
                },
                setLose(name) {
                    const u = Core.state.db.find(x => x.name === name);
                    u.mode = u.mode === 'lose' ? 'auto' : 'lose';
                    this.sync();
                },
                deposit() { Core.state.user.bal += 500; Core.state.stats.dep += 500; this.sync(); }
            },

            Router: {
                go(id, el) {
                    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                    document.getElementById(id).classList.add('active');
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    el.classList.add('active');
                }
            }
        };
    </script>
</body>
</html>
