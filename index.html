<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | LOG-PRO V18.9 LOTE</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #000; --inbound: #ffcc00; --outbound: #00ff41; --reversa: #ff3b30; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; background: var(--bg); }
        .active { display: flex !important; }
        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #050505; font-family: 'Orbitron'; font-size: 10px; }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .btn { width: 100%; padding: 15px; border: none; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; border-radius: 5px; margin-bottom: 10px; font-size: 12px; }
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .kpi { background: #080808; border: 1px solid #222; padding: 10px; border-radius: 5px; text-align: center; border-bottom: 2px solid var(--primary); }
        .kpi b { font-family: 'Orbitron'; color: var(--primary); font-size: 18px; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid var(--primary) !important; margin-bottom: 10px; }
        .sheet-container { background: #050505; border: 1px solid #222; border-radius: 5px; margin-top: 10px; overflow-x: auto; height: 250px; }
        table { width: 100%; border-collapse: collapse; font-size: 9px; font-family: monospace; }
        th { background: #111; color: #555; padding: 10px; text-align: left; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #111; color: #888; }
        .status-tag { padding: 2px 5px; border-radius: 3px; font-size: 8px; font-weight: bold; color: #000; }
        /* PREVIA DO LOTE NO CELULAR */
        #previa-lote { background: #0a0a0a; border: 1px solid #222; padding: 10px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px;">
        <h1 style="font-family:'Orbitron'; color:var(--primary); font-size:25px; text-align:center;">JP DIAS PRO</h1>
        <input type="password" id="pass" placeholder="SENHA" style="width:100%; padding:15px; background:#111; border:1px solid #333; color:#fff; margin-bottom:10px; text-align:center;">
        <button class="btn" style="background:var(--primary);" onclick="auth()">CONECTAR UNIDADE</button>
    </div>
</div>

<div id="scr-shark" class="screen">
    <header><span>CENTRAL DE COMANDO (SHARK)</span> <button onclick="location.reload()" style="background:none; border:none; color:var(--reversa);">SAIR</button></header>
    <div class="scroll">
        <div class="kpi-grid">
            <div class="kpi"><small>TOTAL</small><br><b id="tot-geral">0</b></div>
            <div class="kpi"><small>IN</small><br><b id="tot-in" style="color:var(--inbound)">0</b></div>
            <div class="kpi"><small>OUT</small><br><b id="tot-out" style="color:var(--outbound)">0</b></div>
        </div>
        <div class="sheet-container">
            <table id="main-table">
                <thead><tr><th>HORA</th><th>CÓDIGO</th><th>SETOR</th><th>STATUS</th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        <button class="btn" style="background:var(--reversa); color:#fff; margin-top:15px;" onclick="limpar()">LIMPAR TELA</button>
    </div>
</div>

<div id="scr-op" class="screen">
    <header><span id="txt-mod">OPERADOR</span> <button onclick="ir('scr-login')" style="background:none; border:none; color:#555;">VOLTAR</button></header>
    <div class="scroll">
        <select id="sel-mod-op" style="width:100%; padding:10px; background:#111; color:#fff; border:1px solid #333; margin-bottom:10px;">
            <option value="INBOUND">SETOR: RECEBIMENTO</option>
            <option value="OUTBOUND">SETOR: EXPEDIÇÃO</option>
        </select>
        <div id="reader"></div>
        <button class="btn" style="background:#222; color:#fff;" onclick="startScan()">ABRIR CÂMERA</button>
        
        <div id="previa-lote">
            <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:5px;">
                <span>CARGA ATUAL:</span> <b id="count-lote" style="color:var(--primary)">0 ITENS</b>
            </div>
            <div id="lista-lote" style="height:60px; overflow-y:auto; font-size:9px; color:#444; font-family:monospace; border-bottom:1px solid #222; margin-bottom:10px;"></div>
            <button class="btn" id="btn-enviar" style="background:var(--primary); color:#000; display:none;" onclick="enviarLoteParaCentral()">ENVIAR LISTA PARA CENTRAL</button>
        </div>
    </div>
</div>

<script>
    const canal = new BroadcastChannel('logpro_sync');
    let DB = { logs: [], in: 0, out: 0 };
    let LOTE_LOCAL = [];

    function auth() {
        const p = document.getElementById('pass').value;
        if(p === "9910") ir('scr-shark');
        else if(p === "1234") ir('scr-op');
    }

    function ir(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // SINCRONIA: O Shark recebe a lista enviada pelo celular
    canal.onmessage = (event) => {
        if(event.data.type === 'LOTE_OK') {
            const dadosLote = event.data.dados;
            DB.logs = [...dadosLote, ...DB.logs];
            DB.in += dadosLote.filter(d => d.m === "INBOUND").length;
            DB.out += dadosLote.filter(d => d.m === "OUTBOUND").length;
            atualizarPainel();
            beep(1200); // Som diferente para chegada de lote
        }
    };

    function processarScan(cod) {
        const mod = document.getElementById('sel-mod-op').value;
        const item = { h: new Date().toLocaleTimeString(), c: cod, m: mod };
        LOTE_LOCAL.unshift(item);
        
        // Atualiza a prévia no celular
        document.getElementById('count-lote').innerText = LOTE_LOCAL.length + " ITENS";
        document.getElementById('lista-lote').innerHTML = LOTE_LOCAL.map(i => `> ${i.c}<br>`).join('');
        document.getElementById('btn-enviar').style.display = 'block';
        
        beep(800);
    }

    function enviarLoteParaCentral() {
        if(LOTE_LOCAL.length === 0) return;
        canal.postMessage({ type: 'LOTE_OK', dados: LOTE_LOCAL });
        alert("LISTA ENVIADA!");
        LOTE_LOCAL = [];
        document.getElementById('count-lote').innerText = "0 ITENS";
        document.getElementById('lista-lote').innerHTML = "";
        document.getElementById('btn-enviar').style.display = 'none';
    }

    function startScan() {
        const scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (txt) => {
            processarScan(txt);
        });
    }

    function atualizarPainel() {
        const body = document.getElementById('table-body');
        if(!body) return;
        document.getElementById('tot-geral').innerText = DB.logs.length;
        document.getElementById('tot-in').innerText = DB.in;
        document.getElementById('tot-out').innerText = DB.out;
        body.innerHTML = DB.logs.map(l => `
            <tr>
                <td>${l.h}</td>
                <td style="color:#fff;">${l.c}</td>
                <td><span class="status-tag" style="background:${l.m === 'INBOUND' ? 'var(--inbound)' : 'var(--outbound)'}">${l.m}</span></td>
                <td style="color:var(--primary)">✓ RECEBIDO</td>
            </tr>
        `).join('');
    }

    function beep(freq) {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = freq; g.gain.value = 0.1;
        osc.start(); osc.stop(ctx.currentTime + 0.1);
    }

    function limpar() { DB = { logs: [], in: 0, out: 0 }; atualizarPainel(); }
    function init() { console.log("SINCRONIA LOTE ATIVA"); }
</script>
</body>
</html>
