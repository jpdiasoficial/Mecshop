<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MECSHOP | Intelligence System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --red: #ea1d2c; --gold: #d4af37; --dark: #050505; 
            --card: #0d0d0d; --border: #1a1a1a; --text: #f0f0f0;
        }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--text); margin: 0; overflow-x: hidden; }
        
        /* LOGIN ELITE */
        #login-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        .logo-main { font-size: 50px; font-weight: 900; letter-spacing: -2px; color: var(--red); margin: 0; text-transform: uppercase; }
        .sub-logo { font-size: 10px; letter-spacing: 5px; color: #444; margin-bottom: 30px; }
        .input-group { width: 300px; }
        input { width: 100%; padding: 18px; margin-bottom: 12px; background: #0a0a0a; border: 1px solid #222; border-radius: 12px; color: #fff; font-size: 14px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--red); outline: none; box-shadow: 0 0 15px rgba(234, 29, 44, 0.2); }
        button#btn-login { width: 100%; padding: 18px; background: var(--red); border: none; border-radius: 12px; color: #fff; font-weight: 800; cursor: pointer; text-transform: uppercase; }

        /* PAINEL DE COMANDO */
        #main-panel { display: none; padding: 40px 20px; animation: fadeIn 0.8s ease; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111; padding-bottom: 20px; margin-bottom: 40px; }
        
        /* GRADE 1-30 */
        .grid-arsenal { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { 
            background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; 
            cursor: pointer; position: relative; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:hover { transform: translateY(-10px); background: #121212; }
        .card b { font-size: 16px; display: block; margin-bottom: 5px; }
        .card span { font-size: 10px; color: #555; font-weight: 700; text-transform: uppercase; }
        .card .id-num { position: absolute; top: 15px; right: 20px; font-size: 11px; font-weight: 900; opacity: 0.2; }

        /* CATEGORIAS POR BORDAS */
        .card.micro { border-left: 4px solid #333; }
        .card.logpro { border-left: 4px solid var(--red); }
        .card.shark { border-left: 4px solid var(--gold); }

        /* MODAL DE SINCRONIZAÇÃO (PITCH) */
        #modal-sync { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; align-items: center; justify-content: center; }
        .device { width: 340px; height: 85vh; background: #fff; border-radius: 40px; border: 10px solid #1a1a1a; overflow: hidden; position: relative; color: #111; box-shadow: 0 0 50px rgba(234,29,44,0.1); }
        .device-header { background: #000; color: #fff; padding: 20px; text-align: center; font-weight: 800; font-size: 14px; letter-spacing: 1px; }
        
        .status-monitor { margin: 20px; padding: 30px 15px; background: #f8f8f8; border-radius: 25px; text-align: center; border: 1px solid #eee; transition: 0.3s; }
        .status-monitor.pulse { border-color: var(--red); box-shadow: 0 0 20px rgba(234,29,44,0.15); transform: scale(1.02); }
        .status-txt { font-size: 22px; font-weight: 900; color: var(--red); text-transform: uppercase; }

        /* COMANDOS ADM */
        .admin-controls { padding: 0 25px; display: none; }
        .btn-act { width: 100%; padding: 14px; margin-bottom: 10px; border: none; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; transition: 0.2s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 class="logo-main">MECSHOP</h1>
        <div class="sub-logo">SYSTEM INTELLIGENCE</div>
        <div class="input-group">
            <input type="text" id="user-in" placeholder="IDENTIFICAÇÃO (SHARK / JP)">
            <input type="password" id="pass-in" placeholder="CHAVE DE ACESSO">
            <button id="btn-login" onclick="execLogin()">AUTENTICAR</button>
        </div>
    </div>

    <div id="main-panel">
        <div class="nav-header">
            <div><small style="color:#555">SISTEMA ATIVO</small><br><b id="display-user"></b></div>
            <button onclick="window.location.reload()" style="background:none; border:1px solid #222; color:#fff; padding:10px 20px; border-radius:8px; cursor:pointer;">LOGOUT</button>
        </div>
        <div class="grid-arsenal" id="grid-30"></div>
    </div>

    <div id="modal-sync">
        <div class="device">
            <div class="device-header" id="m-title">MECSHOP PRO</div>
            
            <div class="status-monitor" id="status-card">
                <small style="color:#999; font-weight:700">MONITORAMENTO EM TEMPO REAL</small>
                <div id="live-status" class="status-txt">STAND BY</div>
            </div>

            <div id="shark-btns" class="admin-controls">
                <button class="btn-act" style="background:#ffa500" onclick="trigger('📦 SEPARAÇÃO INICIADA')">ORDEM SEPARAÇÃO</button>
                <button class="btn-act" style="background:#007bff" onclick="trigger('🚚 EM ROTA DE ENTREGA')">ORDEM DE SAÍDA</button>
                <button class="btn-act" style="background:#28a745" onclick="trigger('✅ ENTREGA CONCLUÍDA')">ORDEM FINALIZAR</button>
            </div>

            <div style="padding: 20px;">
                <small style="font-weight:800; font-size:10px; color:#999">RELATÓRIO DE CAMPO (OPERADOR):</small>
                <textarea id="op-note" oninput="sendNote(this.value)" style="width:100%; height:80px; margin-top:10px; border-radius:12px; border:1px solid #ddd; padding:15px; font-family:inherit; font-size:13px;" placeholder="Relate o andamento..."></textarea>
            </div>
            
            <center><button onclick="closeModal()" style="background:none; border:none; color:#bbb; cursor:pointer; margin-top:10px; font-size:12px;">FECHAR AMBIENTE</button></center>
        </div>
    </div>

<script>
    let activeRole = "";
    const modConfig = {
        1: {n:'Hortifruti Sync', t:'micro'}, 5: {n:'Barbearia VIP', t:'micro'},
        15: {n:'Sneaker Log Pro', t:'logpro'}, 16: {n:'Moda Logística', t:'logpro'},
        24: {n:'MEC-BANK', t:'shark'}, 30: {n:'HOLDING MASTER', t:'shark'}
    };

    function execLogin() {
        const u = document.getElementById('user-in').value.toLowerCase();
        const p = document.getElementById('pass-in').value;
        if(p === "9910shark" && (u === 'shark' || u === 'jp')) {
            activeRole = u;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('display-user').innerText = u.toUpperCase() + " / ARSENAL ATIVO";
            buildGrid();
        }
    }

    function buildGrid() {
        let html = "";
        for(let i=1; i<=30; i++) {
            const m = modConfig[i] || {n: 'Módulo de Escala', t: i > 20 ? 'shark' : i > 10 ? 'logpro' : 'micro'};
            html += `
                <div class="card ${m.t}" onclick="openMod('${m.n}')">
                    <div class="id-num">#${i < 10 ? '0'+i : i}</div>
                    <span>Categoria: ${m.t}</span>
                    <b>${m.n}</b>
                </div>
            `;
        }
        document.getElementById('grid-30').innerHTML = html;
    }

    function openMod(nome) {
        // Reset Real-time
        localStorage.removeItem('sync_v9');
        localStorage.removeItem('note_v9');

        document.getElementById('modal-sync').style.display = 'flex';
        document.getElementById('m-title').innerText = nome;
        document.getElementById('shark-btns').style.display = (activeRole === 'shark') ? 'block' : 'none';
        document.getElementById('live-status').innerText = "STAND BY";
        document.getElementById('op-note').value = "";
    }

    function trigger(v) {
        localStorage.setItem('sync_v9', v);
        uiUpdate(v);
    }

    function sendNote(v) {
        localStorage.setItem('note_v9', v);
    }

    function uiUpdate(v) {
        const card = document.getElementById('status-card');
        document.getElementById('live-status').innerText = v;
        card.classList.add('pulse');
        setTimeout(() => card.classList.remove('pulse'), 400);
    }

    function closeModal() { document.getElementById('modal-sync').style.display = 'none'; }

    window.addEventListener('storage', (e) => {
        if(e.key === 'sync_v9') uiUpdate(e.newValue);
        if(e.key === 'note_v9') document.getElementById('op-note').value = e.newValue;
    });
</script>
</body>
</html>
