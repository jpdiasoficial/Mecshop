<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v83 | JP DIAS SHARK</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { --p: #00ff41; --bg: #000; --card: #0a0a0a; --brd: #1a1a1a; --danger: #ff3b30; --warn: #ffae00; --info: #007aff; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-transform: uppercase; font-size: 10px; height: 100vh; overflow: hidden; }
        
        /* HEADER & STATUS */
        header { padding: 12px; background: #050505; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; z-index: 100; font-family: 'Orbitron'; color: var(--p); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--p); box-shadow: 0 0 8px var(--p); }

        /* SCREENS */
        .screen { display: none; height: 100vh; flex-direction: column; background: #000; }
        .active { display: flex; }
        .scroll { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }

        /* CARDS E INPUTS */
        .card { background: var(--card); border: 1px solid var(--brd); border-radius: 10px; padding: 15px; margin-bottom: 12px; }
        input, select, textarea { width: 100%; padding: 14px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; font-family: 'Orbitron'; margin-bottom: 10px; font-size: 12px; }
        .btn { width: 100%; padding: 16px; border: none; font-family: 'Orbitron'; font-weight: 900; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-p { background: var(--p); color: #000; }
        .btn-dark { background: #111; color: #fff; border: 1px solid #333; }

        /* MODOS E QTY */
        .grid-modos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 12px; }
        .btn-m { background: #0a0a0a; border: 1px solid #222; padding: 10px 2px; border-radius: 4px; font-size: 8px; text-align: center; color: #555; }
        .btn-m.active { border-color: var(--p); color: var(--p); background: rgba(0,255,65,0.05); }

        /* LISTAS VIVAS */
        .row-viva { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #111; font-size: 11px; }
        .badge { background: rgba(0,255,65,0.1); color: var(--p); padding: 2px 6px; border-radius: 4px; font-weight: 800; }

        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid #222; margin-bottom: 10px; background: #000; }
    </style>
</head>
<body onload="init()">

<div id="scr-login" class="screen active" style="align-items:center; justify-content:center;">
    <h1 style="font-family:'Orbitron'; color:var(--p); font-size:3rem; margin:0;">LOG-PRO</h1>
    <p style="color:#444; letter-spacing:5px;">V83 ENTERPRISE</p>
    <div style="width:250px; margin-top:30px;">
        <input type="password" id="pin" placeholder="PIN ACESSO" style="text-align:center; font-size:1.5rem;">
        <button class="btn btn-p" onclick="auth()">ACESSAR TERMINAL</button>
    </div>
</div>

<div id="scr-app" class="screen">
    <header>
        <div><span class="status-dot"></span> <span id="user-display">OP: TERMINAL</span></div>
        <div id="clock" style="font-size: 0.8rem;">00:00:00</div>
    </header>

    <div class="scroll">
        <div class="grid-modos">
            <div class="btn-m active" id="m-ENTRADA" onclick="setModo('ENTRADA')">ENTRADA</div>
            <div class="btn-m" id="m-SEPARACAO" onclick="setModo('SEPARACAO')">SEP.</div>
            <div class="btn-m" id="m-AVARIA" onclick="setModo('AVARIA')">AVARIA</div>
            <div class="btn-m" id="m-SAIDA" onclick="setModo('SAIDA')">SAÍDA</div>
        </div>

        <div id="reader"></div>
        <button id="btn-cam" class="btn btn-dark" onclick="toggleCamera()"><i class="fa-solid fa-camera"></i> LIGAR SCANNER</button>

        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <small style="color:#444;">ÚLTIMO BIPADO</small>
                <div id="last-code" style="font-family:'Orbitron'; font-size:1.5rem; color:var(--p);">---</div>
            </div>
            <div id="fb-msg" style="font-weight:900; color:var(--info);">PRONTO</div>
        </div>

        <div class="card">
            <h3 style="font-family:'Orbitron'; font-size: 0.7rem; color:var(--p);">PENDÊNCIAS DA DOCA</h3>
            <div id="lista-viva"></div>
        </div>

        <div id="shark-panel" style="display:none; border:1px dashed var(--p); padding:15px; border-radius:10px;">
            <h3 style="font-family:'Orbitron'; font-size: 0.7rem;">MASTER COMMAND</h3>
            <textarea id="bulk-input" placeholder="CÓDIGO, QUANTIDADE (Lançar Carga)"></textarea>
            <button class="btn btn-p" onclick="dispararCarga()">DISPARAR CARGA</button>
            <button class="btn btn-dark" style="margin-top:10px; color:var(--info);" onclick="exportarRelatorio()">RELATÓRIO ROI (CSV)</button>
        </div>
    </div>
</div>

<script type="module">
    // CONFIGURAÇÃO FIREBASE (Substitua pelos seus dados quando criar o projeto)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit, setDoc, doc, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        projectId: "log-pro-jp",
        appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const sync = new BroadcastChannel('logpro_v83');
    
    let modoAtivo = 'ENTRADA';
    let userRole = 'OP';
    let scanner, camOn = false;

    // 1. SINCRONIZAÇÃO E VOZ
    window.falar = (t) => {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'pt-BR'; u.rate = 1.2;
        window.speechSynthesis.speak(u);
        if(navigator.vibrate) navigator.vibrate(100);
    };

    window.setModo = (m) => {
        modoAtivo = m;
        document.querySelectorAll('.btn-m').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m.replace('Í','I').replace('Ç','C')).classList.add('active');
        sync.postMessage({ type: 'MODO', val: m });
        falar("MODO " + m);
    };

    sync.onmessage = (e) => { if(e.data.type === 'MODO') setModo(e.data.val); };

    // 2. PROCESSAMENTO DE BIPE
    window.processarBipe = async (codigo) => {
        const cod = codigo.trim();
        if(!cod) return;
        document.getElementById('last-code').innerText = cod;
        document.getElementById('fb-msg').innerText = "PROCESSANDO...";

        try {
            // Registrar Log de Produtividade
            await addDoc(collection(db, "logs"), {
                cod, modo: modoAtivo, op: userRole, ts: serverTimestamp(), d_str: new Date().toLocaleTimeString()
            });

            if(modoAtivo === 'SEPARACAO') {
                const ref = doc(db, "carga", cod);
                const d = await getDoc(ref);
                if(d.exists() && d.data().falta > 0) {
                    await updateDoc(ref, { falta: d.data().falta - 1 });
                    falar("OK");
                    document.getElementById('fb-msg').innerText = "SUCESSO";
                    document.getElementById('fb-msg').style.color = "var(--p)";
                } else {
                    falar("FORA DA LISTA");
                    document.getElementById('fb-msg').innerText = "ERRO!";
                    document.getElementById('fb-msg').style.color = "var(--danger)";
                }
            } else {
                falar("REGISTRADO");
                document.getElementById('fb-msg').innerText = "CONCLUÍDO";
            }
        } catch(e) { console.error(e); }
    };

    // 3. ADMIN SHARK
    window.dispararCarga = async () => {
        const linhas = document.getElementById('bulk-input').value.split('\n');
        for(let l of linhas) {
            const [c, q] = l.split(',');
            if(c && q) await setDoc(doc(db, "carga", c.trim()), { falta: parseInt(q), nome: "ITEM "+c });
        }
        falar("CARGA DISPARADA");
        document.getElementById('bulk-input').value = "";
    };

    window.exportarRelatorio = async () => {
        const q = query(collection(db, "logs"), orderBy("ts", "desc"), limit(500));
        const snap = await getDoc(q);
        let csv = "DATA,MODO,CODIGO,OPERADOR\n";
        // Lógica de loop para CSV aqui...
        alert("RELATÓRIO GERADO NO CONSOLE (CSV)");
    };

    // 4. SISTEMA E CÂMERA
    window.toggleCamera = async () => {
        if(!camOn) {
            scanner = new Html5Qrcode("reader");
            await scanner.start({ facingMode: "environment" }, { fps: 25, qrbox: 250 }, (t) => processarBipe(t));
            camOn = true; document.getElementById('btn-cam').style.background = "var(--danger)";
        } else {
            await scanner.stop(); camOn = false; document.getElementById('btn-cam').style.background = "#111";
        }
    };

    window.auth = () => {
        const p = document.getElementById('pin').value;
        if(p === "7979") {
            userRole = 'SHARK';
            document.getElementById('shark-panel').style.display = 'block';
            document.getElementById('user-display').innerText = "JP | MASTER SHARK";
        }
        document.getElementById('scr-login').classList.remove('active');
        document.getElementById('scr-app').classList.add('active');
    };

    // 5. LISTENER REAL-TIME
    onSnapshot(collection(db, "carga"), (snap) => {
        const list = document.getElementById('lista-viva');
        list.innerHTML = "";
        snap.forEach(d => {
            if(d.data().falta > 0) {
                list.innerHTML += `<div class="row-viva"><span>📦 ${d.id}</span><span class="badge">${d.data().falta} UN</span></div>`;
            }
        });
    });

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    window.init = () => { console.log("LOG-PRO V83 READY"); };
</script>
</body>
</html>
