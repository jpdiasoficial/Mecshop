<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HG MOTORS | ULTIMATE v95</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #050505; --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #fff; line-height: 1.4; }

        /* HEADER GLASS */
        header { position: fixed; top: 0; width: 100%; z-index: 100; padding: 20px; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 20px; color: var(--gold); letter-spacing: -1px; }

        .container { padding: 100px 15px 40px; }

        /* FILTROS NATIVOS */
        .scroller { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none; }
        .scroller::-webkit-scrollbar { display: none; }
        .btn-f { background: var(--glass); border: 1px solid var(--glass-border); color: #888; padding: 12px 22px; border-radius: 50px; font-size: 11px; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .btn-f.active { background: #fff; color: #000; border-color: #fff; }

        /* CARD GALÁTICO */
        .card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; overflow: hidden; margin-bottom: 25px; transition: 0.3s; }
        .img-area { position: relative; width: 100%; height: 280px; }
        .img-area img { width: 100%; height: 100%; object-fit: cover; }
        
        .overlay-tags { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; }
        .tag { background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 50px; font-size: 9px; font-weight: 900; border: 1px solid rgba(255,255,255,0.1); }

        .content { padding: 20px; }
        .car-name { font-size: 22px; font-weight: 900; text-transform: uppercase; margin-bottom: 4px; }
        .car-info { font-size: 13px; color: #aaa; margin-bottom: 20px; }
        
        .price-area { background: rgba(255,255,255,0.02); border-radius: 16px; padding: 15px; margin-bottom: 20px; border: 1px dashed rgba(255,255,255,0.1); }
        .label { font-size: 10px; color: var(--gold); font-weight: 900; display: block; margin-bottom: 4px; }
        .val { font-size: 26px; font-weight: 900; }
        .parc { font-size: 12px; color: #666; font-weight: 600; }

        .btn-zap { background: #25D366; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px; border-radius: 18px; font-weight: 900; font-size: 14px; text-transform: uppercase; }
    </style>
</head>
<body onload="render()">

    <header>
        <div class="logo">HG MOTORS</div>
        <div style="font-size: 12px; font-weight: 900; color: #fff;">ESTOQUE (12)</div>
    </header>

    <div class="container">
        <div class="scroller">
            <button class="btn-f active" onclick="filter('TODOS')">Todos</button>
            <button class="btn-f" onclick="filter('PREMIUM')">Premium</button>
            <button class="btn-f" onclick="filter('SUV')">SUVs</button>
            <button class="btn-f" onclick="filter('SEDAN')">Sedans</button>
        </div>

        <div id="vitrine"></div>
    </div>

    <script>
        const veiculos = [
            { cat: 'PREMIUM', nome: 'BMW 320i Sport', desc: 'M Sport | Turbo | 2022 | Branca', preco: '249.900', img: '5739.jpg' },
            { cat: 'SUV', nome: 'Jeep Compass Longitude', desc: 'Diesel 4x4 | Couro | 2021 | Prata', preco: '158.900', img: '5743.jpg' },
            { cat: 'SEDAN', nome: 'Honda Civic G10', desc: 'EXL | Full LED | 2020 | Cinza', preco: '119.900', img: '5745.jpg' },
            { cat: 'SUV', nome: 'Chevrolet Equinox', desc: 'Premier Turbo | Teto | 2021 | Branca', preco: '145.900', img: '5746.jpg' },
            { cat: 'PREMIUM', nome: 'Audi A3 Sedan', desc: 'S-Line | Virtual Cockpit | 2022', preco: '189.900', img: '5752.jpg' }
        ];

        function render(f = 'TODOS') {
            const vitrine = document.getElementById('vitrine');
            const lista = f === 'TODOS' ? veiculos : veiculos.filter(v => v.cat === f);
            
            vitrine.innerHTML = lista.map(v => `
                <div class="card">
                    <div class="img-area">
                        <img src="${v.img}" alt="${v.nome}">
                        <div class="overlay-tags">
                            <span class="tag">${v.cat}</span>
                            <span class="tag" style="background:var(--gold); color:#000;">NOVIDADE</span>
                        </div>
                    </div>
                    <div class="content">
                        <h2 class="car-name">${v.nome}</h2>
                        <p class="car-info">${v.desc}</p>
                        <div class="price-area">
                            <span class="label">VALOR À VISTA</span>
                            <span class="val">R$ ${v.preco}</span><br>
                            <span class="parc">Financiamento em até 60x</span>
                        </div>
                        <a href="https://wa.me/5519999999999" class="btn-zap">
                            <i class="fab fa-whatsapp"></i> Tenho Interesse
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filter(c) {
            document.querySelectorAll('.btn-f').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render(c);
        }
    </script>
</body>
</html>
