<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOG-PRO v105 | SHARK CONTROL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #00ff41; --s: #007aff; --bg: #000; --sf: #0a0a0a; --brd: #1a1a1a; --dg: #ff3b30; --w: #ffae00; }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; font-size: 11px; height: 100vh; overflow: hidden; text-transform: uppercase; }
        .screen { display: none; height: 100vh; flex-direction: column; }
        .active-screen { display: flex !important; }
        header { padding: 15px; border-bottom: 2px solid var(--brd); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; background: #000; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px 15px 100px 15px; }
        .card { background: var(--sf); border: 1px solid var(--brd); border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; }
        h3 { font-family: 'Orbitron'; font-size: 9px; color: var(--p); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-left: 3px solid var(--p); padding-left: 8px; }
        input, select { width: 100%; padding: 12px; background: #050505; border: 1px solid #222; color: #fff; border-radius: 8px; font-size: 11px; margin-bottom: 8px; font-weight: 700; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: var(--s); color: #fff; }
        .btn-d { background: var(--dg); color: #fff; }
        .btn-ghost { background: transparent; border: 1px solid #333; color: #888; font-size: 8px; height: 25px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .kpi-box { background: #0a0a0a; border: 1px solid #222; padding: 10px 5px; border-radius: 8px; text-align: center; }
        .kpi-box span { font-family: 'Orbitron'; font-size: 14px; color: var(--p); display: block; }
        .bottom-nav { display: none; background: #000; border-top: 2px solid var(--brd); position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-size: 8px; font-weight: 800; gap: 4px; }
        .active-tab { color: var(--p); border-top: 3px solid var(--p); background: #050505; }
        .action-row { display: flex; gap: 5px; margin-top: 10px; }
        .item-list { border-top: 1px solid #111; margin-top: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #111; }
    </style>
</head>
<body onload="inicializarApp()">

    <div id="tela-login" class="screen active-screen" style="justify-content:center; padding:40px;">
        <h1 style="font-family:'Orbitron'; color:var(--p); text-align:center; font-size:40px;">SHARK</h1>
        <p style="color:#555; font-size:9px; text-align:center; margin-bottom:40px; letter-spacing:3px;">TOTAL CONTROL v105</p>
        <button class="btn btn-p" onclick="login('shark')" style="margin-bottom:10px;">👑 ADMIN SHARK</button>
        <button class="btn btn-s" onclick="login('operador')" style="margin-bottom:10px;">📦 OPERADOR WMS</button>
        <button class="btn btn-d" onclick="login('motorista')">🚚 MOTORISTA</button>
    </div>

    <div id="tela-shark" class="screen">
        <header><span>SHARK MASTER</span> <button onclick="location.reload()" style="background:none; border:none; color:var(--dg);">SAIR</button></header>
        <div class="scroll-area">
            <div class="kpi-grid">
                <div class="kpi-box"><span id="sk-inv">0</span><small>SKUS</small></div>
                <div class="kpi-box"><span id="sk-est">0</span><small>EST</small></div>
                <div class="kpi-box"><span id="sk-mov">0</span><small>LOGS</small></div>
                <div class="kpi-box"><span id="sk-ava" style="color:var(--dg)">0</span><small>AVA</small></div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-plus"></i> ADICIONAR / EDITAR SKU</h3>
                <input type="text" id="sk-ean" placeholder="EAN">
                <input type="text" id="sk-nome" placeholder="NOME DO PRODUTO">
                <div class="action-row">
                    <button class="btn btn-p" onclick="sharkSaveSku()">SALVAR</button>
                    <button class="btn btn-d" onclick="sharkDelSku()">EXCLUIR</button>
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-database"></i> GESTÃO DE DADOS MASTER</h3>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <button class="btn btn-s" onclick="exportData('full')">EXP TUDO</button>
                    <button class="btn btn-p" onclick="document.getElementById('importFull').click()">IMP TUDO</button>
                </div>
                <input type="file" id="importFull" style="display:none" onchange="importData(this, 'full')">
                <button class="btn btn-d" onclick="limparSistema()" style="margin-top:10px; height:30px; font-size:8px;">RESETAR SISTEMA</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-list"></i> ÚLTIMOS MOVIMENTOS (EDITÁVEL)</h3>
                <div id="shark-log-list" class="item-list"></div>
            </div>
        </div>
    </div>

    <div id="tela-operador" class="screen">
        <header><span>OPERACIONAL WMS</span></header>
        <div class="scroll-area">
            <div class="card">
                <div id="reader-op" style="width:100%; min-height:180px; background:#000; border:2px solid var(--p); display:none; margin-bottom:10px;"></div>
                <button class="btn btn-p" id="btn-cam" onclick="toggleCam()">SCANNER</button>
            </div>
            
            <div class="card">
                <h3>ENTRADA / SEPARAÇÃO / AVARIA</h3>
                <select id="op-acao">
                    <option value="ENTRADA">📥 ENTRADA</option>
                    <option value="SEPARACAO">📦 SEPARAÇÃO</option>
                    <option value="AVARIA">⚠️ AVARIA</option>
                </select>
                <input type="text" id="op-ean" placeholder="EAN">
                <input type="text" id="op-loc" placeholder="ENDEREÇO (EX: RUA A-1)">
                <button class="btn btn-s" onclick="opRegistrar()">REGISTRAR</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-file-csv"></i> MEUS DADOS</h3>
                <button class="btn btn-ghost" onclick="exportData('op')">EXPORTAR MEUS LOGS</button>
            </div>
        </div>
    </div>

    <div id="tela-motorista" class="screen">
        <header><span>DRIVER CONTROL</span></header>
        <div class="scroll-area" id="motorista-content">
            </div>
    </div>

    <div class="bottom-nav" id="bot-nav">
        <div class="nav-item" id="nv-sk" onclick="navegar('tela-shark', this)"><i class="fa-solid fa-crown"></i>SHARK</div>
        <div class="nav-item" id="nv-op" onclick="navegar('tela-operador', this)"><i class="fa-solid fa-barcode"></i>WMS</div>
        <div class="nav-item" id="nv-mt" onclick="navegar('tela-motorista', this)"><i class="fa-solid fa-truck"></i>ROTA</div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('SHARK_V105') || '{"produtos":{}, "logs":[], "romaneios":[]}');
        let html5QrCode, camAtiva = false;

        function inicializarApp() { render(); }

        function login(role) {
            document.getElementById('tela-login').classList.remove('active-screen');
            document.getElementById('bot-nav').style.display = 'flex';
            document.getElementById('nv-sk').style.display = (role==='shark') ? 'flex' : 'none';
            document.getElementById('nv-op').style.display = (role!=='motorista') ? 'flex' : 'none';
            document.getElementById('nv-mt').style.display = (role!=='operador') ? 'flex' : 'none';
            navegar('tela-'+role, document.getElementById('nv-'+(role=='operador'?'op':role=='motorista'?'mt':'sk')));
        }

        function navegar(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-screen');
            el.classList.add('active-tab');
            render();
        }

        // --- FUNÇÕES SHARK (CONTROLE TOTAL) ---
        function sharkSaveSku() {
            let ean = document.getElementById('sk-ean').value;
            let nome = document.getElementById('sk-nome').value;
            if(ean && nome) {
                db.produtos[ean] = nome;
                save(); render();
                alert("SKU ATUALIZADO!");
            }
        }

        function sharkDelSku() {
            let ean = document.getElementById('sk-ean').value;
            if(db.produtos[ean] && confirm("EXCLUIR ESTE SKU DO SISTEMA?")) {
                delete db.produtos[ean];
                save(); render();
            }
        }

        function deleteLog(index) {
            if(confirm("EXCLUIR ESTA MOVIMENTAÇÃO? ISSO ALTERARÁ O ESTOQUE!")) {
                db.logs.splice(index, 1);
                save(); render();
            }
        }

        // --- FUNÇÕES OPERADOR ---
        function opRegistrar(eanLido = null) {
            let ean = eanLido || document.getElementById('op-ean').value;
            if(!ean) return;
            if(!db.produtos[ean]) {
                let n = prompt("NOVO SKU ENCONTRADO! NOME:");
                if(n) db.produtos[ean] = n; else return;
            }
            let qtd = prompt("QUANTIDADE:", "1");
            if(qtd) {
                db.logs.unshift({
                    data: new Date().toLocaleString(),
                    tipo: document.getElementById('op-acao').value,
                    ean: ean,
                    nome: db.produtos[ean],
                    qtd: parseInt(qtd),
                    local: document.getElementById('op-loc').value || 'S/E'
                });
                save(); render();
                document.getElementById('op-ean').value = "";
            }
        }

        // --- LÓGICA DE RENDERIZAÇÃO ---
        function render() {
            let estTotal = 0, avarias = 0, shLogs = "", mtHtml = "";
            let saldos = {};

            db.logs.forEach((l, idx) => {
                saldos[l.nome] = saldos[l.nome] || 0;
                if(l.tipo === 'ENTRADA') { estTotal += l.qtd; saldos[l.nome] += l.qtd; }
                if(l.tipo === 'SEPARACAO') { estTotal -= l.qtd; saldos[l.nome] -= l.qtd; }
                if(l.tipo === 'AVARIA') { avarias += l.qtd; }

                shLogs += `<div class="item-row">
                    <div><b>${l.tipo}</b><br><small>${l.data}</small></div>
                    <div style="text-align:right">
                        <span>${l.qtd} UN - ${l.nome}</span><br>
                        <button class="btn-ghost" style="color:var(--dg); border-color:var(--dg)" onclick="deleteLog(${idx})">DEL</button>
                    </div>
                </div>`;
            });

            // KPIs
            if(document.getElementById('sk-inv')) {
                document.getElementById('sk-inv').innerText = Object.keys(db.produtos).length;
                document.getElementById('sk-est').innerText = estTotal;
                document.getElementById('sk-mov').innerText = db.logs.length;
                document.getElementById('sk-ava').innerText = avarias;
                document.getElementById('shark-log-list').innerHTML = shLogs || "SEM LOGS";
            }

            // MOTORISTA (Exemplo Simples de Rota)
            let rotasAtivas = db.logs.filter(l => l.tipo === 'SEPARACAO');
            rotasAtivas.forEach(r => {
                mtHtml += `<div class="card">
                    <h3>PEDIDO PARA ENTREGA</h3>
                    <p>${r.nome} (QTD: ${r.qtd})</p>
                    <button class="btn btn-p" style="height:30px; margin-top:10px;" onclick="alert('ENTREGA CONCLUÍDA')">BAIXAR</button>
                </div>`;
            });
            if(document.getElementById('motorista-content')) document.getElementById('motorista-content').innerHTML = mtHtml || "NENHUMA CARGA";
        }

        // --- IMPORT / EXPORT ---
        function exportData(type) {
            let data = type === 'full' ? db : db.logs;
            let blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url; a.download = `shark_${type}_${Date.now()}.json`;
            a.click();
        }

        function importData(input, type) {
            let reader = new FileReader();
            reader.onload = () => {
                let json = JSON.parse(reader.result);
                if(type === 'full') db = json;
                save(); location.reload();
            };
            reader.readAsText(input.files[0]);
        }

        function save() { localStorage.setItem('SHARK_V105', JSON.stringify(db)); }
        function limparSistema() { if(confirm("APAGAR TUDO?")) { localStorage.clear(); location.reload(); } }
        
        function toggleCam() {
            if(!camAtiva) {
                document.getElementById('reader-op').style.display='block';
                html5QrCode = new Html5Qrcode("reader-op");
                html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => { opRegistrar(txt); toggleCam(); });
                document.getElementById('btn-cam').innerText="FECHAR"; camAtiva=true;
            } else {
                html5QrCode.stop().then(() => { document.getElementById('reader-op').style.display='none'; camAtiva=false; document.getElementById('btn-cam').innerText="SCANNER"; });
            }
        }
    </script>
</body>
</html>
