<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JP DIAS | GENESIS V500</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff9f0a; --bg: #000; --card: #0d0d0d; --red: #ff3b30; --blue: #0a84ff; --green: #30d158; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        
        /* GERENCIAMENTO DE TELAS */
        .screen { display: none; position: absolute; width: 100%; height: 100%; flex-direction: column; padding: 20px; box-sizing: border-box; background: var(--bg); }
        .active { display: flex !important; }

        .glass { background: #080808; border: 1px solid #1a1a1a; border-radius: 12px; padding: 20px; }
        input { width: 100%; padding: 15px; margin-top: 10px; background: #000; border: 1px solid #222; color: var(--primary); border-radius: 6px; font-family: 'Orbitron'; text-align: center; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 18px; margin-top: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Orbitron'; border: none; font-size: 12px; }
        .btn-green { background: var(--green); color: #000; }
        .btn-red { background: var(--red); color: #fff; }

        .voice-box { flex: 1; border: 2px solid var(--primary); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 20px 0; background: radial-gradient(circle, rgba(255,159,10,0.05) 0%, transparent 70%); }
    </style>
</head>
<body>

<div id="scr-portal" class="screen active" style="justify-content: center; align-items: center;">
    <h1 id="ghost-trigger" style="font-family:'Orbitron'; letter-spacing:15px; color:#0a0a0a; cursor:pointer;" onclick="handleGhost()">JP DIAS</h1>
    <div class="glass" style="width: 320px;">
        <input type="text" id="u" placeholder="USUÁRIO">
        <input type="password" id="p" placeholder="SENHA">
        <button class="btn" style="background:var(--primary); color:#000;" onclick="handleLogin()">ENTRAR NO SISTEMA</button>
    </div>
</div>

<div id="scr-master" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-family:'Orbitron'; color:var(--primary); font-size:14px;">MASTER JP DIAS</span>
        <button onclick="falarESair()" class="btn-red" style="padding:5px 10px; width:auto; margin:0; font-size:10px;">SAIR</button>
    </div>
    
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0;">
        <div class="glass"><b>R$ 4.290</b><br><small style="font-size:8px;">ROI HOJE</small></div>
        <div class="glass" style="border-color:var(--blue);"><b>03ms</b><br><small style="font-size:8px;">PING</small></div>
    </div>

    <div class="glass" style="text-align:left;">
        <h4 style="font-family:'Orbitron'; font-size:10px; margin-top:0;">CONFIGURAR PRÓXIMA ENTREGA</h4>
        <input type="text" id="set-box" placeholder="BOX (Ex: A-12)" style="text-align:left;">
        <input type="text" id="set-cod" placeholder="CÓDIGO (Ex: 990)" style="text-align:left;">
        <button class="btn btn-green" onclick="configurarSistema()">ATUALIZAR OPERAÇÃO</button>
    </div>
</div>

<div id="scr-voz" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-family:'Orbitron'; color:var(--primary); font-size:12px;">OPERAÇÃO VOZ</span>
        <span id="status-online" style="color:var(--green); font-size:10px;">● LIVE</span>
    </div>
    <div class="voice-box">
        <h3 id="inst" style="font-family:'Orbitron'; font-size:24px;">AGUARDANDO</h3>
        <p id="v-status" style="font-size:9px; color:#444;">FALE "ATIVAR" 3 VEZES</p>
    </div>
    <button class="btn btn-red" onclick="falarESair()">FINALIZAR TURNO</button>
</div>

<script>
    let vCount = 0;
    let clicks = 0;
    let config = { box: "A-01", cod: "000" };
    const audio = new (window.AudioContext || window.webkitAudioContext)();

    function bip(f = 800, d = 0.1) {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.connect(g); g.connect(audio.destination);
        o.frequency.value = f; g.gain.value = 0.1;
        o.start(); setTimeout(() => o.stop(), d * 1000);
    }

    function falar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'pt-BR'; m.rate = 1.1;
        window.speechSynthesis.speak(m);
    }

    function handleGhost() {
        bip(1200); clicks++;
        if(clicks === 5) {
            bip(1500, 0.2);
            if(prompt("CHAVE MESTRE:") === "9910") {
                show('scr-master');
                falar("Acesso mestre. Painel JP Dias ativo.");
            }
            clicks = 0;
        }
    }

    function handleLogin() {
        const u = document.getElementById('u').value.toLowerCase();
        bip();
        if(u === "shark" || u === "jp") {
            show('scr-master');
            falar("Bem vindo ao controle mestre.");
        } else if(u === "op") {
            show('scr-voz');
            falar("Sistema pronto. Aguardando entrega.");
            startVoice();
        } else {
            bip(200, 0.3);
            alert("ACESSO NEGADO");
        }
    }

    function configurarSistema() {
        config.box = document.getElementById('set-box').value || "A-01";
        config.cod = document.getElementById('set-cod').value || "000";
        bip(1000, 0.2);
        falar("Sistema atualizado. Box " + config.box + " definido.");
    }

    function falarESair() {
        bip(400, 0.5);
        falar("Encerrando sistema. Até logo.");
        setTimeout(() => location.reload(), 1500);
    }

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startVoice() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return;
        const rec = new Rec();
        rec.lang = 'pt-BR'; rec.continuous = true;
        
        rec.onresult = (e) => {
            const fala = e.results[e.results.length - 1][0].transcript.toLowerCase();
            if(fala.includes("ativar")) {
                bip(1000, 0.1);
                vCount++;
                falar(vCount);
                if(vCount === 3) {
                    bip(1600, 0.3);
                    document.getElementById('inst').innerHTML = "BOX: " + config.box + "<br>COD: " + config.cod;
                    falar("Tarefa entregue. Box " + config.box + ". Código " + config.cod);
                    vCount = 0;
                }
            }
        };
        rec.onerror = () => rec.start();
        rec.start();
    }
</script>
</body>
</html>
